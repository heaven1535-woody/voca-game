<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>몽테크리스토 — 복수의 서막</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1020;
    font-family:'Galmuri11','Galmuri9',monospace;touch-action:none;overscroll-behavior:none;}
  #screen{display:block;width:100vw;height:100vh;image-rendering:pixelated;background:#0b1020;}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
const CV=document.getElementById('screen'), X=CV.getContext('2d');
let VW=360, VH=640, DPR=1, TS=40;

/* ---------- palette (Kairosoft-bright) ---------- */
const C={
  bg:'#0b1020',
  sky1:'#173a63', sky2:'#0e2647',
  sea1:'#3aa8d8', sea2:'#2b8fc4', sea3:'#7fd4ec', foam:'#eafaff',
  moon:'#fff6c8',
  grass:'#7cc36a', grassD:'#5fae55', grassT:'#95d67f',
  path:'#e6d2a0', pathD:'#cdb884',
  wall:'#8c95b0', wallD:'#6b7290', wallL:'#aab2c9', floor:'#3f4a६0',
  dstone:'#565f7e', dstoneD:'#434a63', dfloor:'#2f3650', dfloorL:'#3a4260',
  wood:'#c78a46', woodD:'#a06e33', woodL:'#e0a860',
  gold:'#ffd24a', goldD:'#d69f27',
  ink:'#20233a', line:'#141726',
  skin:'#ffcfa0', skinS:'#e0a878',
  text:'#22263f', textL:'#fff7ea',
  panel:'#fbf3dc', panelE:'#c9a86a', panelE2:'#8f6f3a', panelSh:'#0006',
  red:'#e05a4a', hpg:'#66c96a', mpb:'#5aa9e6',
  sel:'#ffd24a'
};
C.floor='#3f4a60';

/* ---------- resize ---------- */
function resize(){
  VW=Math.round(document.documentElement.clientWidth);
  VH=Math.round(window.innerHeight);
  DPR=Math.min(2, window.devicePixelRatio||1);
  CV.width=Math.round(VW*DPR); CV.height=Math.round(VH*DPR);
  CV.style.width=VW+'px'; CV.style.height=VH+'px';
  X.setTransform(DPR,0,0,DPR,0,0);
  X.imageSmoothingEnabled=false;
  TS=Math.max(30, Math.floor(Math.min(VW,VH)/9));
}
addEventListener('resize',resize); resize();

/* ---------- draw helpers ---------- */
function px(x,y,w,h,col){X.fillStyle=col;X.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
function rr(x,y,w,h,r,col){X.fillStyle=col;X.beginPath();X.roundRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h),r);X.fill();}
function circ(x,y,r,col){X.fillStyle=col;X.beginPath();X.arc(x,y,r,0,7);X.fill();}
function txt(s,x,y,col,size,align){X.fillStyle=col;X.font=size+"px 'Galmuri11',monospace";X.textAlign=align||'left';X.textBaseline='top';X.fillText(s,x,y);}
function fs(base){return Math.max(11, Math.round(base));}

/* ---------- input (touch/pointer) ---------- */
let tap=null;
function toLocal(e){const r=CV.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
CV.addEventListener('pointerdown',e=>{e.preventDefault();const p=toLocal(e);tap={x:p.x,y:p.y};},{passive:false});
// keyboard optional (desktop)
const kq=[];
addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(k)){kq.push(k);e.preventDefault();}
  else if([' ','Enter','z','Z','x','X'].includes(k)){tap={confirm:true};e.preventDefault();}
});

/* ---------- actors (cute chibi) ---------- */
const ACTORS={
  edmond:{hair:'#3a2a18',skin:C.skin,body:'#3f7ad0',bodyD:'#2f5ea8'},
  count:{hair:'#1c1c26',skin:C.skin,body:'#3a3550',bodyD:'#26223a',cape:'#b23142'},
  mercedes:{hair:'#5a3a20',skin:'#ffd8b0',body:'#e56aa0',bodyD:'#c24d82'},
  faria:{hair:'#e8e8e8',skin:'#eabf95',body:'#8a8fa6',bodyD:'#6b7088'},
  villain:{hair:'#20202a',skin:'#e6b48a',body:'#6a4a8a',bodyD:'#4c3266'},
  villain2:{hair:'#3a2a1a',skin:'#e6b48a',body:'#4a7a5a',bodyD:'#356043'},
  guard:{hair:'#3a2a10',skin:'#e0aa78',body:'#c0503a',bodyD:'#963a28'}
};
function actor(sx,sy,type,dir,frame){
  const p=ACTORS[type]||ACTORS.edmond, u=TS/16;
  const bob=frame? -u*0.6:0;
  const cx=sx+TS/2, top=sy+u*1.5+bob;
  // shadow
  X.fillStyle='#0004'; X.beginPath(); X.ellipse(cx, sy+TS-u*1.5, TS*0.30, TS*0.12, 0,0,7); X.fill();
  const O=C.line;
  // body
  rr(cx-4.6*u, top+7.2*u, 9.2*u, 7.4*u, 2.4*u, O);
  rr(cx-3.8*u, top+7.6*u, 7.6*u, 6.4*u, 2*u, p.bodyD);
  rr(cx-3.8*u, top+7.6*u, 7.6*u, 4.2*u, 2*u, p.body);
  if(p.cape){ rr(cx-5.6*u, top+7*u, 2.2*u, 8*u, 1*u, p.cape); rr(cx+3.4*u, top+7*u, 2.2*u, 8*u, 1*u, p.cape); }
  // feet
  px(cx-3*u, top+14.2*u, 2.2*u, 1.6*u, O); px(cx+0.8*u, top+14.2*u, 2.2*u, 1.6*u, O);
  // head
  rr(cx-5*u, top-0.6*u, 10*u, 9*u, 3.4*u, O);
  rr(cx-4.3*u, top, 8.6*u, 8*u, 3*u, p.skin);
  // hair
  rr(cx-4.6*u, top-0.6*u, 9.2*u, 4.2*u, 2.6*u, p.hair);
  px(cx-4.6*u, top+1.6*u, 1.6*u, 3*u, p.hair); px(cx+3*u, top+1.6*u, 1.6*u, 3*u, p.hair);
  // face (down/side)
  if(dir!=='up'){
    const ex=dir==='left'?-0.8*u: dir==='right'?0.8*u:0;
    circ(cx-2.2*u+ex, top+4.4*u, 0.9*u, C.ink);
    circ(cx+2.2*u+ex, top+4.4*u, 0.9*u, C.ink);
    // cheeks
    X.fillStyle='#ff9a9a55'; X.beginPath(); X.arc(cx-3*u+ex, top+6*u, 1*u,0,7); X.arc(cx+3*u+ex, top+6*u, 1*u,0,7); X.fill();
  }
}

/* ---------- tiles ---------- */
function tile(t,x,y,anim){
  const u=TS/16;
  switch(t){
    case '~':{ px(x,y,TS,TS,C.sea1);
      const o=Math.sin(x*0.05+anim*0.06)*2*u;
      px(x,y+5*u+o,TS,1.6*u,C.sea2); px(x,y+10*u-o,TS,1.4*u,C.sea3);
      if(((x/TS+(anim>>5))|0)%2===0) px(x+3*u,y+3*u,4*u,1.2*u,C.foam); break; }
    case 'W':{ px(x,y,TS,TS,C.wood); px(x,y,TS,1.4*u,C.woodL); px(x,y+7*u,TS,1.2*u,C.woodD); px(x+7.4*u,y,1.2*u,TS,C.woodD); break; }
    case ',':{ px(x,y,TS,TS,C.grass); px(x,y,TS,1.4*u,C.grassT);
      X.fillStyle=C.grassD; const s=((x*13+y*7)>>4)%4; px(x+3*u+s*u,y+9*u,1.4*u,2.4*u,C.grassD); px(x+10*u,y+5*u,1.2*u,2*u,C.grassD); break; }
    case 'p':{ px(x,y,TS,TS,C.path); px(x,y,TS,1.2*u,'#f2e3b8'); px(x,y+TS-1.2*u,TS,1.2*u,C.pathD); if(((x+y)>>4)%2)px(x+4*u,y+4*u,2*u,2*u,C.pathD); break; }
    case 'T':{ px(x,y,TS,TS,C.grass); px(x+6.5*u,y+8*u,3*u,7*u,C.woodD);
      circ(x+8*u,y+6*u,5.2*u,C.line); circ(x+8*u,y+5.4*u,4.6*u,'#57a84e'); circ(x+6.2*u,y+4.4*u,1.6*u,C.grassT); break; }
    case 'x':{ px(x,y,TS,TS,C.grass); rr(x+2*u,y+2*u,12*u,12*u,1.6*u,C.line); rr(x+2.7*u,y+2.7*u,10.6*u,10.6*u,1.2*u,C.wood); px(x+2.7*u,y+7.2*u,10.6*u,1.2*u,C.woodD); break; }
    case '#':{ px(x,y,TS,TS,C.wall); px(x,y,TS,1.6*u,C.wallL); px(x,y+TS-1.6*u,TS,1.6*u,C.wallD);
      px(x+2*u,y+3*u,5*u,3*u,C.wallD); px(x+9*u,y+9*u,4*u,3*u,C.wallD); break; }
    case 'B':{ px(x,y,TS,TS,C.dstone); px(x,y,TS,1.6*u,'#636c8c'); px(x,y+TS-1.6*u,TS,1.6*u,C.dstoneD);
      // barred window
      rr(x+3*u,y+3*u,10*u,8*u,1*u,'#12142400'); px(x+3.5*u,y+3.5*u,9*u,7*u,'#12162b');
      px(x+5.6*u,y+3.5*u,1*u,7*u,'#8a90a8'); px(x+9*u,y+3.5*u,1*u,7*u,'#8a90a8'); px(x+3.5*u,y+6.5*u,9*u,1*u,'#8a90a8'); break; }
    case '.':{ px(x,y,TS,TS,C.dfloor); if(((x+y)>>4)%2)px(x,y,TS,TS,C.dfloorL); px(x,y,TS,1*u,'#00000022'); break; }
    case 'D':{ px(x,y,TS,TS,C.dstone); rr(x+2*u,y+1*u,12*u,15*u,2*u,C.line); rr(x+2.6*u,y+1.6*u,10.8*u,13.8*u,1.6*u,C.wood);
      px(x+2.6*u,y+1.6*u,10.8*u,1.4*u,C.woodL); circ(x+11.5*u,y+8.5*u,1.2*u,C.gold); break; }
    case 'C':{ px(x,y,TS,TS,C.dstone);
      X.strokeStyle='#12142b'; X.lineWidth=Math.max(1,1.4*u); X.beginPath(); X.moveTo(x+8*u,y); X.lineTo(x+5*u,y+6*u); X.lineTo(x+10*u,y+10*u); X.lineTo(x+6*u,y+TS); X.stroke(); break; }
    case 'g':{ px(x,y,TS,TS,C.dfloor); rr(x+2*u,y+9*u,12*u,5*u,1.4*u,C.goldD);
      circ(x+5*u,y+8*u,2.4*u,C.gold); circ(x+9.5*u,y+7*u,2.8*u,C.gold); circ(x+7*u,y+5*u,2*u,'#fff0a8'); px(x+6.4*u,y+4.6*u,0.8*u,0.8*u,'#fff'); break; }
    default: px(x,y,TS,TS,C.dfloor);
  }
}

/* ---------- rooms (20x12) ---------- */
function city(nm,price,grp){return {type:'city',name:nm,price:price,grp:grp,owner:null,lv:0};}
const ROOMS={
  marseille:{ name:'마르세유 항구 · 1815',
    tiles:[
      '~~~~~~~~~~~~~~~~~~~~',
      '~~~~~~~~~~~~~~~~~~~~',
      'WWWWWWWWWWWWWWWWWWWW',
      ',,,,,,,ppp,,,,,,,,,,',
      ',,T,,,,,p,,,,,x,,,T,',
      ',,,,,,,,p,,,,,,,,,,,',
      ',,,,,,,,p,,,,,x,,,,,',
      ',,,,,,,,p,,,,,,,,,,,',
      '###ppppppp,,,,,,,,,,',
      '#D#,,,,,,,,,,,,,,,T,',
      '###,,,,,,,,,,,,,,,,,',
      ',,,,,,,,,,,,,,,,,,,,'
    ],
    start:[8,10,'up'],
    npcs:[
      {id:'mercedes',x:8,y:4,type:'mercedes',dir:'down',name:'메르세데스'},
      {id:'danglars',x:4,y:8,type:'villain',dir:'down',name:'당글라르'},
      {id:'fernand',x:14,y:8,type:'villain2',dir:'down',name:'페르낭'}
    ]},
  cell:{ name:'이프 성 지하 감옥',
    tiles:[
      'BBBBBBBBBBBBBBBBBBBB',
      'B..................B',
      'B..................B',
      'B........xx........B',
      'B..................B',
      'B..................C',
      'B..................C',
      'B..................B',
      'B..................B',
      'B........DD........B',
      'BBBBBBBBBBBBBBBBBBBB',
      '                    '
    ],
    start:[9,8,'up'], npcs:[]},
  corridor:{ name:'이프 성 복도',
    tiles:[
      'BBBBBBBBBBBBBBBBBBBB',
      'B..................B',
      'B..############....B',
      'B..#........#.....B'.padEnd(20,'.').slice(0,19)+'B',
      'B..#........#......B',
      'B..#........#......D',
      'B..#........#......B',
      'B..######.###......B',
      'B..................B',
      'B..................B',
      'BBBBBBBBBBBBBBBBBBBB',
      '                    '
    ],
    start:[3,9,'up'],
    npcs:[{id:'guard',x:14,y:5,type:'guard',dir:'left',name:'간수'}]},
  treasure:{ name:'몬테크리스토 섬 · 보물 동굴',
    tiles:[
      'BBBBBBBBBBBBBBBBBBBB',
      'B..................B',
      'B...g....g....g....B',
      'B..................B',
      'B.....gggggggg.....B',
      'B....gggggggggg....B',
      'B.....gggggggg.....B',
      'B..................B',
      'B........gg........B',
      'B........DD........B',
      'BBBBBBBBBBBBBBBBBBBB',
      '                    '
    ],
    start:[9,8,'up'], npcs:[]}
};

/* ---------- state ---------- */
const G={
  mode:'title', room:null, roomKey:'', anim:0, cam:{x:0,y:0},
  px:0,py:0,dir:'down', moving:null, moveT:0, path:null, pend:null,
  flags:{}, cut:null, cutI:0, _cutCb:null, _dialogCb:null,
  dialog:null, fade:0, fadeDir:0, fadeCb:null,
  player:{name:'에드몽',lv:1,hp:60,maxhp:60,mp:12,maxmp:12,atk:14,def:6},
  battle:null, title:{sel:0, showHelp:false, rects:[]}
};

/* ---------- rooms helpers ---------- */
function loadRoom(key){ G.room=ROOMS[key]; G.roomKey=key;
  G.room.npcsLive=JSON.parse(JSON.stringify(G.room.npcs));
  G.px=G.room.start[0]; G.py=G.room.start[1]; G.dir=G.room.start[2];
  G.moving=null; G.path=null; G.pend=null; }
function cols(){return G.room.tiles[0].length;}
function rows(){return G.room.tiles.length;}
function tileAt(x,y){ const r=G.room.tiles; if(y<0||y>=r.length||x<0||x>=r[0].length) return '#'; return r[y][x]; }
function npcAt(x,y){ if(G.room.npcsLive) for(const n of G.room.npcsLive) if(n.x===x&&n.y===y) return n; return null; }
function solid(x,y){ const t=tileAt(x,y); if('#~BTWx'.indexOf(t)>=0) return true; if(npcAt(x,y)) return true; return false; }
function interactable(x,y){ const t=tileAt(x,y); if(npcAt(x,y)) return true; return 'DCg'.indexOf(t)>=0; }

/* ---------- pathfinding (BFS) ---------- */
function bfs(sx,sy,tx,ty,allowTarget){
  const C0=cols(),R0=rows(); const key=(x,y)=>y*C0+x;
  const prev=new Map(); prev.set(key(sx,sy),-1); const q=[[sx,sy]];
  const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
  while(q.length){ const [x,y]=q.shift(); if(x===tx&&y===ty) break;
    for(const [dx,dy] of dirs){ const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=C0||ny>=R0) continue; if(prev.has(key(nx,ny))) continue;
      const isTarget=(nx===tx&&ny===ty);
      if(solid(nx,ny) && !(isTarget&&allowTarget)) continue;
      prev.set(key(nx,ny),key(x,y)); q.push([nx,ny]); } }
  if(!prev.has(key(tx,ty))) return null;
  const path=[]; let c=key(tx,ty); while(c!==-1){ path.unshift([c%C0, (c/C0)|0]); c=prev.get(c); }
  path.shift(); return path;
}

/* ---------- dialog ---------- */
function say(list){ G.dialog={q:list.map(d=>typeof d==='string'?{who:'',txt:d}:d), i:0, shown:'', ci:0, t:0, done:false}; }
function dialogAnim(){ const d=G.dialog,cur=d.q[d.i];
  if(d.ci<cur.txt.length){ d.t++; if(d.t%2===0){ d.ci++; d.shown=cur.txt.slice(0,d.ci); } } else d.done=true; }
function dialogAdvance(){ const d=G.dialog,cur=d.q[d.i];
  if(!d.done){ d.ci=cur.txt.length; d.shown=cur.txt; d.done=true; return; }
  d.i++; if(d.i>=d.q.length){ G.dialog=null; if(G._dialogCb){const cb=G._dialogCb;G._dialogCb=null;cb();} }
  else { d.ci=0; d.shown=''; d.t=0; d.done=false; } }

/* ---------- cutscene ---------- */
function runCut(steps){ G.cut=steps; G.cutI=0; nextCut(); }
function nextCut(){ if(!G.cut) return;
  if(G.cutI>=G.cut.length){ G.cut=null; return; }
  const s=G.cut[G.cutI++], t=s[0];
  if(t==='say'){ say(s[1]); G._dialogCb=nextCut; }
  else if(t==='wait'){ setTimeout(nextCut,s[1]); }
  else if(t==='flag'){ G.flags[s[1]]=s[2]; nextCut(); }
  else if(t==='goto'){ fadeTo(()=>{ loadRoom(s[1]); if(s[2]){G.px=s[2][0];G.py=s[2][1];G.dir=s[2][2];} }, nextCut); }
  else if(t==='pos'){ G.px=s[1];G.py=s[2];G.dir=s[3]||G.dir; nextCut(); }
  else if(t==='spawn'){ G.room.npcsLive.push(s[1]); nextCut(); }
  else if(t==='despawn'){ G.room.npcsLive=G.room.npcsLive.filter(n=>n.id!==s[1]); nextCut(); }
  else if(t==='battle'){ startBattle(s[1], nextCut); }
  else if(t==='mode'){ G.mode=s[1]; nextCut(); }
  else if(t==='fn'){ s[1](); nextCut(); }
  else nextCut();
}
function fadeTo(mid,after){ G.fadeDir=1; G.fadeCb=()=>{ mid&&mid(); G.fadeDir=-1; G.fadeCb=()=>{ G.fadeDir=0; after&&after(); }; }; }

/* ---------- battle ---------- */
const ENEMIES={
  guard:{name:'간수',hp:52,maxhp:52,atk:13,def:4},
  chief:{name:'간수장',hp:92,maxhp:92,atk:18,def:7}
};
const BCMDS=[{n:'공격'},{n:'반격의 검'},{n:'희망'},{n:'방어'},{n:'도망'}];
function startBattle(key,onWin,onLose){
  const e=JSON.parse(JSON.stringify(ENEMIES[key]));
  G.battle={e,onWin,onLose,phase:'intro',msg:e.name+'이(가) 나타났다!',msgQ:[],_after:null,_end:null,
    flash:0,shake:0,ehit:0,defending:false,btns:[]};
  G.mode='battle';
}
function bmsg(m){G.battle.msgQ.push(m);}
function nextMsg(){ const b=G.battle;
  if(b.msgQ.length){ b.msg=b.msgQ.shift(); b.phase='msg'; return; }
  if(b._after){ const f=b._after; b._after=null; f(); return nextMsg(); }
  if(b.phase!=='win'&&b.phase!=='lose') b.phase='menu'; }
function chooseCmd(i){ const b=G.battle, pl=G.player; b.defending=false; b._after=null;
  const cmd=BCMDS[i].n;
  if(cmd==='공격') pAtk(pl.atk,'에드몽의 공격!');
  else if(cmd==='반격의 검'){ if(pl.mp<5) bmsg('MP가 부족하다!'); else {pl.mp-=5; pAtk(Math.round(pl.atk*1.9),'반격의 검!');} }
  else if(cmd==='희망'){ if(pl.mp<4) bmsg('MP가 부족하다!'); else {pl.mp-=4; const h=Math.min(pl.maxhp-pl.hp,28); pl.hp+=h; bmsg('희망을 되새겼다! HP +'+h); b._after=eTurn;} }
  else if(cmd==='방어'){ b.defending=true; bmsg('에드몽은 몸을 웅크렸다.'); b._after=eTurn; }
  else if(cmd==='도망'){ if(Math.random()<0.45){bmsg('도망쳤다!'); b._after=()=>{b.phase='win';b._end=b.onWin;};} else {bmsg('도망치지 못했다!'); b._after=eTurn;} }
  b.phase='msg'; nextMsg();
}
function pAtk(pow,label){ const b=G.battle,e=b.e;
  const dmg=Math.max(1,(pow-e.def+(Math.random()*4-2))|0); e.hp-=dmg; b.ehit=10; b.shake=8;
  bmsg(label+' '+e.name+'에게 '+dmg+' 피해!');
  b._after=()=>{ if(e.hp<=0){e.hp=0; bmsg(e.name+'을(를) 쓰러뜨렸다!'); b._after=()=>{b.phase='win';b._end=b.onWin;};} else eTurn(); }; }
function eTurn(){ const b=G.battle,pl=G.player,e=b.e;
  let dmg=Math.max(1,(e.atk-pl.def+(Math.random()*4-2))|0); if(b.defending)dmg=Math.max(1,(dmg/2)|0);
  pl.hp-=dmg; b.flash=8; bmsg(e.name+'의 공격! '+dmg+' 피해를 입었다.');
  b._after=()=>{ if(pl.hp<=0){pl.hp=0; bmsg('에드몽은 쓰러졌다...'); b._after=()=>{b.phase='lose';b._end=b.onLose||(()=>{G.mode='gameover';});};} else b.phase='menu'; }; }

/* ---------- tap handling ---------- */
function handleTap(t){
  if(G.fadeDir!==0) return;
  if(G.mode==='title'){
    if(G.title.showHelp){ G.title.showHelp=false; return; }
    for(const r of G.title.rects){ if(t.x>=r.x&&t.x<=r.x+r.w&&t.y>=r.y&&t.y<=r.y+r.h){ G.title.sel=r.i; if(r.i===0) startGame(); else G.title.showHelp=true; return; } }
    return;
  }
  if(G.mode==='gameover'){ G.mode='title'; G.title.sel=0; return; }
  if(G.mode==='ending'){ G.mode='title'; G.title.sel=0; return; }
  if(G.mode==='battle'){ const b=G.battle;
    if(b.phase==='menu'){ for(const r of b.btns){ if(t.x>=r.x&&t.x<=r.x+r.w&&t.y>=r.y&&t.y<=r.y+r.h){ chooseCmd(r.i); return; } } }
    else if(b.phase==='win'||b.phase==='lose'){ G.mode='field'; const f=b._end; G.battle=null; f&&f(); }
    else { nextMsg(); }
    return;
  }
  if(G.mode==='field'){
    if(G.dialog){ dialogAdvance(); return; }
    if(G.cut) return;
    if(t.confirm){ return; }
    if(G.moving||G.path) { return; }
    // world tile
    const wx=Math.floor((t.x+G.cam.x)/TS), wy=Math.floor((t.y+G.cam.y)/TS);
    if(wx<0||wy<0||wx>=cols()||wy>=rows()) return;
    if(interactable(wx,wy)){
      // path to nearest adjacent walkable, then interact
      let best=null,bl=1e9;
      for(const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){ const ax=wx+dx,ay=wy+dy;
        if(ax<0||ay<0||ax>=cols()||ay>=rows()) continue; if(solid(ax,ay)) continue;
        const p=bfs(G.px,G.py,ax,ay,false); if(p&&p.length<bl){bl=p.length;best={path:p,ax,ay};} }
      if((wx===G.px&&Math.abs(wy-G.py)===1)||(wy===G.py&&Math.abs(wx-G.px)===1)){
        G.dir=wx<G.px?'left':wx>G.px?'right':wy<G.py?'up':'down'; doInteract(wx,wy); return; }
      if(best){ G.path=best.path; G.pend={tx:wx,ty:wy,interact:true}; }
      return;
    }
    if(!solid(wx,wy)){ const p=bfs(G.px,G.py,wx,wy,false); if(p&&p.length){ G.path=p; G.pend=null; } }
  }
}
function doInteract(wx,wy){ const n=npcAt(wx,wy); const t=tileAt(wx,wy);
  if(n) triggerNPC(n);
  else if(t==='D') triggerDoor();
  else if(t==='C') triggerCrack();
  else if(t==='g') say([{who:'',txt:'눈부신 황금과 보석이 산처럼 쌓여 있다.'}]);
}

/* ---------- field update ---------- */
function updateField(){
  if(G.dialog){ dialogAnim(); return; }
  if(G.cut) return;
  // keyboard step
  if(!G.moving && !G.path && kq.length){ const k=kq.shift();
    let dx=0,dy=0,nd=G.dir;
    if(k==='ArrowUp'||k==='w'||k==='W'){dy=-1;nd='up';} else if(k==='ArrowDown'||k==='s'||k==='S'){dy=1;nd='down';}
    else if(k==='ArrowLeft'||k==='a'||k==='A'){dx=-1;nd='left';} else if(k==='ArrowRight'||k==='d'||k==='D'){dx=1;nd='right';}
    G.dir=nd; const tx=G.px+dx,ty=G.py+dy;
    if(interactable(tx,ty)) doInteract(tx,ty);
    else if(!solid(tx,ty)){ G.moving={fx:G.px,fy:G.py,tx,ty}; G.moveT=0; }
  }
  if(G.moving){ G.moveT+=0.16;
    if(G.moveT>=1){ G.px=G.moving.tx; G.py=G.moving.ty; G.moving=null;
      if(G.path&&G.path.length){ stepPath(); }
      else if(G.pend&&G.pend.interact){ const pn=G.pend; G.pend=null; G.dir=pn.tx<G.px?'left':pn.tx>G.px?'right':pn.ty<G.py?'up':'down'; doInteract(pn.tx,pn.ty); }
    }
  } else if(G.path&&G.path.length){ stepPath(); }
}
function stepPath(){ const [nx,ny]=G.path[0];
  if(solid(nx,ny)){ G.path=null; G.pend=null; return; }
  G.path.shift(); G.dir=nx<G.px?'left':nx>G.px?'right':ny<G.py?'up':'down'; G.moving={fx:G.px,fy:G.py,tx:nx,ty:ny}; G.moveT=0;
  if(!G.path.length && !(G.pend&&G.pend.interact)) G.path=null;
}

/* ---------- draw: field ---------- */
function drawField(){
  const r=G.room, C0=cols(), R0=rows(), worldW=C0*TS, worldH=R0*TS;
  let ppx=G.px*TS, ppy=G.py*TS;
  if(G.moving){ ppx=(G.moving.fx+(G.moving.tx-G.moving.fx)*G.moveT)*TS; ppy=(G.moving.fy+(G.moving.ty-G.moving.fy)*G.moveT)*TS; }
  let camX=ppx+TS/2-VW/2, camY=ppy+TS/2-VH/2;
  camX = worldW<=VW ? (worldW-VW)/2 : Math.max(0,Math.min(worldW-VW,camX));
  camY = worldH<=VH ? (worldH-VH)/2 : Math.max(0,Math.min(worldH-VH,camY));
  G.cam.x=camX; G.cam.y=camY;
  px(0,0,VW,VH,C.bg);
  const x0=Math.max(0,Math.floor(camX/TS)), x1=Math.min(C0-1,Math.floor((camX+VW)/TS));
  const y0=Math.max(0,Math.floor(camY/TS)), y1=Math.min(R0-1,Math.floor((camY+VH)/TS));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) tile(r.tiles[y][x], x*TS-camX, y*TS-camY, G.anim);
  const walk=(G.moving)?(Math.floor(G.moveT*2)%2):0;
  if(r.npcsLive) for(const n of r.npcsLive) actor(n.x*TS-camX, n.y*TS-camY, n.type, n.dir, 0);
  actor(ppx-camX, ppy-camY, G.flags.ending?'count':'edmond', G.dir, walk);
  // top banner
  const bh=Math.round(TS*0.72);
  px(0,0,VW,bh,'#0b1020cc'); px(0,bh,VW,2,C.panelE2);
  txt(r.name, 10, bh*0.28, C.gold, fs(TS*0.34));
  // hint (before first move)
  if(!G.flags.act && !G.dialog){ txt('화면을 탭해서 이동 · 사람/사물을 탭해 조사', VW/2, VH-TS*0.9, '#ffffffcc', fs(TS*0.3), 'center'); }
  if(G.dialog) drawDialog();
}

function drawDialog(){
  const d=G.dialog,cur=d.q[d.i];
  const m=Math.round(TS*0.28);
  const h=Math.min(VH*0.3, Math.max(TS*2.6, 130));
  const y=VH-h-m, w=VW-m*2, x=m;

  rr(x+3,y+4,w,h,10,C.panelSh);
  rr(x,y,w,h,10,C.panelE2); rr(x+2,y+2,w-4,h-4,9,C.panelE); rr(x+4,y+4,w-8,h-8,8,C.panel);
  const ts=fs(TS*0.38), pad=Math.round(TS*0.32);
  let ty=y+pad;
  if(cur.who){ txt(cur.who, x+pad, ty, C.panelE2, fs(TS*0.4)); ty+=ts+4; }
  wrap(d.shown||'', x+pad, ty, w-pad*2, ts+4, C.text, ts);
  if(d.done && (G.anim>>4)%2) txt('▼', x+w-pad, y+h-ts-6, C.panelE2, ts);
}
function wrap(s,x,y,maxw,lh,col,size){
  X.font=size+"px 'Galmuri11',monospace"; X.fillStyle=col; X.textAlign='left'; X.textBaseline='top';
  let line='',yy=y;
  for(const ch of s){ if(ch==='\n'){X.fillText(line,x,yy);line='';yy+=lh;continue;}
    const test=line+ch; if(X.measureText(test).width>maxw){X.fillText(line,x,yy);line=ch;yy+=lh;} else line=test; }
  X.fillText(line,x,yy);
}

/* ---------- draw: battle ---------- */
function drawBattle(){
  const b=G.battle,pl=G.player,e=b.e;

  const g=X.createLinearGradient(0,0,0,VH); g.addColorStop(0,'#241d33'); g.addColorStop(1,'#120c1c');
  X.fillStyle=g; X.fillRect(0,0,VW,VH);
  for(let i=0;i<50;i++) px((i*71%VW),(i*53%(VH*0.5)),2,2, i%4?'#2a2340':'#3a3358');
  // enemy
  let ex=VW/2, ey=VH*0.30; if(b.shake>0){ex+=(Math.random()*b.shake-b.shake/2);b.shake--;}
  const es=TS*0.16;

  bar(m+sp+TS*0.9, uy+sp+TS*1.68, sw-sp*2-TS*0.9, TS*0.28, pl.mp/pl.maxmp, C.mpb);
  txt(pl.mp+'/'+pl.maxmp, m+sp, uy+sp+TS*2.1, C.text, fs(TS*0.3));
  // right panel: menu or message
  const rx=m*2+sw, rw=sw;
  panel(rx,uy,rw,uh-m);
  b.btns=[];
  if(b.phase==='menu'){

      rr(bx,by+2,bw,bh-4,6,'#00000018'); rr(bx,by,bw,bh-6,6,'#fff'); rr(bx,by,bw,bh-6,6,'#ffffff');
      X.strokeStyle=C.panelE; X.lineWidth=2; X.beginPath(); X.roundRect(bx,by,bw,bh-6,6); X.stroke();
      txt(BCMDS[i].n, bx+bw/2, by+(bh-6)/2-fs(TS*0.34)/2, C.text, fs(TS*0.34),'center');
      b.btns.push({x:bx,y:by,w:bw,h:bh-6,i}); }
  } else {
    wrap(b.msg||'', rx+sp, uy+sp, rw-sp*2, fs(TS*0.36)+4, C.text, fs(TS*0.36));
    if((G.anim>>4)%2) txt('▼', rx+rw-sp, uy+uh-m-fs(TS*0.4)-6, C.panelE2, fs(TS*0.4));
  }
}

  px(cx+6*u,cy-6*u,1.6*u,14*u,'#8a8a9a'); px(cx+5.6*u,cy-9*u,2.4*u,3*u,'#d8d8e0'); // spear
}
function bar(x,y,w,h,frac,col){ rr(x,y,w,h,h/2,'#0007'); rr(x+1,y+1,w-2,h-2,(h-2)/2,'#00000030'); rr(x+1,y+1,Math.max(0,(w-2)*Math.max(0,Math.min(1,frac))),h-2,(h-2)/2,col); }
function panel(x,y,w,h){ rr(x+2,y+3,w,h,9,C.panelSh); rr(x,y,w,h,9,C.panelE2); rr(x+2,y+2,w-4,h-4,8,C.panelE); rr(x+4,y+4,w-8,h-8,7,C.panel); }

/* ---------- draw: title ---------- */
function drawTitle(){
  const a=G.anim;
  const g=X.createLinearGradient(0,0,0,VH); g.addColorStop(0,C.sky1); g.addColorStop(0.6,C.sky2); g.addColorStop(1,'#081a30');
  X.fillStyle=g; X.fillRect(0,0,VW,VH);
  for(let i=0;i<80;i++){ const sx=(i*57+i*i*3)%VW, sy=(i*37)%(VH*0.55); if(((a>>4)&15)!==(i&15)) px(sx,sy,2,2, i%6?'#8fb0e0':'#fff'); }
  // moon
  circ(VW*0.76, VH*0.16, TS*0.9, C.moon); circ(VW*0.79, VH*0.145, TS*0.78, C.sky1);
  // sea
  const seaY=VH*0.52;
  px(0,seaY,VW,VH-seaY,C.sea2);
  for(let y=seaY;y<VH;y+=Math.max(3,TS*0.16)){ px(0,y,VW,2, ((y/TS+ (a>>5))|0)%2? C.sea1:C.sea3+'aa'); }
  // fortress
  const ix=VW*0.5, iy=seaY-TS*1.2, w=TS*4;
  px(ix-w*0.75, iy+TS*0.9, w*1.5, TS*0.9, '#0a0f1e');
  px(ix-w*0.5, iy, w, TS*1.1, '#13203a');
  px(ix-w*0.6, iy-TS*0.7, TS*0.9, TS*1.8, '#182746'); px(ix+w*0.5-TS*0.9, iy-TS*0.7, TS*0.9, TS*1.8, '#182746');
  px(ix-TS*0.6, iy-TS*1.1, TS*1.2, TS*2.2, '#1d2c50');
  if((a>>5)%2) px(ix-w*0.45, iy+TS*0.2, TS*0.24, TS*0.34, C.gold);
  px(ix-TS*0.35, iy-TS*0.5, TS*0.24, TS*0.34, (a>>4)%2?C.gold:'#6a4a10');
  px(ix+w*0.3, iy+TS*0.2, TS*0.24, TS*0.34, C.gold);
  // title text
  txt('MONTE CRISTO', VW/2+2, VH*0.235+2, '#08122a', fs(TS*1.05),'center');
  txt('MONTE CRISTO', VW/2, VH*0.235, C.gold, fs(TS*1.05),'center');
  txt('몽테크리스토 — 복수의 서막', VW/2, VH*0.235+TS*1.1, C.textL, fs(TS*0.42),'center');
  // menu buttons
  const items=['새 게임','조작법']; G.title.rects=[];
  const bw=Math.min(VW*0.6, TS*6), bh=TS*1.1, bx=VW/2-bw/2; let by=VH*0.68;
  for(let i=0;i<items.length;i++){
    const sel=i===G.title.sel;
    rr(bx+2,by+3,bw,bh,10,'#0006'); rr(bx,by,bw,bh,10, sel?C.gold:'#e9edf7');
    X.strokeStyle=sel?'#fff6c8':'#9fb0d8'; X.lineWidth=2; X.beginPath(); X.roundRect(bx,by,bw,bh,10); X.stroke();
    txt(items[i], VW/2, by+bh/2-fs(TS*0.44)/2, sel?'#5a3a00':'#33436e', fs(TS*0.44),'center');
    G.title.rects.push({x:bx,y:by,w:bw,h:bh,i}); by+=bh+TS*0.4;
  }
  if(G.title.showHelp){
    const w=Math.min(VW*0.86,TS*8), h=TS*5.2, x=VW/2-w/2, y=VH/2-h/2;
    panel(x,y,w,h);
    wrap('조작법\n\n· 가고 싶은 곳을 탭하면 이동합니다.\n· 사람이나 사물을 탭하면 대화·조사.\n· 대화 중에는 화면을 탭해 다음으로.\n· 전투는 명령 버튼을 탭.\n\n폰·태블릿 모두 터치로 즐겨요.\n(탭하면 닫기)', x+TS*0.4, y+TS*0.4, w-TS*0.8, fs(TS*0.4)+4, C.text, fs(TS*0.4));
  }
}
function drawGameOver(){ px(0,0,VW,VH,'#180810'); txt('쓰러졌다…',VW/2,VH*0.4,C.red,fs(TS*0.9),'center'); txt('화면을 탭해 타이틀로',VW/2,VH*0.55,C.textL,fs(TS*0.42),'center'); }
function drawEnding(){
  const g=X.createLinearGradient(0,0,0,VH); g.addColorStop(0,'#0a0810'); g.addColorStop(1,'#161020'); X.fillStyle=g; X.fillRect(0,0,VW,VH);
  for(let i=0;i<60;i++) px((i*61%VW),(i*47%VH),2,2,i%4?'#2a2338':C.gold);
  txt('― 제 1 막  끝 ―', VW/2, VH*0.22, C.gold, fs(TS*0.7),'center');
  wrap('에드몽 단테스는 죽고,\n몬테크리스토 백작이 태어났다.\n\n그의 복수는 이제\n막 시작되었다…', 0, VH*0.36, VW, fs(TS*0.5)+8, C.textL, fs(TS*0.5));
  X.textAlign='center';
  txt('제2막 「백작의 심판」에서 계속', VW/2, VH*0.72, '#9fb0d8', fs(TS*0.36),'center');
  txt('화면을 탭해 타이틀로', VW/2, VH*0.8, C.gold, fs(TS*0.38),'center');
}

/* ---------- start ---------- */
function startGame(){ const p=G.player;
  G.flags={}; p.hp=60;p.maxhp=60;p.mp=12;p.maxmp=12;p.atk=14;p.def=6;p.lv=1;
  fadeTo(()=>{ loadRoom('marseille'); G.mode='field';
    setTimeout(()=>{ say([{who:'',txt:'1815년, 프랑스 마르세유. 젊은 선원 에드몽 단테스가 약혼자 메르세데스에게 돌아왔다.'},
      {who:'',txt:'(위쪽의 메르세데스에게 다가가 탭해서 이야기하자.)'}]); },250);
  });
}

/* ---------- main loop ---------- */
function loop(){
  G.anim++;
  const t=tap; tap=null;
  if(G.fadeDir!==0){
    G.fade+=G.fadeDir*0.08;
    if(G.fadeDir>0&&G.fade>=1){G.fade=1;const c=G.fadeCb;G.fadeCb=null;c&&c();}
    else if(G.fadeDir<0&&G.fade<=0){G.fade=0;const c=G.fadeCb;G.fadeCb=null;c&&c();}
  } else {
    if(t) handleTap(t);
    if(G.mode==='field') updateField();
    if(G.dialog && G.mode!=='field') dialogAnim();
  }
  X.clearRect(0,0,VW,VH);
  if(G.mode==='title') drawTitle();
  else if(G.mode==='field') drawField();
  else if(G.mode==='battle') drawBattle();
  else if(G.mode==='gameover') drawGameOver();
  else if(G.mode==='ending') drawEnding();
  if(G.fade>0){ X.fillStyle='rgba(0,0,0,'+G.fade+')'; X.fillRect(0,0,VW,VH); }
  requestAnimationFrame(loop);
}
if(!X.roundRect){ X.roundRect=function(x,y,w,h,r){ this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); return this; }; }
document.fonts && document.fonts.load("16px 'Galmuri11'").catch(()=>{});
loop();
</script>
