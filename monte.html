    if (B.script) {
      for (const l of (B.script.d.intro || [])) S.push({ t: 'say', who: l.who, text: fmt(l.t, {}) });
      // 대사가 끝난 뒤 로그 창이 비어 있지 않게(명령을 고를 때 상황 한 줄)
      if (B.td && B.td.appear) S.push({ t: 'msg', text: fmt(B.td.appear, {}), wait: 'auto', style: 'enemy', fam: B.enemies[0] && B.enemies[0].fam });
      return S;
    }
    const td = B.td, e0 = B.enemies[0], done = {};
    for (const e of B.enemies) {                                     // 등장 대사는 말풍선(기다리지 않음)
      if (done[e.id]) continue; done[e.id] = 1;
      const ln = e.data.lines && e.data.lines.appear;
      if (ln) S.push({ t: 'bubble', unit: e, text: fmt(ln, {}) });
    }
    S.push({ t: 'msg', text: fmt(td.appear || (B.enemies.length > 1 ? T('appearN') : T('appear1')), { name: e0 ? e0.name : '' }), wait: 'auto', style: 'enemy', fam: e0 && e0.fam });
    if (B.preempt === 'player') S.push({ t: 'msg', text: T('preemptPlayer'), style: 'gold', wait: 'auto' });
    if (B.preempt === 'enemy') S.push({ t: 'msg', text: T('preemptEnemy'), style: 'red', wait: 'short' });
    const TU = DB().tutorials || {};
    let tut = td.tutorial;                                              // 무리 전용 안내가 없으면 '첫 전투' 안내(한 번)
    if (!tut && !B.boss && TU.first && MC.game && !MC.game.flag(TU.first.flag)) tut = TU.first;
    if (tut && !B.sim && MC.game && !MC.game.flag(tut.flag)) {
      S.push({ t: 'say', who: tut.who || 'think', text: fmt(tut.t, {}) });
      if (tut.flag) MC.game.setFlag(tut.flag);
    }
    return S;
  }

  /* ---------- 라운드 시작: intent ---------- */
  function mkIntent(B, e, id) {
    const a = actionDef(e, id), kind = a.kind || 'atk';
    return { act: id, def: a, kind, strong: kind === 'charge' || !!a.strong, show: kind !== 'atk' || !!B.scanned || !!a.show, icon: ICON[kind] || 'ic_intent_unknown' };
  }
  function condOk(B, e, c) {
    if (c.hpBelow != null && !(e.hp < e.maxHp * c.hpBelow)) return false;
    if (c.hpAbove != null && !(e.hp >= e.maxHp * c.hpAbove)) return false;
    if (c.round != null && B.round !== c.round) return false;
    if (c.every != null && B.round % c.every !== 0) return false;
    return true;
  }
  function chooseIntent(B, e, strongUsed) {
    if (e.st.charge) {                                                // 차지하면 다음 라운드 확정 발동
      const it = mkIntent(B, e, e.st.charge.release || 'atk');
      it.kind = 'atk'; it.release = e.st.charge.mult || 2.3; it.show = true; it.icon = 'ic_intent_charge'; it.strong = true;
      return it;
    }
    if (B.script && e.boss) { const it = scriptIntent(B, e); if (it) return it; }
    const ai = (e.data.ai && e.data.ai.length) ? e.data.ai : [{ act: 'atk', w: 1 }];
    const cand = [];
    let tot = 0;
    for (const r of ai) {
      const a = actionDef(e, r.act), k = a.kind || 'atk';
      if (k !== 'atk' && e.last === r.act) continue;                                     // 같은 특수 행동 연속 금지
      if ((k === 'charge' || a.strong) && strongUsed) continue;                            // 라운드당 차지·강공 1체
      if (k === 'confuse' && B.allies.every(u => !u.alive || u.st.confuse)) continue;     // 이미 혼란이면 금지
      if (k === 'heal' && !B.enemies.some(x => x.alive && x.hp < x.maxHp * 0.5)) continue;
      if (k === 'drain' && !a.all && B.allies.every(u => !u.alive || u.mp <= 0)) continue;
      if (r.cond && !condOk(B, e, r.cond)) continue;
      cand.push(r); tot += r.w || 1;
    }
    if (!cand.length) return mkIntent(B, e, ai[0].act);
    let x = B.rng() * tot;
    for (const r of cand) { x -= r.w || 1; if (x < 0) return mkIntent(B, e, r.act); }
    return mkIntent(B, e, cand[cand.length - 1].act);
  }
  function planRound(B) {
    const S = [];
    B.round++;
    if (B.script) scriptRoundStart(B, S);
    let strong = false;
    for (const e of B.enemies) {
      e.intent = null;
      if (!e.alive) continue;
      if (B.round === 1 && B.preempt === 'player') { e.intent = { act: 'surprised', kind: 'skip', show: true, icon: null, zz: true }; continue; }
      const it = chooseIntent(B, e, strong);
      if (it.strong) strong = true;
      e.intent = it;
    }
    S.push({ t: 'intents' });
    return S;
  }

  /* ---------- 라운드 해결 ---------- */
  // cmds[i]: {kind:'attack'|'skill'|'item'|'endure'|'flee', id, target(적 idx)} — null이면 그 아군은 행동 안 함(기습 라운드)
  function resolveRound(B, cmds) {
    const S = [], acts = [];
    B.allies.forEach((u, i) => {
      const c = cmds && cmds[i];
      if (!u.alive || !c) return;
      const pri = (c.kind === 'endure' || c.kind === 'flee' || (c.kind === 'skill' && skill(c.id) && skill(c.id).priority)) ? 1 : 0;
      acts.push({ u, c, pri, k: speedOf(u) * (0.95 + B.rng() * 0.1), ally: 1 });
    });
    for (const e of B.enemies) {
      if (!e.alive || !e.intent || e.intent.kind === 'skip') continue;
      acts.push({ u: e, pri: e.intent.kind === 'guard' ? 1 : 0, k: speedOf(e) * (0.95 + B.rng() * 0.1), ally: 0 });
    }
    acts.sort((a, b) => (b.pri - a.pri) || (b.k - a.k) || (b.ally - a.ally));   // 동률이면 아군 먼저
    S.push({ t: 'order', list: acts.map(a => a.u), pri: acts.map(a => !!a.pri) });
    for (const a of acts) {
      if (B.outcome) break;
      if (!a.u.alive) continue;
      S.push({ t: 'turn', unit: a.u });
      if (a.ally) { allyAct(B, a.u, a.c, S); B.turnsTaken++; }
      else enemyAct(B, a.u, S);
      checkEnd(B, S);
    }
    if (!B.outcome) roundEnd(B, S);
    return S;
  }
  function checkEnd(B, S) {
    if (B.outcome) return;
    if (!B.enemies.some(e => e.alive)) B.outcome = 'win';
    else if (!B.allies.some(u => u.alive)) { B.outcome = 'lose'; }
  }

  /* ---------- 아군 행동 ---------- */
  function allyAct(B, u, c, S) {
    const sk = c.kind === 'skill' ? skill(c.id) : null;
    if (u.st.confuse && !(sk && sk.cureConfuse)) {                     // C-4: 40% 헛손질(반은 무작위 공격, 반은 무행동)
      if (B.rng() < 0.4) {
        if (B.rng() < 0.5) { S.push({ t: 'msg', text: fmt(T('confuseIdle'), { actor: u.name }), style: 'think', wait: 'auto' }); return; }
        const pool = aliveE(B).concat([u]);
        const t = pool[Math.floor(B.rng() * pool.length)];
        S.push({ t: 'msg', text: fmt(T('confuseHit'), { actor: u.name }), style: 'think', wait: 'short' });
        if (t === u) {
          const n = Math.max(1, Math.round((u.str - u.def * 0.5) * 0.5 * vari(B)));
          S.push({ t: 'msg', text: T('confuseSelf'), wait: 0 });
          hurtAlly(B, null, u, n, false, S);
        } else {
          S.push({ t: 'slash', target: t, kind: 'atk' });
          damageEnemy(B, t, physDmg(B, u, t, 1), 'normal', null, S, {});
        }
        return;
      }
    }
    switch (c.kind) {
      case 'attack': {
        const t = tgtEnemy(B, c.target);
        if (!t) return;
        S.push({ t: 'msg', text: fmt(T('attack'), { actor: u.name }), wait: 'short' });
        S.push({ t: 'slash', target: t, kind: 'atk' });
        damageEnemy(B, t, physDmg(B, u, t, 1), 'normal', null, S, {});
        return;
      }
      case 'skill': return castSkill(B, u, c, sk, S);
      case 'endure': return doEndure(B, u, S);
      case 'item': return useItemB(B, u, c, S);
      case 'flee': return doFlee(B, u, S);
    }
  }
  function physDmg(B, a, t, power) { return Math.max(1, Math.round((a.str * (power || 1) - defEff(t) * 0.5) * vari(B))); }

  function castSkill(B, u, c, sk, S) {
    if (!sk) return;
    const r = rankOf(u.lv), cost = pick3(sk.mp, r);
    if (u.mp < cost) { S.push({ t: 'msg', text: T('noMp'), style: 'sys', wait: 'auto' }); return; }
    u.mp -= cost;
    if (cost) S.push({ t: 'mp', target: u, mp: u.mp, n: -cost });
    const sr = B.script ? scriptReact(B, c.id) : null;
    if (sr) {
      S.push(...sr.pre);
      S.push({ t: 'msg', text: fmt(T('skill'), { actor: u.name, skill: sk.name }), wait: 0, quiet: true });
    } else {
      S.push({ t: 'msg', text: fmt(T('skill'), { actor: u.name, skill: sk.name }), wait: 0 });
      const lines = L(sk.lines);
      if (lines.length) S.push({ t: 'msg', text: lines[Math.floor(B.rng() * lines.length)], style: 'think', wait: 'short' });
    }
    if (sk.cureConfuse && u.st.confuse) {
      delete u.st.confuse;
      S.push({ t: 'status', target: u, id: 'confuse', on: false });
      S.push({ t: 'msg', text: T('confuseCure'), style: 'blue', wait: 'short' });
    }
    const targets = sk.target === 'all' ? aliveE(B) : [tgtEnemy(B, c.target)].filter(Boolean);
    for (const t of targets) {
      if (!t.alive) continue;
      const m = elemMult(t, sk.elem), mk = multKind(m);
      const fresh = record(B, t, sk.elem, mk);
      const discover = fresh && mk === 'weak' && !(B.script && B.script.d.noDiscover);
      if (discover) B.weakBonus = true;
      S.push({ t: 'slash', target: t, kind: sk.fx || c.id, color: sk.color });
      const n = Math.max(1, Math.round((pick3(sk.power, r) + u.wis * 0.8 - defEff(t) * 0.3) * m * vari(B)));
      damageEnemy(B, t, n, mk, sk.elem, S, { discover, skill: sk });
    }
    if (sr) {
      S.push(...sr.post);
      if (sr.heal) for (const e of B.enemies) if (e.boss && e.alive && e.hp < e.maxHp) { e.hp = e.maxHp; S.push({ t: 'regen', target: e, hp: e.hp }); }
    }
  }
  function doEndure(B, u, S) {
    const sk = skill('endure') || {};
    u.st.endure = { n: 1, mul: sk.guard || 0.5 };
    const sr = B.script ? scriptReact(B, 'endure') : null;
    if (sr) S.push(...sr.pre);
    S.push({ t: 'msg', text: fmt(T('endure'), { actor: u.name }), wait: sr ? 0 : 'short', quiet: !!sr });
    S.push({ t: 'guard', target: u });
    const gain = Math.min(u.maxMp - u.mp, Math.max(sk.mpGainMin || 2, Math.round(u.maxMp * (sk.mpGain || 0.15))));
    if (gain > 0) { u.mp += gain; S.push({ t: 'heal', target: u, stat: 'mp', n: gain, mp: u.mp }); }
    if (sr) S.push(...sr.post);
  }
  function useItemB(B, u, c, S) {
    const it = item(c.id);
    if (!it || !((B.items[c.id] || 0) > 0) || B.disabled.item) { S.push({ t: 'msg', text: T('noItem'), style: 'sys', wait: 'auto' }); return; }
    B.items[c.id]--;
    if (B.items[c.id] <= 0) delete B.items[c.id];
    S.push({ t: 'msg', text: fmt(T('item'), { actor: u.name, item: it.name }), wait: 'short' });
    applyItem(u, it, S);
    if (it.recall) S.push({ t: 'msg', text: it.recall, style: 'think', wait: 'auto' });
  }
  // 도구 효과(전투·필드 공용). S가 있으면 스텝을 쌓는다 → 회복량 {hp, mp}
  function applyItem(u, it, S) {
    const ef = it.effect || {}, out = { hp: 0, mp: 0 };
    const maxHp = u.maxHp != null ? u.maxHp : (u.st && u.st.maxHp) || u.hp, maxMp = u.maxMp != null ? u.maxMp : (u.st && u.st.maxMp) || u.mp;
    if (ef.hp || ef.hpPct) {
      const amt = Math.max(ef.hp || 0, Math.round(maxHp * (ef.hpPct || 0)));
      out.hp = Math.min(amt, maxHp - u.hp); u.hp += out.hp;
      if (S) S.push({ t: 'heal', target: u, stat: 'hp', n: out.hp, hp: u.hp });
    }
    if (ef.mp || ef.mpPct) {
      const amt = Math.max(ef.mp || 0, Math.round(maxMp * (ef.mpPct || 0)));
      out.mp = Math.min(amt, maxMp - u.mp); u.mp += out.mp;
      if (S) S.push({ t: 'heal', target: u, stat: 'mp', n: out.mp, mp: u.mp });
    }
    for (const k of L(ef.cure)) if (u.st && u.st[k]) { delete u.st[k]; if (S) S.push({ t: 'status', target: u, id: k, on: false }); }
    return out;
  }
  function doFlee(B, u, S) {
    if (!B.canFlee || B.disabled.flee) { S.push({ t: 'msg', text: T('fleeNo'), style: 'sys', wait: 'auto' }); return; }
    let top = 0;
    for (const e of aliveE(B)) top = Math.max(top, speedOf(e));
    const p = B.preempt === 'player' ? 1 : clamp(0.6 + (speedOf(u) - top) * 0.03 + B.fleeFails * 0.25, 0.2, 0.95);
    if (B.rng() < p) {
      S.push({ t: 'flee' });
      S.push({ t: 'msg', text: fmt(T('flee'), { actor: u.name }), wait: 'short' });
      B.outcome = 'flee';
    } else {
      B.fleeFails++;
      S.push({ t: 'fleeFail' });
      S.push({ t: 'msg', text: T('fleeFail'), style: 'sys', wait: 'auto' });
    }
  }

  /* ---------- 피해 ---------- */
  function damageEnemy(B, t, n, mk, elem, S, o) {
    let hp = t.hp - n;
    if (t.boss && B.script && B.script.d.immortal) hp = Math.max(1, hp);
    t.hp = Math.max(0, hp);
    S.push({ t: 'hit', target: t, n, mult: mk, elem, hp: t.hp, max: t.maxHp });
    if (o && o.discover) S.push({ t: 'weakFound', target: t, skill: o.skill });
    if (t.hp <= 0) {
      t.alive = false; t.intent = null;
      const last = !B.enemies.some(x => x.alive);
      const dl = t.data.lines && t.data.lines.defeat;
      S.push({ t: 'die', target: t, last, line: dl ? fmt(dl, {}) : null });
      S.push({ t: 'msg', text: fmt(T('kill'), { target: t.label }), wait: last ? 'short' : 'short', style: 'gold' });
    }
  }
  function hurtAlly(B, src, t, n, guard, S) {
    let hp = t.hp - n;
    const sd = B.script && B.script.d;
    if (sd && sd.minHp) hp = Math.max(sd.minHp, hp);                   // 절망 1차: 당테스 HP 최소 1
    t.hp = Math.max(0, hp);
    S.push({ t: 'hurt', target: t, n, hp: t.hp, guard: !!guard, src });
    if (t.hp <= 0) { t.alive = false; S.push({ t: 'down', target: t }); S.push({ t: 'msg', text: fmt(T('lose'), { actor: t.name }), style: 'red', wait: 'auto' }); }
  }

  /* ---------- 적 행동 ---------- */
  function enemyAct(B, e, S) {
    const it = e.intent;
    if (!it) return;
    const a = it.def || {}, who = e.label, fc = e.fam;
    if (e.st.confuse && B.rng() < 0.4) { S.push({ t: 'msg', text: fmt(T('enemyConfused'), { actor: who }), style: 'enemy', fam: fc, wait: 'auto' }); e.last = it.act; return; }
    const tgt = pickAlly(B);
    if (!tgt && it.kind !== 'overwhelm') return;
    switch (it.kind) {
      case 'atk': {
        S.push({ t: 'msg', text: fmt(it.release ? (a.releaseMsg || T('release')) : (a.msg || T('eAttack')), { actor: who, target: tgt.name }), style: 'enemy', fam: fc, wait: 0 });
        S.push({ t: 'windup', unit: e, strong: !!it.release });
        let n = Math.max(1, Math.round((e.str * (a.power || 1) * (it.release || 1) - tgt.def * 0.5) * vari(B)));
        const guard = !!tgt.st.endure;
        if (guard) n = Math.max(1, Math.round(n * tgt.st.endure.mul));
        hurtAlly(B, e, tgt, n, guard, S);
        if (it.release) { delete e.st.charge; S.push({ t: 'charge', unit: e, on: false }); }
        break;
      }
      case 'charge':
        S.push({ t: 'msg', text: fmt(a.msg || T('charge'), { actor: who }), style: 'enemy', fam: fc, wait: 'short' });
        e.st.charge = { release: a.release || 'atk', mult: a.mult || 2.3 };
        S.push({ t: 'charge', unit: e, on: true });
        break;
      case 'drain': {
        S.push({ t: 'msg', text: fmt(a.msg, { actor: who, target: tgt.name }), style: 'enemy', fam: fc, wait: 0 });
        S.push({ t: 'windup', unit: e, soft: true });
        const amt = a.all ? tgt.mp : Math.min(tgt.mp, a.n || 2);
        if (amt <= 0) { S.push({ t: 'msg', text: fmt(a.none || '……', { actor: who }), style: 'sys', wait: 'auto' }); break; }
        tgt.mp -= amt;
        S.push({ t: 'drain', from: tgt, to: e, n: amt, mp: tgt.mp });
        const h = Math.min(e.maxHp - e.hp, amt);
        if (h > 0 && !(e.boss && B.script)) { e.hp += h; S.push({ t: 'eheal', target: e, n: h, hp: e.hp }); }
        break;
      }
      case 'confuse':
        S.push({ t: 'msg', text: fmt(a.msg, { actor: who, target: tgt.name }), style: 'enemy', fam: fc, wait: 0 });
        S.push({ t: 'windup', unit: e, soft: true });
        if (!tgt.st.confuse && B.rng() < (a.acc || 0.7)) {
          tgt.st.confuse = { n: a.turns || 2, fresh: true };
          S.push({ t: 'status', target: tgt, id: 'confuse', on: true });
          S.push({ t: 'msg', text: fmt(T('confused'), { actor: tgt.name }), style: 'purple', wait: 'auto' });
        } else S.push({ t: 'msg', text: fmt(a.miss || '{target}{은/는} 흔들리지 않았다.', { target: tgt.name }), style: 'sys', wait: 'auto' });
        break;
      case 'guard':
        e.st.guardDef = { n: 1, mul: a.mul || 2 };
        S.push({ t: 'guard', target: e });
        S.push({ t: 'msg', text: fmt(a.msg, { actor: who }), style: 'enemy', fam: fc, wait: 'auto' });
        break;
      case 'heal': {
        const tg = B.enemies.filter(x => x.alive).sort((p, q) => p.hp / p.maxHp - q.hp / q.maxHp)[0];
        const h = Math.min(tg.maxHp - tg.hp, Math.round(tg.maxHp * (a.pct || 0.2)));
        S.push({ t: 'msg', text: fmt(a.msg, { actor: who, target: tg.label }), style: 'enemy', fam: fc, wait: 'short' });
        tg.hp += h; S.push({ t: 'eheal', target: tg, n: h, hp: tg.hp });
        break;
      }
      case 'overwhelm':
        scriptFinale(B, e, S);
        break;
      default:
        S.push({ t: 'msg', text: fmt(a.msg || T('enemyIdle'), { actor: who }), style: 'enemy', fam: fc, wait: 'auto' });
    }
    e.last = it.act;
  }

  /* ---------- 라운드 끝 ---------- */
  function roundEnd(B, S) {
    for (const u of B.allies.concat(B.enemies)) {
      if (!u.alive) continue;
      for (const k of ['endure', 'guardDef', 'slow', 'bind', 'buff']) if (u.st[k] && --u.st[k].n <= 0) delete u.st[k];
      const cf = u.st.confuse;
      if (cf) {
        if (cf.fresh) cf.fresh = false;
        else if (--cf.n <= 0) {
          delete u.st.confuse;
          S.push({ t: 'status', target: u, id: 'confuse', on: false });
          if (u.side === 'ally') S.push({ t: 'msg', text: fmt(T('confuseEnd'), { actor: u.name }), style: 'blue', wait: 'short' });
        }
      }
    }
    if (B.script) scriptRoundEnd(B, S);
    for (const e of B.enemies) e.intent = null;
    S.push({ t: 'roundEnd' });
  }

  /* ---------- 보스 스크립트 (절망 1차: C-8 a + F-3 3-4) ---------- */
  const SD = B => (B.script && B.script.d) || {};
  function scriptRoundStart(B, S) {
    const rc = SD(B).rounds && SD(B).rounds[B.round];
    if (!rc) return;
    if (rc.shatter) { for (const k of rc.shatter) B.disabled[k] = true; S.push({ t: 'shatter', cmds: rc.shatter.slice() }); }
    if (rc.music) S.push({ t: 'music', calls: rc.music });
    for (const l of L(rc.say)) S.push({ t: 'say', who: l.who, text: fmt(l.t, {}) });
  }
  function scriptIntent(B, e) {
    const R = SD(B).rounds || {}, rc = R[B.round] || R.default;
    if (!rc || !rc.act) return null;
    const it = mkIntent(B, e, rc.act);
    if (rc.intent) { it.icon = 'ic_intent_' + rc.intent; it.show = true; }
    if (rc.show != null) it.show = !!rc.show;
    return it;
  }
  function scriptReact(B, id) {
    const R = SD(B).react;
    if (!R || !R[id]) return null;
    const cnt = B.reactN || (B.reactN = {}), n = cnt[id] = (cnt[id] || 0) + 1;
    const r0 = R[id], again = n > 1 && r0.again, r = again ? r0.again : r0, pre = [], post = [];   // 같은 명령을 또 쓰면 again 대사(같은 말 되풀이 방지)
    for (const t of L(r.dantes)) pre.push({ t: 'say', who: 'dantes', text: fmt(t, {}) });
    const v = !again && r0.byVar ? B.vars[r0.byVar] : null;            // 선택지 메아리(toast)는 처음 한 번
    if (v != null && r0.byVal && r0.byVal[v]) pre.push({ t: 'say', who: 'dantes', text: fmt(r0.byVal[v], {}) });
    for (const t of L(r.despair)) post.push({ t: 'say', who: 'despair', text: fmt(t, {}) });
    return { pre, post, heal: !!r0.heal };
  }
  function scriptRoundEnd(B, S) {
    const d = SD(B);
    if (!d.regen) return;
    for (const e of B.enemies) if (e.boss && e.alive && e.hp < e.maxHp) {
      e.hp = e.maxHp;
      S.push({ t: 'regen', target: e, hp: e.hp, line: d.regenLine ? fmt(d.regenLine, {}) : null });
    }
  }
  function scriptFinale(B, e, S) {
    const f = SD(B).finale || {};
    if (f.line) S.push({ t: 'say', who: 'despair', text: fmt(f.line, {}), slow: true });
    S.push({ t: 'overwhelm', text: fmt(f.text || '', {}) });
    B.outcome = 'scripted';
  }

  /* ---------- 결산 ---------- */
  function floorMul(B, lv) {
    const fl = B.td.floor && levels().floors && levels().floors[B.td.floor];
    if (!fl) return 1;
    if (lv < fl[0]) return 1.5;
    if (lv > fl[1] + 2) return 0.5;
    return 1;
  }
  // 보상 적용 + 아군 HP/MP를 파티로 되돌림 → {outcome, exp, drops:[id], mp, ups:[...], label, before:{lv,exp}}
  function finish(B) {
    const out = B.outcome || 'flee', lead = B.allies[0], m0 = lead && lead.ref;
    const R = { outcome: out, exp: 0, drops: [], mp: 0, ups: [], label: null, before: m0 ? { lv: m0.lv, exp: m0.exp || 0 } : null, weakBonus: B.weakBonus };
    const st = MC.state;
    if (!B.sim && st) {
      const s = st.stats || (st.stats = { battles: 0, lose: 0, flee: 0 });
      s.battles = (s.battles || 0) + 1;
      if (out === 'lose') s.lose = (s.lose || 0) + 1;
      if (out === 'flee') s.flee = (s.flee || 0) + 1;
    }
    if (out === 'win') {
      let exp = 0;
      for (const e of B.enemies) { exp += e.data.exp || 0; record(B, e, null, null); }
      if (B.weakBonus) exp *= 1.2;
      exp *= floorMul(B, lead ? lead.lv : 1);
      R.exp = Math.round(exp);
      for (const e of B.enemies) for (const dr of (e.data.drops || [])) {
        if (B.rng() < (dr.p || 0)) { R.drops.push(dr.id); B.items[dr.id] = (B.items[dr.id] || 0) + (dr.n || 1); }
      }
      const vm = levels().victoryMp != null ? levels().victoryMp : 0.1;
      for (const u of aliveA(B)) { const g = Math.min(u.maxMp - u.mp, Math.max(1, Math.round(u.maxMp * vm))); u.mp += g; if (u === lead) R.mp = g; }
    } else if (out === 'scripted') {
      const f = SD(B).finale || {};
      R.exp = f.exp || 0; R.label = f.expLabel || null;
    } else if (out === 'lose') {
      const its = DB().items || {};                                    // 재료 절반 손실(경험치 유지)
      for (const id in B.items) if (its[id] && its[id].kind === 'mat') B.items[id] = Math.floor(B.items[id] / 2);
    }
    for (const u of B.allies) {                                        // 파티로 되돌림
      const m = u.ref;
      m.hp = u.alive ? u.hp : (out === 'win' ? 1 : 0);
      m.mp = u.mp;
    }
    if (R.exp > 0) for (const u of B.allies) {
      if (!u.alive && out !== 'scripted' && out !== 'win') continue;
      const ups = gainExp(u.ref, R.exp);
      if (u === lead) R.ups = ups;
    }
    return R;
  }

  /* ---------- 대상·반복 도우미(뷰·sim 공용) ---------- */
  function needsTarget(B, cmd) {
    if (cmd.kind === 'attack') return aliveE(B).length > 1;
    if (cmd.kind === 'skill') { const s = skill(cmd.id); return !!s && s.target === 'one' && aliveE(B).length > 1; }
    return false;
  }
  // [↻반복]: 직전 명령 재사용. 대상이 죽었으면 첫 생존 적
  function repeatOf(B, u, last) {
    if (!last) return null;
    const c = Object.assign({}, last);
    if (c.target != null) { const t = B.enemies[c.target]; if (!t || !t.alive) c.target = firstAliveIdx(B); }
    return canUse(B, u, c).ok ? c : null;
  }
  function canUse(B, u, c) {
    if (!c) return { ok: false };
    if (c.kind === 'skill') { const s = skill(c.id); if (!s) return { ok: false }; if (u.mp < skillCost(c.id, u.lv)) return { ok: false, why: 'mp' }; }
    if (c.kind === 'item') { const it = item(c.id); if (!it || !((B.items[c.id] || 0) > 0) || B.disabled.item) return { ok: false, why: 'item' }; }
    if (c.kind === 'flee' && (!B.canFlee || B.disabled.flee)) return { ok: false, why: 'flee' };
    return { ok: true };
  }
  function instantWinOk(B) {
    const gap = levels().instantWinGap;
    if (!gap || B.boss || B.script) return false;
    const lead = B.allies[0];
    if (!lead) return false;
    let top = 0;
    for (const e of B.enemies) top = Math.max(top, e.lv);
    return lead.lv >= top + gap;
  }

  /* ---------- 밸런스 시뮬레이션 ---------- */
  // 뷰의 실제 연출 시간에 맞춘 어림값(ms). battleSpeed 보통(1) 기준
  const TIME = {
    typeMs: 11, auto: [900, 550, 250], short: 120, slash: { atk: 90, memory: 280, thought: 260 }, hit: 330, weakHit: 520, weakFound: 1250,
    windup: 280, hurt: 470, die: 250, lastDie: 420, heal: 320, drain: 560, guard: 220, charge: 320, status: 180, regen: 750,
    shatter: 1250, say: 1500, sayPerChar: 45, intents: 200, appear: 900, appearBoss: 3800, flee: 420, overwhelm: 7000,
    victory: 380 + 600 + 1500 + 500, levelUp: 3200, lose: 3200, fleeOut: 700,
    decide: 1000, tap: 380, firstDecide: 1500                         // 사람이 고르는 시간(어림): 첫 라운드 1.5초, 이후 1초 + 탭마다 0.38초
  };
  function stepMs(s, bs) {
    const k = [1.5, 1, 0.6][bs == null ? 1 : bs];
    const wait = w => (w === 'auto' || w == null ? TIME.auto[bs == null ? 1 : bs] : (w === 'short' ? TIME.short * k : (+w || 0)));
    switch (s.t) {
      case 'msg': return (s.quiet ? 0 : String(s.text).length * TIME.typeMs + wait(s.wait));
      case 'say': return TIME.say + String(s.text).length * TIME.sayPerChar;
      case 'slash': return TIME.slash[s.kind] || 200;
      case 'hit': return s.mult === 'weak' ? TIME.weakHit : TIME.hit;
      case 'weakFound': return TIME.weakFound;
      case 'windup': return TIME.windup;
      case 'hurt': return TIME.hurt * k;
      case 'die': return s.last ? TIME.lastDie : TIME.die;
      case 'heal': case 'eheal': return TIME.heal;
      case 'drain': return TIME.drain;
      case 'guard': return TIME.guard;
      case 'charge': return TIME.charge;
      case 'status': return TIME.status;
      case 'regen': return TIME.regen + (s.line ? 900 : 0);
      case 'shatter': return TIME.shatter;
      case 'intents': return TIME.intents;
      case 'appear': return TIME.appear;
      case 'flee': return TIME.flee;
      case 'overwhelm': return TIME.overwhelm;
      default: return 0;
    }
  }
  function mkRng(seed) {
    let s = (seed >>> 0) || 1;
    return function () { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function knowAll() {                                               // 플레이어가 상성을 안다고 가정
    const seen = {}, E = DB().enemies || {};
    for (const id in E) { const f = fam(E[id].fam); seen[id] = { fam: true, weak: {} }; if (f) { seen[id].weak[f.weak] = 'weak'; seen[id].weak[f.resist] = 'resist'; } }
    return seen;
  }
  // 정책 → {cmd, taps}. 'weakFirst'(약점 기술 우선, 없으면 공격), 'attack'(맞선다만), 'smart'(weakFirst + 정신력 바닥이면 버티기 1회)
  function policyCmd(B, u, pol, last) {
    const alive = aliveE(B), first = firstAliveIdx(B);
    const prevT = last && last.target != null && B.enemies[last.target] && B.enemies[last.target].alive ? last.target : null;
    let cmd = null;
    if (pol === 'attack') cmd = { kind: 'attack', target: prevT != null ? prevT : first };
    else if (pol === 'flee') cmd = canUse(B, u, { kind: 'flee' }).ok ? { kind: 'flee' } : { kind: 'attack', target: first };
    else {
      if (B.disabled.item) { /* 부서진 [도구] */ }
      else if (u.hp < u.maxHp * 0.3 && (B.items.bread || 0) > 0) cmd = { kind: 'item', id: 'bread' };
      else if (u.mp < 3 && (B.items.water || 0) > 0 && (pol === 'smart' || pol === 'econ')) cmd = { kind: 'item', id: 'water' };
      const order = (prevT != null ? [prevT] : []).concat(alive.map(e => e.idx).filter(i => i !== prevT));
      if (!cmd && pol === 'econ') {                                  // 아끼는 사람: 두 대 안에 쓰러질 적은 맞서고, 단단한 적에만 기술
        for (const ti of order) {
          const e = B.enemies[ti], ph = Math.max(1, u.str - defEff(e) * 0.5);
          if (Math.ceil(e.hp / ph) <= 2) { cmd = { kind: 'attack', target: ti }; break; }
        }
      }
      if (!cmd) {
        for (const ti of order) {
          const e = B.enemies[ti];
          for (const sid of u.skills) {
            const s = skill(sid);
            if (!s || s.button || s.kind === 'guard' || u.mp < skillCost(sid, u.lv)) continue;
            if (elemMult(e, s.elem) > 1) { cmd = { kind: 'skill', id: sid, target: ti }; break; }
          }
          if (cmd) break;
        }
      }
      if (!cmd && (pol === 'smart' || pol === 'econ') && u.mp < 3 && !(last && last.kind === 'endure') && u.hp > u.maxHp * 0.5) cmd = { kind: 'endure' };
      if (!cmd) cmd = { kind: 'attack', target: prevT != null ? prevT : first };
    }
    let taps;
    const rep = repeatOf(B, u, last);
    if (rep && rep.kind === cmd.kind && rep.id === cmd.id && (cmd.target == null || rep.target === cmd.target)) taps = 1;
    else if (cmd.kind === 'attack') taps = 1;                           // 명령 중 적 그림을 바로 누르면 그 적에게 [맞선다](1탭)
    else taps = ({ attack: 1, skill: 2, item: 2, endure: 1, flee: 1 })[cmd.kind] + (needsTarget(B, cmd) ? 1 : 0);
    return { cmd, taps };
  }
  function simOne(o, rng) {
    const m = { id: 'dantes', lv: o.lv || 2, exp: o.exp || 0, hp: null, mp: null, skills: (o.skills || ['memory', 'thought', 'endure']).slice(), st: {} };
    recompute(m);
    if (o.hp != null) m.hp = Math.min(m.st.maxHp, o.hp);
    if (o.mp != null) m.mp = Math.min(m.st.maxMp, o.mp);
    const B = create({ troop: o.troop, party: [m], rng, sim: true, seen: o.know === false ? {} : knowAll(), vars: o.vars || {}, items: Object.assign({}, o.items || {}), preempt: o.preempt || null });
    return runSim(B, o);
  }
  function runSim(B, o) {
    const bs = o.speed == null ? 1 : o.speed, pol = o.policy || 'weakFirst';
    let ms = 0, taps = 0, last = null, guard = 0;
    const u = B.allies[0], hp0 = u.hp, mp0 = u.mp;
    const add = S => { for (const s of S) ms += stepMs(s, bs); };
    add(intro(B));
    if (B.preempt === 'enemy') { add(planRound(B)); add(resolveRound(B, null)); }
    while (!B.outcome && guard++ < 80) {
      add(planRound(B));
      if (B.outcome) break;
      const p = policyCmd(B, u, pol, last);
      taps += p.taps;
      ms += (B.round === 1 ? (o.firstDecide != null ? o.firstDecide : TIME.firstDecide) : (o.decide != null ? o.decide : TIME.decide)) + TIME.tap * p.taps;
      add(resolveRound(B, [p.cmd]));
      last = p.cmd;
    }
    const dmg = hp0 - u.hp, mpUsed = mp0 - u.mp;
    const R = finish(B);
    ms += B.outcome === 'win' ? TIME.victory + (R.ups.length ? TIME.levelUp : 0) : (B.outcome === 'lose' ? TIME.lose : TIME.fleeOut);
    return { outcome: B.outcome, rounds: B.round, taps, ms, dmg, mpUsed, exp: R.exp, lv: u.ref.lv, B, R };
  }
  // MC.battle.sim({troop, lv, n, policy, hp, mp, speed, seed, items}) → 승률·평균 초·라운드·탭·받은 피해
  function sim(o) {
    o = o || {};
    const n = o.n || 300, rng = mkRng(o.seed || 20260926);
    const acc = { win: 0, lose: 0, flee: 0, ms: 0, rounds: 0, taps: 0, maxTaps: 0, dmg: 0, mp: 0, exp: 0, maxMs: 0, minMs: 1e9 };
    for (let i = 0; i < n; i++) {
      const r = simOne(o, rng);
      acc[r.outcome] = (acc[r.outcome] || 0) + 1;
      acc.ms += r.ms; acc.rounds += r.rounds; acc.taps += r.taps; acc.dmg += r.dmg; acc.mp += r.mpUsed; acc.exp += r.exp;
      acc.maxTaps = Math.max(acc.maxTaps, r.taps); acc.maxMs = Math.max(acc.maxMs, r.ms); acc.minMs = Math.min(acc.minMs, r.ms);
    }
    const f = v => Math.round(v * 10) / 10;
    return { troop: o.troop, lv: o.lv || 2, policy: o.policy || 'weakFirst', n, winRate: f(acc.win / n * 100), sec: f(acc.ms / n / 1000), secMin: f(acc.minMs / 1000), secMax: f(acc.maxMs / 1000),
      rounds: f(acc.rounds / n), taps: f(acc.taps / n), maxTaps: acc.maxTaps, dmg: f(acc.dmg / n), mpUsed: f(acc.mp / n), exp: f(acc.exp / n) };
  }
  // B1 한 바퀴: 무리를 차례로(HP·MP·EXP·도구 이월). HP 30% 미만이면 잠들어 회복(sleeps+1). → 끝 레벨·경험치
  function simRoute(o) {
    o = o || {};
    const troops = o.troops || ['b1_rat', 'b1_rat2', 'b1_door', 'b1_mistake', 'b1_rat3', 'b1_rat_door', 'b1_rat2_door'];
    const n = o.n || 200, rng = mkRng(o.seed || 1815);
    const acc = { lv: 0, exp: 0, sleeps: 0, ms: 0, lose: 0, lvHist: {}, bossLv: 0, bMs: 0, bN: 0, taps: 0, per: {} };
    for (let i = 0; i < n; i++) {
      const m = { id: 'dantes', lv: o.lv || 1, exp: 0, hp: null, mp: null, skills: ['memory', 'thought', 'endure'], st: {} };
      recompute(m);
      const items = Object.assign({ bread: 1, water: 1, memory_pipe: 1 }, o.items || {});
      let sleeps = 0, ms = 0, puddle = true;
      const seen = o.know ? knowAll() : {};                            // 기본: 처음엔 모름(약점 발견 연출·보너스 포함)
      for (const tr of troops) {
        if (m.hp < m.st.maxHp * 0.3) { sleeps++; m.hp = m.st.maxHp; m.mp = m.st.maxMp; }
        if (puddle && m.mp < 4) { m.mp = m.st.maxMp; puddle = false; }
        const B = create({ troop: tr, party: [m], rng, sim: true, seen, vars: {}, items });
        const r = runSim(B, o);
        ms += r.ms; acc.bMs += r.ms; acc.bN++; acc.taps += r.taps;
        const pt = acc.per[tr] || (acc.per[tr] = { ms: 0, n: 0, taps: 0, rounds: 0 });
        pt.ms += r.ms; pt.n++; pt.taps += r.taps; pt.rounds += r.rounds;
        if (r.outcome === 'lose') { acc.lose++; sleeps++; m.hp = m.st.maxHp; m.mp = m.st.maxMp; }
      }
      acc.bossLv += m.lv;
      if (o.boss !== false) {                                         // 절망 1차(스크립트 패배, EXP 20)
        const B = create({ troop: 'despair1', party: [m], rng, sim: true, seen: knowAll(), vars: { toast: 'A' }, items });
        const r = runSim(B, Object.assign({}, o, { policy: 'weakFirst' }));
        ms += r.ms;
      }
      acc.lv += m.lv; acc.exp += m.exp; acc.sleeps += sleeps; acc.ms += ms;
      acc.lvHist[m.lv] = (acc.lvHist[m.lv] || 0) + 1;
    }
    const f = v => Math.round(v * 100) / 100, per = {};
    for (const k in acc.per) { const p = acc.per[k]; per[k] = f(p.ms / p.n / 1000) + 's R' + f(p.rounds / p.n) + ' tap' + f(p.taps / p.n); }
    return { n, troops: troops.length, endLv: f(acc.lv / n), lvAtBoss: f(acc.bossLv / n), endExp: f(acc.exp / n), lvHist: acc.lvHist, sleeps: f(acc.sleeps / n), loses: acc.lose, minutes: f(acc.ms / n / 60000),
      avgSec: f(acc.bMs / Math.max(1, acc.bN) / 1000), avgTaps: f(acc.taps / Math.max(1, acc.bN)), per };
  }

  /* ---------- 필드용 도우미(메뉴가 호출) ---------- */
  // 도구 설명(감찰관의 약속처럼 변수로 바뀌는 설명 포함)
  function itemDesc(id) {
    const it = item(id);
    if (!it) return '';
    if (it.descs && it.descVar) {
      const v = +((MC.state && MC.state.vars && MC.state.vars[it.descVar]) || 0);
      return it.descs[clamp(v, 0, it.descs.length - 1)];
    }
    return it.desc || '';
  }
  // 필드에서 도구 사용 → {ok, text, hp, mp}
  function useItemField(id, member) {
    const it = item(id), st = MC.state;
    if (!it || !st || !(st.items[id] > 0)) return { ok: false, text: T('noItem') };
    if (it.field === false || it.kind !== 'use') return { ok: false, text: it.desc || '' };
    const m = member || st.party[0];
    recompute(m);
    const r = applyItem(m, it, null);
    if (!r.hp && !r.mp && !(it.effect && it.effect.cure)) return { ok: false, text: '지금은 쓸 필요가 없다.' };
    st.items[id]--; if (st.items[id] <= 0) delete st.items[id];
    try { if (MC.sfx && MC.sfx.play) MC.sfx.play(it.sfx || 'heal'); } catch (_) {}
    const parts = [];
    if (r.hp) parts.push(fmt(T('hpHeal'), { n: r.hp }));
    if (r.mp) parts.push(fmt(T('mpHeal'), { n: r.mp }));
    return { ok: true, text: (it.recall ? it.recall + ' ' : '') + parts.join(', '), hp: r.hp, mp: r.mp };
  }

  const C = BT.core = {
    create, intro, planRound, resolveRound, finish, checkEnd,
    needsTarget, repeatOf, canUse, instantWinOk, record, elemMult, multKind, aliveE, aliveA, firstAliveIdx,
    skill, item, fam, actionDef, skillCost, rankOf, table, T, fmt, TIME, stepMs, mkRng, knowAll, policyCmd, applyItem
  };
  // 계약 API(§10)
  BT.expNeed = expNeed;                 // (lv) -> 다음 레벨까지 필요한 경험치
  BT.statsFor = statsFor;               // (unitId, lv) -> {hp,mp,str,def,spd,wis}
  BT.recompute = recompute;             // (member) 레벨·장비 반영, member.st={maxHp,maxMp,str,def,spd,wis}
  BT.gainExp = gainExp;                 // (member, n) -> 레벨업 목록
  BT.skillCost = skillCost;             // (skillId, lv) -> 정신력 비용(숙련 반영)
  BT.itemDesc = itemDesc;               // (itemId) -> 설명(감찰관의 약속은 vars.promise로 바뀜)
  BT.useItem = useItemField;            // (itemId, member?) -> {ok, text} 필드(메뉴)에서 도구 사용
  BT.sim = sim;                         // ({troop, lv, n, policy}) -> 평균 초·탭·승률
  BT.simRoute = simRoute;               // ({lv:1, n}) -> B1 전부 잡았을 때 끝 레벨
  BT.simAll = function (o) {            // B1 무리 전부 한 번에
    o = o || {};
    const ids = o.troops || ['b1_rat', 'b1_rat2', 'b1_door', 'b1_rat3', 'b1_rat_door', 'b1_rat2_door', 'b1_mistake'];
    return ids.map(t => sim(Object.assign({}, o, { troop: t })));
  };
})(window.MC);

</script>
<script>/* ==== src/engine/battle_view.js ==== */
/* battle_view.js — [battle] 전투 씬: 레이아웃(B-5/C-9: 무대·로그 3줄·상태·명령 3×2), 목록, 적 그림 탭 대상 선택, 메시지 자동 진행(900/550/250ms, 탭=즉시, 누르고 있기=3배),
   데미지 숫자·히트스톱·흰 실루엣·넉백·흔들림·붉은 비네트, 약점 발견(C-3), 등장·사망 디졸브(D-5), 승리 EXP 카운트업·레벨업, 위기 심장박동, 절망 1차(C-8 a) 연출.
   공개: MC.battle.start(opts) -> Promise<{outcome, exp, drops, levelUps}>, debugWin(), debugLose(), active */
(function (MC) { 'use strict';
  const BT = MC.battle = MC.battle || {};
  const G = () => MC.gfx;
  const CORE = () => BT.core;
  const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
  const EZ = MC.ease;
  const T = k => CORE().T(k);
  const F = (k, o) => CORE().fmt(CORE().T(k), o);

  /* ---------- 전투 UI 전용 작은 그림 ---------- */
  MC.addSprites({ pals: {}, spr: {
    bt_repeat: { pal: { o: '#f0ece0', k: '#07060a' }, rows: [
      '..oooo..',
      '.o....o.',
      'o....ooo',
      'o.....o.',
      'o.......',
      '.o....o.',
      '..oooo..'] }
  } });

  /* ---------- 소리 (없는 모듈·id는 조용히) ---------- */
  function sfx(id, o) { try { if (MC.sfx && MC.sfx.play) MC.sfx.play(id, o); } catch (_) { /* */ } }
  function mus(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    try { const m = MC.music; if (m && typeof m[fn] === 'function') return m[fn].apply(m, args); } catch (_) { /* */ }
    return undefined;
  }
  function jingle(id, ms) {
    let p = null;
    try { if (MC.music && MC.music.jingle) p = MC.music.jingle(id); } catch (_) { p = null; }
    const cap = MC.core.waitReal(ms || 2000);
    return (p && typeof p.then === 'function') ? Promise.race([p, cap]) : cap;
  }
  function vib(p) { try { MC.input.vibrate(p); } catch (_) { /* */ } }

  const bs = () => { const s = MC.save && MC.save.settings; return clamp((s && s.battleSpeed != null ? s.battleSpeed : 1) | 0, 0, 2); };
  const AUTO = [900, 550, 250], KF = [1.5, 1, 0.6], TYPE = [16, 11, 6];

  const COL = { gold: '#ffcf4a', red: '#e05a4a', pink: '#ff9aa8', hp: '#66c96a', hpHi: '#9ee89a', mp: '#5aa9e6', mpHi: '#9fd0ff', think: '#b8b4c8', blue: '#8ab8f0', purple: '#d8a8ff', ghost: '#f4f0e8', ebar: '#d8584a', ebarHi: '#ff8a6a', barBg: '#15121c', name: '#f0c860', despair: '#ff9aa8' };
  function famOf(f) { return (CORE().fam(f)) || { color: '#a0a0b0', dark: '#404050', text: '#e0e0e8' }; }
  function famForElem(elem) { const fs = (MC.data.battle && MC.data.battle.families) || {}; for (const k in fs) if (fs[k].weak === elem) return fs[k]; return null; }

  let V = null;

  /* ---------- 대기(전투 시간: 히트스톱 중 멈춤, 누르고 있으면 3배) ---------- */
  function waitFor(fn) { return new Promise(res => { if (!V) { res(); return; } V.conds.push({ fn, res }); }); }
  function bwait(ms, skippable) {
    if (!V) return Promise.resolve();
    const v = V, t0 = v.t, until = v.t + Math.max(0, ms || 0);
    return waitFor(() => v.abort || v.t >= until || (skippable !== false && v.skipAt >= t0));
  }
  function later(ms, fn) { if (V) V.timers.push({ at: V.t + ms, fn }); }
  const kf = () => KF[bs()];

  /* ---------- 로그 ---------- */
  function lineColor(l) {
    const P = G().uiPal;
    switch (l.style) {
      case 'enemy': return l.fam ? famOf(l.fam).text : '#d8d4e4';
      case 'gold': return COL.gold;
      case 'think': return COL.think;
      case 'sys': return P.dim;
      case 'red': return '#ff8a7a';
      case 'blue': return COL.blue;
      case 'purple': return COL.purple;
      default: return P.text;
    }
  }
  function logPush(text, style, fam, instant) {
    const v = V, tm = TYPE[bs()];
    const lines = MC.text.wrap(String(text), 160, 'body');
    let start = Math.max(v.t, v.log.end);
    const t0 = v.t;
    for (const s of lines) {
      const chars = Array.from(s), l = { s, chars, n: chars.length, style, fam, start: instant ? v.t - chars.length * tm : start, shakeUntil: 0 };
      v.log.lines.push(l);
      if (!instant) start += chars.length * tm;
    }
    if (v.log.lines.length > 8) v.log.lines.splice(0, v.log.lines.length - 8);
    if (!instant) v.log.end = start;
    const end = instant ? v.t : start;
    return waitFor(() => v.abort || v.t >= end || v.skipAt >= t0);
  }
  function logNote(text, style) { if (V) logPush(text, style || 'sys', null, true); }
  function completeTyping() {
    const tm = TYPE[bs()];
    for (const l of V.log.lines) if (l.start + l.n * tm > V.t) l.start = V.t - l.n * tm;
    V.log.end = Math.min(V.log.end, V.t);
  }
  function afterWait(w) {
    if (w === 0 || w === false) return Promise.resolve();
    if (w === 'short') return bwait(120 * kf());
    if (typeof w === 'number') return bwait(w * kf());
    return bwait(AUTO[bs()]);
  }

  /* ---------- 뷰 상태 ---------- */
  function stageFor(B) {
    const S = (MC.data.battle && MC.data.battle.stages) || {};
    return S[B.td.stage] || S[B.td.floor] || S.b1 || { grad: ['#050818', '#0c1230', '#1c2350', '#2f3a78'], floor: ['#0c1230', '#10163a'], line: '#2f3a78', wave: '#5a7ad8', tally: '#0a0f2a', light: '#5a7ad8', window: true, tallies: 6 };
  }
  function newView(B, o) {
    const v = {
      B, o, t: 0, mode: 'play', modeT: 0, conds: [], timers: [], skipAt: -1, abort: false, forced: null,
      log: { lines: [], end: 0 }, speech: null, bubbles: [], fx: [], banner: null, panel: null, ow: null,
      order: null, broken: {}, shards: [], al: [], en: [], last: [], actor: null, pend: null, list: null, cmdRes: null,
      stage: stageFor(B), tallies: [], heartT: -9999, slow: null, result: null, lb: false, tpress: null, tpid: null,
      snap: { grade: MC.fx.gradeState ? MC.fx.gradeState() : null, shakeMax: MC.fx.shakeMax }, scene: null
    };
    B.allies.forEach((u, i) => { v.al[i] = u._v = { u, vhp: u.hp, vmp: u.mp, dhp: u.hp, dmp: u.mp, ghp: u.hp, ghold: 0, rate: 60, jolt: -9999, hurtT: -9999, guardT: -9999, conf: !!u.st.confuse, endure: false, lv: u.lv }; });
    B.enemies.forEach((e, i) => {
      const spr = (e.data.sprite || ('en_' + e.id));
      v.en[i] = e._v = { u: e, spr, has1: G().hasSprite(spr + '_1'), vhp: e.hp, dhp: e.hp, ghp: e.hp, bar: null, appear: null, visible: false, shadowT0: -1,
        die: null, gone: false, hitT: -9999, kb: null, lunge: null, intent: null, intentT: 0, charge: false, guardT: -9999, phase: i * 230 + 90, rise: null,
        x: 0, feet: 0, w: e.size, h: e.size, cx: 0, cy: 0 };
    });
    const sd = v.stage, n = sd.tallies || 6;
    for (let i = 0; i < n; i++) v.tallies.push({ fx: MC.rng(), fy: MC.rng(), n: 1 + ((MC.rng() * 5) | 0), floor: false });
    if (sd.floorTally) for (let i = 0; i < 16; i++) v.tallies.push({ fx: MC.rng(), fy: MC.rng(), n: 1 + ((MC.rng() * 5) | 0), floor: true });
    return v;
  }

  /* ---------- 배치 ---------- */
  function sizeOf(ev) {
    const g = G();
    if (!ev._sz) ev._sz = g.hasSprite(ev.spr) ? g.spriteSize(ev.spr) : { w: ev.u.size, h: ev.u.size };
    return ev._sz;
  }
  // 그림의 실제 불투명 영역(표식·말풍선·숫자를 몸에 붙이려고). 스프라이트마다 한 번만 읽는다
  const bbCache = new Map();
  function bboxOf(ev) {
    const sz = sizeOf(ev);
    let bb = bbCache.get(ev.spr);
    if (bb) return bb;
    bb = { x: 0, y: 0, w: sz.w, h: sz.h };
    try {
      const c = G().hasSprite(ev.spr) ? G().getSprite(ev.spr) : null;
      if (c && c.getContext) {
        const w = c.width, h = c.height, d = c.getContext('2d').getImageData(0, 0, w, h).data;
        let x0 = w, y0 = h, x1 = -1, y1 = -1;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 0) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        if (x1 >= 0) bb = { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
      }
    } catch (_) { /* 읽을 수 없으면 전체 칸 */ }
    bbCache.set(ev.spr, bb);
    return bb;
  }
  function layout() {
    const g = G(), sb = g.safe.bottom, X0 = g.X0;
    V.X0 = X0;
    V.gridY = g.H - sb - 8 - 76;
    V.statY = V.gridY - 36;
    V.logY = V.statY - 60;
    V.stageH = V.logY;
    V.listY = V.logY - 10;
    const feet = V.stageH - 24, n = V.en.length, slots = n === 1 ? [66] : (n === 2 ? [38, 94] : [10, 66, 122]);
    V.en.forEach((ev, i) => {
      const sz = sizeOf(ev);
      ev.w = sz.w; ev.h = sz.h; ev.feet = feet;
      ev.x = X0 + (slots[i] != null ? slots[i] : 10 + i * 56) + ((48 - ev.w) >> 1);
      const bb = bboxOf(ev), top = feet - ev.h;
      ev.bx = ev.x + bb.x; ev.bw = bb.w; ev.top = top + bb.y; ev.bot = top + bb.y + bb.h;   // 실제 몸의 테두리
      ev.cx = ev.bx + (bb.w >> 1); ev.cy = ev.top + (bb.h >> 1);
    });
    const b = V.btn, bx = X0 + 2;
    [[b.flee, 0, 0], [b.item, 1, 0], [b.skill, 2, 0], [b.repeat, 0, 1], [b.endure, 1, 1], [b.attack, 2, 1]].forEach(([bt, c, r]) => { bt.x = bx + c * 60; bt.y = V.gridY + r * 40; });
  }

  /* ---------- 명령 버튼 ---------- */
  const CMD_KEYS = ['flee', 'item', 'skill', 'repeat', 'endure', 'attack'];
  function mkButtons() {
    const B = V.btn = {}, mk = (k, label, extra) => new MC.ui.Button(Object.assign({ w: 56, h: 36, label, onTap: () => cmdTap(k), onDisabled: () => cmdDisabled(k) }, extra || {}));
    B.flee = mk('flee', T('cmdFlee'));
    B.item = mk('item', T('cmdItem'));
    B.skill = mk('skill', T('cmdSkill'));
    B.repeat = mk('repeat', T('repeat'), { icon: 'bt_repeat' });
    B.endure = mk('endure', T('cmdEndure'));
    B.attack = mk('attack', T('cmdAttack'), { style: 'primary' });
    V.btnList = CMD_KEYS.map(k => B[k]);
  }
  function cmdLabel(c) {
    if (!c) return T('repeat');
    const C = CORE();
    if (c.kind === 'skill') return (C.skill(c.id) || {}).name || '?';
    if (c.kind === 'item') return (C.item(c.id) || {}).name || '?';
    return T({ attack: 'cmdAttack', endure: 'cmdEndure', flee: 'cmdFlee' }[c.kind] || 'repeat');
  }
  function refreshButtons() {
    const B = V.btn, b = V.B, u = V.actor || b.allies[0], C = CORE(), inSub = V.mode === 'list' || V.mode === 'target';
    if (inSub) { B.flee.label = T('back'); B.flee.enabled = true; B.flee.sfx = 'ui_cancel'; }
    else { B.flee.label = T('cmdFlee'); B.flee.enabled = b.canFlee && !b.disabled.flee; B.flee.sfx = 'ui_ok'; }
    B.item.enabled = !b.disabled.item;
    const rep = u ? C.repeatOf(b, u, V.last[u.idx]) : null;
    B.repeat.enabled = !!rep;
    const lab = cmdLabel(V.last[u ? u.idx : 0]);
    B.repeat.label = lab;
    B.repeat.font = MC.text.width(lab, 'body') > 36 ? 'small' : 'body';
  }
  function setMode(m) {
    V.mode = m; V.modeT = V.t;
    for (const b of V.btnList) b.arm(m === 'cmd' ? 120 : 220);
    if (m !== 'target') { V.tpress = null; V.tpid = null; }
  }
  function cmdDisabled(k) {
    const b = V.B;
    if (V.mode !== 'cmd') return;
    if (k === 'flee') logNote(b.disabled.flee ? '……' : T('fleeNo'));
    else if (k === 'repeat') { const c = V.last[V.actor ? V.actor.idx : 0]; if (c && c.kind === 'skill') logNote(T('noMp')); else if (c && c.kind === 'item') logNote(T('noItem')); }
  }
  function cmdTap(k) {
    if (!V || !V.cmdRes) return;
    if (V.mode !== 'cmd' && V.mode !== 'list' && V.mode !== 'target') return;
    if (k === 'flee' && V.mode !== 'cmd') { back(); return; }
    if (V.broken[k]) { sfx('ui_ng'); return; }
    const u = V.actor, B = V.B, C = CORE();
    switch (k) {
      case 'attack': choose({ kind: 'attack' }); break;
      case 'endure': commit({ kind: 'endure' }); break;
      case 'flee': commit({ kind: 'flee' }); break;
      case 'skill': openList('skill'); break;
      case 'item': openList('item'); break;
      case 'repeat': { const c = C.repeatOf(B, u, V.last[u.idx]); if (c) commit(c); break; }
    }
  }
  function choose(c) {
    const C = CORE();
    if (C.needsTarget(V.B, c)) { V.pend = c; V.list = null; setMode('target'); return; }
    const s = c.kind === 'skill' ? C.skill(c.id) : null;
    if (c.kind === 'attack' || (s && s.target === 'one')) c.target = C.firstAliveIdx(V.B);
    commit(c);
  }
  function commit(c) {
    if (!V || !V.cmdRes) return;
    const u = V.actor;
    V.last[u.idx] = Object.assign({}, c);
    const res = V.cmdRes;
    V.cmdRes = null; V.pend = null; V.list = null;
    setMode('play');
    MC.input.lock(60);
    res(c);
  }
  function back() {
    if (V.mode === 'list' || V.mode === 'target') { sfx('ui_cancel'); V.list = null; V.pend = null; setMode('cmd'); }
  }
  function ask(u) {
    return new Promise(res => {
      V.actor = u; V.cmdRes = res; V.pend = null; V.list = null;
      setMode('cmd');
      MC.input.lock(90);
      const tu = ((MC.data.battle || {}).tutorials || {}).endure, C0 = CORE();   // 정신력이 바닥나면 [버티기] 안내 한 번
      if (tu && !V.B.script && MC.game && !MC.game.flag(tu.flag) && u.skills.some(id => { const s = C0.skill(id); return s && !s.button && s.kind !== 'guard'; }) &&
          u.skills.every(id => { const s = C0.skill(id); return !s || s.button || s.kind === 'guard' || u.mp < C0.skillCost(id, u.lv); })) {
        MC.game.setFlag(tu.flag); logPush(tu.t, 'think', null);
      }
      if (BT.autoplay) {                                             // 디버그: 정책대로 자동 입력(실제 연출 시간 측정용)
        const v = V, C = CORE(), p = C.policyCmd(v.B, u, BT.autoplay, v.last[u.idx]);
        later((v.B.round === 1 ? C.TIME.firstDecide : C.TIME.decide) + C.TIME.tap * p.taps, () => { if (V === v && v.cmdRes && v.mode === 'cmd') commit(p.cmd); });
      }
    });
  }

  /* ---------- 목록 ---------- */
  function openList(kind) {
    const u = V.actor, B = V.B, C = CORE(), items = [];
    if (kind === 'skill') {
      for (const id of u.skills) {
        const s = C.skill(id);
        if (!s || s.button || s.kind === 'guard') continue;
        const cost = C.skillCost(id, u.lv);
        items.push({ kind, id, label: s.name, cost, ok: u.mp >= cost, elem: s.elem, s });
      }
    } else {
      for (const id in B.items) {
        const it = C.item(id);
        if (!it || it.battle === false || it.kind !== 'use' || !(B.items[id] > 0)) continue;
        const ef = it.effect || {}, bits = [];
        if (ef.hp || ef.hpPct) bits.push(['HP+' + Math.max(ef.hp || 0, Math.round(u.maxHp * (ef.hpPct || 0))), COL.hp]);
        if (ef.mp || ef.mpPct) bits.push(['MP+' + Math.max(ef.mp || 0, Math.round(u.maxMp * (ef.mpPct || 0))), COL.mpHi]);
        items.push({ kind, id, label: it.name, count: B.items[id], ok: true, bits });
      }
    }
    if (!items.length) { sfx('ui_ng'); logNote(kind === 'item' ? T('noItem') : '……'); return; }
    V.list = { kind, items, page: 0, press: -1, pid: null, inside: false };
    V.pend = null;
    setMode('list');
  }
  function listCells() {
    const x0 = V.X0 + 2, y0 = V.listY, out = [];
    for (let s = 0; s < 6; s++) { const c = s % 2, r = (s / 2) | 0; out.push([x0 + 4 + c * 84, y0 + 4 + r * 32, 84, 32]); }
    return out;
  }
  function listSlotAt(x, y) {
    const cells = listCells();
    for (let s = 0; s < 6; s++) { const r = cells[s]; if (x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3]) return s; }
    return -1;
  }
  function listInput(ev) {
    const Ls = V.list;
    if (!Ls) return false;
    const inWin = ev.x >= V.X0 + 2 && ev.x < V.X0 + 178 && ev.y >= V.listY && ev.y < V.listY + 104;
    switch (ev.type) {
      case 'down': {
        const s = listSlotAt(ev.x, ev.y), many = Ls.items.length > 6;
        if (s < 0 || !((many && s === 5) || Ls.items[Ls.page * (many ? 5 : 6) + s])) return inWin;   // 빈 칸은 반응 없음
        if (V.t - V.modeT < 140) return true;
        Ls.pid = ev.id; Ls.press = s; Ls.inside = true; sfx('ui_cursor');
        return true;
      }
      case 'move': if (ev.id !== Ls.pid) return false; Ls.inside = listSlotAt(ev.x, ev.y) === Ls.press; return true;
      case 'up': {
        if (ev.id !== Ls.pid) return inWin;
        const s = Ls.press, ok = Ls.inside;
        Ls.pid = null; Ls.press = -1;
        if (ok) listPick(s);
        return true;
      }
      case 'cancel': if (ev.id !== Ls.pid) return false; Ls.pid = null; Ls.press = -1; return true;
      case 'tap': case 'long': return !ev.key && inWin;
    }
    return false;
  }
  function listPick(s) {
    const Ls = V.list, many = Ls.items.length > 6, per = many ? 5 : 6;
    if (many && s === 5) { Ls.page = (Ls.page + 1) % Math.ceil(Ls.items.length / per); sfx('page'); return; }
    const it = Ls.items[Ls.page * per + s];
    if (!it) return;
    if (!it.ok) { sfx('ui_ng'); logNote(T('noMp')); return; }
    sfx('ui_ok');
    if (it.kind === 'skill') choose({ kind: 'skill', id: it.id });
    else commit({ kind: 'item', id: it.id });
  }

  /* ---------- 대상 선택(적 그림 탭: W/n 기둥, 최소 60×64) ---------- */
  function enemyAt(x, y) {
    const g = G();
    if (y < 10 + g.safe.top || y > V.stageH + 6) return null;
    const n = V.en.length, cw = g.W / n;
    const ev = V.en[clamp(Math.floor(x / cw), 0, n - 1)];
    if (ev && ev.u.alive) return ev;
    let best = null, bd = 1e9;
    for (const e2 of V.en) if (e2.u.alive) { const d = Math.abs(e2.cx - x); if (d < bd) { bd = d; best = e2; } }
    return bd < 44 ? best : null;
  }
  function targetInput(ev) {
    switch (ev.type) {
      case 'down': { const e = enemyAt(ev.x, ev.y); if (!e) return false; if (V.t - V.modeT < 120) return true; V.tpress = e; V.tpid = ev.id; sfx('ui_cursor'); return true; }
      case 'move': if (ev.id !== V.tpid) return false; V.tover = enemyAt(ev.x, ev.y) === V.tpress; return true;
      case 'up': {
        if (ev.id !== V.tpid) return false;
        const e = enemyAt(ev.x, ev.y), p = V.tpress;
        V.tpid = null; V.tpress = null;
        if (e && e === p && V.mode === 'target' && V.pend) { sfx('ui_ok'); commit(Object.assign({}, V.pend, { target: e.u.idx })); }
        else if (e && e === p && V.mode === 'cmd' && !V.broken.attack) { sfx('ui_ok'); commit({ kind: 'attack', target: e.u.idx }); }   // 명령 중 적 그림을 누르면 곧장 그 적에게 [맞선다]
        return true;
      }
      case 'cancel': if (ev.id !== V.tpid) return false; V.tpid = null; V.tpress = null; return true;
    }
    return false;
  }

  /* ---------- 스텝 재생 ---------- */
  const H = {};
  async function play(steps) {
    for (const s of steps) {
      if (!V || V.abort) return;
      const h = H[s.t];

  /* ---------- 흐름 ---------- */
  async function run() {
    const B = V.B, C = CORE(), v = V;
    try {
      await play(C.intro(B));
      if (B.preempt === 'enemy' && !B.outcome && !v.abort) { await play(C.planRound(B)); await play(C.resolveRound(B, null)); }
      while (!B.outcome && !v.abort) {
        await play(C.planRound(B));
        if (B.outcome || v.abort) break;
        const cmds = [];
        for (const u of B.allies) {
          if (!u.alive) { cmds.push(null); continue; }
          const c = await ask(u);
          if (v.abort) break;
          cmds.push(c);
        }
        if (v.abort || B.outcome) break;
        await play(C.resolveRound(B, cmds));
      }
      if (!B.outcome) B.outcome = v.forced || 'flee';
      v.abort = false; v.skipAt = -1;
      if (B.outcome === 'win') for (const ev of v.en) if (!ev.die && !ev.gone) { ev.die = { t0: v.t }; ev.u.alive = false; }
      const R = v.result = C.finish(B);
      await outro(R);
    } catch (e) {
      MC.core.error(e, 'battle');
      if (!B.outcome) B.outcome = B.script ? 'scripted' : 'flee';
      try { if (!v.result) v.result = C.finish(B); } catch (e2) { MC.core.error(e2, 'battle.finish'); }
    }
    await close(v);

  async function outro(R) {

    } else if (out === 'flee') {
      await bwait(200, false);
    } else if (out === 'scripted') {
      if (!V.ow) await H.overwhelm({ text: ((MC.data.battle.scripts || {})[V.B.script ? V.B.script.id : ''] || { finale: {} }).finale.text || '' });
      V.ow.sub = (R.label ? R.label + ' · ' : '') + T('exp') + ' +'; V.ow.subN = R.exp; V.ow.subT0 = V.t;

  async function close(v) {

      else if (out === 'lose') await MC.fx.fade(1, 1000, { color: '#e8ecf4' });

    } catch (e) { MC.core.error(e, 'battle.close'); }
    if (v.ow || B.script) { mus('detuneTo', 0, 0.05); mus('filterTo', null, 0.05); }   // 절망 연출이 바꾼 음악 버스(디튠·필터)를 되돌림
    if (v.snap.grade) MC.fx.grade({ sat: v.snap.grade.sat, tint: v.snap.grade.tint || null, ta: v.snap.grade.ta }, 0);

      else if (v.musPrev) mus('play', v.musPrev, { fade: 400 });

  /* ---------- 갱신 ---------- */
  function update(dt) {
    if (!V) return;
    let sp = 1;
    if ((V.mode === 'play' || V.mode === 'panel') && MC.input.heldMs && MC.input.heldMs() > 260) sp = 3;
    if (V.slow && V.t - V.slow.t0 < V.slow.dur) sp *= 0.5;
    const d = dt * sp;
    V.t += d;
    // 타이머
    for (let i = V.timers.length - 1; i >= 0; i--) { const tm = V.timers[i]; if (V.t >= tm.at) { V.timers.splice(i, 1); try { tm.fn(); } catch (e) { MC.core.error(e, 'battle.timer'); } } }
    // 아군 HP·MP 굴림
    for (const av of V.al) {
      if (av.dhp > av.vhp) av.dhp = Math.max(av.vhp, av.dhp - av.rate * d / 1000);
      else if (av.dhp < av.vhp) av.dhp = Math.min(av.vhp, av.dhp + Math.max(60, (av.vhp - av.dhp) * 5) * d / 1000);
      if (V.t >= av.ghold) av.ghp = Math.max(av.dhp, av.ghp - Math.max(av.rate, 40) * 1.4 * d / 1000);
      if (av.ghp < av.dhp) av.ghp = av.dhp;
      if (av.dmp !== av.vmp) { const k = Math.max(40, Math.abs(av.vmp - av.dmp) * 6) * d / 1000; av.dmp = av.dmp < av.vmp ? Math.min(av.vmp, av.dmp + k) : Math.max(av.vmp, av.dmp - k); }
      if (av.endure && V.mode === 'cmd') av.endure = false;
    }
    // 적 HP 막대
    for (const ev of V.en) {
      const b = ev.bar;

    let B;
    try { B = C.create({ troop: o.troop, preempt: o.preempt || null, boss: o.boss, canFlee: o.canFlee }); }
    catch (e) { MC.core.error(e, 'battle.start'); return Promise.resolve({ outcome: 'win', exp: 0, drops: [], levelUps: [], error: true }); }
    if (C.instantWinOk(B)) {                                          // C-6 즉시 승리: 레벨 차 5 이상
      B.outcome = 'win';
      const R = C.finish(B);
      MC.ui.toast(C.fmt(T('instant'), { name: B.enemies[0].name }) + ' EXP +' + R.exp, 1200);
      sfx('enemy_die');
      return MC.core.waitReal(800).then(() => ({ outcome: 'win', exp: R.exp, drops: R.drops, levelUps: R.ups.map(x => x.lv), instant: true }));
    }
    const v = V = newView(B, o);
    const bossy = B.boss || !!B.script;
    v.bgm = o.bgm || B.td.bgm || (bossy ? 'boss_despair' : 'battle');
    try { v.musPos = MC.music && MC.music.pos ? MC.music.pos() : null; } catch (_) { v.musPos = null; }
    try { const cur = MC.music && MC.music.current; v.musPrev = cur && typeof cur === 'object' ? (cur.id || null) : (cur || null); } catch (_) { v.musPrev = null; }
    if (bossy && B.script && B.script.d.shakeMax) MC.fx.shakeMax = B.script.d.shakeMax;
    if (!bossy) {
      if (o.sfx !== false && !o.symbol) sfx('encounter');            // 필드 심볼 인카운터는 field가 이미 울림
      mus('play', v.bgm, { fade: 80 });
    }
    MC.fx.grade({ sat: 1, ta: 0 }, 0);
    mkButtons();
    const sc = v.scene = { name: 'battle', opaque: true, blocking: true };
    sc.enter = () => { BT.active = true; run(); };
    sc.update = dt => { if (V === v) update(dt); };
    sc.render = () => { if (V === v) render(); else G().clear('#000000'); };
    sc.onInput = ev => (V === v ? onInput(ev) : true);
    sc.onBack = () => { if (V === v) back(); };
    return MC.scene.push(sc);
  };
  function force(out) {
    if (!V) { console.warn('[battle] 전투 중이 아님'); return false; }
    const B = V.B;
    if (B.script) out = 'scripted';
    if (out === 'win') for (const e of B.enemies) { e.hp = 0; e.alive = false; }
    if (out === 'lose') for (const u of B.allies) { u.hp = 0; u.alive = false; }
    B.outcome = out; V.forced = out; V.abort = true;
    if (V.cmdRes) { const r = V.cmdRes; V.cmdRes = null; r(null); }
    V.speech = null;
    return true;
  }
  BT.debugWin = () => force('win');          // 즉시 승리(절망 1차는 스크립트 결말)
  BT.debugLose = () => force('lose');
  BT.active = false;
  BT.view = () => V;                          // 디버그: 현재 뷰 상태
})(window.MC);

</script>
<script>/* ==== src/engine/debug.js ==== */
/* debug.js — ?debug=1 패널(좌상단 3연타 또는 ` 키)과 MC.dbg 명령, 엔진 테스트 씬(?test=core 또는 MC.main 없을 때) */
(function (MC) { 'use strict';
  const G = () => MC.gfx;
  const warned = new Set();
  function need(obj, fn, what) {
    if (obj && typeof obj[fn] === 'function') return true;
    if (!warned.has(what)) { warned.add(what); console.warn('[dbg] ' + what + ' 없음(해당 담당 모듈 미로드)'); }
    return false;
  }

  const D = MC.dbg = {
    panel: false, showHits: false, ghostOn: false, lastEvent: null,
    warp(map, x, y, dir) { if (need(MC.field, 'enter', 'MC.field.enter')) return MC.field.enter(map, x != null ? [x, y, dir || 'down'] : 'default', 'cut'); },
    run(id) { if (need(MC.events, 'run', 'MC.events.run')) { D.lastEvent = id; return MC.events.run(id); } },
    flag(name, v) { MC.game.setFlag(name, v === undefined ? true : v); if (MC.field && MC.field.refresh) MC.field.refresh(); return MC.game.flag(name); },
    var(name, v) { MC.game.setVar(name, v); if (MC.field && MC.field.refresh) MC.field.refresh(); return MC.game.getVar(name); },
    lv(n) {
      const m = MC.game.lead(); if (!m) return;
      m.lv = n;
      if (MC.battle && MC.battle.expNeed) m.exp = 0;
      if (MC.battle && MC.battle.recompute) MC.battle.recompute(m);
      D.heal();
      return m.lv;
    },
    give(id, n) { return MC.game.give(id, n == null ? 1 : n); },
    heal() {
      for (const m of MC.state.party) {
        if (MC.battle && MC.battle.statsFor) { const s = MC.battle.statsFor(m.id, m.lv); m.hp = s.hp; m.mp = s.mp; }
        else if (m.st && m.st.maxHp) { m.hp = m.st.maxHp; m.mp = m.st.maxMp || m.mp; }
      }
    },
    win() { if (need(MC.battle, 'debugWin', 'MC.battle.debugWin')) MC.battle.debugWin(); },
    lose() { if (need(MC.battle, 'debugLose', 'MC.battle.debugLose')) MC.battle.debugLose(); },
    speed(k) { MC.time.scale = Math.max(0.1, Math.min(5, +k || 1)); return MC.time.scale; },
    ghost(on) { D.ghostOn = on === undefined ? !D.ghostOn : !!on; MC.cfg.ghost = D.ghostOn; if (MC.field && MC.field.setGhost) MC.field.setGhost(D.ghostOn); return D.ghostOn; },
    dump() { return JSON.parse(JSON.stringify(MC.state)); },
    save(slot) { return MC.save.write(slot || 'manual'); },
    load(slot) { return MC.save.load(slot); },
    wipe() { MC.save.wipe(); },
    hits(on) { D.showHits = on === undefined ? !D.showHits : !!on; return D.showHits; },
    coreTest() { return MC.scene.push(makeTestScene()); }
  };

  /* ---------- 데이터 교차 검증: MC.dbg.validate({log:true}) -> {errors, warnings, info, counts} ----------
     스프라이트(base·행 길이·팔레트), 타일셋(스프라이트), 맵(행 길이·타일 문자·스폰·오브젝트 좌표/참조),
     이벤트(op·참조: events.validate + 추가), 전투(troop·enemy·action·item·skill·스프라이트), 화자(초상·목소리), 계약 스프라이트 이름 */
  const UI_PALS = ['act1', 'act2', 'act3', 'act4', 'act5', 'dream', 'despair'];
  const TRANS_KINDS = ['fade', 'white', 'dream', 'wake', 'cut', 'ink'];
  const PARTICLES = ['dust', 'ripple', 'sparkle', 'ember', 'ash', 'bubble', 'drop', 'heal', 'paper'];
  const OBJ_TYPES = ['npc', 'thing', 'exit', 'trigger', 'symbol', 'chest'];
  const COND_KEYS = ['flag', 'not', 'all', 'any', 'var', 'eq', 'ne', 'gte', 'lte', 'gt', 'lt', 'item', 'n', 'lv', 'map'];
  const CONTRACT_SPR = [
    'em_cloud', 'em_question', 'em_exclaim', 'em_sweat', 'em_dots', 'em_anger', 'em_note', 'em_bulb',
    'ic_next', 'ic_menu', 'ic_sound_on', 'ic_sound_off', 'ic_intent_atk', 'ic_intent_charge', 'ic_intent_drain', 'ic_intent_guard',
    'ic_intent_confuse', 'ic_intent_unknown', 'ic_weak', 'ic_resist', 'ic_fam_despair', 'ic_fam_anger', 'ic_fam_madness', 'ic_hand_tap',
    'sym_despair_0', 'sym_despair_1', 'sym_madness_0', 'sym_madness_1', 'sym_anger_0', 'sym_anger_1',
    'en_shadow_rat', 'en_silent_door', 'en_mistake', 'en_despair', 'cu_candle_0', 'cu_candle_1', 'cu_candle_2', 'cu_sack',
    'cu_hand_ink', 'cu_hand_thimble', 'cu_hand_sash', 'cu_letter', 'ob_chest', 'ob_chest_open',
    'ch_dantes_lie_0', 'ch_dantes_kneel_0', 'ch_mercedes_reach_0',
    'pt_dantes_smile', 'pt_dantes_shock', 'pt_dantes_sad', 'pt_dantes_angry', 'pt_dantes_prison', 'pt_dantes_prison_sad', 'pt_dantes_prison_shock',
    'pt_mercedes_smile', 'pt_mercedes_worry', 'pt_mercedes_cry', 'pt_morrel_sad', 'pt_danglars_smirk', 'pt_fernand_glare',
    'pt_caderousse_nervous', 'pt_villefort_shock', 'pt_villefort_stiff', 'pt_father_tear'
  ];
  const CHAR_IDS = ['dantes', 'dantes_prison', 'dantes2', 'morrel', 'danglars', 'fernand', 'caderousse', 'mercedes', 'father', 'villefort',
    'police', 'guard', 'jailer', 'inspector', 'sailor', 'boy', 'guest_a', 'guest_b'];

  D.validate = function (opt) {
    opt = opt || {};
    const E = [], W = [], I = [];
    const err = (w, m) => E.push(w + ': ' + m), wrn = (w, m) => W.push(w + ': ' + m), inf = (w, m) => I.push(w + ': ' + m);
    const g = G(), data = MC.data || {}, S = (data.sprites && data.sprites.spr) || {}, P = (data.sprites && data.sprites.pals) || {};
    const has = n => !!(n && (S[n] || (g.hasSprite && g.hasSprite(n))));
    const maps = data.maps || {}, evs = data.events || {}, ts = data.tilesets || {}, bt = data.battle || {};
    const bgm = data.bgm || {};
    const ambs = MC.amb && MC.amb.list ? MC.amb.list() : [];
    const sfxHas = id => (MC.sfx && MC.sfx.has) ? MC.sfx.has(id) : true;
    const voices = MC.sfx && MC.sfx.voices ? MC.sfx.voices() : null;
    const isArr = Array.isArray;

    /* 1. 스프라이트 */
    const rowsOf = (name, seen) => {
      const d = S[name]; if (!d) return null;
      if (d.rows) return d.rows;
      if (!d.base) return null;
      seen = seen || new Set(); if (seen.has(name)) return null; seen.add(name);
      const b = rowsOf(d.base, seen); if (!b) return null;
      const r = b.slice(); for (const k in d.over || {}) r[+k] = d.over[k]; return r;
    };
    const palOf = (name, seen) => {
      const d = S[name]; if (!d) return null;
      if (d.pal) return typeof d.pal === 'string' ? P[d.pal] : d.pal;
      if (!d.base) return null;
      seen = seen || new Set(); if (seen.has(name)) return null; seen.add(name);
      return palOf(d.base, seen);
    };
    let nSpr = 0;
    for (const name in S) {
      nSpr++;
      const d = S[name], w = 'spr ' + name;
      if (!d || typeof d !== 'object') { err(w, '정의가 객체가 아님'); continue; }
      if (d.base && !S[d.base]) { err(w, '없는 base ' + d.base); continue; }
      if (typeof d.pal === 'string' && !P[d.pal]) { err(w, '없는 팔레트 ' + d.pal); continue; }
      const rows = rowsOf(name);
      if (!rows || !rows.length) { err(w, '행 없음(base 순환?)'); continue; }
      const width = rows[0].length;
      if (d.over) for (const k in d.over) { if (+k < 0 || +k >= rows.length) err(w, 'over 행 번호 범위 밖 ' + k); }
      const bad = rows.findIndex(r => typeof r !== 'string' || r.length !== width);
      if (bad >= 0) { err(w, bad + '행 길이 ' + (rows[bad] || '').length + ' ≠ ' + width); continue; }
      const pal = palOf(name);
      if (!pal) { err(w, '팔레트 없음'); continue; }
      const miss = new Set();
      for (const r of rows) for (const ch of r) if (ch !== '.' && ch !== ' ' && !pal[ch]) miss.add(ch);
      if (miss.size) inf(w, '팔레트에 없는 문자(투명 처리) ' + Array.from(miss).join(''));
      if (g.hasSprite && !g.hasSprite(name)) err(w, '구워지지 않음');
    }
    for (const n of CONTRACT_SPR) if (!has(n)) wrn('계약 스프라이트', '없음 ' + n);
    for (const id of CHAR_IDS) for (const dir of ['down', 'up', 'left']) for (const f of [0, 1]) if (!has('ch_' + id + '_' + dir + '_' + f)) wrn('계약 스프라이트', '없음 ch_' + id + '_' + dir + '_' + f);

    /* 2. 타일셋 */
    const tileSprs = t => { const out = []; const push = v => { if (isArr(v)) v.forEach(push); else if (v) out.push(v); }; push(t.spr); push(t.var); push(t.top); return out; };
    for (const tsId in ts) {
      const tiles = (ts[tsId] && ts[tsId].tiles) || {};
      for (const ch in tiles) {
        const t = tiles[ch], w = 'tileset ' + tsId + " '" + ch + "'";
        if (!t) { err(w, '정의 없음'); continue; }
        for (const n of tileSprs(t)) if (!has(n)) err(w, '없는 스프라이트 ' + n);
        if (t.under != null && !tiles[t.under]) wrn(w, 'under 문자 없음 ' + t.under);
        if (t.step && !sfxHas('step_' + t.step)) wrn(w, '발소리 없음 step_' + t.step);
      }
    }

    /* 3. 맵 */
    const allObjIds = new Set(['player']);
    const evRefs = {};                                          // 이벤트 → 참조한 곳(맵 오브젝트 등)
    const refEv = (id, where) => { if (id == null) return; (evRefs[id] = evRefs[id] || []).push(where); if (!evs[id]) err(where, '없는 이벤트 ' + id); };
    const checkCond = (c, w) => {
      if (c == null) return;
      if (typeof c !== 'object' || isArr(c)) { err(w, 'cond 형식 오류'); return; }
      for (const k in c) if (COND_KEYS.indexOf(k) < 0) wrn(w, 'cond 모르는 키 ' + k);
      if (c.not) checkCond(c.not, w);
      for (const s of c.all || []) checkCond(s, w);
      for (const s of c.any || []) checkCond(s, w);
      if (c.item != null && bt.items && !bt.items[c.item]) wrn(w, 'cond 없는 아이템 ' + c.item);
      if (c.map != null && !maps[c.map]) wrn(w, 'cond 없는 맵 ' + c.map);
    };
    for (const mid in maps) {
      const m = maps[mid], w0 = 'map ' + mid;
      if (!m || mid.indexOf('__') === 0 && !opt.all) continue;
      const tset = ts[m.tileset];
      if (!tset) { err(w0, '없는 타일셋 ' + m.tileset); continue; }
      const tiles = tset.tiles || {};
      const rows = m.tiles || [];
      if (!rows.length) { err(w0, 'tiles 없음'); continue; }
      const MW = rows[0].length, MH = rows.length;
      rows.forEach((r, y) => {
        if (typeof r !== 'string') { err(w0, y + '행이 문자열이 아님'); return; }
        if (r.length !== MW) err(w0, y + '행 길이 ' + r.length + ' ≠ ' + MW);
        const bad = new Set(); for (const ch of r) if (ch !== ' ' && !tiles[ch]) bad.add(ch);
        if (bad.size) err(w0, y + '행 타일셋에 없는 문자 ' + Array.from(bad).join(''));
      });
      const tileAt = (x, y) => (x < 0 || y < 0 || y >= MH || x >= MW) ? null : rows[y][x];
      const solidAt = (x, y) => { const ch = tileAt(x, y); if (ch == null || ch === ' ') return true; const t = tiles[ch]; return !!(t && t.solid); };
      if (m.ui && UI_PALS.indexOf(m.ui) < 0) wrn(w0, '모르는 창 팔레트 ' + m.ui);
      if (m.bgm && !bgm[m.bgm]) err(w0, '없는 곡 ' + m.bgm);
      if (m.amb && ambs.length && ambs.indexOf(m.amb) < 0) err(w0, '없는 환경음 ' + m.amb);
      if (m.onEnter) refEv(m.onEnter, w0 + ' onEnter');
      const sp = m.spawns || {};
      if (!sp.default) wrn(w0, 'default 스폰 없음');
      for (const k in sp) {
        const s = sp[k], w = w0 + ' spawn ' + k;
        if (!isArr(s) || s.length < 2) { err(w, '형식 [x,y,dir]'); continue; }
        if (tileAt(s[0], s[1]) == null) err(w, '맵 밖 (' + s[0] + ',' + s[1] + ')');
        else if (solidAt(s[0], s[1]) && !opt.loose) wrn(w, '막힌 칸 위 (' + s[0] + ',' + s[1] + " '" + tileAt(s[0], s[1]) + "')");
        if (s[2] && ['up', 'down', 'left', 'right'].indexOf(s[2]) < 0) err(w, '방향 ' + s[2]);
      }
      const ids = new Set();
      for (const o of m.objects || []) {
        const w = w0 + ' obj ' + (o && o.id);
        if (!o || !o.id) { err(w0, 'id 없는 오브젝트'); continue; }
        if (ids.has(o.id)) err(w, '중복 id'); ids.add(o.id); allObjIds.add(o.id);
        const type = o.type || 'thing';
        if (OBJ_TYPES.indexOf(type) < 0) err(w, '모르는 type ' + type);
        const ow = Math.max(1, o.w | 0 || 1), oh = Math.max(1, o.h | 0 || 1);
        if (!(o.x >= 0 && o.y >= 0 && o.x + ow <= MW && o.y + oh <= MH)) err(w, '좌표가 맵 밖 (' + o.x + ',' + o.y + ' ' + ow + '×' + oh + ') 맵 ' + MW + '×' + MH);
        checkCond(o.cond, w);
        if (o.event) refEv(o.event, w);
        if (o.lockedEvent) refEv(o.lockedEvent, w + ' lockedEvent');
        if (o.onWin) refEv(o.onWin, w + ' onWin');
        if (type === 'npc' && !o.event) inf(w, 'NPC event 없음(탭해도 무반응 — 연출 전용이면 정상)');
        if (type === 'npc' && o.x >= 0 && solidAt(o.x, o.y)) wrn(w, 'NPC가 막힌 타일 위 (' + tileAt(o.x, o.y) + ')');
        if ((type === 'trigger' || type === 'exit') && !o.event && type === 'trigger') err(w, 'trigger에 event 없음');
        if (type === 'exit') {
          if (!o.to || !maps[o.to]) err(w, '없는 목적지 맵 ' + o.to);
          else if (typeof o.at === 'string' && o.at !== 'default' && !(maps[o.to].spawns || {})[o.at]) err(w, '없는 목적지 스폰 ' + o.to + '/' + o.at);
        }
        if (type === 'symbol') {
          if (!bt.troops || !bt.troops[o.troop]) err(w, '없는 troop ' + o.troop);
          if (!has('sym_' + (o.fam || 'despair') + '_0')) wrn(w, '심볼 스프라이트 없음 sym_' + (o.fam || 'despair'));
        }
        if (type === 'chest' && (!bt.items || !bt.items[o.item])) err(w, '없는 아이템 ' + o.item);
        if (o.sprite && type !== 'symbol') {
          const b = o.sprite;
          const ok = type === 'npc' ? (has(b + '_down_0') || has(b)) : (+o.anim > 0 ? has(b + '_0') : (has(b) || has(b + '_0')));
          if (!ok) err(w, '없는 스프라이트 ' + b);
          if (type === 'thing' && !(+o.anim > 0) && !has(b) && has(b + '_0')) wrn(w, b + '는 _0/_1만 있음 → anim 지정 필요');
        }
      }
    }

    /* 4. 이벤트 (events.validate + 추가 참조 검사) */
    if (MC.events && MC.events.validate) {
      for (const s of MC.events.validate()) {
        if (/^오류/.test(s)) E.push('event ' + s.replace(/^오류 /, ''));
        else if (/^경고/.test(s)) W.push('event ' + s.replace(/^경고 /, ''));
        else I.push('event ' + s.replace(/^정보 /, ''));
      }
    }
    const OPS = (MC.events && MC.events.ops) || {};
    const spawnIds = new Set(), flagsSet = new Set(), flagsRead = new Set(), varsSet = new Set(), varsRead = new Set();
    const collectCond = c => {
      if (!c || typeof c !== 'object') return;
      if (c.flag != null) flagsRead.add(c.flag);
      if (c.var != null) varsRead.add(c.var);
      if (c.not) collectCond(c.not);
      (c.all || []).forEach(collectCond); (c.any || []).forEach(collectCond);
    };
    const walk = (list, where, fn) => {
      if (!isArr(list)) return;
      list.forEach((c, i) => {
        if (!c || typeof c !== 'object') return;
        const w = where + '#' + i;
        fn(c, w);
        if (c.then) walk(c.then, w + '/then', fn);
        if (c.else) walk(c.else, w + '/else', fn);
        if (c.op === 'parallel') (c.do || []).forEach((b, k) => walk(isArr(b) ? b : [b], w + '/p' + k, fn));
        if (c.op === 'choice') (c.opts || []).forEach((o, k) => walk(o.do, w + '/opt' + k, fn));
        if (c.op === 'battle') { walk(c.onWin, w + '/win', fn); walk(c.onLose, w + '/lose', fn); walk(c.onFlee, w + '/flee', fn); }
      });
    };
    const evList = id => { const e = evs[id]; return isArr(e) ? e : (e && e.cmds) || null; };
    const evIds = Object.keys(evs).filter(id => id.indexOf('__') !== 0 && (opt.all || !/^t\./.test(id)));
    for (const id of evIds) walk(evList(id), id, c => { if (c.op === 'spawn' && c.id) spawnIds.add(c.id); });
    for (const id of evIds) {
      walk(evList(id), id, (c, w) => {
        if (!OPS[c.op]) return;                                // events.validate가 이미 보고
        if (c.cond) { checkCond(c.cond, w); collectCond(c.cond); }
        switch (c.op) {
          case 'set': if (c.flag != null) flagsSet.add(c.flag); if (c.var != null) varsSet.add(c.var); break;
          case 'add': varsSet.add(c.var); break;
          case 'choice': {
            if (c.var) varsSet.add(c.var);

            for (const o of c.opts || []) {
