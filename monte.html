<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>34번의 14년 — 제1장 (M0)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;touch-action:none;overscroll-behavior:none;

</head>
<body>
<div id="wrap"><canvas id="screen"></canvas></div>
<script>
/* ============================================================
   34번의 14년 — 제1장 M0 (감방 육성 루프)
   데이터(밸런스/대사)는 아래 BAL, TXT 오브젝트로 분리.
   코드 수정 없이 수치·대사만 고칠 수 있게 설계.
   ============================================================ */

/* ============== DATA: balance.json 상당 ============== */
const BAL={
  totalTurns:56, startYear:1815,
  seasons:['봄','여름','가을','겨울'],
  statOrder:['지식','언어','체력','의지','땅굴','의심'],
  statInit:{지식:5,언어:5,체력:40,의지:60,땅굴:0,의심:0},
  statMax:{지식:100,언어:100,체력:100,의지:100,땅굴:100,의심:100},
  fariaJoinTurn:9,        // 명세 5년차(≈17턴) → M0 재미 테스트용으로 3년차(9턴)로 조정 [CHANGELOG]
  wobble:1,
  sameSlotBonus:0.5,      // 두 번째 같은 행동 +50%
  actions:{
    수업:{req:'faria', eff:{지식:5,언어:4,의지:-2}},
    운동:{req:null,    eff:{체력:5,의지:-3}},
    땅굴:{req:'faria', eff:{땅굴:6,의심:8,체력:-2}, patrol:true},
    제작:{req:'faria', craft:true},
    휴식:{req:null,    eff:{의지:10,의심:-5}}
  },
  patrolMs:1200, patrolFailSusp:10,
  matRates:[['생선뼈',0.40],['그을음',0.25],['기름',0.20],['쇳조각',0.10],['천',0.05]],
  recipes:{
    바늘:{mat:{생선뼈:2}, unlock:{turn:4}, kind:'item', desc:'5막 자루 꿰매기 필수'},
    촛불:{mat:{기름:2}, unlock:{지식:20}, kind:'passive', desc:'수업 효율 +1'},
    펜잉크:{mat:{생선뼈:1,그을음:2}, unlock:{언어:25}, kind:'passive', desc:'수업 시 언어 +1'},
    땅굴도구:{mat:{쇳조각:3}, unlock:{체력:30}, kind:'passive', desc:'땅굴 +3, 의심 +2'},
    칼:{mat:{쇳조각:4,천:1}, unlock:{turn:40}, kind:'item', desc:'5막 줄 끊기 판정 확대'}
  },
  inspect:{threshold:60, chance:0.30, confisc:0.50, tunnelLoss:10, suspDrop:30, soloAt:90},
  eventsPerYear:2,
  enemies:{절망:40,분노:50,광기:60},
  minds:{
    기억:{req:null, base:12, strong:'절망'},
    사색:{req:null, base:8, knowDiv:10, strong:'광기'},
    희망:{req:'faria', base:15, strong:'분노'}
  },
  enemyAtk:[6,10],
  battleLosePenaltyWill:30,
  grade:{S:240, A:180}   // 지식+언어+체력+의지 합
};

/* ============== DATA: dialogue.json 상당 ============== */
const TXT={
  title:['34번의 14년','― 몬테크리스토 백작 제1장 ―','화면을 눌러 시작하세요','(소리가 켜집니다)'],
  intro:['1815년, 재판도 없이 샤토 디프에 갇혔다.','오늘부터 나의 이름은 34번.','14년(56계절)을 버텨 스스로 탈출하라.'],
  fariaCome:'벽 너머에서 소리가… 파리아 신부가 굴을 잘못 파 내 방으로 왔다! 수업·땅굴·제작이 열렸다.',
  actionLine:{
    수업:['오늘은 이탈리아어일세. 따라 해 보게.','역사는 누가 누구를 배신했는지의 기록이지.','별의 위치를 알면 어디서든 길을 잃지 않네.'],
    운동:['팔굽혀펴기 백 번. …아흔아홉, 백.','몸도 공부의 일부일세.'],
    땅굴:['오늘은 손바닥 한 뼘.','조급함은 소리를 만들고, 소리는 간수를 부르지.'],
    휴식:['오늘은 파도 소리만 듣고 싶다.','쉬는 것도 기술이야.'],
    제작:['쓸모없는 물건은 없네. 아직 못 찾았을 뿐이지.']
  },
  report:{
    지식:'자네 머리가 이렇게 좋을 줄은. 선원으로 두기 아깝군.',
    체력:'몸이 먼저 준비됐군. 이제 머리가 따라올 차례.',
    의지:'이곳에서 웃을 수 있다는 것, 그게 제일 어려운 공부지.',
    낮음:'괜찮네. 올해는 버틴 것만으로 충분해.',
    의심:'공부는 좋지만, 간수들 눈빛이 심상치 않네. 조심하게.'
  },
  patrolAlert:'발소리다! 화면을 눌러 멈춰라!',
  patrolOk:'…지나갔다.',
  patrolFail:'간수: 방금 무슨 소리였지?',
  inspect:'간수: 검사다! 숨길 물건 하나만 골라라.',
  inspectDone:'간수: 흠… 이번엔 봐준다.',
  solo:'독방 벌칙! 다음 한 계절은 파리아를 만날 수 없다.',
  events:[
    {t:'폭풍 치는 밤. 잠들지 못했다.', eff:{의지:-5}},
    {t:'파리아의 옛이야기를 들었다.', eff:{지식:3}, req:'faria'},
    {t:'작은 쥐가 빵을 노린다. 나눠 줄까?', choice:true}
  ],
  ratShare:'너도 여기 갇혔구나. (의지 +3)',
  ratNo:'쥐를 쫓아냈다.',
  battle:{
    절망:{in:'절망: 아무도 널 기억하지 않아.', win:'…아직 기억하는 사람이 있다고?'},
    분노:{in:'분노: 그놈들은 지금 웃고 있어.', win:'분노로는 벽을 못 뚫어.'},
    광기:{in:'광기: 벽이 말을 걸지 않니?', win:'생각이… 정리된다.'},
    lose:'한 계절이 아무것도 하지 못한 채 지나갔다.',
    mind:{기억:'메르세데스는 기다린다고 했어.',사색:'이유가 있을 거다. 그걸 알아낼 때까진 미칠 수 없어.',희망:'머릿속은 아무도 가둘 수 없다.'}
  },
  gradeMsg:{S:'파도는 당신 편이었다.',A:'거친 바다를 끝내 건넜다.',B:'살아남았다. 그것만으로도 기적이다.'}
};

/* ============== engine ============== */
const CV=document.getElementById('screen'), X=CV.getContext('2d');
const LW=180, LH=320; let SC=1, OX=0, OY=0;
function resize(){
  const vw=document.documentElement.clientWidth, vh=window.innerHeight;
  SC=Math.max(1, Math.floor(Math.min(vw/LW, vh/LH)));
  CV.width=LW*SC; CV.height=LH*SC;
  CV.style.width=(LW*SC)+'px'; CV.style.height=(LH*SC)+'px';
  X.setTransform(SC,0,0,SC,0,0); X.imageSmoothingEnabled=false;
  const r=CV.getBoundingClientRect(); OX=r.left; OY=r.top;
}
addEventListener('resize',resize);

/* audio (enabled on first tap) */
let AC=null;
function beep(freq,dur,type,vol){ if(!AC)return; try{const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.value=freq; g.gain.value=vol||0.06; o.connect(g); g.connect(AC.destination);
  const t=AC.currentTime; o.start(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.08)); o.stop(t+(dur||0.08)+0.02);}catch(e){} }
const SFX={tap:()=>beep(520,0.05,'square',0.05), up:()=>beep(760,0.09,'triangle',0.06),
  alert:()=>beep(240,0.12,'sawtooth',0.08), fail:()=>beep(150,0.18,'sawtooth',0.09),
  ok:()=>beep(880,0.1,'triangle',0.06), page:()=>beep(400,0.04,'square',0.04)};

/* draw helpers */
function px(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h);}
function rr(x,y,w,h,r,c){X.fillStyle=c;X.beginPath();X.roundRect(x,y,w,h,r);X.fill();}
function ro(x,y,w,h,r,c,lw){X.strokeStyle=c;X.lineWidth=lw||1;X.beginPath();X.roundRect(x,y,w,h,r);X.stroke();}
function T(s,x,y,c,sz,al){X.fillStyle=c;X.font=(sz||8)+"px 'Galmuri11',monospace";X.textAlign=al||'left';X.textBaseline='top';X.fillText(s,x,y);}
function wrap(s,x,y,mw,lh,c,sz){X.font=(sz||8)+"px 'Galmuri11',monospace";X.fillStyle=c;X.textAlign='left';X.textBaseline='top';
  let ln='',yy=y; for(const ch of s){ if(ch==='\n'){X.fillText(ln,x,yy);ln='';yy+=lh;continue;} const t=ln+ch;
    if(X.measureText(t).width>mw){X.fillText(ln,x,yy);ln=ch;yy+=lh;} else ln=t; } X.fillText(ln,x,yy); return yy+lh; }
if(!X.roundRect){X.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);return this;};}

/* palette */
const P={bg:'#12131f',cell:'#20232f',cellD:'#171923',stone:'#2c3040',wall:'#3a3f52',
  ink:'#e9edf7',dim:'#8a90a6',gold:'#ffcf4a',goldD:'#b98f28',
  panel:'#f5edd6',panelE:'#b9974f',panelT:'#2a2418',
  dantes:'#5a8fd6',faria:'#c9c9c9',rat:'#a08a6a',
  bar:{지식:'#6fd07a',언어:'#7fb0ff',체력:'#ff9a5a',의지:'#ffd24a',땅굴:'#c79a5a',의심:'#e06a6a'},
  btn:'#e9edf7',btnOn:'#ffcf4a',btnOff:'#454a5e',red:'#e05a4a',ok:'#4fbf6a'};

/* game state */
let G=null;
function newGame(){ return {
  turn:1, stats:JSON.parse(JSON.stringify(BAL.statInit)),
  mats:{생선뼈:0,그을음:0,기름:0,쇳조각:0,천:0},
  passives:{촛불:false,펜잉크:false,땅굴도구:false}, items:{바늘:false,칼:false},
  faria:false, solo:false, evYear:0, lastYear:1815,
  battles:0, losses:0, patrolFails:0,
  screen:'title', slots:[], log:'',
}; }

/* persistence */
const KEY='m0_34_14_v1';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(G)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){return null;} }
function wipe(){ try{ localStorage.removeItem(KEY);}catch(e){} }

/* helpers */
function yearOf(t){ return BAL.startYear + Math.floor((t-1)/4); }
function seasonOf(t){ return BAL.seasons[(t-1)%4]; }
function clampStat(k){ G.stats[k]=Math.max(0,Math.min(BAL.statMax[k]||100, Math.round(G.stats[k]))); }
function actionUnlocked(name){ const a=BAL.actions[name]; if(a.req==='faria' && !G.faria) return false; if(G.solo && (name==='수업'||name==='제작')) return false; return true; }

/* buttons registry (rebuilt each frame) */
let BTN=[];
function button(x,y,w,h,label,fn,opt){ opt=opt||{};
  const on=opt.on, off=opt.off;
  rr(x+1,y+2,w,h,4,'#0006');
  rr(x,y,w,h,4, off?P.btnOff : (on?P.btnOn:'#e9edf7'));
  ro(x,y,w,h,4, off?'#5a5f70':(on?'#fff2c0':'#aab0c6'),1);
  T(label, x+w/2, y+h/2-4, off?'#7a8098':(on?'#5a3a00':'#2a2f45'), opt.sz||8, 'center');
  if(!off) BTN.push({x,y,w,h,fn});
}
function tapHit(lx,ly){ for(let i=BTN.length-1;i>=0;i--){ const b=BTN[i]; if(lx>=b.x&&lx<=b.x+b.w&&ly>=b.y&&ly<=b.y+b.h){ b.fn(); return true; } } return false; }

/* ============== screens ============== */
function toScreen(s){ G.screen=s; }

/* number popups */
let pops=[];
function pop(x,y,txt,c){ pops.push({x,y,txt,c,t:0}); }
function drawPops(){ for(const p of pops){ p.t++; T(p.txt, p.x, p.y-p.t*0.4, p.c, 8,'center'); } pops=pops.filter(p=>p.t<40); }

/* cell art */
function drawCell(){
  rr(8,26,164,120,6,P.cellD); ro(8,26,164,120,6,P.wall,2);
  // barred window
  px(120,36,34,26,'#0b0d16'); for(let i=0;i<4;i++) px(124+i*8,36,2,26,'#565f7e'); px(120,48,34,2,'#565f7e');
  // floor
  px(14,120,152,22,P.stone);
  // tunnel progress (hole bottom-left)
  const tp=G.stats.땅굴/100; px(18,128,6+tp*36,10,'#0a0a10'); if(tp>0)T('굴',20,129,'#c79a5a',7);
  // table & books (지식)
  px(96,104,48,10,'#7a5a34'); px(96,104,48,2,'#9a744a');
  const books=Math.min(6,Math.floor(G.stats.지식/12)); for(let i=0;i<books;i++) px(100+i*7,96,5,8,['#c05','#5a5','#57a','#da5','#a5a','#5aa'][i%6]);
  // candle if 촛불
  if(G.passives.촛불){ px(146,96,3,8,'#eee'); px(146,92,3,4,'#ffcf4a'); }
  // Dantès sprite (placeholder capsule; ages/darkens over time)
  const age=Math.min(3,Math.floor((G.turn-1)/16)); const bd=['#5a8fd6','#4a7ab0','#3f6690','#33506f'][age];
  const dx=44, dy=100;
  px(dx-1,dy-1,16,30,'#00000030');
  rr(dx,dy,14,20,4,'#111'); rr(dx+1,dy+1,12,18,3,bd); // body
  rr(dx+1,dy-11,12,12,4,'#111'); rr(dx+2,dy-10,10,10,3,P.dantes==bd?bd:'#ffcf a'||'#ffd0a0');
  rr(dx+2,dy-10,10,10,3,'#ffd0a0'); // head
  px(dx+3,dy-13,8,4,['#3a2a18','#2a1e12','#22180e','#181008'][age]); // hair grows darker/longer
  px(dx+4,dy-6,1.5,2,'#222'); px(dx+8,dy-6,1.5,2,'#222');
  if(age>=1){ px(dx+4,dy-2,6,2,['','#5a4a38','#4a3a28','#3a2a1a'][age]); } // beard
  // Faria
  if(G.faria){ const fx=68; px(fx,dy,12,20,'#111'); rr(fx+1,dy+1,10,18,3,P.faria); rr(fx+1,dy-10,10,10,3,'#eaccaa'); px(fx+1,dy-12,10,4,'#e8e8e8');
    px(fx+3,dy-6,1.5,2,'#222'); px(fx+7,dy-6,1.5,2,'#222'); }
}

/* stat bars */
function drawStats(y0){
  const order=BAL.statOrder;
  for(let i=0;i<order.length;i++){ const k=order[i]; const col=i%2, row=(i/2)|0;
    const x=10+col*86, y=y0+row*16;
    T(k, x, y, P.dim, 7);
    const bx=x+22, bw=54, v=G.stats[k]/100;
    rr(bx,y,bw,7,3,'#0c0e18'); rr(bx+1,y+1,(bw-2)*Math.max(0,Math.min(1,v)),5,2,P.bar[k]);
    T(''+G.stats[k], bx+bw+2, y, P.ink, 7);
  }
}

/* ---- title ---- */
function drawTitle(){
  px(0,0,LW,LH,'#0b1024');
  for(let i=0;i<50;i++){ const sx=(i*53+i*i*3)%LW, sy=(i*29)%180; if(((tick>>4)&15)!==(i&15)) px(sx,sy,1,1,'#7fa0d0'); }
  T(TXT.title[0], LW/2, 70, P.gold, 16,'center');
  T(TXT.title[1], LW/2, 96, P.ink, 8,'center');
  // cell silhouette
  rr(50,140,80,60,6,'#161a28'); px(70,150,40,22,'#0b0d16'); for(let i=0;i<4;i++)px(74+i*9,150,2,22,'#3a4considerable'.length&&'#3a4258'||'#3a4258');
  T(TXT.title[2], LW/2, 236, ((tick>>4)%2)?P.gold:P.dim, 9,'center');
  T(TXT.title[3], LW/2, 252, P.dim, 7,'center');
  const hasSave=!!load();
  BTN=[];
  if(hasSave){ button(40,272,100,20,'이어하기',()=>{ const s=load(); if(s){G=s; ensure(); toScreen(G.faria||G.turn>1?'cell':'intro'); if(G.screen==='cell')prepPlan();} SFX.ok();});
    button(52,296,76,16,'처음부터',()=>{ wipe(); startNew(); }, {sz:7}); }
  else { button(40,278,100,22,'시작하기',()=>startNew()); }
}
function startNew(){ G=newGame(); enableAudio(); toScreen('intro'); G._introi=0; SFX.ok(); }
function ensure(){ if(!G.passives)G.passives={촛불:false,펜잉크:false,땅굴도구:false}; if(!G.items)G.items={바늘:false,칼:false}; if(!G.mats)G.mats={생선뼈:0,그을음:0,기름:0,쇳조각:0,천:0}; }

/* ---- intro ---- */
function drawIntro(){
  px(0,0,LW,LH,'#0c0d15');
  panelBox(10,90,160,140);
  let yy=104; for(let i=0;i<=(G._introi||0)&&i<TXT.intro.length;i++){ yy=wrap(TXT.intro[i], 20, yy, 140, 12, P.panelT, 8)+2; }
  T('▶ 탭', 150, 214, P.panelE, 7);
  BTN=[{x:0,y:0,w:LW,h:LH,fn:()=>{ G._introi=(G._introi||0)+1; SFX.page(); if(G._introi>=TXT.intro.length){ toScreen('cell'); prepPlan(); } }}];
}
function panelBox(x,y,w,h){ rr(x+2,y+3,w,h,6,'#0007'); rr(x,y,w,h,6,'#7a5f2e'); rr(x+2,y+2,w-4,h-4,5,P.panelE); rr(x+4,y+4,w-8,h-8,4,P.panel); }

/* ---- cell / plan ---- */
function prepPlan(){ G.slots=[]; G.screen='cell'; maybeYearRollover(); }
function maybeYearRollover(){ const y=yearOf(G.turn); if(y!==G.lastYear){ G.lastYear=y; G.evYear=0; } }
function drawCellScreen(){
  px(0,0,LW,LH,P.bg);
  // top bar
  px(0,0,LW,24,'#0b0d16');
  T(yearOf(G.turn)+'년 '+seasonOf(G.turn), 6, 4, P.gold, 9);
  T((G.turn)+'/'+BAL.totalTurns+'턴', LW-6, 4, P.dim, 8,'right');
  T('34번', LW/2, 14, P.dim, 7,'center');
  drawCell();
  drawStats(150);
  // plan area
  px(0,184,LW,136,'#0e0f1a'); px(0,184,LW,1,'#2a2f45');
  T('한 계절에 할 일 2가지', 8, 190, P.ink, 8);
  // slots
  for(let i=0;i<2;i++){ const x=10+i*84, y=202; rr(x,y,78,18,4,'#1a1d2b'); ro(x,y,78,18,4,'#333a52',1);
    T(G.slots[i]||('칸 '+(i+1)), x+39, y+5, G.slots[i]?P.gold:P.dim, 8,'center'); }
  // action buttons
  BTN=[];
  const acts=['수업','운동','땅굴','제작','휴식'];
  for(let i=0;i<acts.length;i++){ const name=acts[i]; const col=i%3,row=(i/3)|0;
    const x=8+col*56, y=226+row*24; const locked=!actionUnlocked(name);
    button(x,y,52,20, name, ()=>{ if(G.slots.length<2){G.slots.push(name);SFX.tap();} }, {off:locked, sz:8});
  }
  // reset slot + confirm
  button(8,276,80,20,'다시 선택',()=>{G.slots=[];SFX.tap();},{sz:8});
  button(92,276,80,20,'확정 ▶',()=>{ if(G.slots.length===2){ SFX.ok(); startProgress(); } },{on:G.slots.length===2, off:G.slots.length!==2, sz:8});
  // materials + tiny menu
  let mstr=''; for(const k in G.mats){ if(G.mats[k]>0) mstr+=k+G.mats[k]+' '; }
  T(mstr||'재료 없음', 8, 300, P.dim, 7);
  button(140,298,34,16,'저장',()=>{save();G.log='저장했다.';toScreen('toast');},{sz:7});
}

/* ---- progress ---- */
let prog=null;
function startProgress(){
  // determine patrol (only meaningful if 땅굴)
  const hasTunnel=G.slots.indexOf('땅굴')>=0;
  prog={ t:0, patrol: (Math.random()<0.7), patroled:false, patrolStart:0, done:false, hasTunnel, result:null };
  toScreen('progress');
}
function resolveEffects(){
  // craft handled elsewhere; here apply eff actions
  const gained={}; const before={}; BAL.statOrder.forEach(k=>before[k]=G.stats[k]);
  const counts={}; G.slots.forEach(a=>counts[a]=(counts[a]||0)+1);
  G.slots.forEach((a,idx)=>{
    const A=BAL.actions[a]; if(!A||!A.eff) return;
    let mult=1; if(counts[a]===2 && idx===1) mult=1+BAL.sameSlotBonus; // second same +50%
    for(const k in A.eff){ let v=A.eff[k]*mult; if(v>0) v+=Math.round((Math.random()*2-1)*BAL.wobble);
      // passives
      if(a==='수업'&&k==='지식'&&G.passives.촛불) v+=1;
      if(a==='수업'&&k==='언어'&&G.passives.펜잉크) v+=1;
      if(a==='땅굴'&&k==='땅굴'&&G.passives.땅굴도구) v+=3;
      if(a==='땅굴'&&k==='의심'&&G.passives.땅굴도구) v+=2;
      G.stats[k]+=v;
    }
  });
  BAL.statOrder.forEach(clampStat);
  // material gain
  const mk=rollMat(); G.mats[mk]=(G.mats[mk]||0)+1;
  // build log
  let parts=[]; BAL.statOrder.forEach(k=>{ const d=G.stats[k]-before[k]; if(d!==0) parts.push(k+(d>0?'+':'')+d); });
  G.settleLog=parts.join(' ')+'  ·  재료: '+mk;
}
function rollMat(){ let r=Math.random(),acc=0; for(const [k,p] of BAL.matRates){acc+=p; if(r<acc)return k;} return '생선뼈'; }
function drawProgress(){
  px(0,0,LW,LH,P.bg); px(0,0,LW,24,'#0b0d16');
  T(yearOf(G.turn)+'년 '+seasonOf(G.turn), 6,4,P.gold,9);
  drawCell();
  panelBox(10,180,160,60);
  if(prog.patrol && prog.hasTunnel && !prog.patroled){
    // patrol challenge
    if(!prog.patrolStart) { prog.patrolStart=performance.now(); SFX.alert(); }
    const el=performance.now()-prog.patrolStart;
    // red edges
    if((tick>>2)%2){ px(0,0,LW,4,P.red); px(0,LH-4,LW,4,P.red); px(0,0,4,LH,P.red); px(LW-4,0,4,LH,P.red); }
    wrap(TXT.patrolAlert, 20,192,140,12,P.red,9);
    const left=Math.max(0,(BAL.patrolMs-el)/1000);
    T(left.toFixed(1)+'s', LW/2, 216, P.panelT, 9,'center');
    if(el>BAL.patrolMs){ // fail
      prog.patroled=true; G.stats.의심+=BAL.patrolFailSusp; clampStat('의심'); G.patrolFails++; prog.patrolMsg=TXT.patrolFail; SFX.fail();
    }
    BTN=[{x:0,y:0,w:LW,h:LH,fn:()=>{ if(!prog.patroled){ prog.patroled=true; prog.patrolMsg=TXT.patrolOk; SFX.ok(); } }}];
    return;
  }
  // running / show patrol result then settle
  prog.t++;
  wrap(prog.patrolMsg? prog.patrolMsg : '한 계절이 지나간다…', 20,196,140,12, P.panelT, 8);
  T('▶ 탭', 150,222,P.panelE,7);
  BTN=[{x:0,y:0,w:LW,h:LH,fn:()=>{ resolveEffects(); afterTurn(); }}];
}

/* after a turn: settle -> events/checks -> report -> next or ending */
function afterTurn(){ toScreen('settle'); }
function drawSettle(){
  px(0,0,LW,LH,P.bg); px(0,0,LW,24,'#0b0d16'); T(yearOf(G.turn)+'년 '+seasonOf(G.turn),6,4,P.gold,9);
  drawCell(); drawStats(150);
  panelBox(10,188,160,64);
  T('계절 결산', 20,196,P.panelT,9);
  wrap(G.settleLog||'', 20,210,140,11,P.panelT,8);
  // faria line
  const fl = G.faria ? pickLine(TXT.actionLine[G.slots[0]]||[]) : '';
  if(fl) wrap('파리아: '+fl, 20,232,140,10,'#5a4a2a',7);
  T('▶ 탭',150,236,P.panelE,7);
  BTN=[{x:0,y:0,w:LW,h:LH,fn:()=>{ postSettle(); }}];
}
function pickLine(arr){ return arr.length?arr[Math.floor(Math.random()*arr.length)]:''; }

function postSettle(){
  // clear solo after its turn
  if(G.solo) G.solo=false;
  // faria join
  if(!G.faria && G.turn>=BAL.fariaJoinTurn){ G.faria=true; G.log=TXT.fariaCome; save(); toScreen('toast'); G._afterToast='checks'; return; }
  runChecks();
}
function runChecks(){
  // random event (max per year)
  if(G.evYear<BAL.eventsPerYear && Math.random()<0.45){ const ev=pickEvent(); if(ev){ G.evYear++; G.curEvent=ev; toScreen('event'); return; } }
  // mind battle if 의지<=0
  if(G.stats.의지<=0){ startBattle(); return; }
  // inspection
  if(G.stats.의심>=BAL.inspect.threshold && Math.random()<BAL.inspect.chance){ startInspect(); return; }
  // report card every 4 turns
  if(G.turn%4===0){ toScreen('report'); return; }
  advanceTurn();
}
function pickEvent(){ const cand=TXT.events.filter(e=>!e.req||(e.req==='faria'&&G.faria)); return cand.length?cand[Math.floor(Math.random()*cand.length)]:null; }

/* ---- event ---- */
function drawEvent(){
  px(0,0,LW,LH,P.bg); drawCell(); panelBox(10,180,160,70);
  const e=G.curEvent; wrap(e.t, 20,190,140,12,P.panelT,8);
  BTN=[];
  if(e.choice){ button(24,224,60,18,'나눠준다',()=>{ G.stats.의지=Math.min(100,G.stats.의지+3); G.log=TXT.ratShare; toScreen('toast'); G._afterToast='postEvent'; SFX.up(); });
    button(96,224,60,18,'쫓아낸다',()=>{ G.log=TXT.ratNo; toScreen('toast'); G._afterToast='postEvent'; SFX.tap(); }); }
  else { T('▶ 탭',150,236,P.panelE,7); BTN=[{x:0,y:0,w:LW,h:LH,fn:()=>{ if(e.eff){for(const k in e.eff){G.stats[k]+=e.eff[k];clampStat(k);}} postEvent(); }}]; }
}
function postEvent(){ G.curEvent=null; if(G.stats.의지<=0){startBattle();return;} if(G.stats.의심>=BAL.inspect.threshold&&Math.random()<BAL.inspect.chance){startInspect();return;} if(G.turn%4===0){toScreen('report');return;} advanceTurn(); }

/* ---- inspection ---- */
function startInspect(){ G.insp={pickable:Object.keys(G.mats).filter(k=>G.mats[k]>0)}; toScreen('inspect'); SFX.alert(); }
function drawInspect(){
  px(0,0,LW,LH,P.bg); drawCell(); panelBox(10,176,160,120);
  wrap(TXT.inspect, 20,186,140,12,P.panelT,8);
  BTN=[];
  const ks=G.insp.pickable;
  if(ks.length===0){ T('숨길 재료가 없다…',20,214,'#5a4a2a',8); T('▶ 탭',150,270,P.panelE,7);
    BTN=[{x:0,y:0,w:LW,h:LH,fn:()=>doInspect(null)}]; return; }
  for(let i=0;i<ks.length;i++){ const y=210+i*20; button(24,y,132,16, ks[i]+' ('+G.mats[ks[i]]+')', ()=>doInspect(ks[i]), {sz:7}); }
}
function doInspect(keep){
  const c=BAL.inspect;
  for(const k in G.mats){ if(k===keep) continue; if(G.mats[k]>0){ let lost=0; for(let n=0;n<G.mats[k];n++) if(Math.random()<c.confisc) lost++; G.mats[k]-=lost; } }
  G.stats.땅굴=Math.max(0,G.stats.땅굴-c.tunnelLoss); G.stats.의심=Math.max(0,G.stats.의심-c.suspDrop);
  let solo=false; if(G.stats.의심+c.suspDrop>=c.soloAt){ /* was high */ }
  if((G.insp._suspBefore||G.stats.의심+c.suspDrop)>=c.soloAt){ G.solo=true; solo=true; }
  G.log=TXT.inspectDone+(solo?'\n'+TXT.solo:''); toScreen('toast'); G._afterToast='postInspect';
}
function postInspect(){ if(G.turn%4===0){toScreen('report');return;} advanceTurn(); }

/* ---- report card (every 4 turns) ---- */
function drawReport(){
  px(0,0,LW,LH,'#141018'); panelBox(8,20,164,280);
  T(yearOf(G.turn)+'년 성적표', LW/2, 34, P.panelT, 11,'center');
  const order=['지식','언어','체력','의지','땅굴','의심'];
  for(let i=0;i<order.length;i++){ const k=order[i], y=58+i*24;
    T(k, 22, y, P.panelT, 8); const bx=54,bw=90; rr(bx,y,bw,10,4,'#00000022'); rr(bx+1,y+1,(bw-2)*(G.stats[k]/100),8,3,P.bar[k]);
    T(''+G.stats[k], bx+bw+4, y, P.panelT, 8); }
  // faria remark
  let key='낮음'; let mx=-1; ['지식','체력','의지'].forEach(k=>{ if(G.stats[k]>mx){mx=G.stats[k];key=k;} });
  if(G.stats.의심>=60) key='의심'; if(mx<25 && G.stats.의심<60) key='낮음';
  wrap('파리아: '+(TXT.report[key]||TXT.report.낮음), 22, 210, 128, 12, '#4a3a1e', 8);
  T('▶ 탭해서 계속', LW/2, 280, P.panelE, 8,'center');
  BTN=[{x:0,y:0,w:LW,h:LH,fn:()=>{ SFX.page(); advanceTurn(); }}];
}

/* ---- craft screen ---- */
function openCraft(){ toScreen('craft'); }
function recipeReady(name){ const r=BAL.recipes[name]; if(r.unlock){ if(r.unlock.turn&&G.turn<r.unlock.turn) return false; for(const s in r.unlock){ if(s!=='turn'&&G.stats[s]<r.unlock[s]) return false; } } return true; }
function canPay(name){ const r=BAL.recipes[name]; for(const m in r.mat){ if((G.mats[m]||0)<r.mat[m]) return false; } return true; }
function drawCraft(){
  px(0,0,LW,LH,P.bg); px(0,0,LW,24,'#0b0d16'); T('제작', 8,6,P.gold,10);
  let mstr=''; for(const k in G.mats) mstr+=k+G.mats[k]+' '; T(mstr,8,28,P.dim,7);
  BTN=[]; const names=Object.keys(BAL.recipes); let y=42;
  for(const nm of names){ const r=BAL.recipes[nm]; const rdy=recipeReady(nm); const owned=(r.kind==='item'&&G.items[nm])||(r.kind==='passive'&&G.passives[nm]);
    rr(8,y,164,42,5,'#171a26'); ro(8,y,164,42,5,'#2a3048',1);
    T(nm, 14,y+4,rdy?P.gold:P.dim,9); let need=''; for(const m in r.mat)need+=m+'×'+r.mat[m]+' '; T(need,14,y+18,P.dim,7);
    T(r.desc,14,y+29,'#6f7690',6);
    if(owned) T('보유',150,y+6,P.ok,8,'right');
    else if(!rdy) T('잠김',150,y+6,'#7a8098',7,'right');
    else { const pay=canPay(nm); button(120,y+22,46,16, pay?'만들기':'재료?', ()=>{ if(pay)makeItem(nm); }, {off:!pay, sz:7}); }
    y+=46;
  }
  button(8,290,164,22,'◀ 감방으로',()=>{ toScreen('cell'); },{sz:8});
}
function makeItem(nm){ const r=BAL.recipes[nm]; for(const m in r.mat) G.mats[m]-=r.mat[m];
  if(r.kind==='item') G.items[nm]=true; else G.passives[nm]=true; SFX.up(); G.log=nm+'을(를) 만들었다!'; toScreen('toast'); G._afterToast='craft'; }

/* ---- mind battle (간이판) ---- */
let bt=null;
function startBattle(){ const es=Object.keys(BAL.enemies); const en=es[Math.floor(Math.random()*es.length)];
  bt={en, ehp:BAL.enemies[en], emax:BAL.enemies[en], php:Math.max(30,G.stats.의지), pmax:Math.max(30,G.stats.의지), msg:TXT.battle[en].in, phase:'msg'};
  G.battles++; toScreen('battle'); SFX.alert(); }
function drawBattle(){
  px(0,0,LW,LH,'#0c0812'); for(let i=0;i<40;i++)px((i*61%LW),(i*47%160),2,2,i%3?'#241c33':'#3a2f4a');
  // enemy blob (abstract)
  const ex=LW/2, ey=70; const c={절망:'#4a4a6a',분노:'#c0503a',광기:'#7a5aa0'}[bt.en];
  const pulse=6+Math.sin(tick*0.2)*3; X.fillStyle=c; X.beginPath(); X.arc(ex,ey,22+pulse*0.2,0,7); X.fill();
  X.fillStyle='#0008'; X.beginPath(); X.arc(ex-7,ey-4,3,0,7); X.arc(ex+7,ey-4,3,0,7); X.fill();
  T(bt.en, LW/2, 30, P.ink, 10,'center');
  rr(LW/2-40,44,80,7,3,'#000'); rr(LW/2-39,45,78*(bt.ehp/bt.emax),5,2,P.red);
  // player will bar
  T('의지', 10, 150, P.dim,8); rr(38,150,110,9,4,'#000'); rr(39,151,108*(bt.php/bt.pmax),7,3,P.bar.의지); T(bt.php+'/'+bt.pmax,150,150,P.ink,7);
  panelBox(8,170,164,60); wrap(bt.msg||'', 18,180,144,12, P.panelT, 8);
  BTN=[];
  if(bt.phase==='msg'){ T('▶ 탭',150,214,P.panelE,7); BTN=[{x:0,y:0,w:LW,h:LH,fn:()=>{ bt.phase='menu'; }}]; return; }
  if(bt.phase==='menu'){
    const minds=['기억','사색','희망'];
    for(let i=0;i<3;i++){ const m=minds[i]; const locked=(BAL.minds[m].req==='faria'&&!G.faria);
      button(8+i*56,242,52,20, m, ()=>useMind(m), {off:locked, sz:8}); }
    T('마음가짐을 골라 맞서라', LW/2, 270, P.dim,7,'center'); return;
  }
  if(bt.phase==='win'||bt.phase==='lose'){ T('▶ 탭',150,214,P.panelE,7); BTN=[{x:0,y:0,w:LW,h:LH,fn:()=>endBattle()}]; }
}
function useMind(m){ const M=BAL.minds[m]; let dmg=M.base||0; if(M.knowDiv) dmg+=Math.floor(G.stats.지식/M.knowDiv);
  if(M.strong===bt.en) dmg*=2; bt.ehp-=dmg; SFX.up();
  if(bt.ehp<=0){ bt.ehp=0; bt.msg=TXT.battle[bt.en].win; bt.phase='win'; return; }
  // enemy hits
  const [lo,hi]=BAL.enemyAtk; const a=lo+Math.floor(Math.random()*(hi-lo+1)); bt.php-=a; bt.msg=bt.en+'의 공격! 의지 -'+a+' ('+TXT.battle.mind[m]+')';
  if(bt.php<=0){ bt.php=0; bt.phase='lose'; bt.msg=TXT.battle.lose; }
}
function endBattle(){
  if(bt.phase==='win'){ G.stats.의지=Math.min(100,G.stats.의지+10); }
  else { G.losses++; G.stats.의지=BAL.battleLosePenaltyWill; } // lose: consume, restore will
  clampStat('의지'); const wasLose=bt.phase==='lose'; bt=null;
  if(wasLose){ advanceTurn(); return; } // lose consumes the season already; move on
  // win: continue checks (inspection/report)
  if(G.stats.의심>=BAL.inspect.threshold&&Math.random()<BAL.inspect.chance){startInspect();return;}
  if(G.turn%4===0){toScreen('report');return;} advanceTurn();
}

/* ---- toast ---- */
function drawToast(){
  // draw underlying cell faintly
  drawCellScreenStatic();
  px(0,0,LW,LH,'#0008'); panelBox(14,120,152,90);
  wrap(G.log||'', 26,140,128,14, P.panelT, 8);
  T('▶ 탭', 146,190,P.panelE,7);
  BTN=[{x:0,y:0,w:LW,h:LH,fn:()=>{ const a=G._afterToast; G._afterToast=null; SFX.page();
    if(a==='checks') runChecks();
    else if(a==='postEvent') postEvent();
    else if(a==='postInspect') postInspect();
    else if(a==='craft') toScreen('craft');
    else toScreen('cell');
  }}];
}
function drawCellScreenStatic(){ px(0,0,LW,LH,P.bg); px(0,0,LW,24,'#0b0d16'); T(yearOf(G.turn)+'년 '+seasonOf(G.turn),6,4,P.gold,9); drawCell(); drawStats(150); }

/* advance / ending */
function advanceTurn(){
  save();
  if(G.turn>=BAL.totalTurns){ toScreen('ending'); return; }
  G.turn++; G.slots=[]; maybeYearRollover(); toScreen('cell');
}
function drawEnding(){
  px(0,0,LW,LH,'#0a0810'); for(let i=0;i<40;i++)px((i*61%LW),(i*53%LH),2,2,i%4?'#221a2a':P.gold);
  const sum=G.stats.지식+G.stats.언어+G.stats.체력+G.stats.의지;
  let g='B'; if(sum>=BAL.grade.S)g='S'; else if(sum>=BAL.grade.A)g='A';
  if(G.losses+G.patrolFails>=8 && g!=='B') g = g==='S'?'A':'B'; // 재시도 많으면 하향
  T('― 제1장 끝 ―', LW/2, 40, P.gold, 12,'center');
  T('34번 — 사망 처리, 바다에 수장.', LW/2, 70, P.dim, 7,'center');
  T('탈출 등급', LW/2, 100, P.ink, 8,'center');
  T(g, LW/2, 118, g==='S'?P.gold:g==='A'?'#7fb0ff':'#e0a060', 40,'center');
  wrap(TXT.gradeMsg[g], 0, 176, LW, 12, P.ink, 8); X.textAlign='center';
  T('능력치 합 '+sum+' (지'+G.stats.지식+' 언'+G.stats.언어+' 체'+G.stats.체력+' 의'+G.stats.의지+')', LW/2, 200, P.dim,7,'center');
  T('전투 패배 '+G.losses+' · 순찰 실패 '+G.patrolFails, LW/2, 214, P.dim,7,'center');
  T('제2장 — 보물과 새 이름 (예정)', LW/2, 240, '#7f88a8', 7,'center');
  BTN=[]; button(40,264,100,22,'타이틀로',()=>{ wipe(); G=newGame(); toScreen('title'); },{sz:8});
  X.textAlign='left';
}

/* ============== main loop ============== */
let tick=0;
function frame(){
  tick++;
  X.clearRect(0,0,LW,LH);
  const s=G?G.screen:'title';
  if(s==='title') drawTitle();
  else if(s==='intro') drawIntro();
  else if(s==='cell') drawCellScreen();
  else if(s==='progress') drawProgress();
  else if(s==='settle') drawSettle();
  else if(s==='event') drawEvent();
  else if(s==='inspect') drawInspect();
  else if(s==='report') drawReport();
  else if(s==='craft') drawCraft();
  else if(s==='battle') drawBattle();
  else if(s==='toast') drawToast();
  else if(s==='ending') drawEnding();
  drawPops();
  requestAnimationFrame(frame);
}

/* input */
function enableAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); }catch(e){} } }
CV.addEventListener('pointerdown',e=>{ e.preventDefault(); enableAudio();
  const r=CV.getBoundingClientRect(); const lx=(e.clientX-r.left)/SC, ly=(e.clientY-r.top)/SC;
  // craft open shortcut: tap 제작 handled via slots; but craft screen entered when 제작 chosen+confirm? -> we open craft immediately when 제작 tapped as action
  tapHit(lx,ly);
},{passive:false});

/* if 제작 chosen as an action, open craft screen at confirm instead of progress */
const _startProgress=startProgress;
startProgress=function(){ if(G.slots.indexOf('제작')>=0){ // resolve non-craft parts as a normal turn but open craft first
    // simplest: open craft; crafting doesn't consume the turn in M0 — user crafts then returns and confirms again
    // remove 제작 from slots so it doesn't double-run; treat 제작 as "visit workshop"
    G.slots=G.slots.filter(a=>a!=='제작'); openCraft(); return; }
  _startProgress(); };

/* boot */
resize();
G=newGame();
const sv=load(); // don't auto-load into play; title offers 이어하기
document.fonts && document.fonts.load("12px 'Galmuri11'").catch(()=>{});
frame();
</script>
