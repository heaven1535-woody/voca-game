<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>몽테크리스토 — 복수의 서막</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;background:#05060c;font-family:'Galmuri11','Galmuri9',monospace;color:#e8eefc;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;}
  #wrap{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px;}
  #screen{width:100%;image-rendering:pixelated;background:#000;border:2px solid #26304d;border-radius:6px;box-shadow:0 0 0 2px #0a0e1a,0 8px 24px #000a;}
  /* touch controls */
  #pad{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:2px 10px 12px;}
  .dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:2px;}
  .dpad button{background:#1a2340;color:#cfe0ff;border:2px solid #33436e;border-radius:8px;font-size:18px;font-family:inherit;}
  .dpad button:active{background:#2c3c66;}
  .dpad .sp{background:transparent;border:none;}
  .abtns{display:flex;gap:14px;align-items:center;}
  .abtns button{width:62px;height:62px;border-radius:50%;border:2px solid #6b5a2a;font-family:inherit;font-size:20px;font-weight:bold;}
  #btnA{background:#c9a63a;color:#2a2005;}
  #btnB{background:#3a4a6e;color:#dfe9ff;border-color:#556188;}
  .abtns button:active{filter:brightness(1.2);}
  .lbl{font-size:10px;color:#7f8db0;text-align:center;margin-top:2px;}
  #hint{font-size:11px;color:#8896bb;text-align:center;line-height:1.5;padding:0 8px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="320" height="200"></canvas>
</div>
<div id="pad">
  <div>
    <div class="dpad">
      <button class="sp"></button><button data-k="up">▲</button><button class="sp"></button>
      <button data-k="left">◀</button><button class="sp"></button><button data-k="right">▶</button>
      <button class="sp"></button><button data-k="down">▼</button><button class="sp"></button>
    </div>
  </div>
  <div class="abtns">
    <div style="text-align:center"><button id="btnB" data-k="cancel">B</button><div class="lbl">취소</div></div>
    <div style="text-align:center"><button id="btnA" data-k="confirm">A</button><div class="lbl">확인</div></div>
  </div>
</div>
<div id="hint">방향키/WASD 이동 · Z 또는 A 확인 · X 또는 B 취소 (폰은 아래 버튼)</div>

<script>
const CV=document.getElementById('screen'), X=CV.getContext('2d');
X.imageSmoothingEnabled=false;
const W=320,H=200,TS=16;

/* ---------- palette ---------- */
const C={
  night:'#0b1024', sea1:'#12335e', sea2:'#1b4a7a', sea3:'#2f6ea0', foam:'#bfe3f2',
  moon:'#f4f1d0', moon2:'#c9c79c', star:'#fdfdf0',
  stone:'#4a4f63', stone2:'#3a3e50', stoneL:'#5f6479', floor:'#2b2f40',
  wall:'#2a2333', wallL:'#3a3145', grass:'#2f6b3c', grass2:'#276033', dirt:'#5a4632',
  wood:'#6b4a2a', woodL:'#835c33', gold:'#e9c24a', goldD:'#a9832a',
  skin:'#e8b98f', hair:'#2a1e14', shirt:'#3560a8', shirtD:'#274a86',
  robe:'#6a6f82', robeD:'#4d5163', red:'#c0392b', text:'#f2f4ff',
  win:'#101632', winB:'#4a5headd', winB2:'#8fa6d8', shadow:'#00000066'
};
C.winB='#3a4a78';

/* ---------- input ---------- */
const keys={up:0,down:0,left:0,right:0,confirm:0,cancel:0};
let confirmEdge=false, cancelEdge=false;
const KMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right',z:'confirm',Z:'confirm',Enter:'confirm',x:'cancel',X:'cancel',Escape:'cancel',' ':'confirm'};
addEventListener('keydown',e=>{const k=KMAP[e.key]; if(k){ if(!keys[k]){ if(k==='confirm')confirmEdge=true; if(k==='cancel')cancelEdge=true;} keys[k]=1; e.preventDefault();}});
addEventListener('keyup',e=>{const k=KMAP[e.key]; if(k){keys[k]=0; e.preventDefault();}});
document.querySelectorAll('#pad button[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const dn=e=>{e.preventDefault(); if(!keys[k]){ if(k==='confirm')confirmEdge=true; if(k==='cancel')cancelEdge=true;} keys[k]=1;};
  const up=e=>{e.preventDefault(); keys[k]=0;};
  b.addEventListener('touchstart',dn,{passive:false}); b.addEventListener('touchend',up,{passive:false});
  b.addEventListener('mousedown',dn); b.addEventListener('mouseup',up); b.addEventListener('mouseleave',up);
});
function consumeConfirm(){ if(confirmEdge){confirmEdge=false;return true;} return false; }
function consumeCancel(){ if(cancelEdge){cancelEdge=false;return true;} return false; }

/* ---------- pixel helpers ---------- */
function px(x,y,w,h,col){X.fillStyle=col;X.fillRect(x|0,y|0,w|0,h|0);}
function textPix(str,x,y,col,size){ X.fillStyle=col||C.text; X.font=(size||10)+"px 'Galmuri11',monospace"; X.textBaseline='top'; X.fillText(str,x,y); }
function textCenter(str,cx,y,col,size){ X.textAlign='center'; textPix(str,cx,y,col,size); X.textAlign='left'; }

/* ---------- actors (chibi 16x16 drawn procedurally) ---------- */
const ACTORS={
  edmond:{hair:'#2a1e14',skin:C.skin,body:C.shirt,bodyD:C.shirtD},
  edmondCount:{hair:'#20202a',skin:C.skin,body:'#20242f',bodyD:'#14161d',cape:'#6a1620'},
  mercedes:{hair:'#3a2416',skin:'#f0c6a0',body:'#b0446e',bodyD:'#8f3559'},
  faria:{hair:'#c9c9c9',skin:'#d9b48c',body:C.robe,bodyD:C.robeD},
  villain:{hair:'#1a1a1a',skin:'#d9a980',body:'#4a2a4a',bodyD:'#382038'},
  guard:{hair:'#33270f',skin:'#d0a070',body:'#5a1f1f',bodyD:'#421616'}
};
function drawActor(cx,cy,type,dir,step){
  const p=ACTORS[type]||ACTORS.edmond;
  const bob=step?( (step%2)? -1:0 ):0;
  const x=cx, y=cy+bob;
  // shadow
  X.fillStyle=C.shadow; X.beginPath?0:0; px(x+2,y+15,12,2,'#00000055');
  // body
  px(x+3,y+8,10,7,p.bodyD);
  px(x+4,y+8,8,6,p.body);
  if(p.cape){ px(x+2,y+8,2,8,p.cape); px(x+12,y+8,2,8,p.cape); }
  // head
  px(x+4,y+1,8,7,p.skin);
  // hair
  px(x+3,y,10,3,p.hair); px(x+3,y+2,2,3,p.hair); px(x+11,y+2,2,3,p.hair);
  // eyes depending on dir
  if(dir!=='up'){
    px(x+6,y+4,1,2,'#20202a'); px(x+9,y+4,1,2,'#20202a');
  }
  // legs
  px(x+4,y+15,3,1,'#1a1a22'); px(x+9,y+15,3,1,'#1a1a22');
}

/* ---------- tiles ---------- */
function drawTile(t,x,y,anim){
  switch(t){
    case '~': { // sea (animated)
      px(x,y,TS,TS, C.sea1);
      const o=Math.sin((x*0.3)+anim*0.06)*2;
      px(x, y+4+o, TS,2, C.sea2);
      px(x, y+9-o, TS,2, C.sea3);
      if(((x/TS + (anim>>5))|0)%3===0) px(x+2,y+3, 4,1, C.foam);
      break; }
    case '#': { px(x,y,TS,TS,C.stone2); px(x,y,TS,1,C.stoneL); px(x,y,1,TS,C.stoneL);
      px(x+1,y+1,TS-2,TS-2,C.stone); px(x+4,y+4,3,3,C.stone2); px(x+9,y+9,3,3,C.stone2); break; }
    case 'B': { px(x,y,TS,TS,C.wall); px(x,y,TS,1,C.wallL);
      // barred window
      px(x+3,y+3,10,8,'#0a0a12'); px(x+5,y+3,1,8,'#5a5a6a'); px(x+8,y+3,1,8,'#5a5a6a'); px(x+11,y+3,1,8,'#5a5a6a'); break; }
    case '.': { px(x,y,TS,TS,C.floor); px(x,y,TS,1,'#343a4f'); if(((x+y)>>4)%2) px(x+2,y+2,2,2,'#242838'); break; }
    case ',': { px(x,y,TS,TS,C.grass2); px(x+2,y+3,2,2,C.grass); px(x+9,y+8,2,2,C.grass); px(x+5,y+11,2,2,C.grass); break; }
    case 'd': { px(x,y,TS,TS,C.dirt); px(x+3,y+5,2,2,'#6b5540'); px(x+10,y+9,2,2,'#4a3826'); break; }
    case 'W': { // wooden dock
      px(x,y,TS,TS,C.wood); px(x,y+5,TS,1,'#4a3018'); px(x,y+11,TS,1,'#4a3018'); px(x+7,y,1,TS,'#4a3018'); break; }
    case 'D': { px(x,y,TS,TS,C.wall); px(x+2,y+1,12,15,C.wood); px(x+2,y+1,12,1,C.woodL); px(x+11,y+8,2,2,C.gold); break; }
    case 'C': { px(x,y,TS,TS,C.stone2); // cracked wall
      X.strokeStyle='#12131c'; X.lineWidth=1; X.beginPath(); X.moveTo(x+8,y); X.lineTo(x+5,y+6); X.lineTo(x+10,y+10); X.lineTo(x+6,y+16); X.stroke(); break; }
    case 'T': { px(x,y,TS,TS,C.grass2); px(x+6,y+8,4,8,C.wood); px(x+2,y+1,12,9,C.grass); px(x+3,y+3,3,3,'#3a824a'); break; }
    case 'x': { px(x,y,TS,TS,C.floor); px(x+2,y+2,12,12,C.wood); px(x+2,y+2,12,1,C.woodL); px(x+2,y+2,1,12,C.woodL); break; } // crate
    case 'g': { px(x,y,TS,TS,C.floor); // gold pile
      px(x+2,y+9,12,5,C.goldD); px(x+3,y+7,4,4,C.gold); px(x+8,y+6,4,5,C.gold); px(x+5,y+4,3,3,C.gold); break; }
    default: px(x,y,TS,TS, C.floor);
  }
}

/* ---------- rooms ---------- */
// 20 cols x 12 rows
const ROOMS={
  marseille:{
    name:'마르세유 항구, 1815',
    tiles:[
      '~~~~~~~~~~~~~~~~~~~~',
      '~~~~~~~~~~~~~~~~~~~~',
      '~~~~~~~~~~~~~~~~~~~~',
      'WWWWWWWWWWWWWWWWWWWW',
      ',,,,,,,WW,,,,,,,,,,,',
      ',,T,,,,WW,,,,,x,,,T,',
      ',,,,,,,,,,,,,,,,,,,,',
      ',,,,,,,,,,,,,,,,x,,,',
      '#D#,,,,,,,,,,,,,,,,,',
      '###,,,,,,,,,,,,,,,,,',
      ',,,,,,,,,,,,,,,,,,,,',
      ',,,,,,,,,,,,,,,,,,,,'
    ],
    start:[10,10,'up'],
    npcs:[
      {id:'mercedes',x:9,y:6,type:'mercedes',dir:'down',name:'메르세데스'},
      {id:'danglars',x:4,y:9,type:'villain',dir:'down',name:'당글라르'},
      {id:'fernand',x:15,y:9,type:'villain',dir:'down',name:'페르낭'}
    ]
  },
  cell:{
    name:'이프 성 지하 감옥',
    tiles:[
      'BBBBBBBBBBBBBBBBBBBB',
      'B..................B',
      'B..................B',
      'B........xx........B',
      'B..................B',
      'B..................C',
      'B..................C',
      'B..................B',
      'B..................B',
      'B........DD........B',
      'BBBBBBBBBBBBBBBBBBBB',
      '                    '
    ],
    start:[9,7,'down'],
    npcs:[]
  },
  corridor:{
    name:'이프 성 복도',
    tiles:[
      'BBBBBBBBBBBBBBBBBBBB',
      'B..................B',
      'B..###########.....B',
      'B..#.........#.....B',
      'B..#.........#.....B',
      'B..#.........#.....D',
      'B..#.........#.....B',
      'B..###.#######.....B',
      'B..................B',
      'B..................B',
      'BBBBBBBBBBBBBBBBBBBB',
      '                    '
    ],
    start:[3,9,'up'],
    npcs:[
      {id:'guard',x:14,y:5,type:'guard',dir:'left',name:'간수'}
    ]
  },
  treasure:{
    name:'몬테크리스토 섬 — 보물 동굴',
    tiles:[
      'BBBBBBBBBBBBBBBBBBBB',
      'B..................B',
      'B...g....g....g....B',
      'B..................B',
      'B......gggggg......B',
      'B.....gggggggg.....B',
      'B......gggggg......B',
      'B..................B',
      'B........gg........B',
      'B........DD........B',
      'BBBBBBBBBBBBBBBBBBBB',
      '                    '
    ],
    start:[9,8,'up'],
    npcs:[]
  }
};

/* ---------- game state ---------- */
const G={
  mode:'title', room:null, roomKey:'', anim:0,
  px:0, py:0, dir:'down', step:0, moving:null, moveT:0,
  flags:{}, cut:null, cutI:0, waitInput:false,
  player:{name:'에드몽',lv:1,hp:60,maxhp:60,mp:12,maxmp:12,atk:14,def:6,
    skills:[{n:'반격의 검',mp:5,type:'atk',pow:1.9,msg:'에드몽의 반격의 검!'},
            {n:'희망',mp:4,type:'heal',pow:24,msg:'에드몽은 희망을 되새겼다!'}]},
  battle:null, dialog:null, fade:0, fadeDir:0, fadeCb:null,
  title:{sel:0}
};

/* ---------- room helpers ---------- */
function loadRoom(key,keepPos){
  G.room=ROOMS[key]; G.roomKey=key;
  G.room.npcsLive=JSON.parse(JSON.stringify(G.room.npcs));
  if(!keepPos){ G.px=G.room.start[0]; G.py=G.room.start[1]; G.dir=G.room.start[2]; }
  G.moving=null;
}
function tileAt(cx,cy){ const r=G.room.tiles; if(cy<0||cy>=r.length||cx<0||cx>=r[0].length) return '#'; return r[cy][cx]; }
function solid(cx,cy){
  const t=tileAt(cx,cy);
  if('#~BTx'.includes(t)) return true;
  // npc occupying
  if(G.room.npcsLive) for(const n of G.room.npcsLive){ if(n.x===cx&&n.y===cy) return true; }
  return false;
}
function npcFacing(){
  let dx=0,dy=0; if(G.dir==='up')dy=-1; if(G.dir==='down')dy=1; if(G.dir==='left')dx=-1; if(G.dir==='right')dx=1;
  const tx=G.px+dx, ty=G.py+dy;
  if(G.room.npcsLive) for(const n of G.room.npcsLive){ if(n.x===tx&&n.y===ty) return n; }
  const t=tileAt(tx,ty);
  return {tile:t, tx,ty};
}

/* ---------- dialog ---------- */
function say(list){ // list of {who,txt} or strings
  G.dialog={q:list.map(d=> typeof d==='string'?{who:'',txt:d}:d), i:0, shown:'', ci:0, t:0, done:false};
}
function updateDialog(){
  const d=G.dialog; const cur=d.q[d.i];
  if(d.ci<cur.txt.length){ d.t++; if(d.t%2===0){ d.ci++; d.shown=cur.txt.slice(0,d.ci);} }
  else d.done=true;
  if(consumeConfirm()){
    if(!d.done){ d.ci=cur.txt.length; d.shown=cur.txt; d.done=true; }
    else { d.i++; if(d.i>=d.q.length){ G.dialog=null; if(G._dialogCb){const cb=G._dialogCb;G._dialogCb=null;cb();} } else { d.ci=0;d.shown='';d.t=0;d.done=false; } }
  }
}
function drawDialog(){
  const d=G.dialog; const cur=d.q[d.i];
  const bx=8, by=H-58, bw=W-16, bh=50;
  px(bx,by,bw,bh,'#0a0f22ee');
  // border
  X.strokeStyle=C.winB; X.lineWidth=2; X.strokeRect(bx+1,by+1,bw-2,bh-2);
  X.strokeStyle='#8fa6d8'; X.lineWidth=1; X.strokeRect(bx+3,by+3,bw-6,bh-6);
  if(cur.who){ textPix(cur.who, bx+8, by-2+6, C.gold, 11); }
  // wrap text
  wrapText(d.shown||'', bx+8, by+ (cur.who?22:10), bw-16, 13, C.text);
  if(d.done){ if((G.anim>>4)%2) textPix('▼', W-26, by+bh-16, C.gold, 11); }
}
function wrapText(str,x,y,maxw,lh,col){
  X.font="11px 'Galmuri11',monospace"; X.fillStyle=col; X.textBaseline='top';
  let line='',yy=y;
  for(const ch of str){
    if(ch==='\n'){ X.fillText(line,x,yy); line=''; yy+=lh; continue; }
    const test=line+ch;
    if(X.measureText(test).width>maxw){ X.fillText(line,x,yy); line=ch; yy+=lh; }
    else line=test;
  }
  X.fillText(line,x,yy);
}

/* ---------- cutscenes ---------- */
function runCut(steps,cb){ G.cut=steps; G.cutI=0; G._cutCb=cb; nextCut(); }
function nextCut(){
  if(!G.cut) return;
  if(G.cutI>=G.cut.length){ G.cut=null; if(G._cutCb){const c=G._cutCb;G._cutCb=null;c();} return; }
  const s=G.cut[G.cutI++];
  const t=s[0];
  if(t==='say'){ say(s[1]); G._dialogCb=nextCut; }
  else if(t==='wait'){ setTimeout(nextCut, s[1]); }
  else if(t==='flag'){ G.flags[s[1]]=s[2]; nextCut(); }
  else if(t==='goto'){ fadeTo(()=>{ loadRoom(s[1], false); if(s[2]){G.px=s[2][0];G.py=s[2][1];G.dir=s[2][2];} }, nextCut); }
  else if(t==='pos'){ G.px=s[1];G.py=s[2];G.dir=s[3]||G.dir; nextCut(); }
  else if(t==='spawn'){ G.room.npcsLive.push(s[1]); nextCut(); }
  else if(t==='despawn'){ G.room.npcsLive=G.room.npcsLive.filter(n=>n.id!==s[1]); nextCut(); }
  else if(t==='battle'){ startBattle(s[1], ()=>nextCut(), s[2]); }
  else if(t==='mode'){ G.mode=s[1]; nextCut(); }
  else if(t==='fn'){ s[1](); nextCut(); }
  else nextCut();
}
function fadeTo(mid,after){
  G.fadeDir=1; G.fadeCb=()=>{ mid&&mid(); G.fadeDir=-1; G.fadeCb=()=>{ G.fadeDir=0; after&&after(); }; };
}

/* ---------- battle ---------- */
const ENEMIES={
  guard:{name:'간수',hp:46,maxhp:46,atk:12,def:4,exp:0,spr:'guard'},
  chief:{name:'간수장',hp:80,maxhp:80,atk:17,def:6,exp:0,spr:'guard'}
};
function startBattle(key,onWin,onLose){
  const e=JSON.parse(JSON.stringify(ENEMIES[key]));
  G.battle={e, onWin, onLose, phase:'intro', mi:0, msg:e.name+'이(가) 나타났다!', msgQ:[], _after:null, _end:null, flash:0, shake:0, ehit:0, defending:false, _h:0};
  G.mode='battle';
}
function bmsg(m){ G.battle.msgQ.push(m); }
function nextMsg(){
  const b=G.battle;
  if(b.msgQ.length){ b.msg=b.msgQ.shift(); b.phase='msg'; return; }
  if(b._after){ const f=b._after; b._after=null; f(); return nextMsg(); }
  if(b.phase!=='win'&&b.phase!=='lose') b.phase='menu';
}
const BCMDS=['공격','반격의 검','희망','방어','도망'];
function battleInput(){
  const b=G.battle;
  if(b.phase==='intro'){ if(consumeConfirm()){ b.phase='menu'; } return; }
  if(b.phase==='msg'){ if(consumeConfirm()){ nextMsg(); } return; }
  if(b.phase==='win'||b.phase==='lose'){ if(consumeConfirm()){ G.mode='field'; const f=b._end; G.battle=null; f&&f(); } return; }
  if(b.phase==='menu'){
    if(consumeConfirm()){ chooseCmd(); return; }
    if(keys.up&&!b._h){ b.mi=(b.mi+BCMDS.length-1)%BCMDS.length; b._h=1; }
    else if(keys.down&&!b._h){ b.mi=(b.mi+1)%BCMDS.length; b._h=1; }
    else if(!keys.up&&!keys.down){ b._h=0; }
  }
}
function chooseCmd(){
  const b=G.battle, pl=G.player;
  const cmd=BCMDS[b.mi]; b.defending=false; b._after=null;
  if(cmd==='공격'){ playerAttack(pl.atk, '에드몽의 공격!'); }
  else if(cmd==='반격의 검'){ if(pl.mp<5){ bmsg('MP가 부족하다!'); } else { pl.mp-=5; playerAttack(Math.round(pl.atk*1.9), '반격의 검!'); } }
  else if(cmd==='희망'){ if(pl.mp<4){ bmsg('MP가 부족하다!'); } else { pl.mp-=4; const h=Math.min(pl.maxhp-pl.hp,26); pl.hp+=h; bmsg('에드몽은 희망을 되새겼다! HP +'+h); b._after=enemyTurn; } }
  else if(cmd==='방어'){ b.defending=true; bmsg('에드몽은 몸을 웅크렸다.'); b._after=enemyTurn; }
  else if(cmd==='도망'){ if(Math.random()<0.45){ bmsg('도망쳤다!'); b._after=()=>{ b.phase='win'; b._end=b.onWin; }; } else { bmsg('도망치지 못했다!'); b._after=enemyTurn; } }
  b.phase='msg'; nextMsg();
}
function playerAttack(power,label){
  const b=G.battle, e=b.e;
  const dmg=Math.max(1, (power - e.def + (Math.random()*4-2))|0);
  e.hp-=dmg; b.ehit=10; b.shake=8;
  bmsg(label+' '+e.name+'에게 '+dmg+'의 피해!');
  b._after=()=>{
    if(e.hp<=0){ e.hp=0; bmsg(e.name+'을(를) 쓰러뜨렸다!'); b._after=()=>{ b.phase='win'; b._end=b.onWin; }; }
    else enemyTurn();
  };
}
function enemyTurn(){
  const b=G.battle, pl=G.player, e=b.e;
  let dmg=Math.max(1, (e.atk - pl.def + (Math.random()*4-2))|0);
  if(b.defending) dmg=Math.max(1,(dmg/2)|0);
  pl.hp-=dmg; b.flash=8;
  bmsg(e.name+'의 공격! 에드몽은 '+dmg+'의 피해를 입었다.');
  b._after=()=>{
    if(pl.hp<=0){ pl.hp=0; bmsg('에드몽은 쓰러졌다...'); b._after=()=>{ b.phase='lose'; b._end=b.onLose||(()=>gameOver()); }; }

}

function updateField(){

  if(G.moving){

/* ---------- util ---------- */
function mix(a,b,t){ const pa=hx(a),pb=hx(b); return 'rgb('+((pa[0]+(pb[0]-pa[0])*t)|0)+','+((pa[1]+(pb[1]-pa[1])*t)|0)+','+((pa[2]+(pb[2]-pa[2])*t)|0)+')'; }
function hx(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

/* ---------- draw field ---------- */
function drawField(){
  const r=G.room;
  for(let y=0;y<r.tiles.length;y++) for(let x=0;x<r.tiles[0].length;x++){ drawTile(r.tiles[y][x], x*TS, y*TS, G.anim); }
  // npcs
  if(r.npcsLive) for(const n of r.npcsLive){ drawActor(n.x*TS, n.y*TS, n.type, n.dir, 0); }
  // player (with move tween)
  let dpx=G.px*TS, dpy=G.py*TS;
  if(G.moving){ dpx=(G.moving.fx+(G.moving.tx-G.moving.fx)*G.moveT)*TS; dpy=(G.moving.fy+(G.moving.ty-G.moving.fy)*G.moveT)*TS; }
  drawActor(dpx,dpy, G.flags.ending?'edmondCount':'edmond', G.dir, G.moving?(Math.floor(G.moveT*4)):0);
  // location banner
  if(G.anim%1<2 || true){ /* always draw subtle */ }
  px(0,0,W,14,'#0a0f22cc'); textPix(r.name, 6, 2, C.gold, 11);
  if(G.dialog) drawDialog();
}

/* ---------- main loop ---------- */
function loop(){
  G.anim++;
  // update
  if(G.fadeDir!==0){
    G.fade+=G.fadeDir*0.08;
    if(G.fadeDir>0 && G.fade>=1){ G.fade=1; const c=G.fadeCb;G.fadeCb=null;c&&c(); }
    else if(G.fadeDir<0 && G.fade<=0){ G.fade=0; const c=G.fadeCb;G.fadeCb=null;c&&c(); }
  } else {
    if(G.mode==='title') updateTitle();
    else if(G.mode==='field'){ updateField(); }
    else if(G.mode==='battle') battleInput();
    else if(G.mode==='gameover'){ if(consumeConfirm()){ G.mode='title'; } }
    else if(G.mode==='ending'){ if(consumeConfirm()){ G.mode='title'; G.title.sel=0; } }
    // dialog outside cut (field handles its own); ensure dialog updates in non-field story
    if(G.dialog && G.mode!=='field' && G.mode!=='battle') updateDialog();
  }
  // draw
  X.clearRect(0,0,W,H);
  if(G.mode==='title') drawTitle();
  else if(G.mode==='field') drawField();
  else if(G.mode==='battle') drawBattle();
  else if(G.mode==='gameover') drawGameOver();
  else if(G.mode==='ending') drawEnding();
  // dialog overlay for cutscene while in field already drawn; for goto transitions dialog may show over field
  if(G.fade>0){ X.fillStyle='rgba(0,0,0,'+G.fade+')'; X.fillRect(0,0,W,H); }
  requestAnimationFrame(loop);
}

/* fit canvas height to width for crispness handled by CSS width; ensure font ready */
document.fonts && document.fonts.load("12px 'Galmuri11'").then(()=>{}).catch(()=>{});
loop();
</script>
