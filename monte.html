<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060c">
<meta name="format-detection" content="telephone=no">
<title>34번의 14년</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05060c;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{position:fixed;left:0;top:0;right:0;bottom:0}
#screen{position:absolute;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;outline:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden;pointer-events:none}
#rotate{position:fixed;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#05060c;color:#c8ccd8;font:16px Galmuri11,sans-serif;text-align:center;z-index:5}
#rotate small{font:12px Galmuri9,sans-serif;color:#6a7088}
#rotate i{display:block;width:26px;height:44px;border:3px solid #c8ccd8;border-radius:5px;margin-bottom:6px}
#bootmsg{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));color:#9a98a8;font:12px Galmuri11,monospace;pointer-events:none;white-space:pre-wrap;z-index:4;transition:opacity .6s}
#bootmsg .err{color:#ff7a7a}
</style>
</head>
<body>
<canvas id="screen" tabindex="-1"></canvas>
<div id="safe"></div>
<div id="rotate"><i></i><div>세로로 돌려 주세요</div><small>이 게임은 세로 화면 전용입니다</small></div>
<div id="bootmsg">불러오는 중…</div>
<script>window.MC_BUNDLED=true;</script>
<script>/* ==== src/boot.js ==== */
/* boot.js — MC 네임스페이스·등록 함수, 스크립트 순차 로드(?v=VERSION), 폰트 대기(최대 3초) → MC.core.start() → MC.main() */
(function () { 'use strict';
  var VERSION = '0.1.0-s1';
  var FILES = [
    'src/engine/core.js', 'src/engine/gfx.js', 'src/engine/text.js', 'src/engine/input.js', 'src/engine/scene.js',
    'src/engine/ui.js', 'src/engine/fx.js', 'src/engine/game.js', 'src/engine/save.js',
    'src/engine/audio.js', 'src/engine/sfx.js', 'src/engine/music.js',
    'src/engine/dialogue.js', 'src/engine/events.js', 'src/engine/field.js',
    'src/engine/battle_core.js', 'src/engine/battle_view.js', 'src/engine/debug.js',
    'data/sfx.js', 'data/bgm.js',
    'data/spr_chars.js', 'data/spr_portraits.js', 'data/spr_world.js', 'data/tilesets.js',
    'data/speakers.js', 'data/battle.js',
    'data/maps/port.js', 'data/maps/catalan.js', 'data/maps/reserve.js', 'data/maps/villefort.js', 'data/maps/boat.js',
    'data/maps/cell.js', 'data/maps/b1.js',
    'data/events_sys.js', 'data/events_a0.js', 'data/events_a1.js', 'data/events_a2.js', 'data/events_a3.js',
    'src/ch1/cards.js', 'src/ch1/minigames.js', 'src/ch1/custom.js', 'src/ch1/title.js', 'src/ch1/menu.js', 'src/ch1/main.js'
  ];

  /* ---------- URL 설정 ---------- */
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf('='), k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i)), v = i < 0 ? '1' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
    q[k] = v;
  });
  var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === 'file:';

  var MC = window.MC = {
    VERSION: VERSION,
    FILES: FILES,
    cfg: {
      q: q,
      debug: q.debug === '1' || q.debug === 'true',
      dev: local || q.debug === '1',
      test: q.test || null,
      ev: q.ev || null,
      map: q.map || null, x: q.x != null ? +q.x : null, y: q.y != null ? +q.y : null,
      mute: q.mute === '1',
      sound: q.sound === '1',
      seed: q.seed != null && q.seed !== '' ? (+q.seed >>> 0) : null
    },
    data: { sprites: { pals: {}, spr: {} }, tilesets: {}, maps: {}, events: {}, speakers: {} },
    ch1: { custom: {} },
    errors: [],
    bootMissing: [],
    bootErrors: []
  };

  /* ---------- 등록 함수 ---------- */
  function merge(dst, src, kind) {
    if (!src) return;
    for (var k in src) {
      if (!Object.prototype.hasOwnProperty.call(src, k)) continue;
      if (Object.prototype.hasOwnProperty.call(dst, k)) console.warn('[boot] 중복 ' + kind + ' id: ' + k);
      dst[k] = src[k];
    }
  }
  MC.addSprites = function (o) {
    if (!o) return;
    var pals = MC.data.sprites.pals;
    for (var p in o.pals || {}) {
      if (pals[p] && JSON.stringify(pals[p]) !== JSON.stringify(o.pals[p])) console.warn('[boot] 중복 팔레트(내용 다름): ' + p);
      pals[p] = o.pals[p];
    }
    merge(MC.data.sprites.spr, o.spr, 'sprite');
    if (MC.gfx && MC.gfx._invalidate) MC.gfx._invalidate(Object.keys(o.spr || {}));
  };
  MC.addTilesets = function (o) { merge(MC.data.tilesets, o, 'tileset'); };
  MC.addMaps = function (o) { merge(MC.data.maps, o, 'map'); };
  MC.addEvents = function (o) { merge(MC.data.events, o, 'event'); };
  MC.addSpeakers = function (o) { merge(MC.data.speakers, o, 'speaker'); };

  /* ---------- 부팅 메시지 ---------- */
  var msgEl = document.getElementById('bootmsg');
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'; }); }
  function showMsg(html, hideMs) {
    if (!msgEl) return;
    msgEl.innerHTML = html;
    msgEl.style.opacity = '1';
    msgEl.style.display = html ? 'block' : 'none';
    if (hideMs) setTimeout(function () { msgEl.style.opacity = '0'; setTimeout(function () { msgEl.style.display = 'none'; }, 700); }, hideMs);
  }

  // 로드 중 문법·실행 오류(파일 경로 포함)
  function bootErr(ev) {
    var f = (ev && ev.filename) || '';
    var rel = f.replace(/^.*\/monte\//, '').replace(/\?.*$/, '');
    MC.bootErrors.push({ file: rel, line: ev && ev.lineno, msg: (ev && ev.message) || String(ev) });
  }
  window.addEventListener('error', bootErr);

  /* ---------- 스크립트 로드 ---------- */
  function loadAll(done) {
    var pending = FILES.length;
    FILES.forEach(function (f) {
      var s = document.createElement('script');
      s.src = f + '?v=' + encodeURIComponent(VERSION);
      s.async = false;
      s.onload = function () { if (--pending === 0) done(); };
      s.onerror = function () {
        MC.bootMissing.push(f);
        if (MC.cfg.dev) console.warn('[boot] 파일 없음/로드 실패: ' + f);
        if (--pending === 0) done();
      };
      document.head.appendChild(s);
    });
  }

  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function waitFonts() {
    if (!document.fonts || !document.fonts.load) return delay(400);
    var all = Promise.all([
      document.fonts.load('12px "Galmuri11"', '가A1…'),
      document.fonts.load('bold 12px "Galmuri11"', '가A1'),
      document.fonts.load('10px "Galmuri9"', '가A1')
    ]).catch(function () {});
    return Promise.race([all, delay(3000)]);
  }

  function fatal(msg) { showMsg('<span class="err">' + esc(msg) + '</span>'); }

  function afterLoad() {
    window.removeEventListener('error', bootErr);
    var lines = [];
    if (MC.bootMissing.length) lines.push('<span class="err">없는 파일 ' + MC.bootMissing.length + '개:</span> <small>' + esc(MC.bootMissing.map(function (f) { return f.replace(/^src\/engine\/|^data\/|\.js$/g, ''); }).join(' · ')) + '</small>');
    MC.bootErrors.forEach(function (e) { lines.push('<span class="err">오류 ' + esc(e.file) + ':' + (e.line || '?') + '</span> ' + esc(e.msg)); });
    showMsg('글꼴 준비 중…');
    waitFonts().then(function () {
      if (!MC.core || !MC.gfx || !MC.scene) { fatal('엔진을 불러오지 못했습니다. ' + MC.bootMissing.join(', ')); return; }
      try { MC.core.start(); } catch (e) { console.error(e); fatal('시작 오류: ' + (e && e.message)); return; }
      if (lines.length) showMsg(lines.join('\n'), 5000); else showMsg('', 0);
      try {
        if (MC.cfg.test === 'core' || typeof MC.main !== 'function') {
          if (MC.dbg && MC.dbg.coreTest) MC.dbg.coreTest();
          else fatal('MC.main이 없습니다(scenes 담당). ?test=core 로 엔진 테스트를 열 수 있습니다.');
        } else {
          var r = MC.main();
          if (r && typeof r.catch === 'function') r.catch(function (e) { MC.core.error(e, 'main'); });
        }
      } catch (e) { MC.core.error(e, 'main'); }
    });
  }

  if (window.MC_BUNDLED) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', afterLoad); else afterLoad(); } else loadAll(afterLoad);
})();

</script>
<script>/* ==== src/engine/core.js ==== */
/* core.js — 60Hz 고정 스텝 루프, MC.time(게임/실시간), wait·tween·rng, 오류 수집(루프는 절대 멈추지 않음) */
(function (MC) { 'use strict';
  const STEP = 1000 / 60;
  // now: 게임 시간(히트스톱·일시정지 때 멈춤) / real: 실시간(스텝 누적, 일시정지 때만 멈춤)
  const time = MC.time = { now: 0, real: 0, dt: STEP, frame: 0, scale: 1, frozen: false };

  MC.clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
  MC.lerp = (a, b, t) => a + (b - a) * t;

  /* ---------- 이징 ---------- */
  MC.ease = {
    linear: t => t,
    inQuad: t => t * t,
    outQuad: t => t * (2 - t),
    inOutQuad: t => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
    inCubic: t => t * t * t,
    outCubic: t => { const u = t - 1; return u * u * u + 1; },
    inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 + 4 * (t - 1) * (t - 1) * (t - 1)),
    outBack: t => { const s = 1.70158, u = t - 1; return u * u * ((s + 1) * u + s) + 1; },
    inSine: t => 1 - Math.cos(t * Math.PI / 2),
    outSine: t => Math.sin(t * Math.PI / 2),
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2
  };

  /* ---------- 난수 (mulberry32, 시드 가능) ---------- */
  let seedState = ((Date.now() ^ 0x9e3779b9) >>> 0) || 1;
  function rng() {
    seedState = (seedState + 0x6D2B79F5) >>> 0;
    let t = seedState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  rng.seed = n => { seedState = (n >>> 0) || 1; };
  rng.int = (a, b) => a + Math.floor(rng() * (b - a + 1));      // a..b 포함
  rng.pick = arr => (arr && arr.length ? arr[Math.floor(rng() * arr.length)] : undefined);
  rng.range = (a, b) => a + rng() * (b - a);
  MC.rng = rng;

  /* ---------- 오류 ---------- */
  const errSeen = new Map();
  function error(e, where) {
    const msg = (e && (e.message || e.reason)) ? String(e.message || e.reason) : String(e);
    const key = (where || '') + '|' + msg;
    const n = (errSeen.get(key) || 0) + 1;
    errSeen.set(key, n);
    if (n === 1) {
      const rec = { where: where || '', msg, stack: e && e.stack ? String(e.stack) : '', t: time.real, n: 1 };
      MC.errors.push(rec);
      if (MC.errors.length > 60) MC.errors.shift();
      console.error('[MC:' + (where || '?') + ']', e);
      try { localStorage.setItem('mc34.lastError', JSON.stringify({ where: rec.where, msg: rec.msg, stack: rec.stack.slice(0, 800), at: Date.now() })); } catch (_) {}
    } else {
      for (let i = MC.errors.length - 1; i >= 0; i--) if (MC.errors[i].where === (where || '') && MC.errors[i].msg === msg) { MC.errors[i].n = n; break; }
    }
  }

  /* ---------- 대기 ---------- */
  const waits = [];            // {at, real, res}
  function addWait(ms, real) {
    return new Promise(res => {
      waits.push({ at: (real ? time.real : time.now) + (ms > 0 ? ms : 0), real: !!real, res });
    });
  }
  function runWaits() {
    for (let i = waits.length - 1; i >= 0; i--) {
      const w = waits[i];
      if ((w.real ? time.real : time.now) >= w.at) { waits.splice(i, 1); w.res(); }
    }
  }

  /* ---------- 트윈 ---------- */
  const tweens = [];
  // MC.tween(obj, {x:10}, ms, 'outCubic', {real:false}) -> Promise(true=완료 / false=다른 트윈에 덮임)
  MC.tween = function (obj, props, ms, ease, opt) {
    const real = !!(opt && opt.real);
    const ef = typeof ease === 'function' ? ease : (MC.ease[ease] || MC.ease.linear);
    const keys = Object.keys(props);
    for (let i = tweens.length - 1; i >= 0; i--) {           // 같은 속성을 잡고 있던 트윈은 그 속성을 놓는다
      const tw = tweens[i];
      if (tw.obj !== obj) continue;
      tw.keys = tw.keys.filter(k => !(k in props));
      if (!tw.keys.length) { tweens.splice(i, 1); tw.res(false); }
    }
    if (!(ms > 0)) { for (const k of keys) obj[k] = props[k]; return Promise.resolve(true); }
    return new Promise(res => {
      const from = {};
      for (const k of keys) from[k] = +obj[k] || 0;
      tweens.push({ obj, keys, from, to: props, ms, t: 0, ef, real, res });
    });
  };
  MC.tween.kill = function (obj, finish) {                   // obj의 트윈 전부 중지(finish면 끝값으로)
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (tw.obj !== obj) continue;
      if (finish) for (const k of tw.keys) obj[k] = tw.to[k];
      tweens.splice(i, 1); tw.res(false);
    }
  };
  function runTweens(frozen) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (frozen && !tw.real) continue;
      tw.t += STEP;
      const p = tw.t >= tw.ms ? 1 : tw.t / tw.ms;
      const e = tw.ef(p);
      for (const k of tw.keys) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
      if (p >= 1) {
        for (const k of tw.keys) tw.obj[k] = tw.to[k];
        tweens.splice(i, 1); tw.res(true);
      }
    }
  }

  /* ---------- 씬 밖 태스크 ---------- */
  const tasks = [];
  function onUpdate(fn, opt) { if (typeof fn === 'function') tasks.push({ fn, real: !!(opt && opt.real) }); return fn; }
  function offUpdate(fn) { for (let i = tasks.length - 1; i >= 0; i--) if (tasks[i].fn === fn) tasks.splice(i, 1); }

  /* ---------- 히트스톱·일시정지 ---------- */
  let stopUntil = 0;
  function hitstop(ms) { stopUntil = Math.max(stopUntil, time.real + (ms || 0)); }
  const pauseReasons = new Set();
  function pause(on, reason) {
    reason = reason || 'user';
    if (on) pauseReasons.add(reason); else pauseReasons.delete(reason);
    if (!pauseReasons.size) resetClock = true;
  }
  function isPaused() { return pauseReasons.size > 0; }

  /* ---------- 루프 ---------- */
  let started = false, last = -1, acc = 0, resetClock = true, needRender = true;
  const stats = { fps: 0, upd: 0, rnd: 0, frames: 0, fpsT: 0, steps: 0, hist: new Float32Array(90), hi: 0 };

  function step() {
    time.real += STEP;
    time.frame++;
    const frozen = time.real <= stopUntil;
    time.frozen = frozen;
    if (!frozen) time.now += STEP;
    try { if (MC.input && MC.input.update) MC.input.update(); } catch (e) { error(e, 'input'); }
    if (!frozen) { try { MC.scene.update(STEP); } catch (e) { error(e, 'update'); } }
    for (let i = 0; i < tasks.length; i++) {
      const tk = tasks[i];
      if (frozen && !tk.real) continue;
      try { tk.fn(STEP); } catch (e) { error(e, 'task'); }
    }
    try { runTweens(frozen); } catch (e) { error(e, 'tween'); }
    runWaits();
    try { if (MC.fx && MC.fx.update) MC.fx.update(STEP, frozen); } catch (e) { error(e, 'fx'); }
  }

  function render() {
    const g = MC.gfx, ctx = g.ctx;
    if (!ctx) return;
    g._beginFrame();
    try { MC.scene.render(); } catch (e) { error(e, 'render'); g._beginFrame(); }
    try { if (MC.fx && MC.fx.renderOverlays) MC.fx.renderOverlays(); } catch (e) { error(e, 'overlay'); g._beginFrame(); }
    try { if (MC.dbg && MC.dbg.render) MC.dbg.render(); } catch (e) { error(e, 'dbg'); g._beginFrame(); }
    if (MC.cfg.debug && MC.errors.length) drawErrors();
    g.present();
    g.renderId++;
  }

  function drawErrors() {
    const g = MC.gfx, n = Math.min(2, MC.errors.length);
    const y0 = g.H - 13 * n - 2 - g.safe.bottom;
    g.rect(0, y0 - 1, g.W, 13 * n + 3, '#3a0008');
    for (let i = 0; i < n; i++) {
      const e = MC.errors[MC.errors.length - n + i];
      const s = '! ' + e.where + ': ' + e.msg + (e.n > 1 ? ' ×' + e.n : '');
      MC.text.draw(s.length > 40 ? s.slice(0, 40) + '…' : s, 2, y0 + i * 13, { font: 'small', color: '#ff7a7a' });
    }
  }

  let lastRaf = -1e9;
  function rafLoop(ts) {
    requestAnimationFrame(rafLoop);
    lastRaf = performance.now();
    frame(ts);
  }
  function frame(ts) {
    if (isPaused()) { resetClock = true; return; }
    if (resetClock || last < 0) { last = ts; acc = STEP; resetClock = false; }
    let d = ts - last; last = ts;
    if (d < 0) d = 0;
    if (d > 250) d = STEP;                    // 긴 정지 뒤에는 한 스텝만
    acc += d * time.scale;
    const t0 = performance.now();
    let n = 0;
    while (acc >= STEP) {
      if (n >= 5) { acc = 0; break; }         // 넘치면 버림
      step(); acc -= STEP; n++;
    }
    const t1 = performance.now();
    if (n > 0 || needRender) { render(); needRender = false; }
    const t2 = performance.now();
    stats.upd = stats.upd * 0.9 + (t1 - t0) * 0.1;
    stats.rnd = stats.rnd * 0.9 + (t2 - t1) * 0.1;
    stats.hist[stats.hi] = t2 - t0; stats.hi = (stats.hi + 1) % stats.hist.length;
    stats.frames++;
    if (ts - stats.fpsT >= 500) { stats.fps = Math.round(stats.frames * 1000 / (ts - stats.fpsT)); stats.frames = 0; stats.fpsT = ts; }
  }

  function start() {
    if (started) return;
    started = true;
    if (MC.cfg.seed != null) rng.seed(MC.cfg.seed);
    const init = (name, fn) => { try { fn(); } catch (e) { error(e, 'init:' + name); } };
    init('gfx', () => MC.gfx.init());
    init('text', () => MC.text && MC.text.init && MC.text.init());
    init('input', () => MC.input.init());
    init('save', () => MC.save && MC.save.init && MC.save.init());
    init('audio', () => { if (MC.audio && MC.audio.init) MC.audio.init(); });
    init('bake', () => MC.gfx.bakeAll());
    init('fx', () => MC.fx && MC.fx.init && MC.fx.init());
    init('game', () => MC.game && MC.game.init && MC.game.init());
    init('dbg', () => MC.dbg && MC.dbg.init && MC.dbg.init());
    window.addEventListener('error', ev => error(ev.error || ev.message, 'window'));
    window.addEventListener('unhandledrejection', ev => error(ev.reason || 'promise', 'promise'));
    // ?debug=1이면 '깨어 있음': 탭이 숨겨져도(에이전트 브라우저 뒤 탭) 타이머로 계속 돈다. ?awake=0으로 끔
    const awake = MC.cfg.debug && MC.cfg.q && MC.cfg.q.awake !== '0';
    MC.cfg.awake = !!awake;
    if (!awake) {
      document.addEventListener('visibilitychange', () => pause(document.hidden, 'hidden'));
      window.addEventListener('pagehide', () => pause(true, 'hidden'));
      window.addEventListener('pageshow', () => pause(document.hidden, 'hidden'));
      pause(!!document.hidden, 'hidden');
    } else {
      setInterval(() => { const t = performance.now(); if (t - lastRaf > 120) frame(t); }, 16);
    }
    MC.gfx.onResize(() => { needRender = true; });

    const sh = P.sh || '#000';
    if (small || w < 16 || h < 16) {
      // 작은 요소: W 1px + k 1px, 모따기 1px
      x.fillStyle = sh; x.fillRect(2, h, w - 2, 1); x.fillRect(w, 2, 1, h - 2); x.fillRect(w - 1, h - 1, 1, 1);
      x.fillStyle = P.W; x.fillRect(1, 0, w - 2, 1); x.fillRect(1, h - 1, w - 2, 1); x.fillRect(0, 1, 1, h - 2); x.fillRect(w - 1, 1, 1, h - 2);
      x.fillStyle = P.k; x.fillRect(1, 1, w - 2, 1); x.fillRect(1, h - 2, w - 2, 1); x.fillRect(1, 2, 1, h - 4); x.fillRect(w - 2, 2, 1, h - 4);
      if (fill) { x.fillStyle = P.f; x.fillRect(2, 2, w - 4, h - 4); }
      if (P.hi) { x.fillStyle = P.hi; x.fillRect(2, 2, w - 4, 1); }
      return c;
    }
    x.fillStyle = sh; x.fillRect(2, h, w - 2, 1); x.fillRect(w, 2, 1, h - 2);
    if (fill) { x.fillStyle = P.f; x.fillRect(4, 4, w - 8, h - 8); }
    const edge = [[P.W, 0], [P.W, 1], [P.k, 2], [P.D, 3]];
    for (const [col, o] of edge) {
      x.fillStyle = col;
      x.fillRect(8, o, w - 16, 1); x.fillRect(8, h - 1 - o, w - 16, 1);
      x.fillRect(o, 8, 1, h - 16); x.fillRect(w - 1 - o, 8, 1, h - 16);
    }
    for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) {
      const ch = CORNER[j][i];
      if (ch === '.') continue;
      if (ch === 'f' && !fill) continue;
      const col = P[ch];
      put(i, j, col); put(w - 1 - i, j, col); put(i, h - 1 - j, col); put(w - 1 - i, h - 1 - j, col);
    }
    if (P.hi) { x.fillStyle = P.hi; x.fillRect(4, 4, w - 8, 1); }
    return c;
  }
  // opt: {pal:'act1'.., fill:true, small:false, sel:false(f↔W 반전), alpha, over:{W,f,D,k,r}}
  g.frame = function (x, y, w, h, opt) {
    w |= 0; h |= 0; if (w < 4 || h < 4) return;
    opt = opt || {};
    const pn = opt.pal || g.uiPalName;
    const base = UIPALS[pn] || g.uiPal;
    const fill = opt.fill !== false, small = !!opt.small;
    const over = opt.over;
    const key = pn + '|' + w + '|' + h + '|' + (small ? 1 : 0) + (fill ? 1 : 0) + (opt.sel ? 1 : 0) + (over ? '|' + JSON.stringify(over) : '');
    let c = frameCache.get(key);
    if (!c) {
      let P = base;
      if (opt.sel) P = Object.assign({}, base, { W: base.f, f: base.W, D: mix(base.W, base.f, 0.5), r: base.f });
      if (over) P = Object.assign({}, P, over);
      c = bakeFrame(w, h, P, small, fill);
      if (frameCache.size > 160) frameCache.delete(frameCache.keys().next().value);
      frameCache.set(key, c);
    }
    const ctx = g.ctx;
    if (opt.alpha != null && opt.alpha !== 1) { ctx.globalAlpha = opt.alpha; ctx.drawImage(c, x | 0, y | 0); ctx.globalAlpha = 1; }
    else ctx.drawImage(c, x | 0, y | 0);
  };
  g.setUIPal = function (name) {
    if (!UIPALS[name]) { warnOnce('uipal:' + name, '창 팔레트 없음: ' + name); return; }
    g.uiPalName = name; g.uiPal = UIPALS[name];
  };
  g.pal = name => UIPALS[name] || g.uiPal;
})(window.MC);

<script>/* ==== src/engine/text.js ==== */
/* text.js — Galmuri 4배 오버샘플 → 1비트 글리프 캐시(부분 알파 0), 문자열 캐시, 어절 줄바꿈·금칙, 조사 */
(function (MC) { 'use strict';
  const K = 4;
  const FALLBACK = ', "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
  // rows: 글리프 마스크 높이(= 줄 칸). y는 칸 위쪽, 기준선은 size 행
  const FONTS = {
    body: { fam: 'Galmuri11', size: 12, bold: false, line: 16, rows: 16, scale: 1 },
    small: { fam: 'Galmuri9', size: 10, bold: false, line: 13, rows: 14, scale: 1 },
    bold: { fam: 'Galmuri11', size: 12, bold: true, line: 16, rows: 16, scale: 1 },
    big: { src: 'bold', line: 32, rows: 32, scale: 2 }
  };
  const LINE = { body: 16, small: 13, bold: 16, big: 32 };
  const COLOR_NAMES = { text: 1, dim: 1, gold: 1, red: 1 };
  const EXTRA_COLORS = { blue: '#8ab8f0', white: '#ffffff', black: '#000000', green: '#66c96a' };

  let scratch = null, sctx = null;
  function ensureScratch() {
    if (scratch) return;
    scratch = document.createElement('canvas');
    scratch.width = 12 * K * 2 + 8; scratch.height = 16 * K + 8;
    sctx = scratch.getContext('2d', { willReadFrequently: true });
  }
  function fontStr(f) { return (f.bold ? 'bold ' : '') + (f.size * K) + 'px "' + f.fam + '"' + FALLBACK; }
  function fontOf(name) { return FONTS[name] || FONTS.body; }

  /* ---------- 글리프 ---------- */
  const glyphs = new Map();      // font+ch -> {adv,w,h,bits}
  const advs = new Map();        // font+ch -> adv
  const tints = new Map();       // font|color|ch -> canvas
  const lines = new Map();       // font|color|shadow|outline|str -> canvas
  const wraps = new Map();
  let lastFontKey = '';

  function advance(fname, ch) {
    const key = fname + ch;
    let a = advs.get(key);
    if (a !== undefined) return a;
    const f = fontOf(fname);
    if (f.src) a = advance(f.src, ch) * f.scale;
    else {
      ensureScratch();
      const fs = fontStr(f);
      if (lastFontKey !== fs) { sctx.font = fs; lastFontKey = fs; }
      a = Math.round(sctx.measureText(ch).width / K);
    }
    advs.set(key, a);
    return a;
  }

  function glyph(fname, ch) {
    const key = fname + ch;
    let gl = glyphs.get(key);
    if (gl) return gl;
    const f = fontOf(fname);
    if (f.src) {                                  // big = bold 마스크 2배
      const b = glyph(f.src, ch), s = f.scale, w = b.w * s, h = b.h * s, bits = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) bits[y * w + x] = b.bits[((y / s) | 0) * b.w + ((x / s) | 0)];
      gl = { adv: b.adv * s, w, h, bits };
    } else {
      ensureScratch();
      const cw = f.size * 2 * K, chh = f.rows * K;
      if (scratch.width < cw || scratch.height < chh) { scratch.width = Math.max(scratch.width, cw); scratch.height = Math.max(scratch.height, chh); lastFontKey = ''; }
      sctx.setTransform(1, 0, 0, 1, 0, 0);
      sctx.clearRect(0, 0, cw, chh);
      const fs = fontStr(f);
      sctx.font = fs; lastFontKey = fs;
      sctx.textBaseline = 'alphabetic'; sctx.textAlign = 'left'; sctx.fillStyle = '#fff';
      sctx.fillText(ch, 0, f.size * K);
      const adv = advance(fname, ch);
      const data = sctx.getImageData(0, 0, cw, chh).data;
      const mw = f.size * 2, mh = f.rows;
      const tmp = new Uint8Array(mw * mh);
      let maxX = -1;
      for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
        if (data[((y * K + 2) * cw + x * K + 2) * 4 + 3] > 127) { tmp[y * mw + x] = 1; if (x > maxX) maxX = x; }
      }
      const w = Math.max(1, maxX + 1), bits = new Uint8Array(w * mh);
      for (let y = 0; y < mh; y++) for (let x = 0; x < w; x++) bits[y * w + x] = tmp[y * mw + x];
      gl = { adv, w, h: mh, bits };
    }
    if (glyphs.size > 1500) glyphs.delete(glyphs.keys().next().value);
    glyphs.set(key, gl);
    return gl;
  }

  function resolveColor(c) {
    if (!c) return (MC.gfx.uiPal && MC.gfx.uiPal.text) || '#f0ece0';
    if (COLOR_NAMES[c]) return MC.gfx.uiPal[c];
    return EXTRA_COLORS[c] || c;
  }

  function tinted(fname, ch, color) {
    const key = fname + '|' + color + '|' + ch;
    let c = tints.get(key);
    if (c !== undefined) return c;
    const gl = glyph(fname, ch);
    let any = false;
    for (let i = 0; i < gl.bits.length; i++) if (gl.bits[i]) { any = true; break; }
    if (!any) c = null;
    else {
      c = MC.gfx.makeCanvas(gl.w, gl.h);
      const x = c.getContext('2d'), id = x.createImageData(gl.w, gl.h), d = id.data, col = MC.gfx.rgb(color);
      for (let i = 0; i < gl.bits.length; i++) if (gl.bits[i]) { const o = i * 4; d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255; }
      x.putImageData(id, 0, 0);
    }
    if (tints.size > 1500) tints.delete(tints.keys().next().value);
    tints.set(key, c);
    return c;
  }

  /* ---------- 폭 ---------- */
  function width(str, fname) {
    fname = fname || 'body';
    str = String(str);
    let w = 0, best = 0;
    for (const ch of str) {
      if (ch === '\n') { if (w > best) best = w; w = 0; continue; }
      w += advance(fname, ch);
    }
    return w > best ? w : best;
  }

  /* ---------- 문자열 굽기 (한 줄 → 캔버스 한 장) ---------- */
  // opt: {shadow:'#000'(1px 우하), outline:'#000'(1px 8방향)}
  function bake(str, fname, color, shadow, outline) {
    fname = fname || 'body';
    color = resolveColor(color);
    const key = fname + '|' + color + '|' + (shadow || '') + '|' + (outline || '') + '|' + str;
    let c = lines.get(key);
    if (c !== undefined) return c;
    const f = fontOf(fname);
    const w = width(str, fname);
    if (w <= 0) { lines.set(key, null); return null; }
    const pad = outline ? 1 : 0, sh = shadow ? 1 : 0;
    const cw = w + pad * 2 + sh, chh = f.rows + pad * 2 + sh;
    const mask = new Uint8Array(cw * chh);            // 0 빈칸, 1 글자, 2 그림자/외곽선
    let pen = pad;
    for (const ch of str) {
      const gl = glyph(fname, ch);
      for (let y = 0; y < gl.h; y++) for (let x = 0; x < gl.w; x++) {
        if (!gl.bits[y * gl.w + x]) continue;
        const px = pen + x, py = pad + y;
        if (px >= 0 && px < cw && py < chh) mask[py * cw + px] = 1;
      }
      pen += gl.adv;
    }
    if (outline || shadow) {
      for (let y = 0; y < chh; y++) for (let x = 0; x < cw; x++) {
        if (mask[y * cw + x] !== 1) continue;
        if (outline) {
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || ny < 0 || nx >= cw || ny >= chh) continue;
            if (!mask[ny * cw + nx]) mask[ny * cw + nx] = 2;
          }
        } else {
          const nx = x + 1, ny = y + 1;
          if (nx < cw && ny < chh && !mask[ny * cw + nx]) mask[ny * cw + nx] = 2;
        }
      }
    }
    c = MC.gfx.makeCanvas(cw, chh);
    const x2 = c.getContext('2d'), id = x2.createImageData(cw, chh), d = id.data;
    const C1 = MC.gfx.rgb(color), C2 = MC.gfx.rgb(outline || shadow || '#000');
    for (let i = 0; i < mask.length; i++) {
      const m = mask[i]; if (!m) continue;
      const col = m === 1 ? C1 : C2, o = i * 4;
      d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
    }
    x2.putImageData(id, 0, 0);
    if (lines.size > 600) lines.delete(lines.keys().next().value);
    lines.set(key, c);
    return c;
  }

  /* ---------- 그리기 ---------- */
  // opt:{font:'body', color, align:'left'|'center'|'right', shadow:null|'#000', outline:null|'#000', alpha:1} -> 끝 x
  function draw(str, x, y, opt) {
    if (str == null) return x;
    str = String(str);
    opt = opt || {};
    const fname = opt.font || 'body';
    if (str.indexOf('\n') >= 0) {
      const ls = str.split('\n'), lh = LINE[fname] || 16;
      let ex = x;
      for (let i = 0; i < ls.length; i++) ex = draw(ls[i], x, y + i * lh, opt);
      return ex;
    }
    const w = width(str, fname);
    let dx = x;
    if (opt.align === 'center') dx = x - (w >> 1);
    else if (opt.align === 'right') dx = x - w;
    dx |= 0; y |= 0;
    const c = bake(str, fname, opt.color, opt.shadow, opt.outline);
    if (c) {
      const ctx = MC.gfx.ctx, a = opt.alpha != null ? opt.alpha : 1;
      if (a <= 0) return dx + w;
      const off = opt.outline ? 1 : 0;
      if (a !== 1) ctx.globalAlpha = a;
      ctx.drawImage(c, dx - off, y - off);
      if (a !== 1) ctx.globalAlpha = 1;
    }
    return dx + w;
  }

  // 한 글자(대사 타자기·흔들림용) -> advance
  function drawChar(ch, x, y, fname, color, alpha) {
    fname = fname || 'body';
    const adv = advance(fname, ch);
    if (ch === ' ' || ch === '\n') return adv;
    const c = tinted(fname, ch, resolveColor(color));
    if (c) {
      const ctx = MC.gfx.ctx;
      if (alpha != null && alpha !== 1) { if (alpha <= 0) return adv; ctx.globalAlpha = alpha; ctx.drawImage(c, x | 0, y | 0); ctx.globalAlpha = 1; }
      else ctx.drawImage(c, x | 0, y | 0);
    }
    return adv;
  }

  /* ---------- 줄바꿈 (어절 단위 + 금칙) ---------- */
  const NO_HEAD = new Set(['.', ',', '!', '?', '…', ')', '」', '』', '~', '”', '’', '"', '\'', ']', '」', '。', '、', ':', ';', '─']);
  function firstChar(s) { for (const ch of s) return ch; return ''; }
  function charBreak(word, maxW, fname, out) {       // 한 어절이 너무 길 때 글자 단위로
    let cur = '';
    for (const ch of word) {
      if (cur && width(cur + ch, fname) > maxW && !NO_HEAD.has(ch)) { out.push(cur); cur = ch; }
      else cur += ch;
    }
    return cur;
  }
  function wrap(str, maxW, fname) {
    fname = fname || 'body';
    str = String(str == null ? '' : str);
    const key = fname + '|' + maxW + '|' + str;
    const hit = wraps.get(key);
    if (hit) return hit;
    const out = [];
    const paras = str.split('\n');
    for (const para of paras) {
      if (!para.trim()) { out.push(''); continue; }
      const words = para.split(' ').filter(w => w.length);
      let line = '';
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        const cand = line ? line + ' ' + w : w;
        if (width(cand, fname) <= maxW) { line = cand; continue; }
        if (!line) { line = charBreak(w, maxW, fname, out); continue; }

          const sp = line.lastIndexOf(' ');

            out.push(line.slice(0, sp));
            const moved = line.slice(sp + 1) + ' ' + w;
            line = width(moved, fname) <= maxW ? moved : charBreak(moved, maxW, fname, out);
            continue;
          }
          line = cand;                                  // 내릴 수 없으면 조금 넘치게 둔다
          continue;
        }
        out.push(line);
        line = width(w, fname) <= maxW ? w : charBreak(w, maxW, fname, out);
      }
      out.push(line);
    }
    if (wraps.size > 800) wraps.delete(wraps.keys().next().value);
    wraps.set(key, out);
    return out;
  }

  /* ---------- 조사 ---------- */
  const JOSA = {   // [받침 있음, 받침 없음]
    '이/가': ['이', '가'], '가/이': ['이', '가'],
    '을/를': ['을', '를'], '를/을': ['을', '를'],
    '은/는': ['은', '는'], '는/은': ['은', '는'],
    '과/와': ['과', '와'], '와/과': ['과', '와'],
    '으로/로': ['으로', '로'], '로/으로': ['으로', '로'],
    '아/야': ['아', '야'], '야/아': ['아', '야'],
    '이나/나': ['이나', '나'], '이랑/랑': ['이랑', '랑'], '이여/여': ['이여', '여'], '이라/라': ['이라', '라'], '이다/다': ['이다', '다'], '이에요/예요': ['이에요', '예요']
  };
  const DIGIT_JONG = { '0': 1, '1': 8, '2': 0, '3': 1, '4': 0, '5': 0, '6': 1, '7': 8, '8': 8, '9': 0 };   // 영 일 이 삼 사 오 육 칠 팔 구 (8=ㄹ)
  function jong(ch) {         // 0: 받침 없음, 8: ㄹ, 그 외: 받침 있음
    if (!ch) return 0;
    const c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28;
    if (DIGIT_JONG[ch] !== undefined) return DIGIT_JONG[ch];
    const u = ch.toUpperCase();
    if (u === 'L' || u === 'R') return 8;
    if (u === 'M' || u === 'N') return 1;
    return 0;
  }
  function pick(j, pair) {
    const p = JOSA[pair];
    if (!p) { const parts = pair.split('/'); return j ? parts[0] : (parts[1] || parts[0]); }
    if (pair.indexOf('로') >= 0 && p[1] === '로') return (j === 0 || j === 8) ? '로' : '으로';
    return j ? p[0] : p[1];
  }
  function lastSyll(word) {
    const s = String(word || '').replace(/[\s'"’”」』)\]}.,!?…~]+$/, '');
    return s ? s[s.length - 1] : '';
  }
  function josa(word, pair) { return pick(jong(lastSyll(word)), pair); }
  function resolveJosa(str) {
    return String(str).replace(/\{([가-힣]+)\/([가-힣]+)\}/g, (m, a, b, idx, all) => {
      let i = idx - 1;
      for (;;) {                           // 공백·마크업 {..}은 건너뛰고 바로 앞 글자
        while (i >= 0 && /\s/.test(all[i])) i--;
        if (i >= 0 && all[i] === '}') { const o = all.lastIndexOf('{', i); if (o < 0) break; i = o - 1; continue; }
        break;
      }
      while (i >= 0 && /['"’”」』)\].,!?…~]/.test(all[i])) i--;
      const pair = a + '/' + b;
      return pick(jong(i >= 0 ? all[i] : ''), pair);
    });
  }

  function clear() { glyphs.clear(); advs.clear(); tints.clear(); lines.clear(); wraps.clear(); lastFontKey = ''; }

  MC.text = {
    LINE, FONTS,
    init() {
      if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { clear(); });
      MC.text.ready = !!(document.fonts && document.fonts.check && document.fonts.check('12px "Galmuri11"', '가'));
    },
    ready: false,
    draw, drawChar, width, wrap, josa, resolveJosa, clear,
    bake: (str, font, color, opt) => bake(String(str), font, color, opt && opt.shadow, opt && opt.outline),   // -> canvas|null
    advance: (ch, font) => advance(font || 'body', ch),
    glyph: (ch, font) => glyph(font || 'body', ch),    // {adv,w,h,bits} — 디버그·특수 연출용
    color: resolveColor
  };
})(window.MC);

</script>
<script>/* ==== src/engine/input.js ==== */
/* input.js — Pointer Events 단일 경로(논리 좌표), tap/long 판정, 에포크 lock, 키보드, 뒤로가기 가드, 진동, 플로팅 Stick */
(function (MC) { 'use strict';
  const P = new Map();          // pointerId -> {id,x0,y0,x,y,t0,ts0,travel,dead,long,type}
  const queue = [];
  const hooks = [];             // fn(ev) -> true면 소비 (디버그 등)
  const keyHooks = [];          // fn(KeyboardEvent) -> true면 소비
  const dirHeld = [];           // 눌린 방향키(마지막이 우선)
  let lockUntil = 0, firstTouch = false, okHeld = false, okT0 = 0, okLong = false, guard = false, canvas = null;

  const I = MC.input = { epoch: 1, hooks, TAP_MOVE: 6, TAP_MS: 300, LONG_MS: 450 };
  const now = () => performance.now();

  function mkEv(type, r, extra) {
    const t = now();
    const ev = { type, id: r ? r.id : -1, x: r ? r.x : -1, y: r ? r.y : -1, x0: r ? r.x0 : -1, y0: r ? r.y0 : -1,
      t, ts: r ? r.ts : t, dur: r ? t - r.t0 : 0, travel: r ? r.travel : 0, epochOk: true, epoch: I.epoch, ptype: r ? r.type : 'key' };
    if (extra) Object.assign(ev, extra);
    return ev;
  }
  function blocked() {
    return now() < lockUntil || (MC.fx && MC.fx.busy && MC.fx.busy()) || (MC.core && MC.core.isPaused && MC.core.isPaused());
  }

  /* ---------- 포인터 ---------- */
  function onDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    firstTouch = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    const [x, y] = MC.gfx.toLogical(e.clientX, e.clientY);
    const r = { id: e.pointerId, x0: x, y0: y, x, y, t0: now(), ts: e.timeStamp, travel: 0, dead: false, long: false, type: e.pointerType || 'mouse' };
    if (blocked() || (r.type === 'touch' && x < 8)) r.dead = true;   // 잠금 중·사파리 가장자리 스와이프는 무시
    P.set(e.pointerId, r);
    if (!r.dead) queue.push(mkEv('down', r));
    if (e.cancelable) e.preventDefault();
  }
  function onMove(e) {
    const r = P.get(e.pointerId);
    if (!r) return;
    const [x, y] = MC.gfx.toLogical(e.clientX, e.clientY);
    r.x = x; r.y = y;
    const d = Math.hypot(x - r.x0, y - r.y0);
    if (d > r.travel) r.travel = d;
    if (r.dead) return;
    const lastEv = queue[queue.length - 1];
    if (lastEv && lastEv.type === 'move' && lastEv.id === r.id && lastEv.epoch === I.epoch) {   // 같은 스텝 안의 move는 합침
      lastEv.x = x; lastEv.y = y; lastEv.travel = r.travel; lastEv.t = now(); lastEv.dur = lastEv.t - r.t0;
    } else queue.push(mkEv('move', r));
  }
  function onUp(e) {
    const r = P.get(e.pointerId);
    if (!r) return;
    const [x, y] = MC.gfx.toLogical(e.clientX, e.clientY);
    r.x = x; r.y = y;
    const d = Math.hypot(x - r.x0, y - r.y0);
    if (d > r.travel) r.travel = d;
    P.delete(e.pointerId);
    if (r.dead) return;
    const up = mkEv('up', r);
    queue.push(up);
    if (r.travel <= I.TAP_MOVE && up.dur <= I.TAP_MS) queue.push(mkEv('tap', r));
  }
  function onCancel(e) {
    const r = P.get(e.pointerId);
    if (!r) return;
    P.delete(e.pointerId);
    if (!r.dead) queue.push(mkEv('cancel', r));
  }

  /* ---------- 키보드 ---------- */
  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
    z: 'ok', Z: 'ok', ' ': 'ok', Enter: 'ok', x: 'back', X: 'back', Escape: 'back', Backspace: 'back'
  };
  function onKeyDown(e) {
    for (const h of keyHooks) { try { if (h(e)) { e.preventDefault(); return; } } catch (err) { MC.core.error(err, 'keyhook'); } }
    const k = KEYMAP[e.key];
    if (!k) return;
    e.preventDefault();
    firstTouch = true;
    if (k === 'ok') {
      if (e.repeat) return;
      okHeld = true; okT0 = now(); okLong = false;
      if (!blocked()) queue.push(mkEv('tap', null, { key: true }));
    } else if (k === 'back') {
      if (e.repeat) return;
      if (!blocked()) queue.push(mkEv('back', null, { key: true }));
    } else {
      const i = dirHeld.indexOf(k);
      if (i >= 0) dirHeld.splice(i, 1);
      dirHeld.push(k);
    }
  }
  function onKeyUp(e) {
    const k = KEYMAP[e.key];
    if (!k) return;
    if (k === 'ok') okHeld = false;
    else { const i = dirHeld.indexOf(k); if (i >= 0) dirHeld.splice(i, 1); }
  }

  /* ---------- 해제·잠금 ---------- */
  function releaseAll() {
    P.clear(); dirHeld.length = 0; okHeld = false; queue.length = 0;
    I.epoch++;
  }
  // 현재 눌린 포인터는 뗄 때까지 무시 + ms 동안 새 입력 무시
  I.lock = function (ms) {
    if (ms == null) ms = 150;
    I.epoch++;
    for (const r of P.values()) r.dead = true;
    lockUntil = Math.max(lockUntil, now() + ms);
  };
  I.locked = () => now() < lockUntil;

  I.init = function () {
    canvas = MC.gfx.screen;
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onCancel);
    canvas.addEventListener('lostpointercapture', onCancel);
    const pd = e => { if (e.cancelable) e.preventDefault(); };
    document.addEventListener('touchstart', pd, { passive: false });
    document.addEventListener('touchmove', pd, { passive: false });
    document.addEventListener('gesturestart', pd, { passive: false });
    document.addEventListener('dblclick', pd, { passive: false });
    document.addEventListener('contextmenu', pd);
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', releaseAll);
    window.addEventListener('pagehide', releaseAll);
    document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
    window.addEventListener('popstate', () => {
      if (!guard) return;
      queue.push(mkEv('back', null, { key: false, sys: true }));
      try { history.pushState({ mc34: 1 }, ''); } catch (_) {}
    });
  };

  // 매 스텝(core): long 판정 + 큐 배포
  I.update = function () {
    const t = now();
    for (const r of P.values()) {
      if (!r.dead && !r.long && r.travel <= I.TAP_MOVE && t - r.t0 >= I.LONG_MS) { r.long = true; queue.push(mkEv('long', r)); }
    }
    if (okHeld && !okLong && t - okT0 >= I.LONG_MS) { okLong = true; queue.push(mkEv('long', null, { key: true })); }
    const n = queue.length;
    if (!n) return;
    const batch = queue.splice(0, n);
    for (let i = 0; i < batch.length; i++) {
      const ev = batch[i];
      if (ev.epoch !== I.epoch) continue;      // lock 이후 옛 포인터의 이벤트는 버림
      dispatch(ev);
    }
  };
  function dispatch(ev) {
    for (let i = 0; i < hooks.length; i++) {
      try { if (hooks[i](ev)) return; } catch (e) { MC.core.error(e, 'input.hook'); }
    }
    try {
      if (ev.type === 'back') MC.scene.back(ev);
      else MC.scene.input(ev);
    } catch (e) { MC.core.error(e, 'input'); }
  }
  I.inject = function (ev) { ev.epoch = I.epoch; ev.epochOk = true; queue.push(ev); };   // 테스트용

  I.keyDir = () => (dirHeld.length ? dirHeld[dirHeld.length - 1] : null);
  I.onKey = fn => { keyHooks.push(fn); };
  I.isDown = () => { if (okHeld) return true; for (const r of P.values()) if (!r.dead) return true; return false; };
  I.heldMs = () => {           // 살아 있는 누름 중 가장 오래된 것의 지속 시간(대사 빨리감기용)
    const t = now(); let m = okHeld ? t - okT0 : 0;
    for (const r of P.values()) if (!r.dead && r.travel <= 12 && t - r.t0 > m) m = t - r.t0;
    return m;
  };
  I.pointerCount = () => P.size;
  I.firstTouch = () => firstTouch;

  // 뒤로가기 가드: 타이틀 이후 켬, 타이틀에서 끔
  I.guardBack = function (on) {
    if (on && !guard) { guard = true; try { history.pushState({ mc34: 1 }, ''); } catch (_) {} }
    else if (!on && guard) { guard = false; try { if (history.state && history.state.mc34) history.back(); } catch (_) {} }
  };

  I.vibrate = function (p) {
    if (!firstTouch || !navigator.vibrate) return false;
    // 브라우저가 아직 '사용자 활성화'를 못 받았으면 부르지 않는다(합성 입력·키보드만 쓴 경우 콘솔 'Blocked call' 오류 방지)
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return false;
    const s = MC.save && MC.save.settings;
    if (s && s.vibrate === false) return false;
    try { return navigator.vibrate(p); } catch (_) { return false; }
  };

  /* ---------- 플로팅 스틱 ---------- */
  const DIRS = { right: 0, down: 90, left: 180, up: 270 };
  const KVEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const stickArt = new Map();
  function artFor(rest, knob) {
    const key = rest + '|' + knob;
    let a = stickArt.get(key);
    if (a) return a;
    const G = MC.gfx, ctxSave = G.ctx;
    const R = rest + 2, sz = R * 2 + 1;
    const ring = G.makeCanvas(sz, sz), kr = 8, kn = G.makeCanvas(kr * 2 + 3, kr * 2 + 3);
    const arrows = {};
    try {
      G.ctx = ring.getContext('2d');
      G.circle(R, R, rest - 1, 'rgba(8,10,20,0.28)');
      G.ring(R, R, rest + 1, '#05060c');
      G.ring(R, R, rest, '#f0ece0');
      G.ring(R, R, rest - 1, '#05060c');
      for (const d of ['up', 'down', 'left', 'right']) {      // 방향 눈금(흐림)
        const v = KVEC[d], cx = R + v[0] * (rest - 4), cy = R + v[1] * (rest - 4);
        G.rect(cx - 1, cy - 1, 3, 3, '#05060c'); G.px(cx, cy, '#9a98a8');
      }
      G.ctx = kn.getContext('2d');
      G.circle(kr + 1, kr + 1, kr, '#05060c');
      G.circle(kr + 1, kr + 1, kr - 1, '#d8d2c2');
      G.circle(kr, kr, kr - 3, '#f4efe0');
      G.px(kr - 2, kr - 3, '#ffffff'); G.px(kr - 3, kr - 2, '#ffffff');
      for (const d of ['up', 'down', 'left', 'right']) {      // 현재 방향 화살(금색)
        const c = G.makeCanvas(9, 9); G.ctx = c.getContext('2d');
        const rows = { up: ['....o....', '...ooo...', '..ooooo..', '.ooooooo.'], down: null, left: null, right: null };
        for (let j = 0; j < 4; j++) for (let i = 0; i < 9; i++) {
          if (rows.up[j][i] !== 'o') continue;
          let px = i, py = j + 2;
          if (d === 'down') py = 8 - py;
          if (d === 'left') { const t = px; px = py; py = t; }
          if (d === 'right') { const t = px; px = 8 - py; py = t; }
          G.px(px, py, '#ffcf4a');
        }
        arrows[d] = c;
      }
    } finally { G.ctx = ctxSave; }
    a = { ring, kn, R, kr, arrows };
    stickArt.set(key, a);
    return a;
  }

  class Stick {
    // o: {rest:22, knob:18, dead:5, drag:26, hyst:12, zone:(x,y)=>bool 추가 제외 영역, tapMs:220, tapMove:5}
    constructor(o) {
      o = o || {};
      this.rest = o.rest || 22; this.knob = o.knob || 18; this.dead = o.dead != null ? o.dead : 5;
      this.drag = o.drag || 26; this.hyst = o.hyst != null ? o.hyst : 12; this.zone = o.zone || null;
      this.tapMs = o.tapMs || 220; this.tapMove = o.tapMove || 5;
      this.tapped = false; this._tap = null; this._lastPid = null;
      this._vec = [0, 0]; this._kv = [0, 0];
      this._clear();
    }
    _clear() {
      this.pid = null; this.ep = -1; this.ox = 0; this.oy = 0; this.sx = 0; this.sy = 0; this.kx = 0; this.ky = 0;
      this._dir = null; this._vec[0] = 0; this._vec[1] = 0; this._mag = 0; this.t0 = 0; this.travel = 0; this.everDir = false;
    }
    reset() { this._clear(); this.tapped = false; this._tap = null; }
    _check() { if (this.pid !== null && this.ep !== I.epoch) this._clear(); }
    get touching() { this._check(); return this.pid !== null; }
    get active() { this._check(); return this.pid !== null || !!I.keyDir(); }
    get dir() { this._check(); return this.pid !== null ? this._dir : I.keyDir(); }
    get vec() {
      this._check();
      if (this.pid !== null) return this._vec;
      const k = I.keyDir(); if (!k) { this._kv[0] = 0; this._kv[1] = 0; return this._kv; }
      this._kv[0] = KVEC[k][0]; this._kv[1] = KVEC[k][1]; return this._kv;
    }
    get mag() { this._check(); return this.pid !== null ? this._mag : (I.keyDir() ? 1 : 0); }
    canStart(x, y) {
      const G = MC.gfx;
      if (y < 14 + G.safe.top) return false;
      if (x < 8 + G.safe.left || x > G.W - 8 - G.safe.right) return false;
      if (this.zone && !this.zone(x, y)) return false;
      return true;
    }
    onInput(ev) {
      this._check();
      switch (ev.type) {
        case 'down':
          if (this.pid !== null || !this.canStart(ev.x, ev.y)) return false;
          this.pid = ev.id; this.ep = I.epoch; this.ox = this.sx = ev.x; this.oy = this.sy = ev.y;
          this.kx = this.ky = 0; this.t0 = now(); this.travel = 0; this.everDir = false; this._dir = null; this._mag = 0;
          return true;
        case 'move':
          if (ev.id !== this.pid) return false;
          this._move(ev.x, ev.y);
          return true;
        case 'up': {
          if (ev.id !== this.pid) return false;
          this._move(ev.x, ev.y);
          const dur = now() - this.t0;
          if (!this.everDir && dur <= this.tapMs && this.travel <= this.tapMove) { this.tapped = true; this._tap = { x: this.sx, y: this.sy }; }
          this._lastPid = ev.id;
          this._clear();
          return true;
        }
        case 'cancel':
          if (ev.id !== this.pid) return false;
          this._clear(); return true;
        case 'tap':
          return !ev.key && ev.id === this._lastPid && this.pid === null && !!this._tap;
        case 'long':
          return ev.id === this.pid;
      }
      return false;
    }
    _move(x, y) {
      const t = Math.hypot(x - this.sx, y - this.sy);
      if (t > this.travel) this.travel = t;
      let dx = x - this.ox, dy = y - this.oy, d = Math.hypot(dx, dy);
      if (d > this.drag) {                                   // 원점 끌기
        const k = (d - this.drag) / d;
        this.ox += dx * k; this.oy += dy * k;
        dx = x - this.ox; dy = y - this.oy; d = this.drag;
      }
      const kd = Math.min(d, this.knob);
      this.kx = d > 0 ? dx / d * kd : 0; this.ky = d > 0 ? dy / d * kd : 0;
      if (d < (this._dir ? this.dead : this.dead + 2)) { this._dir = null; this._mag = 0; this._vec[0] = 0; this._vec[1] = 0; return; }   // 새로 정할 땐 2px 더(대각 출발 오판 방지)
      this._vec[0] = dx / d; this._vec[1] = dy / d;
      this._mag = MC.clamp((d - this.dead) / Math.max(1, this.knob - this.dead), 0, 1);
      const ang = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
      let nd = ang >= 315 || ang < 45 ? 'right' : ang < 135 ? 'down' : ang < 225 ? 'left' : 'up';
      if (this._dir && nd !== this._dir) {                   // ±hyst° 히스테리시스
        const diff = Math.abs(((ang - DIRS[this._dir] + 540) % 360) - 180);
        if (diff <= 45 + this.hyst) nd = this._dir;
      }
      this._dir = nd; this.everDir = true;
    }
    consumeTap() { if (!this.tapped) return null; const t = this._tap; this.tapped = false; this._tap = null; return t; }
    // 월드 위, UI 아래에서 호출. 누르고 있을 때만 그린다
    render(alpha) {
      this._check();
      if (this.pid === null) return;
      const a = artFor(this.rest, this.knob), ctx = MC.gfx.ctx;
      const ox = Math.round(this.ox), oy = Math.round(this.oy);
      ctx.globalAlpha = alpha != null ? alpha : 0.75;
      ctx.drawImage(a.ring, ox - a.R, oy - a.R);
      if (this._dir) {
        const v = KVEC[this._dir];
        ctx.drawImage(a.arrows[this._dir], ox + v[0] * (this.rest + 6) - 4, oy + v[1] * (this.rest + 6) - 4);
      }
      ctx.globalAlpha = Math.min(1, (alpha != null ? alpha : 0.75) + 0.15);
      ctx.drawImage(a.kn, Math.round(ox + this.kx) - a.kr - 1, Math.round(oy + this.ky) - a.kr - 1);
      ctx.globalAlpha = 1;
    }
  }
  I.Stick = Stick;
})(window.MC);

</script>
<script>/* ==== src/engine/scene.js ==== */
/* scene.js — 씬 스택: push(→Promise 결과)/pop/replace, blocking update, 첫 opaque부터 render, 입력은 맨 위에만 */
(function (MC) { 'use strict';
  // 씬: { name, opaque:true, blocking:true, enter(){}, exit(){}, pause(){}, resume(){}, update(dt){}, render(){}, onInput(ev){return consumed}, onBack(){} }
  const stack = [];
  const tmp = [];
  function call(sc, fn, arg) {
    if (!sc || typeof sc[fn] !== 'function') return;
    try { sc[fn](arg); } catch (e) { MC.core.error(e, 'scene.' + (sc.name || '?') + '.' + fn); }
  }
  function lock() { if (MC.input && MC.input.lock) MC.input.lock(); }

  const S = MC.scene = {
    stack,
    push(sc) {
      return new Promise(res => {
        if (sc.opaque === undefined) sc.opaque = true;
        if (sc.blocking === undefined) sc.blocking = true;
        sc._res = res;
        const prev = stack[stack.length - 1];
        stack.push(sc);
        lock();
        if (prev) call(prev, 'pause');
        call(sc, 'enter');
      });
    },
    pop(result) {
      const sc = stack.pop();
      if (!sc) return;
      finish(sc, result);
    },
    remove(sc, result) {                 // 맨 위가 아니어도 그 씬을 뺀다
      const i = stack.indexOf(sc);
      if (i < 0) return false;
      const wasTop = i === stack.length - 1;
      stack.splice(i, 1);
      finish(sc, result, wasTop);
      return true;
    },
    replace(sc) {
      const old = stack.pop();
      if (old) { call(old, 'exit'); const r = old._res; old._res = null; if (r) r(undefined); }
      return S.push(sc);
    },
    clear() { while (stack.length) S.pop(); },
    top() { return stack[stack.length - 1] || null; },
    find(name) { for (let i = stack.length - 1; i >= 0; i--) if (stack[i].name === name) return stack[i]; return null; },
    has(sc) { return stack.indexOf(sc) >= 0; },

    update(dt) {
      tmp.length = 0;
      for (let i = stack.length - 1; i >= 0; i--) { tmp.push(stack[i]); if (stack[i].blocking !== false) break; }
      for (let i = 0; i < tmp.length; i++) {
        const sc = tmp[i];
        if (stack.indexOf(sc) < 0 || typeof sc.update !== 'function') continue;
        sc.update(dt);
      }
      tmp.length = 0;
    },

    render() {
      const n = stack.length;
      if (!n) { MC.gfx.clear('#05060c'); return; }
      let from = n - 1;
      while (from > 0 && stack[from].opaque === false) from--;
      const fz = MC.fx && MC.fx._freeze;
      if (fz && fz.on) {
        const depth = Math.min(fz.depth, n);
        if (fz.pending) {                               // 정지 순간: 그대로 그리고 depth까지를 찍어 둔다
          for (let i = from; i < depth; i++) renderOne(stack[i]);
          MC.fx._captureFreeze();
          for (let i = Math.max(from, depth); i < n; i++) renderOne(stack[i]);
          return;
        }
        if (from < depth) { MC.fx._drawFreeze(); from = depth; }
        for (let i = from; i < n; i++) renderOne(stack[i]);
        return;
      }
      for (let i = from; i < n; i++) renderOne(stack[i]);
    },

    input(ev) {
      const sc = stack[stack.length - 1];
      if (sc && typeof sc.onInput === 'function') return !!sc.onInput(ev);
      return false;
    },
    back(ev) {
      const sc = stack[stack.length - 1];
      if (sc && typeof sc.onBack === 'function') sc.onBack(ev);
    }
  };

  function renderOne(sc) {
    if (typeof sc.render !== 'function') return;
    MC.gfx._beginFrame();
    sc.render();
    MC.gfx._beginFrame();
  }

  function finish(sc, result, wasTop) {
    lock();
    call(sc, 'exit');
    const r = sc._res; sc._res = null;
    if (wasTop !== false) call(stack[stack.length - 1], 'resume');
    if (r) r(result);
  }
})(window.MC);

</script>
<script>/* ==== src/engine/ui.js ==== */
/* ui.js — 보존형 위젯: Button(떼는 순간 발동·180ms 준비·minTouch 판정·hold 원형 진행), List(페이지), Confirm(모달), toast, nextMark */
(function (MC) { 'use strict';
  const G = () => MC.gfx;
  function sfx(id) { try { if (MC.sfx && MC.sfx.play) MC.sfx.play(id); } catch (_) {} }

  // 44 CSS px를 논리 px로 (아이폰 dpr3·S6 → 22, SE dpr2·S3 → 30)
  function minTouch() { const g = G(); return Math.ceil(44 * g.dpr / g.S); }

  // 원형 진행 표시용 점(각도순) 캐시
  const arcCache = new Map();
  function arcPts(r) {
    let a = arcCache.get(r);
    if (a) return a;
    const pts = [], seen = new Set(), n = Math.max(24, r * 10);
    for (let i = 0; i < n; i++) {
      const t = i / n * Math.PI * 2 - Math.PI / 2;
      const x = Math.round(Math.cos(t) * r), y = Math.round(Math.sin(t) * r), k = x + ',' + y;
      if (seen.has(k)) continue; seen.add(k); pts.push(x, y);
    }
    arcCache.set(r, pts);
    return pts;
  }
  function drawArc(cx, cy, r, p, col, back) {
    const pts = arcPts(r), n = pts.length / 2, m = Math.floor(n * MC.clamp(p, 0, 1));
    const g = G();
    if (back) for (let i = 0; i < n; i++) g.px(cx + pts[i * 2], cy + pts[i * 2 + 1], back);
    for (let i = 0; i < m; i++) g.px(cx + pts[i * 2], cy + pts[i * 2 + 1], col);
  }

  /* ---------- Button ---------- */
  class Button {
    // {x,y,w,h,label,font:'body',onTap, enabled:true, style:'normal'|'primary'|'danger'|'ghost', icon:null, hold:0, small:auto, sfx:'ui_ok', pal:null, visible:true}
    constructor(o) {
      Object.assign(this, { x: 0, y: 0, w: 56, h: 24, label: '', font: 'body', onTap: null, enabled: true, style: 'normal', icon: null, hold: 0, small: null, sfx: 'ui_ok', pal: null, visible: true, color: null, onDisabled: null }, o || {});
      this._pid = null; this._inside = false; this._t0 = 0; this._fired = false; this._lastPid = null;
      this._ready = MC.time.real + 180; this._lastR = -99;
    }
    arm(ms) { this._ready = MC.time.real + (ms == null ? 180 : ms); }
    hitRect(slack) {
      const mt = minTouch();
      let x = this.x, y = this.y, w = this.w, h = this.h;
      if (w < mt) { x -= (mt - w) / 2; w = mt; }
      if (h < mt) { y -= (mt - h) / 2; h = mt; }

      return [x - slack, y - slack, w + slack * 2, h + slack * 2];
    }
    hit(x, y, slack) { const r = this.hitRect(slack); return x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3]; }
    get pressed() { return this._pid !== null && this._inside; }
    _shown() { return G().renderId - this._lastR <= 1; }
    onInput(ev) {
      if (!this.visible) return false;
      switch (ev.type) {
        case 'down': {
          if (this._pid !== null || !this._shown() || !this.hit(ev.x, ev.y, 0)) return false;
          if (MC.time.real < this._ready) return true;          // 막 나타난 버튼: 삼킨다
          this._pid = ev.id; this._inside = true; this._t0 = MC.time.real; this._fired = false;
          if (this.enabled) sfx('ui_cursor');
          return true;
        }
        case 'move':
          if (ev.id !== this._pid) return false;
          this._inside = this.hit(ev.x, ev.y, 4);
          return true;
        case 'up': {
          if (ev.id !== this._pid) return false;
          this._pid = null; this._lastPid = ev.id;
          if (this._fired) return true;
          if (this.hit(ev.x, ev.y, 4)) {
            if (this.hold > 0 && this.enabled) { /* 다 누르지 않고 뗐다 */ }
            else this._activate();
          }
          return true;
        }
        case 'cancel':
          if (ev.id !== this._pid) return false;
          this._pid = null; return true;
        case 'tap': case 'long':
          if (ev.key) return false;
          return ev.id === this._pid || (ev.id === this._lastPid && this.hit(ev.x, ev.y, 4));
      }
      return false;
    }
    _activate() {
      if (!this.enabled) { sfx('ui_ng'); if (this.onDisabled) this.onDisabled(this); return; }
      if (this.sfx) sfx(this.sfx);
      MC.input.vibrate(8);
      if (this.onTap) { try { const r = this.onTap(this); if (r && r.catch) r.catch(e => MC.core.error(e, 'button')); } catch (e) { MC.core.error(e, 'button'); } }
    }
    update() {
      if (this.hold > 0 && this._pid !== null && this._inside && !this._fired && this.enabled && MC.time.real - this._t0 >= this.hold) {
        this._fired = true; this._activate();
      }
      if (this.hold > 0 && this._pid !== null && !this._inside) this._t0 = MC.time.real;   // 벗어나면 진행 초기화
    }
    render() {
      if (!this.visible) return;
      const g = G(), rid = g.renderId;
      if (rid - this._lastR > 1) this.arm(180);                 // 다시 나타남 → 준비 시간
      this._lastR = rid;
      if (this.hold > 0 && this._pid !== null) {                // hold 진행은 렌더 시점에도 확인(update 안 불러도 동작)
        if (this._inside && !this._fired && this.enabled && MC.time.real - this._t0 >= this.hold) { this._fired = true; Promise.resolve().then(() => this._activate()); }
        if (!this._inside) this._t0 = MC.time.real;
      }
      const P = this.pal ? g.pal(this.pal) : g.uiPal;
      const down = this.pressed && !this._fired;
      const x = this.x | 0, y = (this.y | 0) + (down ? 1 : 0), w = this.w | 0, h = this.h | 0;
      const small = this.small != null ? this.small : h < 26;
      let txt = this.color || P.text, over = null;
      if (this.style === 'primary') { over = { D: g.mix(P.gold, P.f, 0.45) }; txt = this.color || P.gold; }
      else if (this.style === 'danger') { over = { f: '#2a0a10', D: '#7a2a30', W: g.mix(P.W, '#e05a4a', 0.55) }; txt = this.color || '#ff9a8a'; }
      if (!this.enabled) { over = Object.assign({}, over || {}, { W: g.mix(P.W, P.f, 0.55), D: g.mix(P.D, P.f, 0.5) }); txt = P.dim; }
      if (down) over = Object.assign({}, over || {}, { f: g.mix((over && over.f) || P.f, P.W, 0.22) });
      if (this.style === 'ghost') {
        if (down) g.rect(x, y, w, h, g.mix(P.f, P.W, 0.18));
      } else g.frame(x, y, w, h, { small, pal: this.pal || undefined, over });
      const lh = MC.text.LINE[this.font] || 16;
      let tx = x + (w >> 1);
      const ty = y + ((h - lh) >> 1) + (this.font === 'small' ? 1 : 1);
      if (this.icon) {
        const sz = g.spriteSize(this.icon);
        if (this.label) {
          const tw = sz.w + 3 + MC.text.width(this.label, this.font);
          const ix = x + ((w - tw) >> 1);
          g.sprite(this.icon, ix, y + ((h - sz.h) >> 1), this.enabled ? null : { alpha: 0.5 });
          tx = ix + sz.w + 3 + (MC.text.width(this.label, this.font) >> 1);
        } else g.sprite(this.icon, x + ((w - sz.w) >> 1), y + ((h - sz.h) >> 1), this.enabled ? null : { alpha: 0.5 });
      }
      if (this.label) MC.text.draw(this.label, tx, ty, { font: this.font, color: txt, align: 'center' });
      if (this.hold > 0 && this._pid !== null && this._inside && !this._fired) {
        const p = (MC.time.real - this._t0) / this.hold, r = Math.min(7, (h >> 1) - 3);
        drawArc(x + w - r - 5, y + (h >> 1), r, p, P.gold, g.mix(P.D, P.f, 0.3));
      }
      if (MC.dbg && MC.dbg.showHits) { const r = this.hitRect(0); g.rectO(r[0], r[1], r[2], r[3], '#ff00ff'); }
    }
  }

  /* ---------- List ---------- */
  class List {
    // {x,y,w,rowH:26,items:[{label,right?,enabled,onTap,desc?,color?}], cols:1|2, rows:N, font:'body', onTap:(item,i)=>{}, pal}
    constructor(o) {
      Object.assign(this, { x: 0, y: 0, w: 176, rowH: 26, items: [], cols: 1, rows: 4, font: 'body', onTap: null, pal: null, page: 0, visible: true }, o || {});
      if (o && o.rows == null) this.rows = Math.max(1, Math.ceil(this.items.length / this.cols));
      this._pid = null; this._cell = -1; this._inside = false; this._lastPid = null;
      this._ready = MC.time.real + 180; this._lastR = -99;
      this.focus = -1;                          // 마지막으로 누른 항목 번호(설명 표시용)
    }
    get per() { return this.rows * this.cols; }
    get pages() { return Math.max(1, Math.ceil(this.items.length / this.per)); }
    get paged() { return this.items.length > this.per; }
    get h() { return this.rows * this.rowH + 8 + (this.paged ? 16 : 0); }
    setItems(items) { this.items = items || []; this.page = Math.min(this.page, this.pages - 1); }
    cellRect(slot) {
      const cw = Math.floor((this.w - 8) / this.cols), c = slot % this.cols, r = Math.floor(slot / this.cols);
      return [this.x + 4 + c * cw, this.y + 4 + r * this.rowH, cw, this.rowH];
    }
    _slotAt(x, y) {
      for (let s = 0; s < this.per; s++) {
        const i = this.page * this.per + s; if (i >= this.items.length) break;
        const r = this.cellRect(s);
        if (x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3]) return s;
      }
      return -1;
    }
    _pagerHit(x, y) {
      if (!this.paged) return 0;
      const mt = minTouch(), fy = this.y + this.h - 18, cy = fy + 8;
      if (y < cy - mt / 2 || y > cy + mt / 2) return 0;
      if (x >= this.x && x < this.x + this.w * 0.4) return -1;
      if (x >= this.x + this.w * 0.6 && x < this.x + this.w) return 1;
      return 0;
    }
    onInput(ev) {
      if (!this.visible) return false;
      const shown = G().renderId - this._lastR <= 1;
      switch (ev.type) {
        case 'down': {
          if (this._pid !== null || !shown) return false;
          const inBox = ev.x >= this.x && ev.x < this.x + this.w && ev.y >= this.y - 4 && ev.y < this.y + this.h + 8;
          const pg = this._pagerHit(ev.x, ev.y);
          const s = this._slotAt(ev.x, ev.y);
          if (!inBox && !pg) return false;
          if (MC.time.real < this._ready) return true;
          this._pid = ev.id; this._inside = true;
          this._cell = pg ? 100 + pg : s;
          if (s >= 0) { this.focus = this.page * this.per + s; sfx('ui_cursor'); }
          return true;
        }
        case 'move':
          if (ev.id !== this._pid) return false;
          if (this._cell >= 100) this._inside = this._pagerHit(ev.x, ev.y) === this._cell - 100;
          else if (this._cell >= 0) { const r = this.cellRect(this._cell); this._inside = ev.x >= r[0] - 4 && ev.x < r[0] + r[2] + 4 && ev.y >= r[1] - 4 && ev.y < r[1] + r[3] + 4; }
          return true;
        case 'up': {
          if (ev.id !== this._pid) return false;
          this._pid = null; this._lastPid = ev.id;
          const cell = this._cell; this._cell = -1;
          if (!this._inside) return true;
          if (cell >= 100) { const d = cell - 100; const np = MC.clamp(this.page + d, 0, this.pages - 1); if (np !== this.page) { this.page = np; sfx('page'); } else sfx('ui_ng'); return true; }
          if (cell >= 0) {
            const i = this.page * this.per + cell, it = this.items[i];
            if (!it) return true;
            if (it.enabled === false) { sfx('ui_ng'); if (it.onDisabled) it.onDisabled(it, i); return true; }
            sfx(it.sfx || 'ui_ok');
            try { if (it.onTap) it.onTap(it, i); else if (this.onTap) this.onTap(it, i); } catch (e) { MC.core.error(e, 'list'); }
          }
          return true;
        }
        case 'cancel': if (ev.id !== this._pid) return false; this._pid = null; this._cell = -1; return true;
        case 'tap': case 'long': if (ev.key) return false; return ev.id === this._pid || ev.id === this._lastPid && ev.x >= this.x && ev.x < this.x + this.w && ev.y >= this.y - 4 && ev.y < this.y + this.h + 8;
      }
      return false;
    }
    render() {
      if (!this.visible) return;
      const g = G(), rid = g.renderId;
      if (rid - this._lastR > 1) this._ready = MC.time.real + 180;
      this._lastR = rid;
      const P = this.pal ? g.pal(this.pal) : g.uiPal;
      g.frame(this.x, this.y, this.w, this.h, { pal: this.pal || undefined, small: this.rowH * this.rows < 40 });
      const lh = MC.text.LINE[this.font] || 16;
      for (let s = 0; s < this.per; s++) {
        const i = this.page * this.per + s, it = this.items[i];
        if (!it) break;
        const [cx, cy, cw, ch] = this.cellRect(s);
        const down = this._pid !== null && this._inside && this._cell === s;
        if (down) g.rect(cx, cy + 1, cw, ch - 2, P.W);
        else if (it.sel) g.rect(cx, cy + 1, cw, ch - 2, g.mix(P.f, P.W, 0.16));
        const col = down ? P.f : (it.enabled === false ? P.dim : (it.color ? MC.text.color(it.color) : P.text));
        const ty = cy + ((ch - lh) >> 1) + 1;
        let lx = cx + 5;
        if (it.icon) { const sz = g.spriteSize(it.icon); g.sprite(it.icon, lx, cy + ((ch - sz.h) >> 1)); lx += sz.w + 3; }
        MC.text.draw(it.label, lx, ty, { font: this.font, color: col });
        if (it.right != null && it.right !== '') MC.text.draw(it.right, cx + cw - 5, ty, { font: this.font, color: down ? P.f : (it.enabled === false ? P.dim : P.dim), align: 'right' });
        if (s < this.per - 1 && this.cols === 1 && this.items[i + 1] && !down) g.hline(cx + 3, cy + ch - 1, cw - 6, g.mix(P.f, P.D, 0.6));

        const fy = this.y + this.h - 18;
        g.hline(this.x + 4, fy, this.w - 8, g.mix(P.f, P.D, 0.8));
        const pdown = this._pid !== null && this._inside && this._cell >= 100 ? this._cell - 100 : 0;
        const cy = fy + 2;

        MC.text.draw('▲', this.x + 14, cy + (pdown === -1 ? 1 : 0), { font: 'small', color: prevOn ? P.gold : P.dim });
        MC.text.draw('▼', this.x + this.w - 24, cy + (pdown === 1 ? 1 : 0), { font: 'small', color: nextOn ? P.gold : P.dim });

    }
  }

  /* ---------- Confirm (모달) ---------- */
  // new MC.ui.Confirm({text, yes:'지운다', no:'그만둔다', danger:true, holdYes:1000}) -> Promise<bool>
  function Confirm(o) {
    o = o || {};
    const g = G();
    const W = 168, lines = MC.text.wrap(o.text || '', W - 20, 'body');
    const bh = Math.max(30, Math.min(36, minTouch() + 4)), h = 12 + lines.length * 16 + 10 + bh + 10 + (o.holdYes ? 11 : 0);
    const sc = { name: 'confirm', opaque: false, blocking: true, t: 0, done: false };
    const lay = () => { const x = g.X0 + ((180 - W) >> 1), y = Math.max(20, ((g.H - h) >> 1) - 10); return [x, y]; };
    const bw = 72;
    const no = new Button({ w: bw, h: bh, label: o.no || '그만둔다', style: 'primary', sfx: 'ui_cancel', onTap: () => finish(false) });

    sc.update = () => { no.update(); yes.update(); };
    sc.onInput = ev => {

    };

    sc.enter = () => { sc.t0 = MC.time.real; };

      const ctx = g.ctx;
      const p = MC.clamp((MC.time.real - (sc.t0 || 0)) / 140, 0, 1);

      const [x, y0] = lay(), y = y0 + Math.round((1 - MC.ease.outCubic(p)) * 8);
      g.frame(x, y, W, h, { pal: o.pal || (o.danger ? undefined : undefined) });
      for (let i = 0; i < lines.length; i++) MC.text.draw(lines[i], x + (W >> 1), y + 12 + i * 16, { align: 'center' });
      const by = y + h - bh - 9 - (o.holdYes ? 11 : 0);
      no.x = x + 8; no.y = by; yes.x = x + W - 8 - bw; yes.y = by;
      no.render(); yes.render();
      if (o.holdYes) MC.text.draw(yes.pressed ? '계속 누르세요' : '길게 누르기', yes.x + (bw >> 1), by + bh + 2, { font: 'small', color: yes.pressed ? 'gold' : 'dim', align: 'center' });
    };
    return MC.scene.push(sc);
  }

  /* ---------- 다음 표시(닻) ---------- */
  let anchor = null;
  function anchorCanvas() {
    if (anchor) return anchor;
    const rows = ['..o..', '.oOo.', '..o..', '..o..', 'o.o.o', '.ooo.'];
    anchor = G().makeCanvas(6, 7);
    const x = anchor.getContext('2d');
    for (let j = 0; j < rows.length; j++) for (let i = 0; i < 5; i++) {
      const c = rows[j][i]; if (c === '.') continue;
      x.fillStyle = '#000'; x.fillRect(i + 1, j + 1, 1, 1);
    }
    for (let j = 0; j < rows.length; j++) for (let i = 0; i < 5; i++) {
      const c = rows[j][i]; if (c === '.') continue;
      x.fillStyle = c === 'O' ? '#fff6d0' : '#ffcf4a'; x.fillRect(i, j, 1, 1);
    }
    return anchor;
  }
  function nextMark(x, y) {
    const bob = ((MC.time.real / 400) | 0) & 1;
    const g = G();
    if (g.hasSprite('ic_next')) g.sprite('ic_next', x, y - bob);
    else g.ctx.drawImage(anchorCanvas(), x | 0, (y | 0) - bob);
  }

  MC.ui = {
    Button, List, Confirm,
    confirm: o => Confirm(o),
    minTouch,
    window: (x, y, w, h, opt) => G().frame(x, y, w, h, opt),
    toast: (text, ms) => MC.fx.toast(text, ms == null ? 2000 : ms),
    nextMark,
    drawArc                                     // (cx,cy,r,progress0..1,color,backColor?) 원형 진행
  };
})(window.MC);

</script>
<script>/* ==== src/engine/fx.js ==== */
/* fx.js — 흔들림(trauma)·플래시·히트스톱·채도 그레이드·디더 비네트·레터박스·디더 페이드·전환(fade/white/dream/wake/cut/ink)·정지·입자·떠오르는 글자·토스트 */
(function (MC) { 'use strict';
  const G = () => MC.gfx;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const settingsShake = () => { const s = MC.save && MC.save.settings; return s && s.shake != null ? s.shake : 1; };

  const F = MC.fx = { intensity: 1, shakeMax: 4, satSupported: true, colorSupported: true };

  /* ---------- 흔들림 ---------- */
  let trauma = 0, sx = 0, sy = 0;
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  F.shake = function (p) { trauma = Math.min(1, trauma + (p == null ? 0.3 : p)); };
  F.shakeOffset = function () { return [sx, sy]; };
  F.trauma = () => trauma;

  /* ---------- 플래시 ---------- */
  const flashS = { color: '#fff', a: 0, a0: 0, ms: 0, t: 0 };
  F.flash = function (color, alpha, ms) {
    let a = alpha == null ? 0.6 : alpha;
    a = Math.min(0.6, a) * (0.45 + 0.55 * F.intensity);          // D-12: 플래시는 0.6 이하
    flashS.color = color || '#fff'; flashS.a0 = a; flashS.a = a; flashS.ms = ms == null ? 120 : Math.max(16, ms); flashS.t = 0;
  };
  F.hitstop = ms => MC.core.hitstop(ms);

  /* ---------- 그레이드 ---------- */
  const grade = { sat: 1, ta: 0, tint: null };
  F.grade = function (o, ms) {
    o = o || {};
    const to = {};
    if (o.sat != null) to.sat = MC.clamp(o.sat, 0, 1);
    if (o.tint !== undefined) {
      if (o.tint && o.tint !== grade.tint) { if (grade.tint && grade.ta > 0) { /* 색이 바뀌면 새 색으로 즉시 전환 */ } grade.tint = o.tint; }
      if (!o.tint) to.ta = 0;
    }
    if (o.ta != null) to.ta = MC.clamp(o.ta, 0, 1);
    return MC.tween(grade, to, ms || 0, 'outCubic', { real: true });
  };
  F.gradeState = () => ({ sat: grade.sat, tint: grade.tint, ta: grade.ta });

  /* ---------- 비네트 (미리 구운 디더) ---------- */
  const vig = { a: 0 };
  const vigCache = new Map();
  let vigPulse = { a: 0, color: '#e05a4a' };
  function vigCanvas(level, color) {
    const W = G().W, H = G().H, key = W + 'x' + H + '|' + level + '|' + color;
    let c = vigCache.get(key);
    if (c) return c;
    c = G().makeCanvas(W, H);
    const x = c.getContext('2d'), id = x.createImageData(W, H), d = id.data, col = G().rgb(color);
    const a = level / 16, inner = 1.02 - a * 0.78, band = 0.32 + a * 0.1;
    const cx = (W - 1) / 2, cy = (H - 1) / 2;
    // 둥근 사각형 거리(세로 화면에서 좌우가 타원처럼 크게 먹히지 않게): 네 변에서 같은 두께, 모서리만 둥글게
    const m = Math.min(W, H) / 2, sx = W / 2 - m, sy = H / 2 - m;
    for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
      const qx = Math.abs(xx - cx) - sx, qy = Math.abs(y - cy) - sy;
      const ox = qx > 0 ? qx : 0, oy = qy > 0 ? qy : 0;
      const dist = (Math.sqrt(ox * ox + oy * oy) + Math.min(Math.max(qx, qy), 0)) / m;
      const t = (dist - inner) / band;
      if (t <= 0) continue;
      const lv = t >= 1 ? 16 : Math.floor(t * 17);
      if (BAYER[(y & 3) * 4 + (xx & 3)] < lv) { const o = (y * W + xx) * 4; d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255; }
    }
    x.putImageData(id, 0, 0);
    if (vigCache.size > 40) vigCache.delete(vigCache.keys().next().value);
    vigCache.set(key, c);
    return c;
  }
  F.vignette = function (a, ms) { return MC.tween(vig, { a: MC.clamp(a || 0, 0, 1) }, ms || 0, 'outQuad', { real: true }); };
  // 짧은 색 비네트(피격 붉은 테 등): pulseVignette('#e05a4a', 0.45, 250)
  F.pulseVignette = function (color, a, ms) {
    vigPulse.color = color || '#e05a4a'; vigPulse.a = a == null ? 0.45 : a;
    return MC.tween(vigPulse, { a: 0 }, ms || 250, 'outQuad', { real: true });
  };

  /* ---------- 레터박스 ---------- */
  const lb = { v: 0 };
  F.letterbox = function (on, ms) { return MC.tween(lb, { v: on ? 1 : 0 }, ms == null ? 300 : ms, on ? 'outCubic' : 'inQuad', { real: true }); };
  function drawLetterbox() {
    if (lb.v <= 0) return;
    const h = Math.round(20 * lb.v), g = G();
    g.rect(0, 0, g.W, h, '#000'); g.rect(0, g.H - h, g.W, h, '#000');
  }

  /* ---------- 월드 후처리 ---------- */
  let postFrame = -1;
  function applyGrade() {
    const g = G(), ctx = g.ctx;
    if (grade.sat < 0.995) {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (F.satSupported) { ctx.globalCompositeOperation = 'saturation'; ctx.globalAlpha = 1 - grade.sat; ctx.fillStyle = '#808080'; }
      else { ctx.globalAlpha = (1 - grade.sat) * 0.45; ctx.fillStyle = '#6a6a70'; }

      ctx.restore();
    }
    if (grade.tint && grade.ta > 0.004) {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (F.colorSupported) { ctx.globalCompositeOperation = 'color'; ctx.globalAlpha = grade.ta; }
      else ctx.globalAlpha = grade.ta * 0.5;
      ctx.fillStyle = grade.tint; ctx.fillRect(0, 0, g.W, g.H);
      ctx.restore();
    }
  }
  function drawVignettes() {
    const ctx = G().ctx;
    if (vig.a > 0.01) {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(vigCanvas(Math.max(1, Math.round(vig.a * 16)), '#05060c'), 0, 0);
      ctx.restore();
    }
    if (vigPulse.a > 0.02) {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = MC.clamp(vigPulse.a * 1.6, 0, 1);
      ctx.drawImage(vigCanvas(10, vigPulse.color), 0, 0);
      ctx.restore();
    }
  }
  // 씬이 월드를 다 그린 뒤, UI 전에 호출: 그레이드 → 비네트 → 레터박스(+world 페이드)
  F.applyWorldPost = function () {
    applyGrade();
    drawVignettes();
    drawWorldFade();
    drawLetterbox();
    postFrame = G().renderId;
  };

  /* ---------- 페이드 ---------- */
  const fadeS = { v: 0, color: '#000', dither: true, world: false };
  let busyN = 0;
  F.busy = () => busyN > 0;
  // to: 1=덮음 0=걷음, opt:{dither:true, color:'#000', world:false(true면 UI 아래에만 — 대화창은 보임)}
  F.fade = function (to, ms, opt) {
    opt = opt || {};
    if (opt.color) fadeS.color = opt.color; else if (to > fadeS.v) fadeS.color = '#000';
    fadeS.dither = opt.dither !== false;
    fadeS.world = !!opt.world;
    ms = ms == null ? 400 : ms;
    if (MC.input) MC.input.lock(ms > 0 ? 60 : 0);
    busyN++;
    return MC.tween(fadeS, { v: MC.clamp(to, 0, 1) }, ms, to > fadeS.v ? 'inQuad' : 'outQuad', { real: true })
      .then(r => { busyN--; return r; }, e => { busyN--; throw e; });
  };
  F.fadeLevel = () => fadeS.v;
  function drawFadeLayer(v, color, dither) {

  /* ---------- 전환 ---------- */
  const T = { on: false, kind: '', v: 0, color: '#000', amp: 0, circles: null, cx: 0, cy: 0, t0: 0, rMax: 0 };

  // kind: 'fade'|'white'|'dream'|'wake'|'cut'|'ink'   mid: 덮인 동안 실행(Promise 가능 — 전투 결과 같은 긴 Promise는 넘기지 말 것)

  F.trans = async function (kind, mid, opt) {
    opt = opt || {};

    const R = { real: true };
    if (MC.input) MC.input.lock(80);

    try {
      if (kind === 'cut') {
        T.color = opt.color || '#000'; T.v = 1;
        await MC.core.nextFrame();
        await runMid(mid);
        await MC.core.waitReal(50);
        T.v = 0;
      } else if (kind === 'dream' || kind === 'wake') {
        T.color = opt.color || (kind === 'dream' ? '#0a1030' : '#e8ecf4');
        await Promise.all([
          MC.tween(T, { amp: 10 }, 900 * k, 'inSine', R),
          MC.tween(T, { v: 0.55 }, 900 * k, 'inQuad', R)
        ]);
        await MC.tween(T, { v: 1 }, 300 * k, 'inQuad', R);
        const t0 = MC.time.real;
        await runMid(mid);
        const rest = 200 - (MC.time.real - t0);
        if (rest > 0) await MC.core.waitReal(rest);
        await Promise.all([
          MC.tween(T, { amp: 0 }, 700 * k, 'outSine', R),
          MC.tween(T, { v: 0 }, 700 * k, 'outQuad', R)
        ]);
      } else if (kind === 'ink') {
        const g = G();
        T.color = opt.color || '#000';
        T.cx = opt.x != null ? opt.x : g.W >> 1; T.cy = opt.y != null ? opt.y : g.H >> 1;
        let far = 0;
        for (const [px, py] of [[0, 0], [g.W, 0], [0, g.H], [g.W, g.H]]) far = Math.max(far, Math.hypot(px - T.cx, py - T.cy));
        T.rMax = far + 26;
        T.circles = [];
        for (let i = 0; i < 7; i++) {
          const a = i / 7 * Math.PI * 2 + MC.rng() * 0.6;
          const d = i === 0 ? 0 : 8 + MC.rng() * 16;
          T.circles.push({ x: T.cx + Math.cos(a) * d, y: T.cy + Math.sin(a) * d, delay: i === 0 ? 0 : MC.rng() * 120, r: 0 });
        }
        T.t0 = MC.time.real;
        await MC.core.waitReal(380 * k + 130);
        T.v = 1; T.circles = null;
        const t0 = MC.time.real;
        await runMid(mid);
        const rest = 120 - (MC.time.real - t0);
        if (rest > 0) await MC.core.waitReal(rest);
        await MC.tween(T, { v: 0 }, 250 * k, 'outQuad', R);
      } else {                                           // 'fade' | 'white' (기본)
        T.color = opt.color || (kind === 'white' ? '#f4f0e8' : '#000');
        await MC.tween(T, { v: 1 }, 320 * k, 'inQuad', R);
        const t0 = MC.time.real;
        await runMid(mid);
        const rest = 160 - (MC.time.real - t0);
        if (rest > 0) await MC.core.waitReal(rest);
        await MC.tween(T, { v: 0 }, 320 * k, 'outQuad', R);

    } finally {
