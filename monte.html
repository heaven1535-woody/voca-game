<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>34번의 14년 — 제1장 (JRPG M0)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060c;touch-action:none;overscroll-behavior:none;font-family:'Galmuri11','Galmuri9',monospace;}
  #screen{display:block;width:100vw;height:100vh;image-rendering:pixelated;background:#05060c;}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
/* ================================================================
   34번의 14년 — 제1장 JRPG판 M0
   전투 엔진 + 미궁 B1 + 레벨업 + 거점 저장 (도형 플레이스홀더)
   데이터(적/기술/레벨/맵/대사)는 DATA로 분리 — 수치만 바꿔 조정 가능
   ================================================================ */

/* ===================== DATA ===================== */
const DATA={
  levels:{ l1:{hp:30,mp:10,str:6,def:4,spd:5,wis:3}, l15:{hp:150,mp:70,str:40,def:30,spd:30,wis:45}, maxLv:20 },
  skills:{
    기억:{mp:3,pow:12,kind:'atk',weak:'절망',line:'메르세데스는 기다린다고 했어.'},
    사색:{mp:3,pow:8,kind:'atk',weak:'광기',line:'이유가 있을 거다. 그걸 알아낼 때까진 미칠 수 없어.'},
    버티기:{mp:0,kind:'guard',line:'몸을 웅크렸다.'},
    희망:{mp:4,pow:15,kind:'atk',weak:'분노',line:'머릿속은 아무도 가둘 수 없다.'}
  },
  items:{ 말린빵:{kind:'heal',stat:'hp',amt:30,desc:'HP 30 회복'}, 물한모금:{kind:'heal',stat:'mp',amt:15,desc:'정신력 15 회복'} },
  equip:{ 쇠숟가락:{slot:'weapon',str:3,name:'쇠숟가락'} },
  enemies:{
    그림자쥐:{name:'그림자 쥐',fam:'절망',hp:12,str:5,def:2,spd:6,wis:1,exp:3},
    눅눅한벽:{name:'눅눅한 벽',fam:'절망',hp:18,str:4,def:6,spd:2,wis:1,exp:5},
    절망:{name:'절망',fam:'절망',hp:200,str:12,def:10,spd:3,wis:8,exp:0,boss:true,loseIn:3}
  },
  maps:{
    base:{ name:'샤토 디프 감방', kind:'base', start:[5,6], tiles:[
      '###########',
      '#.........#',
      '#.........#',
      '#....B....#',
      '#.........#',
      '#.........#',
      '#.........#',
      '#.........#',
      '###########'
    ]},
    b1:{ name:'마음의 미궁 B1', kind:'dungeon', start:[1,1], exitAt:[1,1], bossAt:[11,13], tiles:[
      '#############',
      '#U..........#'.slice(0,13),
      '#.#.#.#.#.#.#',
      '#...........#',
      '#.#.#.#.#.#.#',
      '#...........#',
      '#.#.#.#.#.#.#',
      '#...........#',
      '#.#.#.#.#.#.#',
      '#...........#',
      '#.#.#.#.#.#.#',
      '#...........#',
      '#.#.#.#.#.#.#',
      '#..........X#',
      '#############'
    ],
      symbols:[[3,1,'그림자쥐',1],[7,1,'눅눅한벽',1],[5,3,'그림자쥐',2],[9,3,'그림자쥐',1],[3,5,'그림자쥐',2],[9,5,'눅눅한벽',1],[5,7,'그림자쥐',3],[9,9,'그림자쥐',2],[5,11,'눅눅한벽',1]],
      chests:[[11,1,'쇠숟가락'],[1,9,'말린빵']]
    }
  },
  txt:{
    title:['34번의 14년','― 몬테크리스토 백작 · 제1장 (JRPG) ―','화면을 눌러 시작하세요','(소리가 켜집니다)'],
    intro:['1815년. 재판도 없이 샤토 디프에 갇혔다.','이름을 빼앗기고 34번으로 불린다.','짚 침대에서 잠들면 마음속 미궁이 열린다…'],
    bedMenu:'짚 침대에 누웠다. 기록하고 잠든다.\n(완전 회복 · 마음의 미궁으로)',
    bossIntro:['절망: 아무도 널 기억하지 않아.','절망: 메르세데스도, 아버지도, 모렐도.'],
    bossLose:['절망이 모든 것을 덮었다…','당테스는 쓰러졌다.','(이 절망과는 5막에서 다시 싸운다)'],
    timecard:'─── 2년 후 ───   1817년',
    faint:'당테스는 쓰러졌다…\n짚 침대에서 눈을 떴다.\n(경험치 유지, 재료 절반 잃음)',
    exitPrompt:'미궁 밖으로 나간다 (거점으로)'
  }
};
function expNeed(lv){ return Math.round(10*Math.pow(lv,1.6)); }
function statAt(lv){ const a=DATA.levels.l1,b=DATA.levels.l15,o={}; for(const k in a){ const d=(b[k]-a[k])/14; o[k]=Math.round(a[k]+d*(lv-1)); } return o; }

/* ===================== canvas / audio ===================== */
const CV=document.getElementById('screen'), X=CV.getContext('2d');
let VW=360,VH=640,DPR=1,TS=40;
function resize(){ VW=Math.round(document.documentElement.clientWidth); VH=Math.round(window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1); CV.width=Math.round(VW*DPR); CV.height=Math.round(VH*DPR);
  CV.style.width=VW+'px'; CV.style.height=VH+'px'; X.setTransform(DPR,0,0,DPR,0,0); X.imageSmoothingEnabled=false;
  TS=Math.max(26,Math.floor(Math.min(VW,VH)/9)); }
addEventListener('resize',resize);
let AC=null;
function enableAudio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume();}catch(e){} } }
function beep(f,d,t,v){ if(!AC)return; try{const o=AC.createOscillator(),g=AC.createGain(); o.type=t||'square'; o.frequency.value=f; g.gain.value=v||.05; o.connect(g); g.connect(AC.destination); const n=AC.currentTime; o.start(n); g.gain.exponentialRampToValueAtTime(.0001,n+(d||.08)); o.stop(n+(d||.08)+.02);}catch(e){} }
const SFX={tap:()=>beep(520,.05,'square',.04),hit:()=>beep(200,.09,'sawtooth',.06),weak:()=>beep(900,.12,'triangle',.07),heal:()=>beep(760,.12,'triangle',.05),lvl:()=>beep(1046,.2,'triangle',.06),lose:()=>beep(120,.3,'sawtooth',.08),win:()=>beep(880,.14,'triangle',.06),page:()=>beep(420,.04,'square',.035),enc:()=>beep(160,.16,'sawtooth',.07)};

/* ===================== draw utils ===================== */
function px(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h);}
function rrect(x,y,w,h,r,c){X.fillStyle=c;X.beginPath();X.roundRect(x,y,w,h,r);X.fill();}
function stroke(x,y,w,h,r,c,lw){X.strokeStyle=c;X.lineWidth=lw||1;X.beginPath();X.roundRect(x,y,w,h,r);X.stroke();}
function circ(x,y,r,c){X.fillStyle=c;X.beginPath();X.arc(x,y,r,0,7);X.fill();}
function T(s,x,y,c,sz,al){X.fillStyle=c;X.font=(sz||10)+"px 'Galmuri11',monospace";X.textAlign=al||'left';X.textBaseline='top';X.fillText(s,x,y);}
function wrap(s,x,y,mw,lh,c,sz){X.font=(sz||10)+"px 'Galmuri11',monospace";X.fillStyle=c;X.textAlign='left';X.textBaseline='top';
  let ln='',yy=y; for(const ch of s){ if(ch==='\n'){X.fillText(ln,x,yy);ln='';yy+=lh;continue;} const t=ln+ch; if(X.measureText(t).width>mw){X.fillText(ln,x,yy);ln=ch;yy+=lh;} else ln=t;} X.fillText(ln,x,yy); return yy+lh; }
if(!X.roundRect){X.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);return this;};}
function fz(n){return Math.max(10,Math.round(n));}

const C={ ink:'#e9edf7',dim:'#8a90a6',gold:'#ffcf4a',red:'#e05a4a',green:'#66c96a',blue:'#5aa9e6',
  wall:'#3b4160',wallHi:'#525a80',floor:'#232a44',floor2:'#1d2340',bed:'#c7a05a',bedD:'#9a7838',
  chest:'#c78a46',boss:'#7a2f4a',exit:'#4a8f6a',
  win:'#0a0f22cc',winB:'#2a3358',winB2:'#8fa6d8',
  dantes:'#5a8fd6',famColor:{절망:'#5a5a80',분노:'#c0503a',광기:'#7a5aa0'} };

/* ===================== game state ===================== */
let G=null;
function newParty(){ const s=statAt(1); return {name:'에드몽',lv:1,exp:0,hp:s.hp,mp:s.mp,
  str:s.str,def:s.def,spd:s.spd,wis:s.wis, skills:['기억','사색','버티기'], weapon:null,
  items:{말린빵:0,물한모금:0}, mats:{생선뼈:0,쇳조각:0} }; }
function recompute(p){ const s=statAt(p.lv); const eqStr=p.weapon?(DATA.equip[p.weapon].str||0):0;
  p.maxhp=s.hp; p.maxmp=s.mp; p.baseStr=s.str; p.str=s.str+eqStr; p.def=s.def; p.spd=s.spd; p.wis=s.wis;
  if(p.hp>p.maxhp)p.hp=p.maxhp; if(p.mp>p.maxmp)p.mp=p.maxmp; }
function newGame(){ const p=newParty(); recompute(p); p.hp=p.maxhp; p.mp=p.maxmp;
  return { screen:'title', p, mapKey:'base', px:5,py:6,dir:'down', moving:null,moveT:0, path:null,pend:null,
    map:null, cam:{x:0,y:0}, killed:{}, chestsOpen:{}, flags:{}, dialog:null, battle:null, fade:0,fadeDir:0,fadeCb:null,
    tcard:null }; }

/* ===================== maps ===================== */
function loadMap(key,pos){ const m=DATA.maps[key]; G.mapKey=key;
  G.map={ def:m, tiles:m.tiles, cols:m.tiles[0].length, rows:m.tiles.length };
  // live symbols/chests
  G.map.symbols=(m.symbols||[]).map((s,i)=>({x:s[0],y:s[1],key:s[2],n:s[3],id:key+'_s'+i})).filter(s=>!G.killed[s.id]);
  G.map.chests=(m.chests||[]).map((c,i)=>({x:c[0],y:c[1],item:c[2],id:key+'_c'+i})).filter(c=>!G.chestsOpen[c.id]);
  const st=pos||m.start; G.px=st[0]; G.py=st[1]; G.moving=null; G.path=null; G.pend=null; }
function tileAt(x,y){ const t=G.map.tiles; if(y<0||y>=t.length||x<0||x>=t[0].length) return '#'; return t[y][x]; }
function symAt(x,y){ for(const s of G.map.symbols) if(s.x===x&&s.y===y) return s; return null; }
function chestAt(x,y){ for(const c of G.map.chests) if(c.x===x&&c.y===y) return c; return null; }
function solid(x,y){ const t=tileAt(x,y); if(t==='#'||t==='B') return true; if(symAt(x,y)) return true; if(chestAt(x,y)) return true; return false; }
function interactableAt(x,y){ const t=tileAt(x,y); if(symAt(x,y)||chestAt(x,y)) return true; if(t==='B'||t==='X'||t==='U') return true; return false; }

/* BFS path to adjacent-of-target or target */
function bfs(sx,sy,tx,ty){ const C0=G.map.cols,R0=G.map.rows,key=(x,y)=>y*C0+x,prev=new Map(); prev.set(key(sx,sy),-1); const q=[[sx,sy]];
  while(q.length){ const [x,y]=q.shift(); if(x===tx&&y===ty)break; for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){ const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=C0||ny>=R0)continue; if(prev.has(key(nx,ny)))continue; if(solid(nx,ny)&&!(nx===tx&&ny===ty))continue; prev.set(key(nx,ny),key(x,y)); q.push([nx,ny]); } }
  if(!prev.has(key(tx,ty)))return null; const path=[]; let c=key(tx,ty); while(c!==-1){ path.unshift([c%C0,(c/C0)|0]); c=prev.get(c);} path.shift(); return path; }

/* ===================== dialog ===================== */
function say(lines,cb){ G.dialog={lines:lines.slice(),i:0,shown:'',ci:0,t:0,done:false,cb:cb||null}; }
function dlgAnim(){ const d=G.dialog,s=d.lines[d.i]; if(d.ci<s.length){ d.t++; if(d.t%2===0){d.ci++;d.shown=s.slice(0,d.ci);} } else d.done=true; }
function dlgAdvance(){ const d=G.dialog,s=d.lines[d.i]; if(!d.done){d.ci=s.length;d.shown=s;d.done=true;return;} d.i++; if(d.i>=d.lines.length){ const cb=d.cb; G.dialog=null; if(cb)cb(); } else {d.ci=0;d.shown='';d.t=0;d.done=false;} }

/* ===================== fade ===================== */
function fadeTo(mid,after){ G.fadeDir=1; G.fadeCb=()=>{ mid&&mid(); G.fadeDir=-1; G.fadeCb=()=>{G.fadeDir=0; after&&after();}; }; }

/* ===================== BUTTON registry ===================== */
let BTN=[];
function btn(x,y,w,h,label,fn,opt){ opt=opt||{}; rrect(x+1,y+2,w,h,4,'#0006'); rrect(x,y,w,h,4, opt.off?'#3a405a':(opt.on?C.gold:'#e9edf7'));
  stroke(x,y,w,h,4, opt.off?'#565f7e':(opt.on?'#fff2c0':'#aab0c6'),1);
  T(label,x+w/2,y+h/2-fz((opt.sz||10))/2, opt.off?'#7a8098':(opt.on?'#5a3a00':'#2a2f45'), opt.sz||10,'center');
  if(!opt.off) BTN.push({x,y,w,h,fn}); }
function hit(lx,ly){ for(let i=BTN.length-1;i>=0;i--){ const b=BTN[i]; if(lx>=b.x&&lx<=b.x+b.w&&ly>=b.y&&ly<=b.y+b.h){b.fn();return true;} } return false; }

/* ===================== FIELD ===================== */
function updateField(){ if(G.dialog){dlgAnim();return;}
  if(G.moving){ G.moveT+=0.18; if(G.moveT>=1){ G.px=G.moving.tx;G.py=G.moving.ty;G.moving=null;
    if(G.path&&G.path.length) stepPath(); else if(G.pend){ const pn=G.pend;G.pend=null; faceTo(pn.x,pn.y); interactAt(pn.x,pn.y);} } }
  else if(G.path&&G.path.length) stepPath();
}
function stepPath(){ const [nx,ny]=G.path[0]; if(solid(nx,ny)){G.path=null;G.pend=null;return;} G.path.shift(); faceTo(nx,ny); G.moving={fx:G.px,fy:G.py,tx:nx,ty:ny};G.moveT=0; }
function faceTo(x,y){ G.dir=x<G.px?'left':x>G.px?'right':y<G.py?'up':'down'; }
function fieldTap(lx,ly){ if(G.dialog){dlgAdvance();return;}
  if(G.moving||G.path)return;
  // menu button top-right
  if(lx>VW-38&&ly<34){ /* reserved */ }
  const wx=Math.floor((lx+G.cam.x)/TS), wy=Math.floor((ly+G.cam.y)/TS);
  if(wx<0||wy<0||wx>=G.map.cols||wy>=G.map.rows)return;
  if(interactableAt(wx,wy)){
    if((Math.abs(wx-G.px)+Math.abs(wy-G.py))===1){ faceTo(wx,wy); interactAt(wx,wy); return; }
    if(wx===G.px&&wy===G.py){ interactAt(wx,wy); return; }
    let best=null,bl=1e9; for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){ const ax=wx+dx,ay=wy+dy; if(ax<0||ay<0||ax>=G.map.cols||ay>=G.map.rows)continue; if(solid(ax,ay))continue; const p=bfs(G.px,G.py,ax,ay); if(p&&p.length<bl){bl=p.length;best=p;} }
    if(best){G.path=best;G.pend={x:wx,y:wy};} return;
  }
  if(!solid(wx,wy)){ const p=bfs(G.px,G.py,wx,wy); if(p&&p.length){G.path=p;G.pend=null;} }
}
function interactAt(x,y){ const t=tileAt(x,y); const s=symAt(x,y),c=chestAt(x,y);
  if(s){ startBattle(s); return; }
  if(c){ openChest(c); return; }
  if(t==='B'){ say([DATA.txt.bedMenu], ()=>{ // save + heal + enter dungeon
      G.p.hp=G.p.maxhp; G.p.mp=G.p.maxmp; save();
      fadeTo(()=>{ loadMap('b1'); G.screen='field'; }); }); return; }
  if(t==='X'){ startBoss(); return; }
  if(t==='U'){ say([DATA.txt.exitPrompt], ()=>{ fadeTo(()=>{ loadMap('base'); G.screen='field'; save(); }); }); return; }
}
function openChest(c){ SFX.win(); const it=c.item;
  if(DATA.equip[it]){ /* weapon */ if(!G.p.weapon || (DATA.equip[it].str>(DATA.equip[G.p.weapon]?DATA.equip[G.p.weapon].str:0))){ G.p.weapon=it; recompute(G.p);} }
  else if(DATA.items[it]){ G.p.items[it]=(G.p.items[it]||0)+1; }
  else { G.p.mats[it]=(G.p.mats[it]||0)+1; }
  G.chestsOpen[c.id]=1; G.map.chests=G.map.chests.filter(x=>x.id!==c.id);
  say(['상자를 열었다 — '+it+' 획득!']); }

function drawField(){ const m=G.map, C0=m.cols,R0=m.rows,WW=C0*TS,HH=R0*TS;
  let ppx=G.px*TS,ppy=G.py*TS; if(G.moving){ppx=(G.moving.fx+(G.moving.tx-G.moving.fx)*G.moveT)*TS;ppy=(G.moving.fy+(G.moving.ty-G.moving.fy)*G.moveT)*TS;}
  let camX=ppx+TS/2-VW/2,camY=ppy+TS/2-VH/2; camX=WW<=VW?(WW-VW)/2:Math.max(0,Math.min(WW-VW,camX)); camY=HH<=VH?(HH-VH)/2:Math.max(0,Math.min(HH-VH,camY));
  G.cam={x:camX,y:camY};
  px(0,0,VW,VH,'#05060c');
  const x0=Math.max(0,(camX/TS)|0),x1=Math.min(C0-1,((camX+VW)/TS)|0),y0=Math.max(0,(camY/TS)|0),y1=Math.min(R0-1,((camY+VH)/TS)|0);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){ const t=m.tiles[y][x], sx=x*TS-camX, sy=y*TS-camY;
    if(t==='#'){ px(sx,sy,TS,TS,C.wall); px(sx,sy,TS,2,C.wallHi); }
    else { px(sx,sy,TS,TS, ((x+y)&1)?C.floor:C.floor2); }
    if(t==='B'){ rrect(sx+3,sy+5,TS-6,TS-10,3,C.bedD); rrect(sx+3,sy+5,TS-6,6,2,C.bed); T('침대',sx+TS/2,sy+TS-11,'#3a2a12',fz(TS*0.24),'center'); }
    if(t==='X'){ px(sx,sy,TS,TS,'#160c14'); T('보스',sx+TS/2,sy+TS/2-6,C.red,fz(TS*0.26),'center'); }
    if(t==='U'){ T('▲출구',sx+TS/2,sy+TS/2-6,C.exit,fz(TS*0.24),'center'); }
  }
  // chests
  for(const c of m.chests){ const sx=c.x*TS-camX,sy=c.y*TS-camY; rrect(sx+4,sy+7,TS-8,TS-12,3,C.chest); px(sx+4,sy+7+((TS-12)/2),TS-8,2,'#8a5a28'); }
  // symbols (enemies as dark blobs)
  for(const s of m.symbols){ const sx=s.x*TS-camX,sy=s.y*TS-camY; const c=C.famColor[DATA.enemies[s.key].fam];
    circ(sx+TS/2,sy+TS/2+2,TS*0.30,'#0006'); circ(sx+TS/2,sy+TS/2,TS*0.28,c); circ(sx+TS*0.4,sy+TS*0.42,TS*0.05,'#000'); circ(sx+TS*0.6,sy+TS*0.42,TS*0.05,'#000');
    if(s.n>1) T('x'+s.n,sx+TS-4,sy+2,C.ink,fz(TS*0.24),'right'); }
  // player
  drawDantes(ppx-camX,ppy-camY, G.moving?(Math.floor(G.moveT*2)%2):0);
  // top HUD
  px(0,0,VW,22,'#0b0d16cc'); T(m.def.name,6,4,C.gold,fz(11));
  T('Lv'+G.p.lv+'  HP '+G.p.hp+'/'+G.p.maxhp,VW-6,4,C.ink,fz(10),'right');
  if(m.kind==='dungeon') T('출구(▲)로 나가거나 보스방으로. 그림자를 피할 수 있다.',VW/2,VH-18,'#ffffffb0',fz(TS*0.26),'center');
  if(G.dialog) drawDialog();
}
function drawDantes(sx,sy,fr){ const u=TS/16, bob=fr?-u*0.6:0, y=sy+bob;
  X.fillStyle='#0005';X.beginPath();X.ellipse(sx+TS/2,sy+TS-u*2,TS*0.28,TS*0.12,0,0,7);X.fill();
  rrect(sx+4*u,y+7*u,8*u,7*u,2*u,'#141726'); rrect(sx+4.6*u,y+7.4*u,6.8*u,4*u,2*u,C.dantes);
  rrect(sx+4*u,y-0.5*u,8*u,8*u,3*u,'#141726'); rrect(sx+4.6*u,y,6.8*u,7*u,2.6*u,'#ffd0a0');
  px(sx+4.6*u,y-0.5*u,6.8*u,2.4*u,'#3a2a18');
  if(G.dir!=='up'){ circ(sx+6.3*u,y+3.4*u,0.8*u,'#20233a'); circ(sx+9.7*u,y+3.4*u,0.8*u,'#20233a'); } }

/* ===================== dialog draw ===================== */
function drawDialog(){ const d=G.dialog; const m=Math.round(TS*0.28), h=Math.max(TS*2.4,110), y=VH-h-m, w=VW-m*2, x=m;
  rrect(x+2,y+3,w,h,8,'#0007'); rrect(x,y,w,h,8,'#101733'); stroke(x,y,w,h,8,C.winB2,1); stroke(x+3,y+3,w-6,h-6,6,C.winB,1);
  wrap(d.shown||'', x+12, y+12, w-24, fz(TS*0.4)+4, C.ink, fz(TS*0.38));
  if(d.done&&(tick>>4)%2) T('▼',x+w-14,y+h-16,C.gold,fz(TS*0.36)); }

/* ===================== BATTLE ===================== */
function mkEnemy(key){ const e=DATA.enemies[key]; return {key,name:e.name,fam:e.fam,hp:e.hp,maxhp:e.hp,str:e.str,def:e.def,spd:e.spd,wis:e.wis,exp:e.exp,boss:!!e.boss,loseIn:e.loseIn||0,flash:0,dead:false}; }
function startBattle(sym){ SFX.enc(); const list=[]; for(let i=0;i<sym.n;i++) list.push(mkEnemy(sym.key));
  G.battle={ es:list, sym, boss:false, log:[list.length>1?(list[0].name+' 무리가 나타났다!'):(list[0].name+'이(가) 나타났다!')], phase:'intro', mi:0, sub:null, guard:false, pturns:0, wait:0 };
  G.screen='battle'; }
function startBoss(){ SFX.enc(); const b=mkEnemy('절망'); G.battle={ es:[b], sym:null, boss:true, log:DATA.txt.bossIntro.concat(['절망이 나타났다!']), phase:'intro', mi:0, sub:null, guard:false, pturns:0, wait:0 };
  G.screen='battle'; }
function blog(s){ G.battle.log.push(s); if(G.battle.log.length>4) G.battle.log.shift(); }
function aliveEs(){ return G.battle.es.filter(e=>!e.dead); }
const CMDS=['맞선다','배운 것','도구','피한다'];
function battleTap(lx,ly){ const b=G.battle;
  if(b.phase==='intro'){ b.phase='menu'; return; }
  if(b.phase==='msg'){ advMsg(); return; }
  if(b.phase==='win'||b.phase==='lose'){ endBattle(); return; }
  // menu/sub handled by BTN in draw
  hit(lx,ly);
}
function chooseCmd(i){ const b=G.battle;
  if(i===0){ b.sub={type:'atk'}; needTarget(); }
  else if(i===1){ b.phase='skill'; }
  else if(i===2){ b.phase='item'; }
  else { flee(); } }
function needTarget(){ const b=G.battle; const al=aliveEs(); if(al.length<=1){ b.target=b.es.indexOf(al[0]); doPlayerAction(); } else b.phase='target'; }
function doPlayerAction(){ const b=G.battle,p=G.p,e=b.es[b.target]; b.guard=false;
  if(b.sub.type==='atk'){ const dmg=Math.max(1,Math.round((p.str - e.def*0.5)*(0.9+Math.random()*0.2))); e.hp-=dmg; e.flash=8; blog('당테스의 공격! '+e.name+'에게 '+dmg); SFX.hit(); }
  else if(b.sub.type==='skill'){ const sk=DATA.skills[b.sub.name];
    if(sk.kind==='guard'){ b.guard=true; blog('버티기! '+sk.line); }
    else { if(p.mp<sk.mp){ blog('정신력이 부족하다!'); afterPlayer(true); return; } p.mp-=sk.mp; let dmg=Math.round((sk.pow+p.wis*0.8 - e.def*0.3)*(0.9+Math.random()*0.2)); let weak=(sk.weak===e.fam); if(weak){dmg*=2;} dmg=Math.max(1,dmg); e.hp-=dmg; e.flash=8; if(weak){blog('마음을 꿰뚫었다! '+e.name+'에게 '+dmg); SFX.weak();} else {blog(b.sub.name+'! '+e.name+'에게 '+dmg); SFX.hit();} } }
  afterPlayer(false); }
function afterPlayer(skip){ const b=G.battle; b.pturns++;
  // deaths
  b.es.forEach(e=>{ if(!e.dead&&e.hp<=0){e.hp=0;e.dead=true; blog(e.name+'을(를) 물리쳤다!');} });
  if(aliveEs().length===0){ winBattle(); return; }
  if(b.boss && b.pturns>=b.es[0].loseIn){ bossLoseSeq(); return; }
  b.phase='msg'; b._after='enemy'; }
function advMsg(){ const b=G.battle; if(b._after==='enemy'){ b._after=null; enemyTurn(); } else { b.phase='menu'; } }
function enemyTurn(){ const b=G.battle,p=G.p; const al=aliveEs(); let dead=false;
  for(const e of al){ let dmg=Math.max(1,Math.round((e.str - p.def*0.5)*(0.9+Math.random()*0.2))); if(b.guard)dmg=Math.max(1,Math.round(dmg/2)); p.hp-=dmg; blog(e.name+'의 공격! '+dmg+' 피해'); if(p.hp<=0){p.hp=0;dead=true;break;} }
  b.guard=false;
  if(dead){ if(b.boss){ bossLoseSeq(); } else { faintSeq(); } return; }
  b.phase='menu'; }
function flee(){ const b=G.battle,p=G.p; if(b.boss){ blog('보스에게서는 도망칠 수 없다!'); b.phase='msg'; b._after='enemy'; return; }
  const es=aliveEs(); const ms=Math.max(...es.map(e=>e.spd)); const ch=0.5+(p.spd-ms)*0.03;
  if(Math.random()<ch){ blog('당테스는 몸을 피했다!'); b._fled=true; b.phase='lose'; }
  else { blog('그러나 벗어날 수 없었다!'); b.phase='msg'; b._after='enemy'; } }
function winBattle(){ const b=G.battle,p=G.p; let exp=b.es.reduce((a,e)=>a+e.exp,0);
  p.exp+=exp; blog('경험치 '+exp+'을 얻었다.'); SFX.win();
  // level up
  let ups=[]; while(p.lv<DATA.levels.maxLv && p.exp>=expNeed(p.lv)){ p.exp-=expNeed(p.lv); const old=p.maxhp; p.lv++; recompute(p); p.hp+=(p.maxhp-old); ups.push(p.lv); }
  if(ups.length){ blog('레벨 업! → Lv'+p.lv); SFX.lvl(); }
  b.phase='win'; }
function bossLoseSeq(){ const b=G.battle; b.log=DATA.txt.bossLose.slice(); b._bosslose=true; b.phase='lose'; SFX.lose(); }
function faintSeq(){ const b=G.battle; SFX.lose(); b.phase='faint'; }
function endBattle(){ const b=G.battle;
  if(b._bosslose){ G.battle=null; G.flags.bossSeen=1; G.p.hp=G.p.maxhp; G.p.mp=G.p.maxmp; G.tcard=DATA.txt.timecard; G.screen='timecard'; save(); return; }
  if(b._fled){ G.battle=null; G.screen='field'; return; }
  if(b.phase==='win'){ if(b.sym){ G.killed[b.sym.id]=1; G.map.symbols=G.map.symbols.filter(s=>s.id!==b.sym.id); } G.battle=null; G.screen='field'; save(); return; }
  G.battle=null; G.screen='field'; }
function drawBattle(){ const b=G.battle,p=G.p;
  const g=X.createLinearGradient(0,0,0,VH); g.addColorStop(0,'#241d33'); g.addColorStop(1,'#0e0a16'); X.fillStyle=g; X.fillRect(0,0,VW,VH);
  // enemies
  const al=b.es; const n=al.length; const ew=Math.min(64,VW/(n+1));
  for(let i=0;i<n;i++){ const e=al[i]; const cx=VW*(i+1)/(n+1), cy=VH*0.26; if(e.dead)continue;
    let dx=cx; if(e.flash>0){dx+=(Math.random()*6-3);e.flash--;}
    const col=C.famColor[e.fam]; const rad=e.boss?VW*0.16:VW*0.09;
    if(!(e.flash>0&&e.flash%2)){ circ(dx,cy+rad*0.7,rad*0.9,'#0006'); circ(dx,cy,rad,col); circ(dx-rad*0.35,cy-rad*0.15,rad*0.14,'#000'); circ(dx+rad*0.35,cy-rad*0.15,rad*0.14,'#000'); }
    T(e.name,cx,cy+rad+4,C.ink,fz(11),'center'); const bw=rad*2; rrect(cx-bw/2,cy+rad+18,bw,5,2,'#000'); rrect(cx-bw/2+1,cy+rad+19,(bw-2)*(e.hp/e.maxhp),3,1,C.red);
  }
  // log window
  const lw=VW-16, lx=8, ly=VH*0.46, lh=VH*0.20; rrect(lx,ly,lw,lh,6,'#0a0f22ee'); stroke(lx,ly,lw,lh,6,C.winB2,1);
  let yy=ly+8; for(const line of b.log){ yy=wrap(line,lx+10,yy,lw-20,fz(TS*0.36)+2,C.ink,fz(TS*0.34)); }
  if(b.phase==='intro'||b.phase==='msg'||b.phase==='win'||b.phase==='faint'||(b._bosslose&&b.phase==='msg')){ if((tick>>4)%2)T('▼',lx+lw-14,ly+lh-16,C.gold,fz(11)); }
  // party status
  const py=VH*0.68; rrect(8,py,VW-16,VH*0.30-8,6,'#0a0f22ee'); stroke(8,py,VW-16,VH*0.30-8,6,C.winB2,1);
  T(p.name+'  Lv'+p.lv,18,py+8,C.ink,fz(11));
  T('HP '+p.hp+'/'+p.maxhp,18,py+24,p.hp<p.maxhp*0.3?C.red:C.ink,fz(10)); rrect(90,py+25,VW-108,7,3,'#000'); rrect(91,py+26,(VW-110)*(p.hp/p.maxhp),5,2,C.green);
  T('MP '+p.mp+'/'+p.maxmp,18,py+38,C.blue,fz(10)); rrect(90,py+39,VW-108,7,3,'#000'); rrect(91,py+40,(VW-110)*(p.mp/p.maxmp),5,2,C.blue);
  BTN=[];
  const by=py+54, bh=(VH*0.30-8-54-8)/1, bw=(VW-16-8*3)/4;
  if(b.phase==='menu'){ for(let i=0;i<4;i++){ btn(12+i*(bw+8),by,bw,Math.min(bh,30),CMDS[i],()=>chooseCmd(i),{sz:9}); } }
  else if(b.phase==='skill'){ const sk=p.skills; for(let i=0;i<sk.length;i++){ const s=DATA.skills[sk[i]]; const lab=sk[i]+(s.mp?(' '+s.mp):''); btn(12+i*(bw+8),by,bw,Math.min(bh,30),lab,()=>{ b.sub={type:'skill',name:sk[i]}; if(DATA.skills[sk[i]].kind==='guard'){ b.target=0; doPlayerAction(); } else needTarget(); },{sz:9,off:s.mp>p.mp}); } btn(VW-70,by-0,58,Math.min(bh,30),'← 뒤로',()=>{b.phase='menu';},{sz:8}); }
  else if(b.phase==='item'){ const its=Object.keys(p.items).filter(k=>p.items[k]>0); if(its.length===0){ T('도구가 없다.',VW/2,by+6,C.dim,fz(10),'center'); } for(let i=0;i<its.length;i++){ btn(12+i*(bw+8),by,bw,Math.min(bh,30),its[i]+' '+p.items[its[i]],()=>useItem(its[i]),{sz:9}); } btn(VW-70,by,58,Math.min(bh,30),'← 뒤로',()=>{b.phase='menu';},{sz:8}); }
  else if(b.phase==='target'){ T('대상 선택',VW/2,by-14,C.gold,fz(10),'center'); const av=aliveEs(); for(let i=0;i<av.length;i++){ const idx=b.es.indexOf(av[i]); btn(12+i*(bw+8),by,bw,Math.min(bh,30),av[i].name,()=>{ b.target=idx; doPlayerAction(); },{sz:8}); } btn(VW-70,by,58,Math.min(bh,30),'← 뒤로',()=>{b.phase='menu';},{sz:8}); }
}
function useItem(k){ const p=G.p,it=DATA.items[k]; if(it.kind==='heal'){ if(it.stat==='hp')p.hp=Math.min(p.maxhp,p.hp+it.amt); else p.mp=Math.min(p.maxmp,p.mp+it.amt); } p.items[k]--; SFX.heal(); blog(k+' 사용 — '+it.desc); G.battle.phase='msg'; G.battle._after='enemy'; }

/* ===================== title / intro / timecard ===================== */
let tick=0;
function drawTitle(){ px(0,0,VW,VH,'#0b1024'); for(let i=0;i<70;i++){const sx=(i*53+i*i*3)%VW,sy=(i*29)%(VH*0.5); if(((tick>>4)&15)!==(i&15))px(sx,sy,2,2,'#7fa0d0');}
  T(DATA.txt.title[0],VW/2,VH*0.16,C.gold,fz(TS*0.9),'center'); T(DATA.txt.title[1],VW/2,VH*0.16+TS*1.0,C.ink,fz(TS*0.34),'center');
  rrect(VW/2-40,VH*0.4,80,60,6,'#161a28'); px(VW/2-24,VH*0.4+12,48,26,'#0b0d16'); for(let i=0;i<4;i++)px(VW/2-20+i*11,VH*0.4+12,2,26,'#3a4258');
  T(DATA.txt.title[2],VW/2,VH*0.66,((tick>>4)%2)?C.gold:C.dim,fz(TS*0.38),'center'); T(DATA.txt.title[3],VW/2,VH*0.66+TS*0.6,C.dim,fz(TS*0.3),'center');
  BTN=[]; const hasSave=!!localStorage.getItem(KEY);
  if(hasSave){ btn(VW/2-60,VH*0.78,120,TS,'이어하기',()=>{ const s=loadSave(); if(s){G=s; ensureG(); loadMap(G.mapKey,[G.px,G.py]); G.screen='field'; } SFX.win(); },{sz:11});
    btn(VW/2-45,VH*0.78+TS+8,90,TS*0.8,'처음부터',()=>{ wipe(); startNew(); },{sz:9}); }
  else btn(VW/2-60,VH*0.8,120,TS,'시작하기',()=>startNew(),{sz:11});
}
function startNew(){ enableAudio(); G=newGame(); G.screen='intro'; G._ii=0; }
function drawIntro(){ px(0,0,VW,VH,'#0c0d15'); const m=Math.round(TS*0.3); rrect(m,VH*0.3,VW-m*2,VH*0.4,8,'#101733'); stroke(m,VH*0.3,VW-m*2,VH*0.4,8,C.winB2,1);
  let yy=VH*0.3+16; for(let i=0;i<=(G._ii||0)&&i<DATA.txt.intro.length;i++){ yy=wrap(DATA.txt.intro[i],m+12,yy,VW-m*2-24,fz(TS*0.42)+4,C.ink,fz(TS*0.38))+4; }
  T('▶ 탭',VW-m-24,VH*0.7-22,C.gold,fz(TS*0.34));
  BTN=[{x:0,y:0,w:VW,h:VH,fn:()=>{ SFX.page(); G._ii=(G._ii||0)+1; if(G._ii>=DATA.txt.intro.length){ fadeTo(()=>{ loadMap('base'); G.screen='field'; save(); }); } }}]; }
function drawTimecard(){ px(0,0,VW,VH,'#08060a'); T(G.tcard||'',VW/2,VH*0.44,C.gold,fz(TS*0.5),'center'); T('▶ 탭',VW/2,VH*0.6,C.dim,fz(TS*0.34),'center');
  BTN=[{x:0,y:0,w:VW,h:VH,fn:()=>{ G.tcard=null; fadeTo(()=>{ loadMap('base'); G.screen='field'; }); }}]; }
function drawFaint(){ // simple faint overlay handled in battle 'faint'
}

/* ===================== save ===================== */
const KEY='jrpg_34_14_m0';
function save(){ try{ const o={p:G.p,mapKey:G.mapKey,px:G.px,py:G.py,killed:G.killed,chestsOpen:G.chestsOpen,flags:G.flags}; localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} }
function loadSave(){ try{ const s=localStorage.getItem(KEY); if(!s)return null; const o=JSON.parse(s); const g=newGame(); g.p=o.p; g.mapKey=o.mapKey||'base'; g.px=o.px;g.py=o.py; g.killed=o.killed||{}; g.chestsOpen=o.chestsOpen||{}; g.flags=o.flags||{}; return g; }catch(e){return null;} }
function ensureG(){ if(!G.killed)G.killed={}; if(!G.chestsOpen)G.chestsOpen={}; if(!G.flags)G.flags={}; recompute(G.p); }
function wipe(){ try{localStorage.removeItem(KEY);}catch(e){} }

/* faint resolution: when battle.phase==='faint' and tapped */
function resolveFaint(){ // lose half mats, wake base full heal
  for(const k in G.p.mats) G.p.mats[k]=Math.floor(G.p.mats[k]/2);
  G.battle=null; G.p.hp=G.p.maxhp; G.p.mp=G.p.maxmp; loadMap('base'); G.screen='field'; save(); }

/* ===================== loop ===================== */
function frame(){ tick++;
  const t=tapQ; tapQ=null;
  if(G.fadeDir!==0){ G.fade+=G.fadeDir*0.09; if(G.fadeDir>0&&G.fade>=1){G.fade=1;const c=G.fadeCb;G.fadeCb=null;c&&c();} else if(G.fadeDir<0&&G.fade<=0){G.fade=0;const c=G.fadeCb;G.fadeCb=null;c&&c();} }
  else { if(t) routeTap(t.x,t.y); if(G.screen==='field') updateField(); if(G.dialog&&G.screen!=='field') dlgAnim(); }
  X.clearRect(0,0,VW,VH);
  if(G.screen==='title') drawTitle();
  else if(G.screen==='intro') drawIntro();
  else if(G.screen==='field') drawField();
  else if(G.screen==='battle'){ drawBattle(); if(G.battle&&G.battle.phase==='faint'){ px(0,0,VW,VH,'#000a'); wrap(DATA.txt.faint,VW/2-VW*0.4,VH*0.42,VW*0.8,fz(TS*0.42)+4,C.ink,fz(TS*0.38)); T('▶ 탭',VW/2,VH*0.62,C.gold,fz(TS*0.34),'center'); } }
  else if(G.screen==='timecard') drawTimecard();
  if(G.fade>0){ X.fillStyle='rgba(0,0,0,'+G.fade+')'; X.fillRect(0,0,VW,VH); }
  requestAnimationFrame(frame);
}
function routeTap(x,y){ enableAudio();
  if(G.screen==='title'||G.screen==='intro'||G.screen==='timecard'){ hit(x,y); return; }
  if(G.screen==='field'){ fieldTap(x,y); return; }
  if(G.screen==='battle'){ const b=G.battle; if(b&&b.phase==='faint'){ resolveFaint(); return; } battleTap(x,y); return; }
}
let tapQ=null;
CV.addEventListener('pointerdown',e=>{ e.preventDefault(); const r=CV.getBoundingClientRect(); tapQ={x:(e.clientX-r.left),y:(e.clientY-r.top)}; },{passive:false});

resize(); G=newGame(); document.fonts&&document.fonts.load("12px 'Galmuri11'").catch(()=>{}); frame();
</script>
