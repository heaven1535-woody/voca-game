            }
            break;
          }
          case 'call': if (c.ev) (evRefs[c.ev] = evRefs[c.ev] || []).push(w); break;
          case 'amb': if (c.id != null && ambs.length && ambs.indexOf(c.id) < 0) err(w, '없는 환경음 ' + c.id); break;
          case 'spawn': if (!c.sprite || !(has(c.sprite + '_down_0') || has(c.sprite) || has(c.sprite + '_0'))) err(w, 'spawn 없는 스프라이트 ' + c.sprite); break;
          case 'sprite': if (!(has(c.sprite + '_down_0') || has(c.sprite) || has(c.sprite + '_0'))) err(w, '없는 스프라이트 ' + c.sprite); break;
          case 'fx': if (PARTICLES.indexOf(c.kind) < 0) err(w, '없는 입자 ' + c.kind); break;
          case 'trans': if (TRANS_KINDS.indexOf(c.kind || 'fade') < 0) err(w, '없는 전환 ' + c.kind); break;
          case 'map':
            if (c.trans && TRANS_KINDS.indexOf(c.trans) < 0) err(w, '없는 전환 ' + c.trans);
            if (isArr(c.at) && maps[c.id]) { const r = maps[c.id].tiles || []; if (!(c.at[1] >= 0 && c.at[1] < r.length && c.at[0] >= 0 && c.at[0] < (r[0] || '').length)) err(w, '맵 밖 좌표 ' + JSON.stringify(c.at)); }
            break;
          case 'learn': if (!bt.skills || !bt.skills[c.skill]) err(w, '없는 기술 ' + c.skill); break;
          case 'music': if (!MC.music || typeof MC.music[c.fn] !== 'function') err(w, '없는 music.' + c.fn); break;
          case 'act': if (c.ui && UI_PALS.indexOf(c.ui) < 0) err(w, '모르는 창 팔레트 ' + c.ui); break;
          case 'custom': if (!(MC.ch1 && MC.ch1.custom && MC.ch1.custom[c.id])) err(w, '없는 custom ' + c.id); break;
          case 'battle': if (c.bgm && !bgm[c.bgm]) err(w, '없는 곡 ' + c.bgm); break;
          case 'move': case 'face': case 'emote': case 'jump': case 'show': case 'despawn':
            for (const a of String(c.id == null ? 'player' : c.id).split(',').map(s => s.trim())) if (!allObjIds.has(a) && !spawnIds.has(a)) err(w, c.op + ' 없는 액터 ' + a);
            if (c.op === 'face' && c.dir && ['up', 'down', 'left', 'right', 'player', 'back'].indexOf(c.dir) < 0) err(w, '방향 ' + c.dir);
            break;
          case 'cam': if (typeof c.to === 'string' && c.to !== 'player' && !allObjIds.has(c.to) && !spawnIds.has(c.to)) err(w, 'cam 없는 대상 ' + c.to); break;
          case 'light': if (typeof c.at === 'string' && c.at !== 'player' && !allObjIds.has(c.at) && !spawnIds.has(c.at)) err(w, 'light 없는 대상 ' + c.at); break;
        }
        if (c.op === 'fx' && typeof c.at === 'string' && c.at !== 'player' && !allObjIds.has(c.at) && !spawnIds.has(c.at)) err(w, 'fx 없는 대상 ' + c.at);
      });
    }
    for (const mid in maps) for (const o of maps[mid].objects || []) collectCond(o.cond);
    // 참조되지 않는 이벤트(진입점이 아닌데 아무도 부르지 않음)
    const ENTRY = new Set(['a0.start', 'sys.faint']);
    for (const id of evIds) if (!evRefs[id] && !ENTRY.has(id)) inf('event ' + id, '어디서도 부르지 않음');
    // 읽기만 하고 켜지 않는 플래그(코드가 켜는 것일 수 있음 → 정보)
    for (const f of flagsRead) if (!flagsSet.has(f) && !/^s\d\./.test(f)) inf('flag ' + f, '이벤트에서 켜는 곳 없음(코드가 켜는지 확인)');
    for (const v of varsRead) if (!varsSet.has(v)) inf('var ' + v, '이벤트에서 정하는 곳 없음');

    /* 5. 전투 데이터 */
    const en = bt.enemies || {}, tr = bt.troops || {}, acts = bt.actions || {}, items = bt.items || {}, skills = bt.skills || {};
    for (const id in tr) {
      const t = tr[id], w = 'troop ' + id;
      if (!t.members || !t.members.length) err(w, 'members 없음');
      for (const e of t.members || []) if (!en[e]) err(w, '없는 적 ' + e);
      if (t.bgm && !bgm[t.bgm]) err(w, '없는 곡 ' + t.bgm);
    }
    for (const id in en) {
      const e = en[id], w = 'enemy ' + id;
      const spr = e.sprite || ('en_' + id);
      if (!has(spr)) err(w, '없는 스프라이트 ' + spr);
      for (const a of e.ai || []) if (!acts[a.act] && !skills[a.act]) err(w, '없는 행동 ' + a.act);
      for (const d of e.drops || []) if (!items[d.id]) err(w, '없는 드롭 ' + d.id);
      if (e.fam && bt.families && !bt.families[e.fam]) err(w, '없는 계열 ' + e.fam);
    }
    for (const id of ['bread', 'water', 'memory_pipe', 'inspector_note']) if (!items[id]) err('battle', '계약 아이템 없음 ' + id);
    for (const id of ['memory', 'thought', 'endure']) if (!skills[id]) err('battle', '계약 기술 없음 ' + id);
    for (const id of ['b1_rat', 'b1_rat2', 'b1_door', 'b1_rat3', 'b1_rat_door', 'b1_rat2_door', 'b1_mistake', 'despair1']) if (!tr[id]) err('battle', '계약 무리 없음 ' + id);
    const st0 = MC.game && MC.game.newState ? MC.game.newState() : null;
    if (st0) for (const m of st0.party || []) for (const s of m.skills || []) if (!skills[s]) err('newState', '없는 기술 ' + s);

    /* 6. 화자 */
    const spk = data.speakers || {};
    for (const id in spk) {
      const s = spk[id], w = 'speaker ' + id;
      if (s.portrait && !has(s.portrait)) err(w, '없는 초상 ' + s.portrait);
      if (voices && s.voice && voices.indexOf(s.voice) < 0) wrn(w, '없는 목소리 ' + s.voice);
    }

    /* 7. 오디오 계약 id */
    const SFX_REQ = 'ui_cursor ui_ok ui_cancel ui_ng page save step_stone step_wood step_street step_dream bump chest door_iron door_wood knock scratch stone_lift encounter encounter_boss atk skill_memory skill_thought weak hurt guard enemy_die enemy_act_despair enemy_act_madness heal mp_heal buff debuff seal scan flee overwhelm charge heartbeat breath gasp swing splash cannon_far bell candle_out dream_in dream_out voice34 card_tick quill fire_burst paper_burn gull drip glass_clink thud crowd_gasp sting wind_gust year_tick'.split(' ');
    for (const id of SFX_REQ) if (!sfxHas(id)) err('sfx', '계약 효과음 없음 ' + id);
    for (const id of ['marseille', 'marseille_evening', 'feast', 'dream_b1', 'battle', 'boss_despair', 'victory', 'levelup', 'item', 'faint', 'boss_clear', 'learn']) if (!bgm[id]) err('bgm', '계약 곡 없음 ' + id);

    const res = { errors: E, warnings: W, info: I, counts: { sprites: nSpr, maps: Object.keys(maps).length, events: evIds.length, errors: E.length, warnings: W.length, info: I.length } };
    if (opt.log !== false) {
      const head = '[dbg.validate] 오류 ' + E.length + ' · 경고 ' + W.length + ' · 정보 ' + I.length + ' (스프라이트 ' + nSpr + ', 맵 ' + res.counts.maps + ', 이벤트 ' + evIds.length + ')';
      if (E.length) console.warn(head + '\n' + E.slice(0, 60).join('\n'));
      else if (W.length) console.warn(head + '\n' + W.slice(0, 40).join('\n'));
      else console.info(head);
    }
    return res;
  };

  /* ---------- 패널 ---------- */
  let taps = [];
  D.init = function () {
    if (!MC.cfg.debug) return;
    MC.input.hooks.unshift(ev => {
      if (ev.type === 'tap' && !ev.key && ev.x < 26 && ev.y < 26 + G().safe.top) {
        const t = MC.time.real;
        taps = taps.filter(x => t - x < 700); taps.push(t);
        if (taps.length >= 3) { taps = []; D.panel = !D.panel; return true; }
      }
      if (D.panel && (ev.type === 'down' || ev.type === 'tap' || ev.type === 'up')) {
        const r = panelRect();
        if (ev.x >= r[0] && ev.x < r[0] + r[2] && ev.y >= r[1] && ev.y < r[1] + r[3]) {
          if (ev.type === 'tap') panelTap(ev.x - r[0], ev.y - r[1]);
          return true;
        }
      }
      return false;
    });
    MC.input.onKey(e => { if (e.key === '`' && !e.repeat) { D.panel = !D.panel; return true; } return false; });
  };
  function panelRect() { const g = G(); return [2, 2 + g.safe.top, g.W - 4, 118]; }
  const PANEL_BTNS = [['히트', () => D.hits()], ['×¼', () => D.speed(0.25)], ['×1', () => D.speed(1)], ['×3', () => D.speed(3)], ['닫기', () => { D.panel = false; }]];
  function panelTap(x, y) {
    const r = panelRect(), bw = Math.floor((r[2] - 8) / PANEL_BTNS.length);
    if (y >= r[3] - 22) { const i = Math.floor((x - 4) / bw); if (PANEL_BTNS[i]) PANEL_BTNS[i][1](); }
  }
  D.render = function () {
    if (!MC.cfg.debug || !D.panel) return;
    const g = G(), ctx = g.ctx, st = MC.core.stats, r = panelRect();
    g._beginFrame();
    ctx.globalAlpha = 0.86; g.rect(r[0], r[1], r[2], r[3], '#05060c'); ctx.globalAlpha = 1;
    g.rectO(r[0], r[1], r[2], r[3], '#4a4c62');
    const x = r[0] + 4; let y = r[1] + 3;
    const L = (s, c) => { MC.text.draw(s, x, y, { font: 'small', color: c || '#c8ccd8' }); y += 11; };
    L('FPS ' + st.fps + '  갱신 ' + st.upd.toFixed(1) + '  그림 ' + st.rnd.toFixed(1) + 'ms  ×' + MC.time.scale, '#ffcf4a');
    L('씬 ' + (MC.scene.stack.map(s => s.name || '?').join(' › ') || '(없음)'));
    const s = MC.state || {};
    let pos = s.map ? s.map + ' (' + s.x + ',' + s.y + ') ' + (s.dir || '') : '-';
    try { if (MC.field && MC.field.actor) { const a = MC.field.actor('player'); if (a && MC.field.map) pos = (MC.field.map.id || s.map) + ' (' + a.x + ',' + a.y + ') ' + a.dir; } } catch (_) {}
    L('맵 ' + pos + (D.ghostOn ? ' 유령' : ''));
    const evId = D.lastEvent || (MC.events && (MC.events.current || MC.events.lastId)) || '-';
    L('이벤트 ' + evId);
    L(G().W + '×' + G().H + ' S' + G().S + ' dpr' + G().dpr + ' 터치' + MC.ui.minTouch() + ' 입자' + MC.fx.particles.count());
    const e = MC.errors[MC.errors.length - 1];
    L('오류 ' + MC.errors.length + (e ? ' · ' + (e.where + ': ' + e.msg).slice(0, 30) : ''), MC.errors.length ? '#ff7a7a' : '#6a7088');
    // 프레임 ms 그래프 (16.7ms 선)
    const gx = x, gy = y + 1, gh = 16, n = st.hist.length;
    g.rect(gx, gy, n, gh, '#10121c');
    g.hline(gx, gy + gh - Math.round(16.7 / 33 * gh), n, '#3a3f58');
    for (let i = 0; i < n; i++) {
      const v = st.hist[(st.hi + i) % n], h = Math.min(gh, Math.max(1, Math.round(v / 33 * gh)));
      g.vline(gx + i, gy + gh - h, h, v > 12 ? '#e05a4a' : v > 6 ? '#ffcf4a' : '#66c96a');
    }
    const bw = Math.floor((r[2] - 8) / PANEL_BTNS.length), by = r[1] + r[3] - 20;
    PANEL_BTNS.forEach((b, i) => {
      const on = (i === 0 && D.showHits) || (i === 1 && MC.time.scale === 0.25) || (i === 2 && MC.time.scale === 1) || (i === 3 && MC.time.scale === 3);
      g.frame(r[0] + 4 + i * bw, by, bw - 3, 17, { small: true, sel: on });
      MC.text.draw(b[0], r[0] + 4 + i * bw + ((bw - 3) >> 1), by + 3, { font: 'small', align: 'center', color: on ? g.uiPal.f : g.uiPal.text });
    });

    const FLOOR = ['#2e3242', '#34384a'];
    function drawWorld(ox, oy) {

    function updatePlayer(dt) {

    }

    const LONG = '모렐 씨… 르클레르 선장님이 항해 중에 열병으로 돌아가셨습니다. 화물은 무사합니다.';
    sc.enter = () => { layout(); };
    sc.resume = () => { layout(); };
    sc.update = dt => {
      layout();
      updatePlayer(dt);
      MC.fx.particles.update(dt);
      for (const b of uiNow()) if (b.update) b.update();
      const t = stick.consumeTap();
      if (t) { lastTap = t; MC.fx.particles.emit('sparkle', t.x, t.y, 5); say('조사 (' + (t.x | 0) + ',' + (t.y | 0) + ')'); }
      typeT += dt;
    };
    sc.onInput = ev => {
      for (const u of uiNow()) if (u.onInput(ev)) return true;
      if (stick.onInput(ev)) return true;
      if (ev.type === 'tap' && ev.key) { MC.fx.particles.emit('sparkle', pl.x + 8, pl.y, 5); say('조사 (키)'); return true; }
      return false;
    };
    sc.onBack = () => say('뒤로가기 → onBack()');

    sc.render = () => {
      const [sx, sy] = MC.fx.shakeOffset();
      g.offset(sx, sy);
      drawWorld(0, 0);
      MC.fx.particles.render(0, 0);
      drawPlayer(0, 0);
      g.resetOffset();
      MC.fx.applyWorldPost();
      stick.render();
      const P = g.uiPal, X0 = g.X0, y0 = g.safe.top + 29;
      for (const b of tabs) { b.render(); }
      g.hline(X0 + 2 + sc.tab * 60 + 4, tabs[0].y + 21, 48, P.gold);
      if (sc.tab === 0) renderFonts(X0, y0);
      else if (sc.tab === 1) renderFrames(X0, y0);
      else renderFx(X0, y0);
      // 아래 정보 줄
      const by = g.H - 14 - g.safe.bottom;
      g.rect(0, by - 1, g.W, 15 + g.safe.bottom, '#05060c');
      const d = stick.dir, arrow = { up: '↑', down: '↓', left: '←', right: '→' }[d] || '·';
      MC.text.draw(g.W + '×' + g.H + ' S' + g.S + ' dpr' + (Math.round(g.dpr * 100) / 100) + ' 터치' + MC.ui.minTouch(), 3, by + 1, { font: 'small', color: 'dim' });
      MC.text.draw('스틱' + arrow + (stick.touching ? stick.mag.toFixed(1) : ''), g.W - 3, by + 1, { font: 'small', color: stick.active ? 'gold' : 'dim', align: 'right' });
      MC.fx.renderFloats(0, 0);
    };

    function panel(x, y, w, h) { g.frame(x, y, w, h); }
    function renderFonts(X0, y) {
      panel(X0 + 2, y, 176, 124);
      let yy = y + 7;
      MC.text.draw('본문 12 가나다 ABC 123', X0 + 9, yy); yy += 16;
      MC.text.draw('보조 10 에드몽 Lv3 HP 42/48', X0 + 9, yy + 1, { font: 'small', color: 'dim' }); yy += 14;
      MC.text.draw('굵게 12 제1막 마르세유', X0 + 9, yy, { font: 'bold', color: 'gold' }); yy += 17;
      MC.text.draw('1815년', X0 + 9, yy, { font: 'big' });
      MC.text.draw('34', X0 + 116, yy, { font: 'big', color: 'red', shadow: '#000' }); yy += 32;
      MC.text.draw('… ─ ▼ ◆ · ♪ ★ 「」 ○ ×', X0 + 9, yy); yy += 16;
      const j = MC.text.resolveJosa('쥐{이/가} 34번{은/는} 에드몽{을/를} 칼{으로/로}');
      MC.text.draw(j, X0 + 9, yy, { font: 'small', color: '#b8b4c8' });
      // 대화창 견본(타자기)
      const dy = g.H - 66 - g.safe.bottom - 16, dx = X0 + 2;
      g.frame(dx, dy - 30, 36, 36);
      if (g.hasSprite('pt_dantes')) g.sprite('pt_dantes', dx + 2, dy - 28); else { g.rect(dx + 4, dy - 26, 28, 28, '#3a3f58'); drawMiniFace(dx + 10, dy - 22); }
      const nm = (MC.state && MC.state.dispName) || '에드몽', nw = MC.text.width(nm) + 14;
      g.frame(X0 + 40, dy - 18, nw, 18, { small: true });
      MC.text.draw(nm, X0 + 47, dy - 17, { color: '#f0c860' });
      g.frame(dx, dy, 176, 62);
      const lines = MC.text.wrap(LONG, 160, 'body').slice(0, 3);
      let shown = Math.floor(typeT / 28), done = true;
      for (let i = 0; i < lines.length; i++) {
        let x = dx + 8;
        for (const ch of lines[i]) {
          if (shown-- <= 0) { done = false; break; }
          x += MC.text.drawChar(ch, x, dy + 8 + i * 16, 'body');
        }
        if (!done) break;
      }
      if (done) MC.ui.nextMark(dx + 176 - 12, dy + 62 - 12);
      if (typeT > 6000) typeT = 0;
    }
    function drawMiniFace(x, y) {
      g.rect(x, y, 16, 6, '#4a2e1e'); g.rect(x + 1, y + 6, 14, 10, '#f2c49a'); g.px(x + 4, y + 10, '#1a1020'); g.px(x + 11, y + 10, '#1a1020'); g.rect(x, y + 17, 16, 5, '#f4efe0'); g.rect(x + 6, y + 17, 4, 3, '#c83a32');
    }
    function renderFrames(X0, y) {
      const names = ['act1', 'act2', 'act3', 'act4', 'act5', 'dream', 'despair'];
      names.forEach((n, i) => {
        const x = X0 + 2 + (i % 3) * 60, yy = y + Math.floor(i / 3) * 32;
        g.frame(x, yy, 56, 28, { pal: n });
        MC.text.draw(n, x + 28, yy + 8, { font: 'small', align: 'center', color: g.pal(n).text });
      });
      g.frame(X0 + 62, y + 64, 56, 28, { small: true });
      MC.text.draw('small', X0 + 90, y + 72, { font: 'small', align: 'center' });
      g.frame(X0 + 122, y + 64, 56, 28, { sel: true });
      MC.text.draw('선택', X0 + 150, y + 71, { align: 'center', color: g.uiPal.f });
      for (const b of styleBtns) b.render();
      list.render();
    }
    function renderFx(X0, y) {
      for (const b of fxBtns) b.render();
      const yy = y + 4 + 4 * 29 + 2;
      MC.text.draw('빈 곳을 끌면 스틱, 짧게 탭하면 조사', X0 + 90, yy, { font: 'small', color: 'dim', align: 'center', shadow: '#000' });
      const gs = MC.fx.gradeState();
      MC.text.draw('채도 ' + gs.sat.toFixed(2) + (MC.fx.satSupported ? '' : '(대체)') + '  히트스톱 ' + (MC.time.frozen ? '●' : '○'), X0 + 90, yy + 13, { font: 'small', color: 'dim', align: 'center', shadow: '#000' });
    }
    return sc;
  }
})(window.MC);

</script>

      { "op": "sfx", "id": "scratch", "pan": 0.15, "pitch": 1.08 }, { "op": "vibrate", "p": [ 15, 70, 15, 70, 15 ] },
      { "op": "shake", "p": 0.14 },
      { "op": "fx", "kind": "dust", "at": [ 7, 6 ], "n": 6 },
      { "op": "wait", "ms": 700 },
      { "op": "emote", "id": "player", "kind": "exclaim" },
      { "op": "say", "who": "think", "t": [ "……멈추지 않아.{p:300} 이쪽으로 와?", "가까워지고 있어.{p:300} 누가,{p:200} 이쪽으로." ] },
      { "op": "set", "flag": "a3.scratch_night", "v": false },
      { "op": "set", "flag": "a3.scratch_done" },
      { "op": "save", "slot": "auto" },
      { "op": "wait", "ms": 600 },
      { "op": "fade", "to": 1, "ms": 1600 },

</script>
<script>/* ==== src/ch1/cards.js ==== */
/* cards.js — scenes 공용 유틸(MC.ch1.u: 안전한 소리 호출·디더 마스크·덮개 페이드·초상 찾기)과 연출 카드 3종
   MC.ch1.cards.timecard({t,sub,from,to}) 시간 경과 카드 / caption({t,ms,color}) 큰 글자 / closeup({who,face,t,ms}) 초상 2배 클로즈업. 모두 Promise. 담당: scenes */
(function (MC) { 'use strict';
  const ch1 = MC.ch1 || (MC.ch1 = {});
  if (!ch1.custom) ch1.custom = {};
  const G = () => MC.gfx;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

  /* ================================================================ 공용 유틸 (MC.ch1.u) */
  const warned = {};
  function warn(k, msg) { if (warned[k]) return; warned[k] = 1; try { console.warn('[scenes] ' + msg); } catch (_) {} }
  // MC[obj][fn](...args) — 없으면 경고 1회 후 무시, 예외는 오류 기록만
  function safe(objName, fn, args) {
    const o = MC[objName];
    if (!o || typeof o[fn] !== 'function') { warn(objName + '.' + fn, 'MC.' + objName + '.' + fn + ' 없음(건너뜀)'); return undefined; }
    try { return o[fn].apply(o, args); } catch (e) { if (MC.core) MC.core.error(e, 'scenes:' + objName + '.' + fn); return undefined; }
  }
  let vs = 0x2f6b1a3;
  const U = ch1.u = {
    warn, BAYER,
    sfx: (id, o) => safe('sfx', 'play', [id, o]),                  // 효과음(없는 모듈·id는 조용히)
    music: function (fn) { return safe('music', fn, Array.prototype.slice.call(arguments, 1)); },
    amb: function (fn) { return safe('amb', fn, Array.prototype.slice.call(arguments, 1)); },
    audio: function (fn) { return safe('audio', fn, Array.prototype.slice.call(arguments, 1)); },
    vibrate: p => { try { MC.input.vibrate(p); } catch (_) {} },
    // 연출용 난수(게임 MC.rng 시퀀스를 건드리지 않음)
    vr: () => { vs = (Math.imul(vs, 1664525) + 1013904223) >>> 0; return vs / 4294967296; },
    hash: (x, y, s) => {
      let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    },
    hasSong: id => !!(MC.data && MC.data.bgm && MC.data.bgm[id])
  };

  /* ---------- 캐시된 디더 마스크 ---------- */
  const maskCache = new Map();
  function cached(key, make) {
    let c = maskCache.get(key);
    if (c) { maskCache.delete(key); maskCache.set(key, c); return c; }
    c = make(); maskCache.set(key, c);
    if (maskCache.size > 140) maskCache.delete(maskCache.keys().next().value);
    return c;
  }
  function paint(w, h, fn, color) {            // fn(x,y) -> 단계 0..16 (Bayer 비교)
    const c = G().makeCanvas(w, h), x = c.getContext('2d'), id = x.createImageData(w, h), d = id.data, col = G().rgb(color);
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
      const lv = fn(xx, yy);
      if (lv > BAYER[(yy & 3) * 4 + (xx & 3)]) { const o = (yy * w + xx) * 4; d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255; }
    }
    x.putImageData(id, 0, 0);
    return c;
  }
  // 둥근 빛(디더): 가운데 peak 단계 → 가장자리 0. 크기 2r+1
  U.glow = function (r, color, peak, pow) {
    r = Math.max(1, Math.round(r)); peak = peak == null ? 16 : peak; pow = pow || 1.4;
    return cached('g|' + r + '|' + color + '|' + peak + '|' + pow, () => paint(2 * r + 1, 2 * r + 1, (x, y) => {
      const d = Math.hypot(x - r, y - r) / (r + 0.5);
      return d >= 1 ? 0 : peak * Math.pow(1 - d, pow);
    }, color));
  };
  // 어둠 구멍: 반지름 inner 비율 안은 완전히 비고, r까지 디더로 짙어짐. 크기 2r+1 (바깥은 drawHole이 채움)
  U.hole = function (r, color, inner) {
    r = Math.max(1, Math.round(r)); inner = inner == null ? 0.45 : inner;
    return cached('h|' + r + '|' + color + '|' + inner, () => paint(2 * r + 1, 2 * r + 1, (x, y) => {
      const d = Math.hypot(x - r, y - r) / (r + 0.5);
      if (d >= 1) return 17;
      return 16 * MC.clamp((d - inner) / (1 - inner), 0, 1);
    }, color));
  };
  U.drawHole = function (cx, cy, r, color, inner) {
    const g = G(); cx |= 0; cy |= 0; r = Math.round(r);
    if (r <= 0) { g.rect(0, 0, g.W, g.H, color); return; }
    const c = U.hole(r, color, inner), x0 = cx - r, y0 = cy - r, s = 2 * r + 1;
    g.ctx.drawImage(c, x0, y0);
    g.rect(0, 0, g.W, y0, color); g.rect(0, y0 + s, g.W, g.H - y0 - s, color);
    g.rect(0, y0, x0, s, color); g.rect(x0 + s, y0, g.W - x0 - s, s, color);
  };
  // 화면 비네트(디더): step 0..16
  U.vig = function (step, color) {
    const g = G(), W = g.W, H = g.H; step = MC.clamp(Math.round(step), 0, 16);
    return cached('v|' + W + 'x' + H + '|' + step + '|' + color, () => {
      const a = step / 16, inner = 1.0 - a * 0.7, band = 0.3 + a * 0.12, cx = (W - 1) / 2, cy = (H - 1) / 2;
      return paint(W, H, (x, y) => {
        const dx = (x - cx) / (W / 2), dy = (y - cy) / (H / 2), d = Math.sqrt(dx * dx * 1.05 + dy * dy * 0.95);
        const t = (d - inner) / band;
        return t <= 0 ? 0 : t >= 1 ? 17 : t * 17;
      }, color);
    });
  };
  U.drawVig = function (step, color) { if (step >= 0.5) G().ctx.drawImage(U.vig(step, color || '#000000'), 0, 0); };

  /* ---------- 디더로 나타나는 그림 ---------- */
  const tmpMap = new Map();
  function tmpCanvas(w, h) {
    const k = w + 'x' + h; let c = tmpMap.get(k);
    if (!c) { c = G().makeCanvas(w, h); tmpMap.set(k, c); if (tmpMap.size > 24) tmpMap.delete(tmpMap.keys().next().value); }
    return c;
  }
  // img(캔버스)를 level 0..16 디더 밀도로 그림(16=그대로). scale 정수 확대
  U.drawDither = function (img, x, y, level, scale) {
    if (!img) return;
    level = Math.round(level); if (level <= 0) return;
    scale = scale > 1 ? scale | 0 : 1;
    const w = img.width * scale, h = img.height * scale, ctx = G().ctx;
    if (level >= 16) { if (scale > 1) ctx.drawImage(img, x | 0, y | 0, w, h); else ctx.drawImage(img, x | 0, y | 0); return; }
    const t = tmpCanvas(w, h), tx = t.getContext('2d');
    tx.globalCompositeOperation = 'source-over'; tx.globalAlpha = 1; tx.imageSmoothingEnabled = false;
    tx.clearRect(0, 0, w, h);
    tx.drawImage(img, 0, 0, w, h);
    tx.globalCompositeOperation = 'destination-in';
    tx.fillStyle = G().pattern('#ffffff', level); tx.fillRect(0, 0, w, h);
    tx.globalCompositeOperation = 'source-over';
    ctx.drawImage(t, x | 0, y | 0);
  };
  U.spr = name => (G().hasSprite(name) ? G().getSprite(name) : null);
  U.drawSpr = function (name, x, y, level, scale) { const c = U.spr(name); if (c) U.drawDither(c, x, y, level == null ? 16 : level, scale); return !!c; };
  // 글자를 한 자씩(앞 n자) — 왼쪽 x부터. colorFn(ch,i)로 글자별 색
  U.typeChars = function (chars, n, x, y, font, colorFn, jit) {
    for (let i = 0; i < n && i < chars.length; i++) {
      const ch = chars[i], j = jit ? jit(i) : 0;
      x += MC.text.drawChar(ch, x, y + j, font, colorFn ? colorFn(ch, i) : null);
    }
    return x;
  };
  U.lvl = (t, t0, ms) => (t < t0 ? 0 : MC.clamp((t - t0) / Math.max(1, ms), 0, 1) * 16);   // 시각 → 디더 단계

  /* ---------- 덮개 페이드 ----------
     페이드(검정 덮개)는 모든 씬 위에 그려진다. 우리 불투명 씬이 떠 있는 동안에는 페이드를 '월드 층'으로 내려
     (우리가 월드 후처리를 부르지 않으니 안 보임) 우리 화면을 보이게 하고, 끝나면 같은 단계로 다시 올린다.
     그 사이에 다른 곳에서 fade를 부르면 그 값이 그대로 남는다. */
  U.coverBegin = function () {
    const lv = MC.fx.fadeLevel ? MC.fx.fadeLevel() : 0;
    if (lv > 0.001) MC.fx.fade(lv, 0, { world: true });
    return lv;
  };
  U.coverEnd = function () {
    const lv = MC.fx.fadeLevel ? MC.fx.fadeLevel() : 0;
    if (lv > 0.001) MC.fx.fade(lv, 0);
  };

  /* ---------- 화자·초상 ---------- */
  const SPK = {
    dantes: ['에드몽', '#f0c860'], morrel: ['모렐', '#c8d8a0'], danglars: ['당글라르', '#b8b0c8'], fernand: ['페르낭', '#b8b0c8'],
    caderousse: ['카드루스', '#b8b0c8'], mercedes: ['메르세데스', '#f08a8a'], father: ['아버지', '#d8c8a8'], villefort: ['빌포르', '#a8c0e0'],
    police: ['경찰관', '#a0a8b8'], guard: ['호송병', '#a0a8b8'], jailer: ['간수', '#a8a090'], inspector: ['감찰관', '#a8b0a0'],
    sailor: ['늙은 선원', '#c0c8d0'], boy: ['뤼크', '#c0d8f0'], guest: ['하객', '#d0c8c0'], despair: ['절망', '#8aa0ff'], voice: ['목소리', '#8aa0ff'], unknown: ['???', '#a0a0a0']
  };
  U.speaker = function (who) {
    const sp = (MC.data && MC.data.speakers && MC.data.speakers[who]) || null;
    const d = SPK[who] || [who || '', '#d0c8c0'];
    let name = (sp && sp.name) || d[0];
    if (who === 'dantes' && MC.state && MC.state.dispName) name = MC.state.dispName;
    const color = (sp && (sp.color || sp.nameColor)) || d[1];
    let pt = 'pt_' + who;
    if (sp && 'portrait' in sp) pt = sp.portrait; else if (sp && 'pt' in sp) pt = sp.pt;
    return { name, color, pt, voice: (sp && sp.voice) || who };
  };
  U.portrait = function (who, face) {
    const g = G();
    let base = U.speaker(who).pt;
    if (!base) return null;
    if (who === 'dantes' && MC.game && MC.game.getVar('dantesLook') === 'prison' && g.hasSprite('pt_dantes_prison')) base = 'pt_dantes_prison';
    if (face && g.hasSprite(base + '_' + face)) return base + '_' + face;
    return g.hasSprite(base) ? base : null;
  };
  // 초상이 없을 때: 어두운 머리·어깨 실루엣(size 32 기준, scale배)
  U.silhouette = function (x, y, scale, rim) {
    const g = G(), s = scale || 1;
    g.rect(x, y, 32 * s, 32 * s, '#0b0a10');
    g.circle(x + 16 * s, y + 13 * s, 7 * s, '#1c1a24');
    g.rect(x + 6 * s, y + 22 * s, 20 * s, 10 * s, '#1c1a24');
    g.rect(x + 9 * s, y + 20 * s, 14 * s, 3 * s, '#1c1a24');
    if (rim) { g.rect(x + 22 * s, y + 9 * s, s, 8 * s, rim); g.rect(x + 25 * s, y + 23 * s, s, 8 * s, rim); }
  };

  /* ---------- 떠다니는 먼지 ---------- */
  class Motes {
    constructor(n, box) {
      this.p = []; this.box = box;
      for (let i = 0; i < n; i++) this.p.push({ x: U.vr(), y: U.vr(), vx: (U.vr() - 0.5) * 1.6, vy: -(0.5 + U.vr() * 1.5), ph: U.vr() * 6.28, c: U.vr() < 0.35 ? '#8a8898' : '#4e4c5c' });
    }
    update(dt) {
      const s = dt / 1000, b = this.box();
      for (const p of this.p) { p.x += p.vx * s / b[2]; p.y += p.vy * s / b[3]; if (p.y < 0) p.y += 1; if (p.x < 0) p.x += 1; if (p.x > 1) p.x -= 1; }
    }
    render(t, a) {
      const b = this.box(), ctx = G().ctx;
      for (const p of this.p) {
        const tw = 0.5 + 0.5 * Math.sin(t * 0.0021 + p.ph), al = (tw > 0.66 ? 1 : tw > 0.33 ? 0.6 : 0.3) * (a == null ? 1 : a);
        if (al <= 0.05) continue;
        ctx.globalAlpha = al; G().px(b[0] + p.x * b[2], b[1] + p.y * b[3], p.c);
      }
      ctx.globalAlpha = 1;
    }
  }
  U.Motes = Motes;

  // 가운데 정렬로 한 자씩 찍히는 줄(글자 수 기준 폭 고정)
  function typedLine(str, n, cx, y, font, colorFn) {
    const chars = Array.from(str), w = MC.text.width(str, font);
    U.typeChars(chars, n, cx - (w >> 1), y, font, colorFn);
  }
  U.typedLine = typedLine;

  /* ================================================================ 시간 경과 카드 (REDESIGN D-3 e) */
  // opt: {t:'─── 2년 후 ───', sub:'1817년', from:1815, to:1817, line?, spr?:[전,후]|false, auto?:ms}
  function timecard(opt) {
    opt = opt || {};
    const g = G();
    const title = String(opt.t || ''), tChars = Array.from(title);
    const from = opt.from != null ? +opt.from : null, to = opt.to != null ? +opt.to : null;
    const roll = from != null && to != null && !isNaN(from) && !isNaN(to) && to !== from;
    const steps = roll ? Math.min(10, Math.abs(to - from)) : 0;
    let sub = opt.sub != null ? String(opt.sub) : '';
    if (roll && sub.replace(/\s/g, '') === to + '년') sub = '';
    const line = opt.line ? String(opt.line) : '';
    let sprA = null, sprB = null;
    if (Array.isArray(opt.spr) && opt.spr.length === 2) { sprA = opt.spr[0]; sprB = opt.spr[1]; }
    else if (roll && to > from && opt.spr !== false) {
      sprA = g.hasSprite('ch_dantes_prison_down_0') ? 'ch_dantes_prison_down_0' : 'ch_dantes_down_0';
      sprB = 'ch_dantes2_down_0';
    }
    if (!(sprA && g.hasSprite(sprA) && g.hasSprite(sprB))) sprA = sprB = null;

    // 시간표(ms)
    const T_TITLE = 400, CH = 60, STEP = 220, GAP = 90;
    const tTitleEnd = T_TITLE + tChars.length * CH;
    const tYear = roll ? tTitleEnd + 250 : -1;
    const tRoll = roll ? tYear + 520 : -1;
    const tRollEnd = roll ? tRoll + steps * (STEP + GAP) : tTitleEnd;
    const tSub = sub ? (roll ? tRollEnd + 300 : tTitleEnd + 350) : -1;
    const tLine = line ? Math.max(tSub + 400, tRollEnd + 300) : -1;
    const tEnd = Math.max(tTitleEnd, tRollEnd, tSub >= 0 ? tSub + 320 : 0, tLine >= 0 ? tLine + 320 : 0);
    const AUTO = opt.auto != null ? +opt.auto : 4000;
    const yearAt = i => (steps ? Math.round(from + (to - from) * i / steps) : to) + '년';
    const dust = new Motes(8, () => [g.X0 + 10, (g.H >> 1) - 90, 160, 180]);

    return new Promise(resolve => {
      const sc = { name: 'timecard', opaque: true, blocking: true, t: 0, markAt: tEnd + 1200, out: -1, ticks: 0, yi: 0, done: false, settle: -1 };
      function rollState(t) {                    // [완료 단계, 진행 0..1]
        if (!roll || t < tRoll) return [0, 0];
        const k = t - tRoll, per = STEP + GAP;
        const i = Math.min(steps, Math.floor(k / per));
        if (i >= steps) return [steps, 0];
        return [i, MC.clamp((k - i * per) / STEP, 0, 1)];
      }
      function skip() {
        if (sc.t < tEnd) { sc.t = tEnd; sc.ticks = tChars.length; sc.yi = steps; sc.markAt = tEnd + 300; }
      }
      function startOut() { if (sc.out < 0) { sc.out = 0; } }
      async function finish() {
        if (sc.done) return; sc.done = true;
        const stk = MC.scene.stack, i = stk.indexOf(sc), below = i > 0 ? stk[i - 1] : null;
        MC.scene.remove(sc);
        U.coverEnd();
        // 아래가 보이는 상태면 디더로 드러낸다(아래가 이벤트 러너의 검은 바탕이면 곧바로 넘김)
        if ((MC.fx.fadeLevel ? MC.fx.fadeLevel() : 0) < 0.01 && !(below && below.name === 'ev_under')) {
          MC.fx.fade(1, 0);
          await MC.fx.fade(0, 400);
        }
        resolve();
      }
      sc.enter = () => { U.coverBegin(); };
      sc.update = dt => {
        sc.t += dt;
        const t = sc.t;
        const n = t < T_TITLE ? 0 : Math.min(tChars.length, Math.floor((t - T_TITLE) / CH) + 1);
        while (sc.ticks < n) { const c = tChars[sc.ticks]; if (c !== ' ') U.sfx('card_tick', { pitch: c === '─' ? 0.84 : 1 }); sc.ticks++; }
        if (roll) {
          const rs = rollState(t), k = rs[0] + (rs[1] > 0 ? 1 : 0);
          while (sc.yi < k) { sc.yi++; U.sfx('year_tick', { pitch: 1 + sc.yi * 0.04 }); if (sc.yi === steps) sc.settle = t; }
        }
        dust.update(dt);
        if (sc.out < 0 && AUTO > 0 && t >= sc.markAt + AUTO) startOut();
        if (sc.out >= 0) { sc.out += dt; if (sc.out >= 420) finish(); }
      };
      sc.onInput = ev => {
        if ((ev.type === 'tap' || ev.type === 'long') && sc.t > 250) {
          if (sc.t < tEnd) skip();
          else if (sc.t >= sc.markAt - 900) startOut();
        }
        return true;
      };
      sc.onBack = () => {};
      sc.render = () => {
        g.clear('#040306');
        const t = sc.t, W = g.W, H = g.H, cx = W >> 1;
        const cy = (H >> 1) - (sprA ? 30 : 16);
        dust.render(t, 0.9);
        // 제목(한 자씩)
        const n = t < T_TITLE ? 0 : Math.min(tChars.length, Math.floor((t - T_TITLE) / CH) + 1);
        const titleY = roll ? cy - 40 : cy - 22;
        if (n > 0) typedLine(title, n, cx, titleY, 'body', c => (c === '─' ? '#5c5a6c' : '#e8e4d8'));
        // 연도 롤
        if (roll && t >= tYear) {
          const lv = U.lvl(t, tYear, 260), yy = cy - 14, rs = rollState(t);
          const e = MC.ease.outCubic(rs[1]);
          const settled = sc.settle >= 0 ? t - sc.settle : -1;
          const cur = yearAt(rs[0]), nxt = yearAt(Math.min(steps, rs[0] + 1));
          g.pushClip(0, yy + 1, W, 26);
          const colA = rs[0] >= steps ? (settled >= 0 && settled < 90 ? '#ffffff' : '#f0ece0') : '#b8bccc';
          const imgA = MC.text.bake(cur, 'big', colA, { outline: '#000' });
          const bump = settled >= 0 && settled < 160 ? Math.round(2 * (1 - settled / 160)) : 0;
          if (rs[1] > 0) {
            const imgB = MC.text.bake(nxt, 'big', '#b8bccc', { outline: '#000' });
            U.drawDither(imgA, cx - (imgA.width >> 1), yy - 1 - Math.round(e * 26), lv);
            U.drawDither(imgB, cx - (imgB.width >> 1), yy - 1 + 26 - Math.round(e * 26), lv);
          } else U.drawDither(imgA, cx - (imgA.width >> 1), yy - 1 - bump, lv);
          g.popClip();
        }
        // 부제·설명 줄
        if (sub && t >= tSub) {
          const img = MC.text.bake(sub, 'body', roll ? '#c8c4b8' : '#a8a4b4');
          U.drawDither(img, cx - (img.width >> 1), roll ? cy + 16 : cy + 2, U.lvl(t, tSub, 320));
        }
        if (line && t >= tLine) {
          const ls = MC.text.wrap(line, 164, 'small');
          for (let i = 0; i < ls.length; i++) {
            const img = MC.text.bake(ls[i], 'small', '#8a8898');
            U.drawDither(img, cx - (img.width >> 1), (roll ? cy + 34 : cy + 22) + i * 13, U.lvl(t, tLine, 320));
          }
        }
        // 전후 당테스(2배, 나란히)
        if (sprA && t >= tYear) {
          const sy = cy + (line ? 62 : 42), rs = rollState(t);
          const pB = rs[0] >= steps ? 1 : (rs[0] + MC.ease.outCubic(rs[1])) / steps;
          const la = U.lvl(t, tYear, 300);
          g.hline(cx - 44, sy + 32, 26, '#15141c'); g.hline(cx + 18, sy + 32, 26, '#15141c');
          U.drawSpr(sprA, cx - 48, sy, Math.min(la, 16 - pB * 7), 2);
          for (let i = 0; i < 3; i++) { if (pB * 3 > i) g.px(cx - 6 + i * 5, sy + 18, '#5c5a6c'); }
          U.drawSpr(sprB, cx + 16, sy, t >= tRoll ? pB * 16 : 0, 2);
          if (sc.settle >= 0 && t - sc.settle > 420) {
            const bob = ((t / 400) | 0) & 1;
            if (!U.drawSpr('em_dots', cx + 26, sy - 13 - bob, U.lvl(t, sc.settle + 420, 180))) MC.text.draw('…', cx + 28, sy - 14, { font: 'small', color: '#9a98a8' });
          }
        }
        // ▼ (내용 바로 아래)
        if (t >= sc.markAt && sc.out < 0) {
          const bottom = sprA ? cy + (line ? 62 : 42) + 34 : (line ? (roll ? cy + 34 : cy + 22) + 26 : cy + 34);
          MC.ui.nextMark(cx - 3, Math.min(H - 34 - g.safe.bottom, bottom + 22));
        }
        if (t < 400) g.ditherFill('#000', 16 - t / 400 * 16);        // 첫 검정에서 서서히
        if (sc.out >= 0) g.ditherFill('#000', MC.clamp(sc.out / 400, 0, 1) * 16);
      };
      MC.scene.push(sc);
    });
  }

  /* ================================================================ 캡션 (화면 가운데 큰 글자) */
  // opt: {t, ms=1500, color, echo?} — color를 주면 '목소리' 느낌(잔상+떨림)이 기본
  function caption(opt) {
    opt = typeof opt === 'string' ? { t: opt } : (opt || {});
    const g = G();
    const str = String(opt.t || ''), ms = Math.max(300, opt.ms == null ? 1500 : +opt.ms);
    const color = opt.color || '#f0ece0';
    const echo = opt.echo != null ? !!opt.echo : !!opt.color;
    const font = MC.text.width(str, 'big') > g.W - 16 ? 'bold' : 'big';
    const img = MC.text.bake(str, font, color, { outline: '#000' });
    const IN = Math.min(200, ms * 0.25), OUT = Math.min(260, ms * 0.3);
    return new Promise(resolve => {
      const sc = { name: 'caption', opaque: false, blocking: true, t: 0, dark: false, jx: 0, jy: 0, jt: 0, done: false };
      sc.enter = () => { if ((MC.fx.fadeLevel ? MC.fx.fadeLevel() : 0) >= 0.5) { sc.dark = true; sc.opaque = true; U.coverBegin(); } };
      sc.update = dt => {
        sc.t += dt;
        if (echo && sc.t - sc.jt >= 60) { sc.jt = sc.t; sc.jx = U.vr() < 0.3 ? (U.vr() < 0.5 ? -1 : 1) : 0; sc.jy = U.vr() < 0.2 ? (U.vr() < 0.5 ? -1 : 1) : 0; }
        if (sc.t >= ms && !sc.done) { sc.done = true; MC.scene.remove(sc); if (sc.dark) U.coverEnd(); resolve(); }
      };
      sc.onInput = () => true;
      sc.onBack = () => {};
      sc.render = () => {
        if (sc.dark) g.clear('#000');
        if (!img) return;
        const t = sc.t;
        let lv = 16, dy = 0;
        if (t < IN) { const p = t / IN; lv = p * 16; dy = Math.round((1 - MC.ease.outCubic(p)) * 4); }
        else if (t > ms - OUT) lv = MC.clamp((ms - t) / OUT, 0, 1) * 16;
        const x = (g.W - img.width) >> 1, y = (g.H >> 1) - (img.height >> 1) - 10 + dy;
        if (echo) {
          U.drawDither(img, x + 3 + sc.jx, y + 1, lv * 0.22);
          U.drawDither(img, x + 1 - sc.jx, y, lv * 0.45);
          U.drawDither(img, x + sc.jx, y + sc.jy, lv);
        } else {
          const my = y + (img.height >> 1) + (font === 'big' ? 1 : 0), L = Math.min(34, (g.W - img.width) / 2 - 10);
          if (!sc.dark) g.ditherRect(0, y - 8, g.W, img.height + 16, '#05060c', Math.round(lv * 0.7));   // 정지 화면(세 손) 위에서도 읽히게 옅은 띠
          if (L > 6) {
            g.ditherRect(x - 6 - L, my, L, 1, '#6a6878', lv);
            g.ditherRect(x + img.width + 6, my, L, 1, '#6a6878', lv);
          }
          U.drawDither(img, x, y, lv);
        }
      };
      MC.scene.push(sc);
    });
  }

  /* ================================================================ 클로즈업 (REDESIGN D-8: 높이 88 검은 띠 + 초상 2배) */
  let lastCloseEnd = -1e9;
  // opt: {who, face, t, ms=1200}
  function closeup(opt) {
    opt = opt || {};
    const g = G();
    const who = opt.who || 'unknown', ms = Math.max(400, opt.ms == null ? 1200 : +opt.ms);
    const spk = U.speaker(who);
    const pt = (opt.sprite && G().hasSprite(opt.sprite)) ? opt.sprite : U.portrait(who, opt.face);   // 이벤트 러너가 고른 초상 우선
    if (opt.name) spk.name = opt.name;
    if (opt.color) spk.color = opt.color;
    const cont = MC.time.real - lastCloseEnd < 260;          // 연속 클로즈업이면 띠를 새로 열지 않음
    const BAND = 88, OPEN = cont ? 0 : 170, SLIDE = 230, OUT = 150;
    const text = opt.t ? MC.text.resolveJosa(String(opt.t)) : '';
    let tFont = 'body', tLines = text ? MC.text.wrap(text, 92, 'body') : [];
    if (tLines.length > 4) { tFont = 'small'; tLines = MC.text.wrap(text, 92, 'small').slice(0, 6); }
    return new Promise(resolve => {
      const sc = { name: 'closeup', opaque: false, blocking: true, t: 0, dark: false, done: false };
      sc.enter = () => { if ((MC.fx.fadeLevel ? MC.fx.fadeLevel() : 0) >= 0.5) { sc.dark = true; sc.opaque = true; U.coverBegin(); } };
      sc.update = dt => {
        sc.t += dt;
        if (sc.t >= ms && !sc.done) { sc.done = true; lastCloseEnd = MC.time.real; MC.scene.remove(sc); if (sc.dark) U.coverEnd(); resolve(); }
      };
      sc.onInput = () => true;
      sc.onBack = () => {};
      sc.render = () => {
        const t = sc.t, W = g.W, H = g.H;
        if (sc.dark) g.clear('#000');
        else g.ditherFill('#000', cont ? 7 : Math.min(7, t / Math.max(1, OPEN) * 7));
        const mid = (H >> 1) - 12;
        const bh = OPEN ? Math.round(BAND * MC.ease.outCubic(MC.clamp(t / OPEN, 0, 1))) : BAND;
        const top = mid - (bh >> 1);
        g.rect(0, top, W, bh, '#000');
        if (bh >= 4) { g.hline(0, top, W, '#2c2a36'); g.hline(0, top + bh - 1, W, '#2c2a36'); g.ditherRect(0, top + 1, W, 1, '#2c2a36', 6); g.ditherRect(0, top + bh - 2, W, 1, '#2c2a36', 6); }
        if (bh < BAND) return;
        const tx = text ? g.X0 + 12 : ((W - 64) >> 1) - 22, py = mid - 32;
        const t1 = t - OPEN * 0.5;
        let px = tx;
        if (t1 < SLIDE) px = Math.round(-70 + (tx + 70) * MC.ease.outCubic(MC.clamp(t1 / SLIDE, 0, 1)));
        else if (t > ms - OUT) px = Math.round(tx + (W + 6 - tx) * MC.ease.inQuad(MC.clamp((t - (ms - OUT)) / OUT, 0, 1)));
        g.rectO(px - 2, py - 2, 68, 68, '#26242e');
        if (pt) g.sprite(pt, px, py, { scale: 2 }); else U.silhouette(px, py, 2, spk.color);
        const la = t < ms - OUT ? U.lvl(t1, SLIDE * 0.6, 200) : MC.clamp((ms - t) / OUT, 0, 1) * 16;
        const nm = MC.text.bake(spk.name, 'small', spk.color, { shadow: '#000' });
        if (text) {                                  // 이름(머리) + 본문을 초상 오른쪽에 세로 가운데로
          const lh = MC.text.LINE[tFont], block = 15 + tLines.length * lh, y0 = mid - (block >> 1) + 15;
          if (nm) U.drawDither(nm, g.X0 + 88, y0 - 15, la);
          for (let i = 0; i < tLines.length; i++) U.drawDither(MC.text.bake(tLines[i], tFont, '#e8e4d8'), g.X0 + 88, y0 + i * lh, la);
        } else if (nm) {                             // 이름만: 초상 오른쪽 아래, 띠 안
          const nx = Math.min(W - 4 - nm.width, px + 70);
          U.drawDither(nm, nx, mid + 18, la);
          g.ditherRect(nx, mid + 32, nm.width, 1, spk.color, la * 0.5);
        }
      };
      MC.scene.push(sc);
    });
  }

  ch1.cards = { timecard, caption, closeup };
})(window.MC);

</script>
<script>/* ==== src/ch1/minigames.js ==== */
/* minigames.js — 미니게임. breath: 자루 속 숨 참기(검은 화면 + cu_sack 천 결, 심장 72→142bpm에 맞춘 비네트 맥동, 누르고 있는 동안 '숨' 게이지가 버팀,
   손을 떼면 흔들림과 '아직!'). MC.ch1.minigames.breath({sec, fail}) -> Promise<{ok, ms, releases}>. 담당: scenes */
(function (MC) { 'use strict';
  const ch1 = MC.ch1, U = ch1.u, G = () => MC.gfx;

  // 천 결: cu_sack 반복 타일(없으면 절차 생성)
  let weave = null;
  function weaveTile() {
    if (weave) return weave;
    const s = U.spr('cu_sack');
    if (s) { weave = s; return s; }
    const c = G().makeCanvas(16, 16), x = c.getContext('2d');
    for (let yy = 0; yy < 16; yy++) for (let xx = 0; xx < 16; xx++) {
      const over = (((xx >> 1) + (yy >> 1)) & 1) === 0, h = U.hash(xx, yy, 5);
      x.fillStyle = over ? (yy & 1 ? '#33281b' : '#443625') : (xx & 1 ? '#33281b' : '#443625');
      if (h < 0.12) x.fillStyle = '#231a12';
      x.fillRect(xx, yy, 1, 1);
    }
    weave = c; return c;
  }
  // 천 너머 빛: 계단형(5단) 원형 알파 마스크 — 디더 구멍을 천 결 위에 겹치면 무아레가 생겨서 계단 밝기로 대신
  let maskC = null;
  function lightMask() {
    if (maskC) return maskC;
    const R = 48, S = 2 * R + 1, c = G().makeCanvas(S, S), x = c.getContext('2d'), id = x.createImageData(S, S), d = id.data;
    const STEP = [1, 0.74, 0.5, 0.3, 0.14];
    for (let yy = 0; yy < S; yy++) for (let xx = 0; xx < S; xx++) {
      const r = Math.hypot(xx - R, yy - R) / (R + 0.5);
      if (r >= 1) continue;
      const k = Math.min(STEP.length - 1, Math.floor(Math.pow(r, 1.25) * STEP.length)), o = (yy * S + xx) * 4;
      d[o] = d[o + 1] = d[o + 2] = 255; d[o + 3] = Math.round(STEP[k] * 255);
    }
    x.putImageData(id, 0, 0);
    maskC = c; return c;
  }
  let litC = null;
  function litCanvas(W, H) {
    if (!litC || litC.width !== W || litC.height !== H) litC = G().makeCanvas(W, H);
    return litC;
  }

  function breath(opt) {
    opt = opt || {};
    const g = G();
    const sec = Math.max(1, +opt.sec || 5), DUR = sec * 1000, canFail = opt.fail === true;
    const DRAIN_HOLD = 0.8 / DUR;        // 계속 버티면 끝에 숨 0.2가 남는다
    const DRAIN_FREE = 0.4 / 1000;       // 손을 떼고 있으면 초당 0.4 (fail:true면 약 1.5초 만에 바닥)
    const FLOOR = canFail ? 0 : 0.07;
    const S = {
      t: 0, phase: 'intro', prog: 0, air: 1, held: false, paused: false, releases: 0,
      nextBeat: 500, pulse: 0, ajikT: -1e9, freeT: 0, lastShake: 0, endT: -1, result: null,
      holdT0: -1, lowWarn: false, promptA: 0, done: false
    };
    return new Promise(resolve => {
      const sc = { name: 'breath', opaque: true, blocking: true };
      function finish() {
        if (S.done) return; S.done = true;
        MC.scene.remove(sc);
        U.coverEnd();
        resolve(S.result || { ok: true, ms: Math.round(S.prog * DUR), releases: S.releases });
      }
      function beat() {
        const bpm = 72 + 70 * S.prog + (S.phase === 'hold' && !S.held ? 14 : 0);
        S.nextBeat = S.t + 60000 / bpm;
        S.pulse = 1;
        U.sfx('heartbeat', { gain: 0.65 + 0.5 * S.prog, pitch: 1 + S.prog * 0.06 });
        if (S.prog > 0.55) U.vibrate(12);
      }
      function release() {
        S.releases++; S.ajikT = S.t; S.freeT = 0;
        MC.fx.shake(0.4); U.vibrate([20, 30, 20]);
        U.sfx('gasp', { gain: 0.55, pitch: 1.15 });
        S.air = Math.max(FLOOR, S.air - 0.06);
      }
      sc.enter = () => { U.coverBegin(); };
      sc.update = dt => {
        S.t += dt;
        const down = MC.input.isDown() && !document.hidden;
        if (S.t >= S.nextBeat && S.phase !== 'end') beat();
        S.pulse = Math.max(0, S.pulse - dt / 320);
        if (S.phase === 'intro') {
          S.promptA = Math.min(1, S.promptA + dt / 300);
          if (down && S.t > 350) {
            S.phase = 'hold'; S.held = true; S.holdT0 = S.t; S.paused = false;
            U.sfx('breath', { gain: 0.9, pitch: 0.9 });
          }
        } else if (S.phase === 'hold') {
          if (down) {
            if (!S.held) { S.held = true; S.paused = false; U.sfx('breath', { gain: 0.45, pitch: 1.05 }); }
            S.prog = Math.min(1, S.prog + dt / DUR);
            S.air = Math.max(FLOOR, S.air - DRAIN_HOLD * dt);
          } else {
            if (S.held && !S.paused) release();
            S.held = false;
            if (!S.paused) {
              S.freeT += dt;
              S.air = Math.max(FLOOR, S.air - DRAIN_FREE * dt);
              if (S.t - S.lastShake > 380) { S.lastShake = S.t; MC.fx.shake(0.16); }
            }
          }
          if (!S.lowWarn && S.air < 0.3) { S.lowWarn = true; U.sfx('sting', { gain: 0.35, pitch: 0.8 }); }
          if (canFail && S.air <= 0) {
            S.phase = 'end'; S.endT = S.t; S.result = { ok: false, ms: Math.round(S.prog * DUR), releases: S.releases };
            U.sfx('gasp', { gain: 1.3 }); MC.fx.shake(0.6); MC.fx.flash('#ffffff', 0.35, 160);
          } else if (S.prog >= 1) {
            S.phase = 'end'; S.endT = S.t; S.result = { ok: true, ms: DUR, releases: S.releases };
          }
        } else if (S.phase === 'end') {
          if (S.t - S.endT > 650) finish();
        }
      };
      sc.onInput = ev => {
        if (ev.type === 'cancel') S.paused = true;          // pointercancel은 '손 뗌'이 아니라 일시정지(A-12)
        else if (ev.type === 'down') S.paused = false;
        return true;
      };
      sc.onBack = () => {};
      sc.render = () => {
        const W = g.W, H = g.H, t = S.t, ctx = g.ctx;
        g.clear('#020203');
        // 흔들리며 옮겨지는 자루: 천 결이 걸음에 맞춰 흔들린다
        const [shx, shy] = MC.fx.shakeOffset();
        const sway = Math.sin(t * 0.0041), ox = Math.round(sway * 3) + shx, oy = Math.round(Math.abs(sway) * 2) + shy;
        // 천 결은 2배(굵은 올)로 — REDESIGN D-10 5-3 '자루 직조 64×64 오버레이'. 천 너머로 스미는 희미한 빛(이리저리 움직임)만 결을 드러낸다
        const tile = weaveTile(), tw = tile.width * 2, th = tile.height * 2;
        const lx = (W >> 1) + Math.round(Math.sin(t * 0.00071) * 26) + ox, ly = Math.round(H * 0.42 + Math.cos(t * 0.00053) * 18);
        const r = Math.max(22, Math.round(84 + Math.sin(t * 0.0013) * 6 - S.pulse * 12 - S.prog * 20 - (S.phase === 'hold' && !S.held ? 10 : 0)));
        const lc = litCanvas(W, H), lg = lc.getContext('2d');
        lg.imageSmoothingEnabled = false; lg.globalAlpha = 1; lg.globalCompositeOperation = 'source-over';
        lg.clearRect(0, 0, W, H);
        for (let y = -th + (((oy % th) + th) % th); y < H; y += th) for (let x = -tw + (((ox % tw) + tw) % tw); x < W; x += tw) lg.drawImage(tile, x, y, tw, th);
        const x0 = lx - r, y0 = ly - r, s = 2 * r + 1;
        lg.globalCompositeOperation = 'destination-in'; lg.drawImage(lightMask(), x0, y0, s, s);
        lg.globalCompositeOperation = 'source-over';
        lg.clearRect(0, 0, W, Math.max(0, y0)); lg.clearRect(0, y0 + s, W, H); lg.clearRect(0, y0, Math.max(0, x0), s); lg.clearRect(x0 + s, y0, W, s);
        ctx.globalAlpha = 0.8; ctx.drawImage(lc, 0, 0);
        if (S.pulse > 0.05) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.4 * S.pulse; ctx.drawImage(lc, 0, 0); ctx.globalCompositeOperation = 'source-over'; }   // 박동마다 결이 살짝 밝아짐
        ctx.globalAlpha = 1;
        // 심장 박동에 맞춘 비네트
        U.drawVig(3 + S.pulse * 6 + S.prog * 5, '#000000');
        if (S.air < 0.35 && S.phase === 'hold') U.drawVig(2 + S.pulse * 5, '#2a0610');

        const cx = W >> 1, P = { txt: '#c8c4d8', dim: '#6a6878' };
        // 안내: 길게 누르기
        if (S.phase === 'intro' && t > 400) {
          const lv = S.promptA * 16, bob = Math.round(Math.sin(t * 0.008) * 2), hy = Math.round(H * 0.62);
          if (!U.drawSpr('ic_hand_tap', cx - 16, hy + bob, lv, 2)) g.circle(cx, hy + 12 + bob, 6, '#c8c4d8');
          const a = MC.text.bake('길게 누르고 버틴다', 'body', P.txt, { shadow: '#000' });
          U.drawDither(a, cx - (a.width >> 1), hy + 38, lv);
          const b = MC.text.bake('숨을 참는 동안 손을 떼지 말 것', 'small', P.dim);
          U.drawDither(b, cx - (b.width >> 1), hy + 56, lv);             // 작은 글자는 디더 중간 단계가 깨져 보이므로 흐린 색으로만
        }
        // '숨' 게이지
        if (S.phase !== 'intro') {
          const bw = 104, bx = cx - (bw >> 1), by = H - 58 - g.safe.bottom;
          const a = Math.min(16, (t - S.holdT0) / 250 * 16);
          const col = S.air > 0.5 ? '#c8d0e0' : S.air > 0.25 ? '#e0b050' : '#e05a4a';
          const blink = !S.held && S.phase === 'hold' && (((t / 140) | 0) & 1);
          g.ditherRect(bx - 2, by - 2, bw + 4, 8, '#3a3848', a);
          g.ditherRect(bx - 1, by - 1, bw + 2, 6, '#08070c', a);
          const fw = Math.round((bw) * MC.clamp(S.air, 0, 1));
          if (fw > 0) g.ditherRect(bx, by, fw, 4, blink ? '#ff8a7a' : col, a);
          if (fw > 1) g.ditherRect(bx, by, fw - 1, 1, blink ? '#ffd0c8' : '#ffffff', a * 0.5);
          const lb = MC.text.bake('숨', 'small', '#8a8898');
          U.drawDither(lb, bx - lb.width - 5, by - 5, a);
          // 버틴 시간(작은 눈금 5개)
          for (let i = 0; i < 5; i++) {
            const on = S.prog * 5 > i + 0.999 || (S.prog >= 1);
            g.ditherRect(bx + bw + 5, by + 3 - i * 2 - 1, 3, 1, on ? '#9a98a8' : '#2a2834', a);
          }
        }
        // '아직!'
        const since = t - S.ajikT, showAjik = S.phase === 'hold' && (!S.held || since < 700) && S.releases > 0;
        if (showAjik) {
          const lv = S.held ? MC.clamp(1 - (since - 350) / 350, 0, 1) * 16 : Math.min(16, since / 90 * 16);
          const img = MC.text.bake('아직!', 'big', '#f0e8ff', { outline: '#000' });
          const jx = ((t / 50) | 0) % 3 - 1, jy = (((t / 70) | 0) & 1) ? 1 : 0;
          if (img) U.drawDither(img, cx - (img.width >> 1) + (S.held ? 0 : jx), Math.round(H * 0.56) + (S.held ? 0 : jy), lv);
          if (!S.held && since > 600) {
            const h2 = MC.text.bake('다시 눌러 버틴다', 'small', '#9a98a8');
            U.drawDither(h2, cx - (h2.width >> 1), Math.round(H * 0.56) + 34, MC.clamp((since - 600) / 300, 0, 1) * 16);
          }
        }
        if (S.phase === 'end') g.ditherFill('#000', MC.clamp((t - S.endT) / 600, 0, 1) * 16);
        if (t < 300) g.ditherFill('#000', 16 - t / 300 * 16);
      };
      MC.scene.push(sc);
    });
  }

  ch1.minigames = { breath };
})(window.MC);

</script>
<script>/* ==== src/ch1/custom.js ==== */
/* custom.js — 이벤트 {op:"custom"} 연출 등록: MC.ch1.custom.{breath, hands, letter, candle, tbc, title} (각 Promise).
   hands: 1-7 탁자 위 세 손 + 회색 속삭임 / letter: 2-3 삐뚤한 투서 / candle: 촛불 꺼짐(D-3 f) / tbc: '계속됩니다' / title: 타이틀로. 담당: scenes */
(function (MC) { 'use strict';
  const ch1 = MC.ch1, U = ch1.u, G = () => MC.gfx;
  const C = ch1.custom || (ch1.custom = {});

  /* ================================================================ 숨 참기 (minigames.js) */
  C.breath = function (args) {
    if (ch1.minigames && ch1.minigames.breath) return ch1.minigames.breath(args || {});
    U.warn('breath', 'minigames.breath 없음'); return Promise.resolve({ ok: true });
  };

  /* ================================================================ 1-7 탁자 위의 세 손 */
  // 저녁 정자 탁자(나뭇결 + 등불 빛) — 화면 크기별 캐시
  let tableBg = null;
  function bakeTable() {
    const g = G(), W = g.W, H = g.H;
    if (tableBg && tableBg.width === W && tableBg.height === H) return tableBg;
    const c = g.makeCanvas(W, H);
    g.withCtx(c, () => {
      const PL = ['#4a2e1c', '#43291a', '#4d301e'];
      for (let y = 0, i = 0; y < H; y += 15, i++) {
        g.rect(0, y, W, 15, PL[i % 3]);
        g.hline(0, y, W, '#2b1a10');                                   // 판자 이음
        g.hline(0, y + 1, W, '#5a3a24');
        for (let k = 0; k < 7; k++) {                                   // 나뭇결
          const gy = y + 3 + Math.floor(U.hash(i, k, 1) * 10), gx = Math.floor(U.hash(k, i, 2) * W), gl = 10 + Math.floor(U.hash(i, k, 3) * 40);
          g.hline(gx, gy, gl, U.hash(k, i, 4) < 0.6 ? '#3e2616' : '#56361f');
        }
        const sx = Math.floor(U.hash(i, 9, 5) * W);                     // 판자 끝 이음
        g.vline(sx, y + 1, 14, '#2b1a10');
        if (U.hash(i, 3, 6) < 0.5) { const kx = Math.floor(U.hash(i, 4, 7) * (W - 8)), ky = y + 5; g.rect(kx, ky, 5, 3, '#34200f'); g.px(kx + 2, ky + 1, '#24150a'); }
      }
      // 등불 빛(위 가운데) + 가장자리 어둠
      g.ctx.drawImage(U.glow(Math.round(W * 0.62), '#6a4428', 9, 1.2), (W >> 1) - Math.round(W * 0.62), Math.round(H * 0.18) - Math.round(W * 0.62));
      g.ctx.drawImage(U.vig(10, '#140a06'), 0, 0);
      // 쏟은 포도주 얼룩과 부스러기
      const wx = Math.round(W * 0.7), wy = Math.round(H * 0.74);
      g.circle(wx, wy, 5, '#3a1216'); g.circle(wx + 4, wy + 2, 3, '#3a1216'); g.px(wx - 2, wy - 2, '#5a1c22');
      for (let k = 0; k < 9; k++) g.px(Math.floor(U.hash(k, 1, 8) * W), Math.round(H * 0.3 + U.hash(k, 2, 8) * H * 0.5), '#8a6a40');
    });
    tableBg = c; return c;
  }
  // 손 그림이 없을 때 대체(48×40)
  function fallbackHand(kind) {
    const c = G().makeCanvas(48, 40);
    G().withCtx(c, () => {
      const g = G();
      g.rect(0, 30, 48, 10, '#4a2e1c'); g.hline(0, 30, 48, '#5a3a24');
      const sleeve = kind === 'ink' ? '#2a4a34' : kind === 'thimble' ? '#5a3a28' : '#2a2438';
      g.rect(0, 12, 22, 18, sleeve);
      if (kind === 'ink') { g.rect(14, 22, 4, 3, '#101828'); g.line(30, 4, 38, 22, '#e8e4d8'); }
      if (kind === 'thimble') { g.rect(34, 8, 8, 18, '#c8d8e8'); g.rect(35, 16, 6, 8, '#7a1a28'); }
      if (kind === 'sash') { g.rect(0, 22, 22, 6, '#b02a2a'); g.rect(30, 20, 16, 12, '#e8dcc0'); }
      g.circle(28, 22, 7, '#e0b088'); g.rect(22, 18, 6, 8, '#e0b088');
      if (kind === 'thimble') g.rect(33, 17, 4, 4, '#b8b8c0');
    });
    return c;
  }
  const HANDS = [
    { spr: 'cu_hand_ink', kind: 'ink', t: '……왼손으로 쓰면……', sfx: 'quill', from: [-1, 0] },
    { spr: 'cu_hand_thimble', kind: 'thimble', t: '……장난이지, 장난……', sfx: 'glass_clink', from: [0, 1] },
    { spr: 'cu_hand_sash', kind: 'sash', t: '……검사에게……', sfx: 'page', from: [1, 0] }
  ];
  // args: {whisper:true(속삭임 표시)}
  C.hands = function (args) {
    args = args || {};
    const g = G(), whisper = args.whisper !== false;
    const imgs = HANDS.map(h => U.spr(h.spr) || fallbackHand(h.kind));
    const BEAT = 2050, IN = 300, CH = 55;
    const tFinal = BEAT * 3 + 150, FINAL_IN = 450, FINAL_HOLD = 900;
    return new Promise(resolve => {
      const sc = { name: 'hands', opaque: true, blocking: true, t: 0, fired: [false, false, false], resolved: false, t0: MC.time.real, freezeSeen: false, map: MC.state && MC.state.map };
      function beatOf(t) { return Math.min(3, Math.floor(t / BEAT)); }
      function done() {
        if (sc.resolved) return; sc.resolved = true;
        // 1막 끝 '화면 정지'가 세 손을 찍을 수 있게, 스스로 비켜날 때까지 화면에 남는다(갱신은 막지 않음)
        sc.blocking = false; sc.lingerT0 = MC.time.real;
        resolve();
      }
      function leave() { if (MC.scene.has(sc)) MC.scene.remove(sc); }
      sc.update = dt => {
        if (sc.resolved) {
          const fz = MC.fx._freeze;
          if (fz && fz.on) sc.freezeSeen = true;
          const lv = MC.fx.fadeLevel ? MC.fx.fadeLevel() : 0;
          if (lv >= 0.99 || (sc.freezeSeen && fz && !fz.on) || (MC.state && MC.state.map !== sc.map) || MC.time.real - sc.lingerT0 > 30000) leave();
          return;
        }
        sc.t += dt;
        const b = beatOf(sc.t);
        if (b < 3) {
          const k = sc.t - b * BEAT;
          if (!sc.fired[b] && k >= 120) { sc.fired[b] = true; U.sfx(HANDS[b].sfx, { gain: 0.8 }); }
        }
        if (sc.t >= tFinal + FINAL_IN + FINAL_HOLD) done();
      };
      sc.onInput = ev => {
        if (!sc.resolved && ev.type === 'tap' && sc.t > 400) {
          const b = beatOf(sc.t);
          if (b < 3) { const k = sc.t - b * BEAT, full = IN + Array.from(HANDS[b].t).length * CH + 250; if (k > full && k < BEAT - 260) sc.t = b * BEAT + BEAT - 260; }
        }
        return true;
      };
      sc.onBack = () => {};
      sc.render = () => {
        const W = g.W, H = g.H, cx = W >> 1, cy = (H >> 1) - 14, t = sc.t;
        g.ctx.drawImage(bakeTable(), 0, 0);
        if (t < BEAT * 3) {
          const b = beatOf(t), k = t - b * BEAT, h = HANDS[b], img = imgs[b];
          const pIn = MC.clamp(k / IN, 0, 1), e = MC.ease.outCubic(pIn);
          let lv = pIn * 16;
          if (k > BEAT - 240) lv = MC.clamp((BEAT - k) / 240, 0, 1) * 16;
          const x = cx - 48 + Math.round(h.from[0] * 26 * (1 - e)), y = cy - 52 + Math.round(h.from[1] * 20 * (1 - e));
          // 받침 그림자 → 손(2배)
          g.ditherRect(x + 4, y + 82, 92, 3, '#140a06', lv * 0.6);
          U.drawDither(img, x, y, lv, 2);
          // 앞서 나온 손들: 가장자리에 작게, 어둡게
          for (let i = 0; i < b; i++) U.drawDither(imgs[i], i === 0 ? g.X0 + 4 : W - g.X0 - 52, H - 72 - g.safe.bottom, 5);
          if (whisper && k > IN) {
            const chars = Array.from(h.t), n = Math.min(chars.length, Math.floor((k - IN) / CH) + 1);
            const tw = MC.text.width(h.t, 'body'), tx = cx - (tw >> 1), ty = y + 92;
            const tl = k > BEAT - 240 ? lv : 16;
            if (tl >= 16) U.typeChars(chars, n, tx, ty, 'body', () => '#8e8c9c', i => (((t / 90) | 0) + i) % 7 === 0 ? 1 : 0);
            else U.drawDither(MC.text.bake(h.t, 'body', '#8e8c9c'), tx, ty, tl);
          }
        } else if (t >= tFinal) {
          // 마지막 구도: 탁자 위의 세 손 — 2배 세 폭(위에서 차례로, 좌·중·우로 조금씩 어긋나게)
          const k = t - tFinal, hh = 80, gapY = 6, total = hh * 3 + gapY * 2, y0 = Math.max(4 + g.safe.top, ((H - total) >> 1) - 6);
          for (let i = 0; i < 3; i++) {
            const p = MC.clamp((k - i * 160) / FINAL_IN, 0, 1), lv = p * 16, d = Math.round((1 - MC.ease.outCubic(p)) * 6);
            const x = cx - 48 + [-14, 0, 14][i], y = y0 + i * (hh + gapY) + d;
            g.ditherRect(x + 4, y + hh - 1, 92, 3, '#140a06', lv * 0.6);
            U.drawDither(imgs[i], x, y, lv, 2);
          }
        }
        if (t < 250) g.ditherFill('#000', 16 - t / 250 * 16);
      };
      MC.scene.push(sc);
    });
  };

  /* ================================================================ 2-3 삐뚤한 투서 */
  const LETTER = '검사님께.\n왕과 교회의 벗이 알립니다. 파라옹호의 일등 항해사 에드몽 당테스는 엘바 섬에 들러 찬탈자의 편지를 받아 왔습니다. 파리의 보나파르트파에게 가는 편지입니다.\n증거는 그의 몸이나 아버지 집, 아니면 파라옹호 선실에 있을 것입니다.';
  let letterCache = null;
  function bakeLetterSheet() {
    if (letterCache) return letterCache;
    const g = G(), PW = 156, TW = 138;
    const lines = MC.text.wrap(LETTER, TW, 'small');
    const PH = 16 + lines.length * 13 + 16;
    const c = g.makeCanvas(PW + 1, PH + 1);
    g.withCtx(c, () => {
      g.rect(1, 1, PW, PH, '#000000');                                   // 그림자
      g.rect(0, 0, PW, PH, '#efe6cc');
      g.ditherRect(0, PH - 20, PW, 20, '#d4c6a0', 5);                    // 아래쪽 누런 얼룩
      g.ditherRect(PW - 24, 0, 24, PH, '#d4c6a0', 3);
      g.rectO(0, 0, PW, PH, '#bba982');
      const fy = (PH / 2) | 0; g.hline(1, fy, PW - 2, '#d4c6a0'); g.hline(1, fy + 1, PW - 2, '#f8f2e0');   // 접힌 자국
      g.circle(PW - 20, PH - 14, 2, '#241c34'); g.px(PW - 17, PH - 12, '#241c34'); g.px(PW - 23, PH - 16, '#3a3050');   // 잉크 방울
      // 왼손으로 쓴 글씨: 글자마다 높이·간격이 어긋나고 줄이 기운다
      let y = 12;
      lines.forEach((ln, li) => {
        const slope = (U.hash(li, 7, 11) - 0.5) * 0.09;
        let x = 9 + Math.floor(U.hash(li, 3, 12) * 4);
        Array.from(ln).forEach((ch, ci) => {
          const h = U.hash(li * 50 + ci, 5, 13);
          const dy = Math.round(slope * (x - 9) + (h - 0.5) * 2.6);
          const adv = MC.text.drawChar(ch, x, y + dy, 'small', '#241c34');
          if (h > 0.86 && ch !== ' ') MC.text.drawChar(ch, x + 1, y + dy, 'small', '#241c34');   // 꾹 누른 획
          x += adv + (U.hash(ci, li, 14) < 0.3 ? 1 : 0);
        });
        y += 13;
      });
    });
    letterCache = c; return c;
  }
  C.letter = function (args) {
    args = args || {};
    const g = G();
    const scrap = U.spr('cu_letter');
    const SHOW = scrap ? 1100 : 0, SWAP = 320, IN = 260, OUT = 220, MIN = 1300;
    return new Promise(resolve => {
      const sc = { name: 'letter', opaque: false, blocking: true, t: 0, out: -1, done: false };
      function end() { if (sc.out < 0) { sc.out = 0; U.sfx('page', { pitch: 0.9 }); } }
      sc.enter = () => { U.sfx('page'); };
      sc.update = dt => {
        sc.t += dt;
        if (sc.out >= 0) { sc.out += dt; if (sc.out >= OUT && !sc.done) { sc.done = true; MC.scene.remove(sc); resolve(); } }
      };
      sc.onInput = ev => {
        if (ev.type === 'tap' || ev.type === 'long') { if (sc.t < SHOW + SWAP) sc.t = SHOW + SWAP; else if (sc.t > SHOW + SWAP + MIN * 0.5) end(); }
        return true;
      };
      sc.onBack = () => {};
      sc.render = () => {
        const W = g.W, H = g.H, t = sc.t, cx = W >> 1;
        const outP = sc.out >= 0 ? MC.clamp(sc.out / OUT, 0, 1) : 0;
        g.ditherFill('#05040a', Math.min(10, t / 200 * 10) * (1 - outP));
        const sheet = bakeLetterSheet();
        const sy = Math.max(8, ((H - sheet.height) >> 1) - 18);
        const slide = Math.round((1 - MC.ease.outCubic(MC.clamp(t / IN, 0, 1))) * 30 + MC.ease.inQuad(outP) * 24);
        const fade = (1 - outP) * 16;
        if (scrap && t < SHOW + SWAP) {
          // 먼저 손에 쥔 종잇조각 그대로 — 그다음 글씨가 읽힌다
          const lv = t < SHOW ? MC.clamp(t / IN, 0, 1) * 16 : MC.clamp(1 - (t - SHOW) / SWAP, 0, 1) * 16;
          U.drawDither(scrap, cx - 64, (H >> 1) - 58 + slide, lv, 2);
          if (t >= SHOW) U.drawDither(sheet, cx - (sheet.width >> 1), sy, MC.clamp((t - SHOW) / SWAP, 0, 1) * 16);
        } else {
          U.drawDither(sheet, cx - (sheet.width >> 1), sy + (scrap ? 0 : slide), Math.min(fade, scrap ? 16 : MC.clamp(t / IN, 0, 1) * 16));
          if (t > SHOW + SWAP + MIN && sc.out < 0) MC.ui.nextMark(cx + (sheet.width >> 1) - 10, sy + sheet.height + 4);
        }
      };
      MC.scene.push(sc);
    });
  };

  /* ================================================================ 촛불 꺼짐 (REDESIGN D-3 f) */
  let wallBg = null;
  function bakeWall() {
    const g = G(), W = g.W, H = g.H;
    if (wallBg && wallBg.width === W && wallBg.height === H) return wallBg;
    const c = g.makeCanvas(W, H), floorY = Math.round(H * 0.64);
    g.withCtx(c, () => {
      g.rect(0, 0, W, H, '#11131c');
      for (let r = 0, y = 0; y < floorY; r++, y += 9) {                 // 석벽(엇갈린 돌)
        const off = (r & 1) ? 9 : 0;
        for (let x = -off; x < W; x += 18) {
          const h = U.hash(x, r, 21), w = 17, col = h < 0.3 ? '#262a38' : h < 0.8 ? '#2c3040' : '#343849';
          g.rect(x, y, w, 8, col); g.hline(x, y, w, '#3c4152');
          if (h > 0.7) g.px(x + 3 + Math.floor(h * 10), y + 4, '#1c1f2a');
        }
      }
      // 빗금(다섯씩 묶음) — 벽 가득
      for (let k = 0; k < 90; k++) {
        const x = Math.floor(U.hash(k, 1, 22) * (W - 14)) + 2, y = Math.floor(U.hash(k, 2, 22) * (floorY - 26)) + 6, n = U.hash(k, 3, 22) < 0.8 ? 4 : 1 + Math.floor(U.hash(k, 4, 22) * 3);
        for (let i = 0; i < n; i++) g.vline(x + i * 2, y + (i & 1), 7, '#6a7088');
        if (n === 4) g.line(x - 1, y + 6, x + 8, y + 1, '#8a90a8');
      }
      g.rect(0, floorY, W, H - floorY, '#161822');                        // 바닥
      g.hline(0, floorY, W, '#3c4152');
      for (let k = 0; k < 30; k++) g.hline(Math.floor(U.hash(k, 5, 23) * W), floorY + 3 + Math.floor(U.hash(k, 6, 23) * (H - floorY - 6)), 2 + Math.floor(U.hash(k, 7, 23) * 6), '#1f2230');
    });
    wallBg = c; return c;
  }
  let flameAt = null;
  function flamePos() {                          // cu_candle_0에서 불꽃(밝은 노랑) 중심 찾기
    if (flameAt) return flameAt;
    const c = U.spr('cu_candle_0');
    flameAt = [16, 6];
    if (!c) return flameAt;
    try {
      const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
      let sx = 0, sy = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) { if (d[i + 3] && d[i] > 230 && d[i + 1] > 150 && d[i + 2] < 190) { const p = i / 4; sx += p % c.width; sy += (p / c.width) | 0; n++; } }
      if (n) flameAt = [Math.round(sx / n), Math.round(sy / n)];
    } catch (_) {}
    return flameAt;
  }
  C.candle = function (args) {
    args = args || {};
    const g = G();
    const DUR = args.ms || 3000, SIL = 1200, R0 = args.r || 48;
    const REV = [1200, 2100];
    function bump(d) { if (d < -110 || d > 210) return 0; if (d < 0) return -0.25 * (1 + d / 110) * (-d / 110) * 4; if (d < 60) return d / 60; return 1 - (d - 60) / 150; }
    function radius(t) {
      if (t >= DUR) return 0;
      const p = t / DUR;
      let r = R0 * Math.pow(1 - p, 0.75);
      const amp = 0.05 + 0.30 * p;
      const nz = (Math.sin(t * 0.031) + 0.6 * Math.sin(t * 0.053 + 1.7) + 0.4 * Math.sin(t * 0.097 + 0.3)) / 2;
      r *= 1 + amp * nz;
      for (const rv of REV) r *= 1 + 0.3 * bump(t - rv);
      return Math.max(0, r);
    }
    return new Promise(resolve => {
      const sc = { name: 'candle', opaque: true, blocking: true, t: 0, out: false, done: false, smoke: [] };
      sc.enter = () => { U.coverBegin(); };
      sc.update = dt => {
        sc.t += dt;
        if (!sc.out && sc.t >= DUR) { sc.out = true; U.sfx('candle_out'); }
        if (sc.out) {
          const k = sc.t - DUR;
          if (k < 900 && (sc.smoke.length < 18) && ((k / 50) | 0) > sc.smoke.length - 1) sc.smoke.push({ t0: sc.t, ph: U.vr() * 6.28 });
        }
        if (sc.t >= DUR + SIL + 600 && !sc.done) { sc.done = true; MC.scene.remove(sc); U.coverEnd(); resolve(); }
      };
      sc.onInput = () => true;                   // 조작 잠금
      sc.onBack = () => {};
      sc.render = () => {
        const W = g.W, H = g.H, t = sc.t, ctx = g.ctx;
        const sw = 64, shh = 96, sx = (W - sw) >> 1, sy = Math.round(H * 0.64) - shh + 6;
        const fp = flamePos(), fx = sx + fp[0] * 2, fy = sy + fp[1] * 2;
        const r = radius(t);
        ctx.drawImage(bakeWall(), 0, 0);
        U.drawHole(fx, fy, Math.round(r * 2.1), '#000000', 0.12);       // 빛이 닿는 곳만 벽이 보인다
        if (r > 0.5) {                                                    // 따뜻한 빛
          ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55;
          const gl = U.glow(Math.round(r * 1.5), '#6a3a14', 12, 1.3); ctx.drawImage(gl, fx - (gl.width >> 1), fy - (gl.height >> 1));
          ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
        }
        // 초(2배): 밝음 → 흔들림 → 꺼져 감 → 꺼짐(검은 실루엣)
        const p = t / DUR;
        let fr = 'cu_candle_0';
        if (p > 0.72) fr = 'cu_candle_2'; else if (p > 0.3 || r < R0 * 0.8) fr = (((t / 90) | 0) & 1) ? 'cu_candle_1' : 'cu_candle_0';
        if (!sc.out) { if (!U.drawSpr(fr, sx, sy, 16, 2)) { g.rect(fx - 4, fy + 8, 8, 40, '#efe2c2'); g.circle(fx, fy, 3, '#ffd460'); } }
        else {
          const cc = g.getSprite('cu_candle_2', { tint: '#15131a' });
          if (cc) U.drawDither(cc, sx, sy, 16, 2);
          const k = t - DUR;
          if (k < 420 && ((k / 70) | 0) % 2 === 0) g.px(fx, fy + 4, '#ff9a30');                     // 심지의 불씨
          for (const s of sc.smoke) {                                                           // 가는 연기
            const a = t - s.t0, life = 1400; if (a > life) continue;
            const yy = fy + 3 - a * 0.028, xx = fx + Math.round(Math.sin(a * 0.006 + s.ph) * (1 + a / 500));
            const lv = (1 - a / life) * 11;
            g.ditherRect(xx, Math.round(yy), 1, 2, '#6a6a78', lv);
          }
        }
        if (t < 350) g.ditherFill('#000', 16 - t / 350 * 16);
        if (t > DUR + SIL) g.ditherFill('#000', MC.clamp((t - DUR - SIL) / 500, 0, 1) * 16);
      };
      MC.scene.push(sc);
    });
  };

  /* ================================================================ 계속됩니다 */
  C.tbc = function (args) {
    args = args || {};
    const g = G(), st = MC.state || {};
    const lead = (st.party && st.party[0]) || { lv: 1 };
    const name = st.dispName || '34번', year = st.year || 1817;
    const summary = args.summary || '가장 행복한 날,\n모든 것을 잃었다.';
    const ledger = [name + '.', '1815년 2월 입소.', '죄목: 기재 없음.', year + '년 현재, 생존.'];
    const next = args.next || '다음 이야기 · 「27번」';
    const hook = args.hook || '벽 너머에서, 누군가 파고 있다.';
    const pm = Math.floor((st.playMs || 0) / 60000), stat = '플레이 ' + Math.floor(pm / 60) + ':' + String(pm % 60).padStart(2, '0') + ' · Lv ' + (lead.lv || 1);
    // 시간표
    const CH = 48, L_GAP = 260;
    const t0 = 900, tSumEnd = t0 + Array.from(summary).length * CH;
    const tHead = tSumEnd + 900;
    const tLed = [];
    let tt = tHead + 700;
    for (const l of ledger) { tLed.push(tt); tt += Array.from(l).length * CH + L_GAP; }
    const tCont = tt + 900, tNext = tCont + 800, tHook = tNext + 600, tStat = tHook + 500, tMark = tStat + 700;
    return new Promise(resolve => {
      const sc = { name: 'tbc', opaque: true, blocking: true, t: 0, out: -1, played: false, quill: 0, done: false };
      const dust = new U.Motes(10, () => [0, 0, g.W, g.H]);
      function skip() { if (sc.t < tMark) { sc.t = tMark; sc.quill = ledger.length; if (!sc.played) { sc.played = true; U.music('play', U.hasSong('title') ? 'title' : 'marseille', { fade: 1500 }); } } }
      sc.enter = () => { U.coverBegin(); U.sfx('scratch', { gain: 0.35, pan: 0.6 }); };
      sc.update = dt => {
        sc.t += dt; dust.update(dt);
        while (sc.quill < ledger.length && sc.t >= tLed[sc.quill]) { U.sfx('quill', { gain: 0.5, pitch: 1 + sc.quill * 0.05 }); sc.quill++; }
        if (!sc.played && sc.t >= tCont) { sc.played = true; U.music('play', U.hasSong('title') ? 'title' : 'marseille', { fade: 2500 }); }
        if (sc.out >= 0) {
          sc.out += dt;
          if (sc.out >= 650 && !sc.done) {
            sc.done = true;
            if (ch1.gotoTitle) ch1.gotoTitle({ instant: true, keepMusic: true }).then(() => resolve(), () => resolve());
            else { MC.scene.remove(sc); U.coverEnd(); resolve(); }
          }
        }
      };
      sc.onInput = ev => {
        if ((ev.type === 'tap' || ev.type === 'long') && sc.t > 500) { if (sc.t < tMark) skip(); else if (sc.out < 0) { sc.out = 0; U.sfx('ui_ok'); } }
        return true;
      };
      sc.onBack = () => {};
      sc.render = () => {
        const W = g.W, H = g.H, t = sc.t, cx = W >> 1;
        g.clear('#030306');
        dust.render(t, 0.7);
        const top = Math.max(24, (H >> 1) - 128) + g.safe.top;
        // 한 줄 요약
        const sLines = MC.text.wrap(summary, 170, 'body');
        let n = t < t0 ? 0 : Math.floor((t - t0) / CH) + 1;
        sLines.forEach((ln, i) => { const c = Array.from(ln).length; if (n > 0) U.typedLine(ln, Math.min(n, c), cx, top + i * 16, 'body', () => '#d8d4c8'); n -= c + 1; });
        // 수감 기록
        const ly = top + sLines.length * 16 + 22;
        if (t >= tHead) {
          const lv = U.lvl(t, tHead, 400), head = MC.text.bake('샤토 디프 수감 기록', 'small', '#8a8898');
          U.drawDither(head, cx - (head.width >> 1), ly, lv);
          g.ditherRect(cx - 60, ly + 14, 120, 1, '#3a3848', lv);
          const lx = cx - 58;
          ledger.forEach((l, i) => {
            if (t < tLed[i]) return;
            const chars = Array.from(l), k = Math.min(chars.length, Math.floor((t - tLed[i]) / CH) + 1);
            U.typeChars(chars, k, lx, ly + 20 + i * 16, 'body', (ch, j) => (i === 2 && j >= 4 ? '#e05a4a' : '#c8c4d8'));
          });
        }
        // 계속됩니다
        const cy = ly + 20 + ledger.length * 16 + 26;
        if (t >= tCont) {
          const lv = U.lvl(t, tCont, 600), img = MC.text.bake('계속됩니다', 'big', '#f0ece0', { outline: '#000' });
          U.drawDither(img, cx - (img.width >> 1), cy, lv);
          const my = cy + 13, L = Math.max(0, Math.min(26, ((W - img.width) >> 1) - 14));
          g.ditherRect(cx - (img.width >> 1) - 8 - L, my, L, 1, '#5c5a6c', lv); g.ditherRect(cx + (img.width >> 1) + 8, my, L, 1, '#5c5a6c', lv);
        }
        if (t >= tNext) { const img = MC.text.bake(next, 'body', '#ffcf4a'); U.drawDither(img, cx - (img.width >> 1), cy + 36, U.lvl(t, tNext, 400)); }
        if (t >= tHook) { const img = MC.text.bake(hook, 'small', '#9a98a8'); U.drawDither(img, cx - (img.width >> 1), cy + 56, U.lvl(t, tHook, 400)); }
        if (t >= tStat) { const img = MC.text.bake(stat, 'small', '#5c5a6c'); U.drawDither(img, cx - (img.width >> 1), H - 42 - g.safe.bottom, U.lvl(t, tStat, 400)); }
        if (t >= tMark && sc.out < 0) MC.ui.nextMark(cx - 3, H - 24 - g.safe.bottom);
        if (t < 400) g.ditherFill('#000', 16 - t / 400 * 16);
        if (sc.out >= 0) g.ditherFill('#000', MC.clamp(sc.out / 600, 0, 1) * 16);
      };
      MC.scene.push(sc);
    });
  };

  /* ================================================================ 타이틀로 */
  C.title = function (args) {
    if (ch1.gotoTitle) return ch1.gotoTitle(args || {});
    U.warn('gotoTitle', 'MC.ch1.gotoTitle 없음'); return Promise.resolve();
  };
})(window.MC);

</script>
<script>/* ==== src/ch1/title.js ==== */
/* title.js — 타이틀 씬 MC.ch1.titleScene(): 밤바다(물결 3층·달 그림자)·샤토 디프 실루엣·달·회전하는 플라니에 등대 빛, 코드로 그린 로고('34'·'14' 커스텀 숫자).
   1단계 '화면을 눌러 시작하세요'(탭=소리 켬, 파도·갈매기·타이틀 곡 페이드인) → 2단계 [이어하기][처음부터(확인 1초 누르기)][설정] + 소리 켬/끔. 담당: scenes */
(function (MC) { 'use strict';
  const ch1 = MC.ch1, U = ch1.u, G = () => MC.gfx;

  function layout() {
    const g = G(), H = g.H;
    const hz = MC.clamp(Math.round(H * 0.5), 160, 206), k = hz - 160;
    return { hz, logoY: 50 + Math.round(k * 0.45), moonX: g.X0 + 144, moonY: 34 + Math.round(k * 0.3), X0: g.X0, lampX: g.X0 + 171, lampY: hz - 11 };
  }

  /* ---------- 로고: 7×11 커스텀 숫자(2배) + '번의'·'년'(굵게 2배) ---------- */
  const DIG = {
    '3': ['.#####.', '##...##', '.....##', '.....##', '..####.', '....##.', '.....##', '.....##', '##...##', '##...##', '.#####.'],
    '4': ['....##.', '...###.', '..####.', '.##.##.', '##..##.', '##..##.', '#######', '....##.', '....##.', '....##.', '...####'],
    '1': ['...##..', '..###..', '.####..', '...##..', '...##..', '...##..', '...##..', '...##..', '...##..', '...##..', '.######']
  };
  let logoC = null;
  function bakeLogo() {
    if (logoC) return logoC;
    const g = G();
    // 한글 글리프의 실제 위아래 줄
    const rowsOf = ch => { const gl = MC.text.glyph(ch, 'big'); let top = 99, bot = -1; for (let y = 0; y < gl.h; y++) for (let x = 0; x < gl.w; x++) if (gl.bits[y * gl.w + x]) { if (y < top) top = y; if (y > bot) bot = y; } return [top, bot, gl]; };
    const parts = [['34', 1], ['번의', 3], [' ', 0], ['14', 2], ['년', 3]];
    let bot = 23, top = 2;
    for (const ch of '번의년') { const r = rowsOf(ch); if (r[1] > 0) { bot = Math.max(bot === 23 ? 0 : bot, r[1]); top = Math.min(top, r[0]); } }
    const DH = 22, dTop = bot - DH + 1;
    // 폭 계산
    let w = 2;
    const items = [];
    for (const [str, kind] of parts) {
      if (kind === 0) { w += 7; continue; }
      if (kind === 3) { for (const ch of str) { const r = rowsOf(ch); items.push({ x: w, kind, gl: r[2] }); w += r[2].adv + 1; } w += 2; }
      else { for (const ch of str) { items.push({ x: w, kind, d: DIG[ch] }); w += 16; } w += 2; }
    }
    const Wd = w + 1, Hd = bot + 4;
    const m = new Uint8Array(Wd * Hd);
    for (const it of items) {
      if (it.d) {
        for (let y = 0; y < 11; y++) for (let x = 0; x < 7; x++) if (it.d[y][x] === '#') for (let sy = 0; sy < 2; sy++) for (let sx = 0; sx < 2; sx++) m[(dTop + y * 2 + sy + 1) * Wd + it.x + x * 2 + sx] = it.kind;
      } else {
        const gl = it.gl;
        for (let y = 0; y < gl.h; y++) for (let x = 0; x < gl.w; x++) if (gl.bits[y * gl.w + x]) { const yy = y + 1, xx = it.x + x; if (yy < Hd && xx < Wd) m[yy * Wd + xx] = 3; }
      }
    }
    const PAL = {
      1: ['#c8d4ec', '#ffffff', '#5a6a90'],
      2: ['#ffd98a', '#fff6d8', '#b07830'],
      3: ['#9aa8c8', '#c8d4ec', '#6a7aa0']
    };
    const c = g.makeCanvas(Wd, Hd + 1), x2 = c.getContext('2d'), id = x2.createImageData(Wd, Hd + 1), d = id.data;
    const set = (x, y, hex) => { const v = g.rgb(hex), o = (y * Wd + x) * 4; d[o] = v[0]; d[o + 1] = v[1]; d[o + 2] = v[2]; d[o + 3] = 255; };
    const at = (x, y) => (x < 0 || y < 0 || x >= Wd || y >= Hd ? 0 : m[y * Wd + x]);
    for (let y = 0; y < Hd; y++) for (let x = 0; x < Wd; x++) {
      const k = m[y * Wd + x];
      if (k) {
        const p = PAL[k];
        let col = p[0];
        if (!at(x, y - 1)) col = p[1]; else if (!at(x, y + 1) || (k !== 3 && !at(x, y + 2))) col = p[2];
        set(x, y, col);
      } else {
        let near = false;
        for (let dy = -1; dy <= 1 && !near; dy++) for (let dx = -1; dx <= 1; dx++) if (at(x + dx, y + dy)) { near = true; break; }
        if (near) set(x, y, '#03050b');
        else if (at(x, y - 1) || at(x - 1, y - 1)) set(x, y, '#03050b');
      }
    }
    for (let x = 0; x < Wd; x++) if (at(x, Hd - 1) || at(x - 1, Hd - 1)) set(x, Hd, '#03050b');   // 아래 그림자
    x2.putImageData(id, 0, 0);
    logoC = c; return c;
  }

  /* ---------- 배경(하늘·달·별·성·등대탑·바다 바탕) ---------- */
  let bg = null, bgKey = '';
  function bakeBg() {
    const g = G(), W = g.W, H = g.H, L = layout(), key = W + 'x' + H;
    if (bg && bgKey === key) return bg;
    const c = g.makeCanvas(W, H);
    g.withCtx(c, () => {
      g.gradV(0, 0, W, L.hz, ['#03050b', '#060a14', '#0b1322', '#152238']);
      // 달무리 + 별
      g.ctx.drawImage(U.glow(40, '#111c30', 10, 1.8), L.moonX - 40, L.moonY - 40);
      g.ctx.drawImage(U.glow(20, '#1c2a44', 11, 1.5), L.moonX - 20, L.moonY - 20);
      for (let i = 0; i < 52; i++) {
        const x = Math.floor(U.hash(i, 1, 31) * W), y = Math.floor(U.hash(i, 2, 31) * (L.hz - 26));
        if (Math.hypot(x - L.moonX, y - L.moonY) < 22) continue;
        const b = U.hash(i, 3, 31);
        g.px(x, y, b < 0.55 ? '#1e2a44' : b < 0.88 ? '#44547a' : '#8a9ac0');
      }
      // 달(지름 13)
      g.circle(L.moonX, L.moonY, 6, '#aebcd8');
      g.circle(L.moonX + 1, L.moonY - 1, 5, '#e6ecf6');
      g.px(L.moonX - 2, L.moonY + 1, '#bcc8e0'); g.px(L.moonX + 2, L.moonY - 3, '#cad4ea'); g.rect(L.moonX + 1, L.moonY + 2, 2, 1, '#bcc8e0'); g.px(L.moonX - 3, L.moonY - 2, '#d2dbee');
      // 바다 바탕
      g.gradV(0, L.hz, W, H - L.hz, ['#0d1830', '#0a1326', '#070d1b', '#03060c']);
      g.hline(0, L.hz, W, '#1c2c4a');
      // 멀리 플라니에 등대 탑
      g.rect(L.lampX - 1, L.lampY + 2, 3, 10, '#141826'); g.vline(L.lampX + 1, L.lampY + 3, 9, '#26324c');
      g.rect(L.lampX - 2, L.lampY + 1, 5, 1, '#0a0c14'); g.rect(L.lampX - 1, L.lampY - 1, 3, 2, '#0a0c14');
      // 샤토 디프(마스크로 그린 뒤 달빛 테두리)
      // 샤토 디프: 바위섬 → 비탈 성벽 → 본채(사각) → 둥근 탑 셋. 달(오른쪽 위)을 받는 쪽은 밝게
      const mk = g.makeCanvas(W, H), mx = mk.getContext('2d', { willReadFrequently: true });
      const ix = L.X0 + 64, hz = L.hz;
      g.withCtx(mk, () => {
        const rockH = x => { const u = (x - ix) / 62; return Math.max(0, Math.round(2 + 10 * (1 - u * u) + U.hash(x >> 1, 0, 33) * 2.4 + (Math.abs(u) < 0.25 ? 1 : 0))); };
        for (let x = ix - 62; x <= ix + 62; x++) {                                  // 바위섬(오른쪽으로 내려가는 면이 달빛을 받음)
          const h = rockH(x), hr = rockH(x + 1), lit = hr < h;
          g.rect(x, hz - h, 1, h + 2, '#0c0e16');
          g.px(x, hz - h, lit ? '#2a3a5a' : '#161c2a');
          if (lit && h > 3) g.px(x, hz - h + 1, '#1a2232');
          if (U.hash(x, 5, 34) < 0.25 && h > 5) g.px(x, hz - h + 3 + Math.floor(U.hash(x, 6, 34) * (h - 4)), '#141a26');
        }
        const cren = (x0, y0, w, col) => { for (let x = x0; x < x0 + w - 1; x += 3) g.rect(x, y0 - 2, 2, 2, col); };
        // 비탈진 바깥 성벽(아래가 넓다)
        for (let y = hz - 21; y <= hz - 7; y++) { const k = (y - (hz - 21)) >> 1; g.rect(ix - 46 - k, y, 92 + k * 2, 1, '#0b0d15'); }
        g.hline(ix - 46, hz - 21, 92, '#1a2436'); cren(ix - 46, hz - 21, 92, '#0b0d15');
        // 본채
        g.rect(ix - 16, hz - 38, 38, 18, '#0a0c14'); g.rect(ix + 14, hz - 38, 8, 18, '#0e121c'); cren(ix - 16, hz - 38, 38, '#0a0c14');
        g.hline(ix - 16, hz - 38, 38, '#1a2436');
        for (let k = 0; k < 3; k++) g.rect(ix - 10 + k * 10, hz - 33, 1, 3, '#05060a');         // 창 틈
        const tower = (x0, top, w, bot, col, lit) => {                              // 둥근 탑: 오른쪽 1/3 밝게, 위 모서리 깎기
          g.rect(x0, top + 1, w, bot - top - 1, col); g.rect(x0 + 1, top, w - 2, 1, col);
          g.rect(x0 + Math.round(w * 0.62), top + 1, w - Math.round(w * 0.62), bot - top - 1, lit);
          cren(x0, top, w, col);
          g.rect(x0 + (w >> 1) - 1, top + 6, 1, 3, '#05060a');
        };
        tower(ix - 32, hz - 45, 18, hz - 9, '#090b12', '#0f131e');                  // 큰 탑(북서)
