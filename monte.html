      MC.text.drawChar(gl.ch, x, y, 'body', gl.color ? MC.text.color(gl.color) : base);
    }
  }

  /* ---------- 선택지 ---------- */
  function buildChoice(opts) {
    const rh1 = MC.clamp(MC.ui.minTouch(), 26, 36), rows = [];
    let total = 0, cancel = -1;
    opts.forEach((o, i) => {
      const s = strip(prep(o && o.t != null ? o.t : o));
      let lines = MC.text.wrap(s, CHOICE_TW, 'body');
      if (lines.length > 2) lines = [lines[0], lines.slice(1).join(' ')];
      const h = lines.length > 1 ? Math.max(rh1, 36) : rh1;
      rows.push({ lines, h, y: total });
      total += h;
      if (o && (o.cancel || s === '그만둔다')) cancel = i;
    });
    return { rows, total, cancel, cursor: cancel >= 0 ? cancel : 0, pressed: -1, inside: false, pid: null, picked: -1, pickT: 0, t0: now(), open: 0, closing: false, kb: false, lastKey: MC.input.keyDir ? MC.input.keyDir() : null, res: null };
  }
  function choiceRect() {
    const g = G(), c = st.choice, h = c.total + 8, L = boxRect();
    let y;
    if (st.box) {
      if (st.pos === 'top') y = L.y + BOX_H + 3;
      else {
        let top = L.y;
        if (st.pt) top = L.y - 30;
        else if (st.sp && st.sp.style === 'normal' && st.sp.name != null) top = L.y - 18;
        else if (st.sp && st.sp.style === 'think') top = L.y - 17;
        y = top - 3 - h;
      }
    } else y = g.H - 8 - g.safe.bottom - h;
    return { x: L.x, y: Math.max(g.safe.top + 2, y), w: BOX_W, h };
  }
  function rowAt(x, y, slack) {
    const c = st.choice, R = choiceRect();
    slack = slack || 0;
    if (x < R.x - slack || x >= R.x + R.w + slack) return -1;
    const n = c.rows.length;
    for (let i = 0; i < n; i++) {
      const ry = R.y + 4 + c.rows[i].y;
      const top = i === 0 ? ry - 4 - slack : ry, bot = i === n - 1 ? ry + c.rows[i].h + 4 + slack : ry + c.rows[i].h;
      if (y >= top && y < bot) return i;
    }
    return -1;
  }
  function choiceUpdate(dt, t) {
    const c = st.choice;
    if (c.picked < 0) {
      c.open = Math.min(1, c.open + dt / OPEN_MS);
      const kd = MC.input.keyDir ? MC.input.keyDir() : null;
      if (kd !== c.lastKey) {
        c.lastKey = kd;
        if ((kd === 'up' || kd === 'down') && c.open >= 1) {
          const n = c.rows.length;
          if (c.kb) c.cursor = (c.cursor + (kd === 'up' ? n - 1 : 1)) % n;
          c.kb = true; sfx('ui_cursor');
        }
      }
      return;
    }
    if (!c.closing && t - c.pickT >= 200) c.closing = true;
    if (c.closing) {
      c.open = Math.max(0, c.open - dt / CLOSE_MS);
      if (c.open <= 0) {
        const r = c.res, i = c.picked;
        st.choice = null;
        if (st.mode === 'shown' || st.mode === 'typing') { st.mode = 'idle'; st.page = null; }
        st.idleAt = t;
        if (r) r(i);
      }
    }
  }
  function choiceInput(ev) {
    const c = st.choice;
    if (c.picked >= 0 || c.open < 1) return true;
    const ready = now() - c.t0 >= CHOICE_READY;
    switch (ev.type) {
      case 'down': {
        const i = rowAt(ev.x, ev.y, 0);
        if (i >= 0 && ready && c.pid === null) { c.pid = ev.id; c.pressed = i; c.inside = true; c.cursor = i; sfx('ui_cursor'); }
        return true;
      }
      case 'move': if (ev.id === c.pid) c.inside = rowAt(ev.x, ev.y, 4) === c.pressed; return true;
      case 'up': {
        if (ev.id !== c.pid) return true;
        const i = c.pressed;
        c.pid = null; c.pressed = -1;
        if (i >= 0 && rowAt(ev.x, ev.y, 4) === i) pick(i);
        return true;
      }
      case 'cancel': if (ev.id === c.pid) { c.pid = null; c.pressed = -1; } return true;
      case 'tap': if (ev.key && ready) { if (!c.kb) { c.kb = true; sfx('ui_cursor'); } else pick(c.cursor); } return true;
    }
    return true;
  }
  function pick(i) {
    const c = st.choice;
    if (!c || c.picked >= 0) return;
    c.picked = i; c.pickT = now(); c.cursor = i;
    sfx(i === c.cancel ? 'ui_cancel' : 'ui_ok');
    if (MC.input.vibrate) MC.input.vibrate(8);
  }
  function choiceBack() {
    const c = st.choice;
    if (!c || c.picked >= 0 || now() - c.t0 < CHOICE_READY) return;
    if (c.cancel >= 0) pick(c.cancel); else sfx('ui_ng');
  }
  function tri(x, y, col) { const g = G(); g.rect(x, y, 1, 5, col); g.rect(x + 1, y + 1, 1, 3, col); g.px(x + 2, y + 2, col); }
  function renderChoice(g, P, pal) {
    const c = st.choice, R = choiceRect(), t = now(), fo = pal ? { pal } : undefined;
    const e = c.closing ? 1 - MC.ease.inQuad(1 - c.open) : MC.ease.outQuad(c.open);
    if (e <= 0.02) return;
    if (e < 1) { const h = Math.max(6, Math.round(R.h * e) & ~1); g.frame(R.x, R.y + R.h - h, R.w, h, fo); return; }
    g.frame(R.x, R.y, R.w, R.h, fo);
    const sepC = g.mix(P.f, P.D, 0.6), dotC = g.mix(P.W, P.f, 0.55);
    for (let i = 0; i < c.rows.length; i++) {
      const r = c.rows[i], ry = R.y + 4 + r.y;
      const blink = c.picked === i && (((t - c.pickT) / 50) | 0) % 2 === 0;
      const on = (c.picked < 0 && c.pressed === i && c.inside) || blink;
      const cur = !on && c.kb && c.picked < 0 && c.cursor === i;
      if (on) g.rect(R.x + 4, ry, R.w - 8, r.h, P.W);
      else if (cur) g.rect(R.x + 4, ry, R.w - 8, r.h, g.mix(P.f, P.W, 0.14));
      const dim = c.picked >= 0 && c.picked !== i;
      const col = on ? P.f : (dim ? P.dim : P.text), my = ry + (r.h >> 1);
      if (on || cur) tri(R.x + 8, my - 2, on ? P.f : P.gold);
      else g.rect(R.x + 8, my - 1, 2, 2, dotC);
      const th = r.lines.length * LH, ty0 = ry + ((r.h - th) >> 1) + 1;
      for (let j = 0; j < r.lines.length; j++) MC.text.draw(r.lines[j], R.x + 17, ty0 + j * LH, { color: col });
      const nextOn = c.picked < 0 && c.pressed === i + 1 && c.inside;
      if (i < c.rows.length - 1 && !on && !nextOn) g.hline(R.x + 8, ry + r.h - 1, R.w - 16, sepC);
    }
  }

  /* ---------- 공개: 대사·선택지·닫기 ---------- */
  // o: {who, t:문자열|배열, face, auto(ms), pos:'top', voice, speed(ms/자), keep:'yes'|'grace'|'no'(마지막 뒤 창 유지)}
  function say(o) {
    o = o || {};
    return enqueue(async () => {
      const sp = speaker(o.who);
      const boxes = (Array.isArray(o.t) ? o.t : [o.t != null ? o.t : o.text]).filter(x => x != null);
      if (!boxes.length) return;
      await openBox(sp, o);
      const voice = o.voice !== undefined ? o.voice : sp.voice;
      for (let b = 0; b < boxes.length; b++) {
        const comp = compile(boxes[b], { align: sp.align });
        for (let p = 0; p < comp.pages.length; p++) {
          if (!inStack()) return;
          await showPage(comp.pages[p], { auto: o.auto, speed: o.speed, voice });
        }
      }
      st.keep = o.keep || 'grace';
      if (st.keep === 'no') startClose();
    });
  }
  // o: {who, t(질문, 선택), face, pos, opts:[{t, cancel?}]} → Promise<고른 번호>
  function choice(o) {
    o = o || {};
    return enqueue(async () => {
      const opts = (o.opts || []).slice(0, 3);
      if (!opts.length) return -1;
      const sp = speaker(o.who || 'think');
      if (o.t != null && o.t !== '') {
        await openBox(sp, o);
        const comp = compile(o.t, { align: sp.align });
        for (let p = 0; p < comp.pages.length; p++) {
          if (!inStack()) break;
          await showPage(comp.pages[p], { speed: o.speed, voice: sp.voice, noWait: p === comp.pages.length - 1 });
        }
      } else if (!inStack()) {
        if (st.on) hardReset();
        Object.assign(st, { sp, pt: null, face: null, pos: o.pos === 'top' ? 'top' : 'bottom', box: false, open: 0, mode: 'idle', page: null });
        pushScene();
      }
      if (MC.input.lock) MC.input.lock(0);          // 빨리감기 중이던 손가락으로는 못 고름
      const idx = await new Promise(res => { st.choice = buildChoice(opts); st.choice.res = res; if (!inStack()) hardReset(); });
      st.keep = 'grace';
      return idx;
    });
  }
  // 창을 닫는다(앞선 대사가 끝난 뒤). 이미 닫혀 있으면 바로
  function close() {
    return enqueue(() => new Promise(res => {
      if (!inStack()) { if (st.on) hardReset(); res(); return; }
      st.closeRes.push(res);
      startClose();
    }));
  }

  /* ---------- narr: 검은 화면 한가운데 서술(한 자씩) ---------- */
  // o: {t:문자열|배열(줄), ms(다 찍힌 뒤 자동 진행, 없으면 탭 대기), speed(ms/자, 기본 45)}
  let narrS = null;
  function narr(o) {
    o = o || {};
    return enqueue(() => new Promise(res => {
      if (inStack()) startClose();
      const g = G();
      const arr = (Array.isArray(o.t) ? o.t : [o.t]).filter(x => x != null);
      const width = Math.min(g.W - 24, 200);
      const glyphs = [], lineW = [];
      let lines = 0, carry = 0;
      arr.forEach((s, ei) => {
        const pg = compile(s, { width, lines: 999 }).pages[0];
        pg.glyphs.forEach((gl, gi) => { gl.line += lines; if (gi === 0) { if (ei > 0) gl.nl = true; gl.pre += carry; } glyphs.push(gl); });
        carry = pg.glyphs.length ? pg.tail : carry + pg.tail;
        for (const w of pg.lineW) lineW.push(w);
        lines += pg.lines;
      });
      const lf = lift();
      const s = { name: 'narr', opaque: !!lf, blocking: false, glyphs, lineW, lines, shown: 0, acc: 0, revealT: new Array(glyphs.length),
        bg: lf ? 1 : 0, ta: 1, mode: lf ? 'typing' : 'in', doneAt: 0, tail: carry, base: spdOf(o.speed != null ? +o.speed : 45), ms: o.ms != null ? +o.ms : null, lf, downId: null, done: false };
      narrS = s;
      function finish() {
        if (s.done) return; s.done = true;
        MC.scene.remove(s); unlift(s.lf); narrS = null; res();
      }
      function end() { if (s.mode === 'typing' || s.mode === 'shown' || s.mode === 'in') s.mode = 'outText'; }
      function all(t) { for (let i = s.shown; i < glyphs.length; i++) s.revealT[i] = t - 999; s.shown = glyphs.length; s.mode = 'shown'; s.doneAt = t; }
      s.update = dt => {
        const t = now(), ff = MC.scene.top() === s && MC.input.heldMs && MC.input.heldMs() >= FF_HOLD;
        if (s.mode === 'in') { s.bg = Math.min(1, s.bg + dt / 260); if (s.bg >= 1) { s.mode = 'typing'; s.acc = 0; } }
        else if (s.mode === 'typing') {
          if (ff || s.base <= 0) all(t);
          else {
            s.acc += dt;
            while (s.shown < glyphs.length) {
              const d = delayOf(glyphs, s.shown, s.base);
              if (s.acc < d) break;
              s.acc -= d;
              const gl = glyphs[s.shown]; s.revealT[s.shown++] = t;
              if (!gl.quiet) blip('sys', gl.ch);
            }
            if (s.shown >= glyphs.length && s.acc >= pauseOf(s.tail, true)) { s.mode = 'shown'; s.doneAt = t; }
          }
        } else if (s.mode === 'shown') {
          if (s.ms != null ? t - s.doneAt >= s.ms : (ff && t - s.doneAt >= 300)) end();
        } else if (s.mode === 'outText') {
          s.ta = Math.max(0, s.ta - dt / 220);
          if (s.ta <= 0) { if (s.lf) finish(); else s.mode = 'outBg'; }
        } else if (s.mode === 'outBg') {
          s.bg = Math.max(0, s.bg - dt / 300);
          if (s.bg <= 0) finish();
        }
        s.opaque = s.bg >= 1;
      };
      s.onInput = ev => {
        const t = now();
        if (ev.type === 'down') s.downId = ev.id;
        const tapLike = ev.type === 'tap' || (ev.type === 'up' && !ev.key && ev.id === s.downId && ev.dur > MC.input.TAP_MS && ev.dur < 700 && ev.travel <= 12);
        if (!tapLike) return true;
        if (s.mode === 'typing') all(t);
        else if (s.mode === 'shown' && t - s.doneAt >= IGNORE_MS) end();
        return true;
      };
      s.onBack = () => s.onInput({ type: 'tap' });
      s.render = () => {
        const g2 = G(), t = now();
        base(s);
        if (s.bg >= 1) g2.clear('#000'); else if (s.bg > 0) g2.ditherFill('#000', Math.round(s.bg * 16));
        if (s.mode === 'in') return;
        const L2 = 18, total = s.lines * L2, y0 = ((g2.H - total) >> 1) - 6, ta = s.ta;
        for (let i = 0; i < s.shown; i++) {
          const gl = glyphs[i];
          if (gl.space) continue;
          const a = step3(MC.clamp((t - s.revealT[i]) / 120, 0, 1) * ta);
          if (a <= 0) continue;
          let x = ((g2.W - s.lineW[gl.line]) >> 1) + gl.x, y = y0 + gl.line * L2;
          if (gl.fx) { const off = fxOff(gl.fx, i, t); x += off[0]; y += off[1]; }
          MC.text.drawChar(gl.ch, x, y, 'body', gl.color ? MC.text.color(gl.color) : '#f0ece0', a);
        }
        if (s.mode === 'shown' && s.ms == null) MC.ui.nextMark((g2.W >> 1) - 2, y0 + total + 6);
      };
      MC.scene.push(s);
    }));
  }

  /* ---------- 이름칸 전환: 이름이 그어지고 깜빡이며 바뀐다 ---------- */
  // (이름칸 창: 당테스 초상 + '이름' + 큰 글씨 이름) o: {face, sfx(마지막 효과음, 기본 thud)}
  function nameChange(from, to, o) {
    o = o || {};
    return enqueue(() => new Promise(res => {
      if (inStack()) startClose();
      const sp = speaker('dantes'), pt = portraitOf(sp, o.face);
      const T = { open: 140, strike0: 560, strike1: 820, blink0: 1040, settle: 1400, hold: 2500, close: 2600 };
      const lf = lift();
      const s = { name: 'nameplate', opaque: false, blocking: false, t0: now(), lf, done: false, fired: {} };
      const oldN = from == null || from === '' ? '＿＿＿' : String(from), newN = to == null || to === '' ? '＿＿＿' : String(to);
      s.update = () => {
        const t = now() - s.t0, f = s.fired;
        if (t >= T.strike0 && !f.q) { f.q = 1; sfx('quill'); }
        for (let k = 0; k < 4; k++) { const at = T.blink0 + k * 90; if (t >= at && !f['b' + k]) { f['b' + k] = 1; sfx('card_tick', { pitch: 1 + k * 0.06 }); } }
        if (t >= T.settle && !f.s) { f.s = 1; sfx(o.sfx || 'thud'); MC.fx.shake(0.14); if (MC.input.vibrate) MC.input.vibrate(25); }
        if (t >= T.close && !s.done) { s.done = true; MC.scene.remove(s); unlift(s.lf); res(); }
      };
      s.onInput = ev => { if (ev.type === 'tap' && now() - s.t0 > T.settle + 250 && now() - s.t0 < T.hold) s.t0 = now() - T.hold; return true; };
      s.onBack = () => {};
      s.render = () => {
        const g = G(), P = g.uiPal, t = now() - s.t0;
        base(s);
        const w = BOX_W, h = 52, x = g.X0 + 2, y = g.H - 66 - g.safe.bottom + 5;
        let e = 1;
        if (t < T.open) e = MC.ease.outQuad(t / T.open);
        else if (t > T.hold) e = 1 - MC.ease.inQuad(MC.clamp((t - T.hold) / (T.close - T.hold), 0, 1));
        if (e < 1) { const hh = Math.max(6, Math.round(h * e) & ~1); if (e > 0.02) g.frame(x, y + ((h - hh) >> 1), w, hh); return; }
        g.frame(x, y, w, h);
        let nx = x + 12;
        if (pt) {
          g.frame(x + 6, y + 8, 36, 36, { small: true });
          g.gradV(x + 8, y + 10, 32, 32, [g.mix(P.f, P.D, 0.6), g.mix(P.f, P.D, 0.3), P.f]);
          g.sprite(pt, x + 8, y + 10);
          nx = x + 50;
        }
        MC.text.draw('이름', nx, y + 5, { font: 'small', color: P.dim });
        g.hline(nx, y + 43, x + w - 10 - nx, g.mix(P.W, P.f, 0.55));
        const ny = y + 15;
        const drawOld = () => {
          const ow = MC.text.width(oldN, 'big');
          MC.text.draw(oldN, nx, ny, { font: 'big', color: '#f0c860' });
          const p = MC.clamp((t - T.strike0) / (T.strike1 - T.strike0), 0, 1);
          if (p > 0) { const lw = Math.round((ow + 4) * MC.ease.outCubic(p)); g.rect(nx - 2, ny + 14, lw, 2, P.red); g.hline(nx - 2, ny + 16, lw, '#000'); }
        };
        if (t < T.blink0) drawOld();
        else if (t < T.settle) { if ((((t - T.blink0) / 90) | 0) % 2 === 0) drawOld(); else MC.text.draw(newN, nx, ny, { font: 'big', color: '#ffffff' }); }
        else {
          const k = t - T.settle, jx = k < 200 ? ((((k / 40) | 0) % 2) ? 1 : -1) : 0;
          if (k < 70) g.rect(nx - 3, ny + 1, MC.text.width(newN, 'big') + 6, 26, P.W);
          MC.text.draw(newN, nx + jx, ny, { font: 'big', color: k < 70 ? P.f : '#f0c860' });
        }
      };
      MC.scene.push(s);
    }));
  }

  // 모두 치움(타이틀로 돌아갈 때 등): 걸린 약속을 풀고 씬을 뺀다
  function reset() {
    hardReset();
    if (narrS) { const s = narrS; narrS = null; s.done = true; MC.scene.remove(s); unlift(s.lf); }
    for (const sc of MC.scene.stack.slice()) if (sc.name === 'nameplate' || sc.name === 'narr') MC.scene.remove(sc);
    chain = Promise.resolve(); pending = 0;
  }

  MC.dialogue = {
    say,                  // say({who,t,face,auto,pos,voice,speed,keep}) -> Promise
    choice,               // choice({who,t,opts:[{t,cancel}]}) -> Promise<index>
    narr,                 // narr({t,ms,speed}) -> Promise
    nameChange,           // nameChange(옛 이름, 새 이름, {face,sfx}) -> Promise
    close,                // 창 닫기 -> Promise
    reset,
    speaker, portraitOf, compile, prep, strip,
    boxRect,              // 현재 대화창 위치 {x,y,w,h}
    get active() { return st.on || !!narrS || pending > 0 || MC.scene.find('nameplate') !== null; },
    get open() { return inStack(); },
    BOX_W, BOX_H, TEXT_W
  };
})(window.MC);

</script>
<script>/* ==== src/engine/events.js ==== */
/* events.js — 이벤트 러너 MC.events.run(id|cmds) → Promise: 계약서 8.2의 op 전부 + 8.3 조건, async/parallel/call/if/end, 실행 중 필드 잠금,
   op 오류는 그 명령만 건너뛰고 경고(게임은 멈추지 않음), 이미 본 장면은 600ms 길게 눌러 다음 대사까지 빨리 넘김, card/caption/closeup/custom 대체 연출, validate() */
(function (MC) { 'use strict';
  const warned = new Set();
  function warn(k, m) { if (warned.has(k)) return; warned.add(k); console.warn('[events] ' + m); }
  const isFn = (o, f) => !!(o && typeof o[f] === 'function');
  function F(f) { const o = MC.field; if (isFn(o, f)) return o[f].bind(o); warn('field.' + f, 'MC.field.' + f + ' 없음 — 건너뜀'); return null; }
  function A(mod, f) { const o = MC[mod]; if (isFn(o, f)) return o[f].bind(o); warn(mod + '.' + f, 'MC.' + mod + '.' + f + ' 없음 — 건너뜀'); return null; }
  function sfx(id, o) { if (isFn(MC.sfx, 'play')) { try { MC.sfx.play(id, o); } catch (e) { MC.core.error(e, 'sfx'); } } }
  const SKIP_HOLD = 600;
  const EMOTES = ['cloud', 'question', 'exclaim', 'sweat', 'dots', 'anger', 'note', 'bulb'];
  const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };

  let gen = 1, depth = 0, topSeen = false, skipping = false, skipSc = null, prevScale = 1, task = null, validated = false;
  const skipWaiters = new Set();

  const EV = MC.events = {
    get running() { return depth > 0; },     // 이벤트 실행 중(필드는 잠김)
    get skipping() { return skipping; },
    current: null,            // 지금 도는 최상위 이벤트 id
    lastId: null, step: null, // 디버그 표시용
    outcome: null,            // 마지막 battle 결과 win|lose|flee|scripted
    lastChoice: null,
    fadeColor: '#000', fadeGen: 0,
    hudHidden: false, free: false
  };

  /* ---------- 공용 도우미 ---------- */
  function wait(ms) {                        // 게임 시간 대기. 건너뛰기가 시작되면 즉시 풀림
    if (skipping || !(ms > 0)) return Promise.resolve();
    return new Promise(res => {
      let done = false;
      const fin = () => { if (done) return; done = true; skipWaiters.delete(fin); res(); };
      skipWaiters.add(fin);
      MC.core.wait(ms).then(fin);
    });
  }
  function guard(p, ms, label) {             // 남의 Promise가 영영 안 끝나도 이벤트가 멈추지 않게
    if (!p || typeof p.then !== 'function') return Promise.resolve(p);
    return new Promise(res => {
      let done = false;
      p.then(v => { if (!done) { done = true; res(v); } }, e => { if (!done) { done = true; MC.core.error(e, 'ev ' + label); res(); } });
      MC.core.waitReal(ms).then(() => { if (!done) { done = true; warn('to:' + label, label + ' — ' + ms + 'ms 안에 끝나지 않아 넘어감'); res(); } });
    });
  }
  function lockField(on) { if (isFn(MC.field, 'lock')) { try { MC.field.lock(!!on); } catch (e) { MC.core.error(e, 'field.lock'); } } }
  function relock() { if (depth > 0 && !EV.free) lockField(true); }
  function refresh() { if (isFn(MC.field, 'refresh')) { try { MC.field.refresh(); } catch (e) { MC.core.error(e, 'field.refresh'); } } }
  function closeDlg() { return MC.dialogue && MC.dialogue.close ? MC.dialogue.close() : Promise.resolve(); }
  function clean(c) { const o = Object.assign({}, c); delete o.op; delete o.async; return o; }
  function ids(v) { return String(v == null ? 'player' : v).split(',').map(s => s.trim()).filter(Boolean); }
  function actor(id) { try { return isFn(MC.field, 'actor') ? MC.field.actor(id) : null; } catch (_) { return null; } }
  function dirTo(a, b) { const dx = b.x - a.x, dy = b.y - a.y; return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
  function pathTiles(path, id) {
    if (typeof path === 'string') { let n = 0; path.replace(/([UDLR])\s*(\d*)/gi, (m, d, k) => { n += k === '' ? 1 : +k; return m; }); return n || 1; }
    if (Array.isArray(path)) {
      const a = actor(id); let n = 0, px = a ? a.x : null, py = a ? a.y : null;
      for (const p of path) { if (!Array.isArray(p)) continue; n += px != null ? Math.abs(p[0] - px) + Math.abs(p[1] - py) : 8; px = p[0]; py = p[1]; }
      return Math.max(1, n);
    }
    return 8;
  }
  function itemName(id) { const it = MC.data.battle && MC.data.battle.items && MC.data.battle.items[id]; return (it && it.name) || id; }
  function skillName(id) { const it = MC.data.battle && MC.data.battle.skills && MC.data.battle.skills[id]; return (it && it.name) || id; }
  function jingle(id) {
    if (isFn(MC.music, 'jingle')) { try { const p = MC.music.jingle(id); if (p && p.catch) p.catch(() => {}); } catch (e) { MC.core.error(e, 'jingle'); } }
    else sfx(id === 'item' ? 'chest' : 'ui_ok');
  }
  function forward(s, f, ev) { const stk = MC.scene.stack, i = stk.indexOf(s), b = i > 0 ? stk[i - 1] : null; return b && typeof b[f] === 'function' ? b[f](ev) : false; }

  /* ---------- 페이드 위로 띄우기: 화면이 페이드로 완전히 덮였을 때 대사·카드가 보이도록 ---------- */
  // 검은(페이드 색) 바탕 씬을 깔고 페이드를 걷었다가, 끝나면(그 사이 아무도 페이드를 안 바꿨으면) 되돌린다
  EV.lift = function () {
    const lv = MC.fx && MC.fx.fadeLevel ? MC.fx.fadeLevel() : 0;
    if (lv < 0.99) return null;
    const color = EV.fadeColor || '#000';
    const sc = { name: 'ev_under', opaque: true, blocking: false, render() { MC.gfx.clear(color); } };
    sc.onInput = ev => forward(sc, 'onInput', ev);
    sc.onBack = ev => forward(sc, 'onBack', ev);
    const h = { lv, color, gen: ++EV.fadeGen, sc };
    MC.scene.push(sc);
    MC.fx.fade(0, 0);
    return h;
  };
  EV.unlift = function (h) {
    if (!h) return;
    if (EV.fadeGen === h.gen) MC.fx.fade(h.lv, 0, { color: h.color });
    MC.scene.remove(h.sc);
  };
  async function present(fn) {
    await closeDlg();
    const h = EV.lift();
    try { return await fn(); } finally { EV.unlift(h); }
  }

  /* ---------- 대체 연출(scenes 담당 카드가 없을 때) ---------- */
  function overlay(o) {
    return new Promise(res => {
      const s = { name: o.name || 'ev_fx', opaque: !!o.opaque, blocking: false, t0: MC.time.real, done: false, endAt: null };
      s.finish = () => { if (s.done) return; s.done = true; MC.scene.remove(s); res(); };
      s.update = dt => { const t = MC.time.real - s.t0; if (o.update) o.update(t, s, dt); };
      s.render = () => { if (MC.scene.stack[0] === s) MC.gfx.clear('#05060c'); o.render(MC.time.real - s.t0, s); };
      s.onInput = ev => { if (ev.type === 'tap' && o.onTap) o.onTap(MC.time.real - s.t0, s); return true; };
      s.onBack = () => { if (o.onTap) o.onTap(MC.time.real - s.t0, s); };
      MC.scene.push(s);
    });
  }
  const a3 = a => (a <= 0 ? 0 : a < 0.34 ? 0.34 : a < 0.67 ? 0.67 : 1);
  function fbInfo(text, ms) {
    return overlay({ name: 'ev_info', opaque: true,
      render(t) { const g = MC.gfx; g.clear('#000'); MC.text.draw(text, g.W >> 1, (g.H >> 1) - 8, { align: 'center', color: '#9a98a8', alpha: a3(Math.min(t / 150, (ms - t) / 150)) }); },
      update(t, s) { if (t >= ms) s.finish(); },
      onTap(t, s) { if (t > 200) s.finish(); } });
  }
  function fbCaption(o) {
    const ms = o.ms != null ? +o.ms : 1500, IN = 160, OUT = 220;
    return overlay({ name: 'ev_caption',
      render(t) {
        const g = MC.gfx, a = a3(t < IN ? t / IN : t > ms - OUT ? (ms - t) / OUT : 1);
        MC.text.draw(String(o.t == null ? '' : o.t), g.W >> 1, (g.H >> 1) - 18, { font: 'big', color: o.color || '#f0ece0', align: 'center', outline: '#000', alpha: a });
      },
      update(t, s) { if (t >= ms) s.finish(); },
      onTap(t, s) { if (t > 250 && t < ms - OUT) s.t0 = MC.time.real - (ms - OUT); } });
  }
  let bandKept = false;
  function fbCloseup(o) {
    const ms = o.ms != null ? +o.ms : 1200, BAND = 88, IN = 220, OUT = 160, bandIn = bandKept ? 0 : 150, keep = !!o.keepBand;
    bandKept = false;
    const sp = MC.dialogue ? MC.dialogue.speaker(o.who) : { name: o.who, color: '#f0ece0' };
    const lines = o.t ? MC.text.wrap(MC.dialogue ? MC.dialogue.strip(MC.dialogue.prep(o.t)) : String(o.t), 90, 'body').slice(0, 3) : [];
    return overlay({ name: 'ev_closeup',
      render(t) {
        const g = MC.gfx, cy = g.H >> 1;
        const tb = bandIn ? MC.clamp(t / bandIn, 0, 1) : 1, tout = keep ? 0 : MC.clamp((t - (ms - OUT)) / OUT, 0, 1);
        const bh = Math.round(BAND * MC.ease.outCubic(tb) * (1 - MC.ease.inQuad(tout))) & ~1;
        if (bh <= 0) return;
        const by = cy - (bh >> 1);
        g.rect(0, by, g.W, bh, '#05060c');
        if (bh >= 4) { g.hline(0, by + 1, g.W, '#3a3448'); g.hline(0, by + bh - 2, g.W, '#3a3448'); }
        if (tb < 1) return;
        const pin = MC.ease.outCubic(MC.clamp((t - bandIn) / IN, 0, 1)), pout = MC.ease.inCubic(MC.clamp((t - (ms - OUT)) / OUT, 0, 1));
        const x0 = g.X0 + 14, px = Math.round(-70 + (x0 + 70) * pin - pout * (x0 + 70)), py = cy - 32;
        g.pushClip(0, by + 2, g.W, bh - 4);
        if (o.sprite) g.sprite(o.sprite, px, py, { scale: 2 });
        else g.rect(px, py, 64, 64, '#1a1420');
        const tx = px + 76;
        if (sp && sp.name) MC.text.draw(sp.dyn ? (MC.state.dispName || sp.name) : sp.name, tx, py + 6, { font: 'bold', color: sp.color || '#f0ece0' });
        for (let i = 0; i < lines.length; i++) MC.text.draw(lines[i], tx, py + 26 + i * 16, { color: '#c8c4d0' });
        g.popClip();
      },
      update(t, s) { if (t >= ms) { bandKept = keep; s.finish(); } },
      onTap(t, s) { if (t > bandIn + IN && t < ms - OUT) s.t0 = MC.time.real - (ms - OUT); } });
  }
  function fbCard(o) {
    const g0 = MC.gfx, title = String(o.t == null ? '' : o.t), sub = o.sub != null ? String(o.sub) : '';
    const roll = o.from != null && o.to != null && +o.to !== +o.from, from = +o.from, to = +o.to;
    const T0 = 400, CH = 60, typeEnd = T0 + Array.from(title).length * CH, subAt = typeEnd + 500;
    const steps = roll ? Math.abs(to - from) : 0, rollEnd = subAt + steps * 220, markAt = rollEnd + (roll ? 1200 : 900), OUTMS = 400;
    let ticks = 0, rolled = 0, subShown = false, outAt = null;
    return overlay({ name: 'ev_card', opaque: true,
      update(t, s) {
        const nT = Math.min(Array.from(title).length, Math.max(0, Math.floor((t - T0) / CH) + 1));
        while (ticks < nT) { const ch = Array.from(title)[ticks++]; if (ch && ch.trim() && ch !== '─') sfx('card_tick'); }
        if (t >= subAt && !subShown) { subShown = true; if (!roll) sfx('card_tick', { pitch: 0.8 }); }
        if (roll) { const r = MC.clamp(Math.floor((t - subAt) / 220), 0, steps); while (rolled < r) { rolled++; sfx('year_tick'); } }
        if (outAt == null && t >= markAt + 3200) outAt = t;
        s.opaque = outAt == null;
        if (outAt != null && t >= outAt + OUTMS) s.finish();
      },
      render(t) {
        const g = MC.gfx, cy = g.H >> 1;
        const fo = outAt != null ? 1 - MC.clamp((t - outAt) / OUTMS, 0, 1) : 1;
        if (fo >= 1) g.clear('#000'); else g.ditherFill('#000', Math.round(fo * 16));
        const n = Math.max(0, Math.floor((t - T0) / CH) + 1), shownT = Array.from(title).slice(0, n).join('');
        const tw = MC.text.width(title, 'body');
        MC.text.draw(shownT, (g.W - tw) >> 1, cy - 30, { color: '#c8c4d0', alpha: a3(fo) });
        if (t >= subAt) {
          if (roll) {
            const k = MC.clamp((t - subAt) / 220, 0, steps), i = Math.floor(k), f = k - i;
            const yr = from + (to > from ? 1 : -1) * Math.min(i, steps), s1 = yr + '년';
            const dy = i < steps ? Math.round((1 - MC.ease.outCubic(f)) * 6) : 0;
            MC.text.draw(s1, g.W >> 1, cy - 8 + dy, { font: 'big', color: '#f0ece0', align: 'center', alpha: a3(fo) });
          } else MC.text.draw(sub, g.W >> 1, cy - 6, { font: sub.length <= 8 ? 'big' : 'body', color: '#f0ece0', align: 'center', alpha: a3(Math.min(1, (t - subAt) / 200) * fo) });
        }
        if (t >= markAt && outAt == null) MC.ui.nextMark((g.W >> 1) - 2, cy + 34);
        void g0;
      },
      onTap(t, s) { if (t >= markAt && outAt == null) { outAt = t; sfx('page'); } else if (t > 300 && t < markAt) s.t0 = MC.time.real - markAt; } });
  }
  function cards(kind, c, fb) {
    const C = MC.ch1 && MC.ch1.cards, o = clean(c);
    if (C && typeof C[kind] === 'function') { try { return C[kind](o); } catch (e) { MC.core.error(e, 'cards.' + kind); } }
    else warn('cards.' + kind, 'MC.ch1.cards.' + kind + ' 없음 → 대체 연출');
    return fb(o);
  }

  /* ---------- 건너뛰기(이미 본 이벤트: 600ms 길게 누르면 다음 대사까지 빨리) ---------- */
  const SEEN_KEY = 'mc34.evseen';
  let seen = null;
  function loadSeen() { if (seen) return seen; try { seen = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; } catch (_) { seen = {}; } return seen; }
  function isSeen(id) { return !!(id && id[0] !== '(' && loadSeen()[id]); }
  function markSeen(id) {
    if (!id || id[0] === '(' || id.indexOf('__') === 0) return;
    const s = loadSeen();
    if (s[id]) return;
    s[id] = 1;
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(s)); } catch (_) {}
  }
  function startSkip() {
    if (skipping) return;
    skipping = true;
    prevScale = MC.time.scale; MC.time.scale = Math.max(prevScale, 3);
    for (const f of Array.from(skipWaiters)) f();
    const s = skipSc = { name: 'ev_skip', opaque: false, blocking: false };
    s.render = () => {
      if (MC.scene.stack[0] === s) MC.gfx.clear('#05060c');
      const g = MC.gfx, txt = '▶▶ 넘기는 중', w = MC.text.width(txt, 'small') + 12, x = (g.W - w) >> 1, y = 3 + g.safe.top;
      g.frame(x, y, w, 15, { small: true });
      MC.text.draw(txt, x + 6, y + 1, { font: 'small', color: ((MC.time.real / 400) | 0) & 1 ? g.uiPal.gold : g.uiPal.text });
    };
    s.onInput = ev => forward(s, 'onInput', ev);
    s.onBack = ev => forward(s, 'onBack', ev);
    MC.scene.push(s);
  }
  function stopSkip() {
    if (!skipping) return;
    skipping = false;
    MC.time.scale = prevScale;
    if (skipSc) { MC.scene.remove(skipSc); skipSc = null; }
  }
  function tick() {
    if (depth <= 0 || skipping || !topSeen) return;
    if (MC.dialogue && MC.dialogue.active) return;
    // 숨 참기(길게 누르기)·전투·카드·연출 씬 위에서는 건너뛰기를 켜지 않는다(누르고 버티는 조작이 빨리감기로 새지 않게)
    const top = MC.scene.top(), nm = (top && top.name) || '';
    if (!(nm === 'field' || nm === 'dialogue' || nm === 'ev_under')) return;
    if (MC.input.heldMs && MC.input.heldMs() >= SKIP_HOLD) startSkip();
  }
  EV.skip = () => startSkip();       // 디버그용

  /* ---------- 대사 창을 열어 둘지: 다음에 곧 대사가 오면 'yes', 알 수 없으면 'grace', 아니면 'no' ---------- */
  const INSTANT = new Set(['set', 'add', 'sfx', 'face', 'flash', 'shake', 'hitstop', 'vibrate', 'bgm', 'bgmcut', 'amb', 'music', 'duck', 'lowpass', 'take', 'year', 'act', 'hud', 'sprite', 'show', 'spawn', 'despawn', 'banner', 'heal', 'fx']);
  function keepAfter(env) {
    const list = env.list;
    for (let j = env.i + 1; j < list.length; j++) {
      const c = list[j];
      if (!c || typeof c !== 'object') continue;
      if (c.op === 'say' || c.op === 'choice' || (c.op === 'give' && !c.quiet) || c.op === 'learn') return 'yes';
      if (c.async || INSTANT.has(c.op)) continue;
      if (c.op === 'wait' && (+c.ms || 0) <= 500) continue;
      if ((c.op === 'grade' || c.op === 'vignette' || c.op === 'light' || c.op === 'letterbox') && (+c.ms || 0) <= 300) continue;
      if (c.op === 'if' || c.op === 'call') return 'grace';
      return 'no';
    }
    return env.nested ? 'grace' : 'no';
  }

  /* ---------- op 표 ---------- */
  const OPS = EV.ops = {
    /* 흐름 */
    wait: c => wait(+c.ms || 0),
    if: (c, env) => { const br = MC.game.check(c.cond) ? c.then : c.else; return br ? runList(br, env.frame, env.ctx, true) : null; },
    call: (c, env) => runEvent(c.ev || c.event || c.id, env.ctx),
    end: (c, env) => { env.frame.ended = true; },
    set: c => {
      const v = c.v !== undefined ? c.v : c.value;
      if (c.flag != null) MC.game.setFlag(c.flag, v === undefined ? true : v);
      if (c.var != null) MC.game.setVar(c.var, v);
      refresh();
    },
    add: c => { MC.game.addVar(c.var, c.n == null ? 1 : +c.n); refresh(); },
    parallel: (c, env) => Promise.all((c.do || []).map(b => runList(Array.isArray(b) ? b : [b], env.frame, env.ctx, true))),

    /* 대화 */
    say: (c, env) => { stopSkip(); return MC.dialogue.say({ who: c.who, t: c.t != null ? c.t : c.text, face: c.face, auto: c.auto, pos: c.pos, voice: c.voice, speed: c.speed, keep: keepAfter(env) }); },
    narr: async c => { stopSkip(); await closeDlg(); await MC.dialogue.narr({ t: c.t != null ? c.t : c.text, ms: c.ms, speed: c.speed }); },
    choice: async (c, env) => {
      stopSkip();
      const opts = (c.opts || c.options || []).slice(0, 3);
      if (!opts.length) return;
      const idx = await MC.dialogue.choice({ who: c.who, t: c.t != null ? c.t : c.text, face: c.face, pos: c.pos, speed: c.speed, opts: opts.map(o => ({ t: o.t != null ? o.t : o.text, cancel: o.cancel })) });
      const o = opts[idx] || opts[0];
      const v = o.v !== undefined ? o.v : idx;
      if (c.var) MC.game.setVar(c.var, v);
      EV.lastChoice = v;
      refresh();
      if (o.do) await runList(o.do, env.frame, env.ctx, true);
    },
    caption: c => { if (skipping) return; return present(() => cards('caption', c, fbCaption)); },
    closeup: (c, env) => {
      if (skipping) return;
      const nx = env.list[env.i + 1];
      const o = Object.assign({}, c, { sprite: MC.dialogue.portraitOf(c.who, c.face), keepBand: !!(nx && nx.op === 'closeup') });
      const sp = MC.dialogue.speaker(c.who);
      if (o.name == null) o.name = sp.name;
      if (o.color == null) o.color = sp.color;
      return present(() => cards('closeup', o, fbCloseup));
    },

    /* 인물·맵 */
    map: async c => {
      await closeDlg();
      const f = F('enter');
      if (!f) return;
      await f(c.id, c.at != null ? c.at : 'default', skipping ? 'cut' : (c.trans || 'fade'));
      relock();
    },
    spawn: c => { const f = F('spawn'); if (f) f(clean(c)); },
    despawn: c => { const f = F('despawn'); if (f) for (const id of ids(c.id)) f(id); },
    move: async c => {
      const f = F('moveActor');
      if (!f) return;
      let speed = c.speed != null ? +c.speed : 240;
      if (skipping) speed = Math.min(speed, 60);
      await Promise.all(ids(c.id).map(id => guard(f(id, c.path, speed, c.face), pathTiles(c.path, id) * speed * 1.6 + 2500, 'move ' + id)));
    },
    face: c => {
      const f = F('face');
      if (!f) return;
      for (const id of ids(c.id)) {
        let d = c.dir || 'down';
        if (d === 'player' || d === 'back') {
          const a = actor(id), p = actor('player');
          if (c.dir === 'player') d = a && p && id !== 'player' ? dirTo(a, p) : (a ? a.dir : 'down');
          else d = a && OPP[a.dir] ? OPP[a.dir] : 'down';
        }
        f(id, d);
      }
    },
    emote: async c => {
      if (skipping) return;
      const f = F('emote'), ms = c.ms != null ? +c.ms : 1300;
      if (!EMOTES.includes(c.kind)) warn('emo:' + c.kind, '모르는 emote 종류: ' + c.kind);
      if (f) await Promise.all(ids(c.id).map(id => guard(f(id, c.kind || 'exclaim', ms), ms + 1500, 'emote')));
    },
    jump: async c => {
      if (skipping) return;
      const f = F('jump'), ms = c.ms != null ? +c.ms : 220;
      if (f) await Promise.all(ids(c.id).map(id => guard(f(id, c.h != null ? +c.h : 6, ms), ms + 1200, 'jump')));
    },
    sprite: c => { const f = F('setSprite'); if (f) for (const id of ids(c.id)) f(id, c.sprite); },
    show: c => { const f = F('show'); if (f) for (const id of ids(c.id)) f(id, c.v !== false); refresh(); },
    cam: async c => {
      const f = F('cam');
      if (!f) return;
      const ms = skipping ? 0 : (c.ms != null ? +c.ms : 400);
      await guard(f(c.to != null ? c.to : 'player', ms), ms + 1500, 'cam');
    },
    player: c => { EV.free = !!c.free; lockField(!c.free); },

    /* 화면 */
    fade: async c => {
      await closeDlg();
      let to = c.to === 'black' || c.to === 'white' ? 1 : +c.to;
      to = MC.clamp(to >= 0 ? to : 0, 0, 1);
      const cur = MC.fx.fadeLevel ? MC.fx.fadeLevel() : 0;
      const color = c.color || (c.to === 'white' ? '#f4f0e8' : (to >= cur ? '#000' : (EV.fadeColor || '#000')));
      EV.fadeColor = color; EV.fadeGen++;
      await MC.fx.fade(to, skipping ? 0 : (c.ms != null ? +c.ms : 400), { color, dither: c.dither !== false });
    },
    trans: async c => {
      await closeDlg();
      if (skipping) return;
      const kind = c.kind || 'fade', BASE = { fade: 800, white: 800, dream: 2100, wake: 2100, cut: 80, ink: 900 };
      const k = c.ms ? MC.clamp(+c.ms / (BASE[kind] || 800), 0.2, 5) : 1;
      await MC.fx.trans(kind, null, { k });
    },
    flash: c => { if (!skipping) MC.fx.flash(c.color || '#fff', c.a != null ? +c.a : 0.6, c.ms != null ? +c.ms : 120); },
    shake: c => { if (!skipping) MC.fx.shake(c.p != null ? +c.p : 0.3); },
    hitstop: c => { if (!skipping) MC.fx.hitstop(c.ms != null ? +c.ms : 80); },
    grade: c => {
      const o = {};
      if (c.sat != null) o.sat = +c.sat;
      if (c.tint !== undefined) o.tint = c.tint;
      if (c.ta != null) o.ta = +c.ta;
      return MC.fx.grade(o, skipping ? 0 : (+c.ms || 0));
    },
    vignette: c => MC.fx.vignette(+c.a || 0, skipping ? 0 : (+c.ms || 0)),
    letterbox: c => MC.fx.letterbox(c.on !== false, skipping ? 0 : (c.ms != null ? +c.ms : 300)),
    freeze: async c => { await closeDlg(); MC.fx.freeze(!!c.on); },
    card: c => { stopSkip(); return present(() => cards('timecard', c, fbCard)); },
    fx: c => {
      if (skipping) return;
      if (isFn(MC.field, 'fxAt') && MC.field.scene) MC.field.fxAt(c.kind, c.at != null ? c.at : 'player', c.n);
      else { const g = MC.gfx; MC.fx.particles.emit(c.kind, g.W >> 1, g.H >> 1, c.n); }
    },
    light: async c => {
      const f = F('setLight');
      if (!f) return;
      const o = {};
      for (const k of ['dark', 'r', 'at', 'color', 'flicker']) if (c[k] !== undefined) o[k] = c[k];
      const ms = skipping ? 0 : (+c.ms || 0), r = f(o, ms);
      if (r && typeof r.then === 'function') await guard(r, ms + 1500, 'light');
      else if (ms > 0) await wait(ms);
    },
    hud: c => {
      const show = c.show !== false;
      EV.hudHidden = !show;
      if (isFn(MC.field, 'hud')) MC.field.hud(show);
      else if (isFn(MC.field, 'setHud')) MC.field.setHud(show);
      else if (MC.field) MC.field.hudHidden = !show;
    },
    banner: c => { const f = F('banner'); if (f) f(c.t); },
    custom: c => {
      stopSkip();
      return present(() => {
        const f = MC.ch1 && MC.ch1.custom && MC.ch1.custom[c.id];
        if (typeof f === 'function') return f(c.args || {});
        warn('custom.' + c.id, 'MC.ch1.custom.' + c.id + ' 없음 → 대체 연출');
        return fbInfo('(' + c.id + ')', 900);
      });
    },

    /* 오디오 */
    bgm: c => {
      const fade = c.fade != null ? +c.fade : 400;
      if (c.id == null) { const f = A('music', 'stop'); if (f) f(fade); }
      else { const f = A('music', 'play'); if (f) f(c.id, { fade, at: c.at }); }
    },
    bgmcut: () => { const f = A('music', 'cut'); if (f) f(); },
    sfx: c => {
      if (skipping) return;
      const o = {};
      if (c.pan != null) o.pan = +c.pan;
      if (c.pitch != null) o.pitch = +c.pitch;
      if (c.gain != null) o.gain = +c.gain;
      const f = A('sfx', 'play'); if (f) f(c.id, o);
    },
    amb: c => {
      const o = c.fade != null ? { fade: +c.fade } : {};
      if (c.id == null) { const f = A('amb', 'stop'); if (f) f(c.fade != null ? +c.fade : undefined); }
      else { const f = A('amb', 'play'); if (f) f(c.id, o); }
    },
    silence: async c => { if (skipping) return; const f = A('audio', 'silence'); if (f) f(+c.ms || 0); await wait(+c.ms || 0); },
    duck: c => { if (skipping) return; const f = A('music', 'duck'); if (f) f(c.db != null ? +c.db : -6, c.ms != null ? +c.ms : 400); },
    lowpass: c => { const f = A('audio', 'lowpass'); if (f) f(c.hz == null ? null : +c.hz, +c.ms || 0); },
    music: c => {
      const m = MC.music;
      if (m && typeof m[c.fn] === 'function') m[c.fn].apply(m, Array.isArray(c.args) ? c.args : (c.args != null ? [c.args] : []));
      else warn('music.' + c.fn, 'MC.music.' + c.fn + ' 없음 — 건너뜀');
    },
    vibrate: c => { if (!skipping && MC.input.vibrate) MC.input.vibrate(c.p != null ? c.p : 30); },

    /* 게임 */
    battle: async (c, env) => {
      await closeDlg(); stopSkip();
      let r = null;
      if (isFn(MC.battle, 'start')) {
        try { r = await MC.battle.start({ troop: c.troop, preempt: c.preempt || null, boss: !!c.boss, canFlee: c.canFlee !== false, bgm: c.bgm, symbol: null }); }
        catch (e) { MC.core.error(e, 'battle.start'); }
      } else {
        warn('battle', 'MC.battle.start 없음 → 이긴 것으로(보스는 scripted) 넘어감');
        await present(() => fbInfo('전투: ' + c.troop + ' (전투 모듈 없음)', 1100));
        r = { outcome: c.boss ? 'scripted' : 'win' };
      }
      const out = (r && r.outcome) || 'win';
      EV.outcome = out;
      relock();
      const br = out === 'win' ? c.onWin : out === 'flee' ? c.onFlee : (out === 'lose' || out === 'scripted') ? c.onLose : null;
      if (br) { await runList(br, env.frame, env.ctx, true); return; }
      if (out === 'lose') { await runEvent('sys.faint', env.ctx); env.frame.ended = true; }
    },
    give: async (c, env) => {
      const n = c.n == null ? 1 : +c.n;
      MC.game.give(c.item, n);
      refresh();
      if (c.quiet) return;
      stopSkip();
      jingle('item');
      await MC.dialogue.say({ who: 'sys', t: '{c:gold}' + itemName(c.item) + (n > 1 ? ' ' + n + '개' : '') + '{/c}{을/를} 얻었다.', keep: keepAfter(env) });
    },
    take: c => { MC.game.take(c.item, c.n == null ? 1 : +c.n); refresh(); },
    heal: () => {
      for (const m of (MC.state && MC.state.party) || []) {
        if (isFn(MC.battle, 'statsFor')) { const s = MC.battle.statsFor(m.id, m.lv); if (s) { m.hp = s.hp; m.mp = s.mp; } }
        else if (m.st && m.st.maxHp) { m.hp = m.st.maxHp; m.mp = m.st.maxMp || m.mp; }
      }
    },
    save: c => {
      const slot = c.slot || 'auto', ok = MC.save.write(slot);
      if (slot === 'manual' && ok && !skipping) { sfx('save'); MC.ui.toast('기록했습니다.', 1600); }
    },
    name: async c => {
      await closeDlg();
      const old = MC.state.dispName;
      MC.game.setName(c.v == null ? '' : String(c.v));
      if (!skipping && c.anim !== false && old !== MC.state.dispName) await MC.dialogue.nameChange(old, MC.state.dispName, c);
    },
    year: c => { MC.state.year = +c.v; },
    act: c => { MC.state.act = +c.v; MC.gfx.setUIPal(c.ui || ('act' + c.v)); },
    learn: async (c, env) => {
      const m = MC.game.lead();
      if (!m) return;
      m.skills = m.skills || [];
      if (m.skills.indexOf(c.skill) >= 0) return;
      m.skills.push(c.skill);
      if (c.quiet) return;
      stopSkip();
      jingle('learn');
      await MC.dialogue.say({ who: 'sys', t: '{c:gold}' + skillName(c.skill) + '{/c}{을/를} 익혔다.', keep: keepAfter(env) });
    },
    lv: c => {
      if (isFn(MC.dbg, 'lv')) MC.dbg.lv(+c.v);
      else { const m = MC.game.lead(); if (m) m.lv = +c.v; }
    }
  };

  /* ---------- 실행기 ---------- */
  function getEvent(id) {
    let e = MC.data.events && MC.data.events[id];
    if (!e && typeof id === 'string' && id.indexOf('__demo') === 0) { addDemos(); e = MC.data.events[id]; }
    if (e && !Array.isArray(e) && Array.isArray(e.cmds)) e = e.cmds;
    return Array.isArray(e) ? e : null;
  }
  async function exec(c, env) {
    const f = OPS[c.op];
    const where = env.ctx.id + '#' + env.i + ' ' + c.op;
    if (!f) { warn('op:' + c.op, '알 수 없는 op "' + c.op + '" (' + where + ') — 건너뜀'); return; }
    EV.step = where;
    try { const r = f(c, env); if (r && typeof r.then === 'function') await r; }
    catch (e) { MC.core.error(e, 'ev ' + where); }
  }
  async function runList(list, frame, ctx, nested) {
    if (!Array.isArray(list)) return;
    for (let i = 0; i < list.length; i++) {
      if (frame.ended || ctx.gen !== gen) return;
      const c = list[i];
      if (!c || typeof c !== 'object') continue;
      const env = { frame, ctx, list, i, nested };
      if (c.async) { exec(c, env); continue; }        // exec는 거부되지 않음
      await exec(c, env);
    }
  }
  async function runEvent(id, ctx) {
    const cmds = getEvent(id);
    if (!cmds) { warn('miss:' + id, '없는 이벤트: ' + id); return; }
    if (ctx.depth >= 24) { warn('deep:' + id, 'call이 너무 깊음(순환?): ' + id); return; }
    await runList(cmds, { ended: false }, { gen: ctx.gen, id, depth: ctx.depth + 1 }, true);
    if (ctx.gen === gen) markSeen(id);
  }

  // run(id | 명령 배열 | 명령 하나, {lock:true, id}) -> Promise. 여러 개가 겹쳐 돌 수 있고(대사는 한 번에 하나), 모두 끝나면 필드 잠금 해제
  EV.run = async function (x, opt) {
    opt = opt || {};
    let cmds = null, id = opt.id || null;
    if (typeof x === 'string') { id = x; cmds = getEvent(x); if (!cmds) { warn('miss:' + x, '없는 이벤트: ' + x); return; } }
    else if (Array.isArray(x)) { cmds = x; id = id || '(inline)'; }
    else if (x && typeof x === 'object' && x.op) { cmds = [x]; id = id || '(inline)'; }
    else { warn('badrun', 'MC.events.run: 이벤트 id나 명령 배열이 아님'); return; }
    const myGen = gen;
    if (depth === 0) { topSeen = isSeen(id); EV.current = id; EV.free = false; if (MC.cfg.debug && !validated) { validated = true; setTimeout(report, 0); } }
    depth++;
    EV.lastId = id;
    if (opt.lock !== false) lockField(true);
    if (!task) task = MC.core.onUpdate(tick, { real: true });
    try { await runList(cmds, { ended: false }, { gen: myGen, id, depth: 0 }, false); }
    catch (e) { MC.core.error(e, 'events.run ' + id); }
    if (myGen !== gen) return;
    markSeen(id);
    depth--;
    if (depth > 0) return;
    depth = 0;
    stopSkip();
    try { await closeDlg(); } catch (_) {}
    if (myGen !== gen || depth > 0) return;             // 닫는 사이 새 이벤트가 시작됨
    EV.current = null; EV.free = false; EV.step = null;
    lockField(false);
    refresh();
  };
  // 모든 실행 중단(타이틀로 돌아가거나 새 게임·이어하기 직전에 부를 것)
  EV.reset = function () {
    gen++; depth = 0; topSeen = false;
    stopSkip();
    for (const f of Array.from(skipWaiters)) f();
    if (MC.dialogue && MC.dialogue.reset) MC.dialogue.reset();
    for (const sc of MC.scene.stack.slice()) if (/^ev_/.test(sc.name || '')) MC.scene.remove(sc);
    EV.current = null; EV.free = false; EV.step = null;
    lockField(false);
  };
  EV.has = id => !!getEvent(id);
  EV.get = id => getEvent(id);
  EV.isSeen = isSeen;
  EV.forgetSeen = () => { seen = {}; try { localStorage.removeItem(SEEN_KEY); } catch (_) {} };

  /* ---------- 검사: MC.events.validate() -> ['오류|경고|정보 위치: 내용', ...] ---------- */
  const KNOWN_TAG = /^\{(p(\s*[:=]\s*\d+)?|spd\s*[:=]\s*\d+|\/spd|\/?(shake|tremble|wave|c|big|echo|nb|slow)|c\s*[:=]\s*#?[0-9a-zA-Z]+|name|NAME|[가-힣]+\/[가-힣]+)\}$/;
  EV.validate = function (opt) {
    opt = opt || {};
    const out = [], evs = (MC.data && MC.data.events) || {}, maps = MC.data.maps || {}, bt = MC.data.battle || null;
    const add = (lv, w, m) => out.push(lv + ' ' + w + ': ' + m);
    const D = MC.dialogue;
    function text(t, w, who) {
      const boxes = Array.isArray(t) ? t : [t];
      if (!boxes.length || boxes.some(b => typeof b !== 'string')) { add('오류', w, '대사 t가 문자열(배열)이 아님'); return; }
      const sp = D.speaker(who);
      for (const b of boxes) {
        for (const tg of b.match(/\{[^{}]*\}/g) || []) if (!KNOWN_TAG.test(tg)) add('경고', w, '모르는 마크업 ' + tg);
        const plain = D.strip(D.prep(b));
        for (const l of MC.text.wrap(plain, D.TEXT_W, 'body')) if (MC.text.width(l, 'body') > D.TEXT_W) add('경고', w, '창보다 긴 줄 "' + l + '"');
        const np = D.compile(b, { align: sp.align }).pages.length;
        if (np > 1 && opt.info) add('정보', w, np + '페이지 "' + plain.slice(0, 14) + '…"');
      }
    }
    function walk(list, where) {
      if (!Array.isArray(list)) { add('오류', where, '명령 배열이 아님'); return; }
      list.forEach((c, i) => {
        const w = where + '#' + i;
        if (!c || typeof c !== 'object') { add('오류', w, '명령이 객체가 아님'); return; }
        if (!OPS[c.op]) { add('오류', w, '알 수 없는 op "' + c.op + '"'); return; }
        switch (c.op) {
          case 'say':
            if (c.who && !(MC.data.speakers || {})[c.who]) add('경고', w, '없는 화자 ' + c.who);
            text(c.t != null ? c.t : c.text, w, c.who);
            if (c.face && D.speaker(c.who).portrait && !D.portraitOf(c.who, c.face)) add('경고', w, '초상 없음 ' + c.who + '/' + c.face);
            else if (c.face && D.speaker(c.who).portrait) { const nm = D.portraitOf(c.who, c.face); if (nm && nm.indexOf('_' + c.face) < 0) add('정보', w, '표정 ' + c.face + ' 없음 → ' + nm); }
            break;
          case 'narr': text(c.t != null ? c.t : c.text, w, 'narr'); break;
          case 'choice': {
            const opts = c.opts || [];
            if (!opts.length || opts.length > 3) add('오류', w, '선택지는 1~3개(' + opts.length + ')');
            if (c.t != null) text(c.t, w, c.who || 'think');
            opts.forEach((o, k) => {
              const s = D.strip(D.prep(o.t || ''));
              if (Array.from(s).length > 18) add('경고', w, '선택지 ' + k + ' 18자 초과 "' + s + '"');
              if (o.do) walk(o.do, w + '/opt' + k);
            });
            break;
          }
          case 'if': if (!c.cond) add('오류', w, 'cond 없음'); if (c.then) walk(c.then, w + '/then'); if (c.else) walk(c.else, w + '/else'); break;
          case 'parallel': (c.do || []).forEach((b, k) => walk(Array.isArray(b) ? b : [b], w + '/p' + k)); break;
          case 'call': if (!getEvent(c.ev)) add('오류', w, '없는 이벤트 ' + c.ev); break;
          case 'map': if (Object.keys(maps).length && !maps[c.id]) add('오류', w, '없는 맵 ' + c.id); else if (maps[c.id] && typeof c.at === 'string' && c.at !== 'default' && !(maps[c.id].spawns || {})[c.at]) add('오류', w, '없는 스폰 ' + c.id + '/' + c.at); break;
          case 'battle': if (bt && bt.troops && !bt.troops[c.troop]) add('오류', w, '없는 무리 ' + c.troop); if (c.onWin) walk(c.onWin, w + '/win'); if (c.onLose) walk(c.onLose, w + '/lose'); if (c.onFlee) walk(c.onFlee, w + '/flee'); break;
          case 'give': case 'take': if (bt && bt.items && !bt.items[c.item]) add('경고', w, '없는 아이템 ' + c.item); break;
          case 'custom': if (!(MC.ch1 && MC.ch1.custom && MC.ch1.custom[c.id])) add('정보', w, 'custom.' + c.id + ' 아직 없음(대체 연출)'); break;
          case 'emote': if (!EMOTES.includes(c.kind)) add('경고', w, '모르는 emote ' + c.kind); break;
          case 'move': if (typeof c.path === 'string' && !/^\s*([UDLR]\d*\s*)+$/i.test(c.path)) add('오류', w, '경로 형식 "' + c.path + '"'); break;
          case 'sfx': if (isFn(MC.sfx, 'has') && !MC.sfx.has(c.id)) add('경고', w, '없는 효과음 ' + c.id); break;
          case 'bgm': if (c.id != null && MC.data.bgm && !MC.data.bgm[c.id]) add('경고', w, '없는 곡 ' + c.id); break;
          case 'closeup': if (!D.portraitOf(c.who, c.face)) add('경고', w, '클로즈업 초상 없음 ' + c.who + '/' + c.face); break;
        }
      });
    }
    for (const id in evs) walk(Array.isArray(evs[id]) ? evs[id] : (evs[id] && evs[id].cmds), id);
    return out;
  };
  function report() {
    try {
      const r = EV.validate();
      const bad = r.filter(s => !/^정보/.test(s));
      if (bad.length) console.warn('[events] 검사 ' + bad.length + '건\n' + bad.slice(0, 40).join('\n') + (bad.length > 40 ? '\n…' : ''));
      else console.info('[events] 이벤트 검사 통과(' + Object.keys(MC.data.events || {}).length + '개)');
    } catch (e) { MC.core.error(e, 'events.validate'); }
  }

  /* ---------- 디버그 시험 장면: ?debug=1에서 MC.events.run('__demo') (모든 op 한 번씩) ---------- */
  function addDemos() {
    const E = MC.data.events;
    if (E.__demo) return;
    E.__demo_sub = [
      { op: 'say', who: 'sys', t: 'call로 들어온 하위 이벤트.\nend를 만나면 여기서 돌아간다.' },
      { op: 'end' },
      { op: 'say', who: 'sys', t: '(이 줄이 보이면 end 오류)' }
    ];
    E.__demo_text = [
      { op: 'say', who: 'morrel', t: '어이, 파라옹호!{p:200} 깃발은 왜 반만 올렸나!', pos: 'top' },
      { op: 'say', who: 'dantes', face: 'sad', t: ['모렐 씨!', '……르클레르 선장님이 바다에서 돌아가셨습니다. 열병이었습니다. 사흘 앓으시고, 그대로. 화물은 한 상자도 안 잃었습니다.'] },
      { op: 'say', who: 'danglars', face: 'smirk', t: '하루가 아니라 하루 반입니다, 선주님.' },
      { op: 'say', who: 'mercedes', face: 'smile', t: '{wave}석 달하고 엿새.{/wave}{p:300} ……{c:red}늦었어.{/c}' },
      { op: 'say', who: 'think', t: '……숨.{p:600} 아직 쉬면 안 돼.' },
      { op: 'say', who: 'sys', t: '화면을 누른 채 끌면 걷는다.\n짧게 누르면 살펴본다.' },
      { op: 'say', who: 'unknown', t: '{tremble}하나,{p:450} 둘—{/tremble}', auto: 400 },
      { op: 'say', who: 'guard', t: '재판?{p:300} 저 안에서 기다려.{p:500} 오래.' },
      { op: 'say', who: 'narr', t: '『국왕 폐하 만세.{p:200} 찬탈자 보나파르트와 내통하는 자는 즉시 신고할 것.』' },
      { op: 'say', who: 'despair', t: '{shake}네가.{/shake}{p:300} 너도 세다 말았잖아.' }
    ];
    E.__demo_field = [
      { op: 'map', id: 'cell', at: 'start', trans: 'fade' },
      { op: 'spawn', id: 'demo_jailer', sprite: 'ch_jailer', x: 6, y: 1, dir: 'down' },
      { op: 'move', id: 'demo_jailer', path: 'D2', speed: 260 },
      { op: 'face', id: 'demo_jailer', dir: 'player' },
      { op: 'emote', id: 'demo_jailer', kind: 'exclaim', ms: 700 },
      { op: 'jump', id: 'player', h: 4, ms: 200 },
      { op: 'sprite', id: 'player', sprite: 'ch_dantes_prison' },
      { op: 'cam', to: [4, 3], ms: 500 }, { op: 'cam', to: 'player', ms: 300 },
      { op: 'fx', kind: 'dust', at: 'player', n: 6 },
      { op: 'light', dark: 0.6, r: 48, ms: 400 }, { op: 'light', dark: 0, ms: 300 },
      { op: 'banner', t: '이프 성 · 독방' },
      { op: 'show', id: 'demo_jailer', v: false }, { op: 'show', id: 'demo_jailer', v: true },
      { op: 'despawn', id: 'demo_jailer' },
      { op: 'player', free: true }, { op: 'say', who: 'sys', t: '(player free: 이 줄 동안만 조작 허용)' }, { op: 'player', free: false }
    ];
    E.__demo = [

<script>/* ==== src/engine/field.js ==== */
/* field.js — 필드 씬(계약서 9장): 맵 런타임(정적 타일 캐시·오브젝트·조건), 격자 이동(칸당 moveMs·carry·돌아서기 90ms·벽 미끄러짐·코너 보정·막힘 '툭'),

(function (MC) { 'use strict';

  const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };

  const TRANS = { fade: 1, cut: 1, dream: 1, wake: 1, white: 1, ink: 1 };
  const FX_ALIAS = { bubbles: 'bubble', fire_burst: 'ember', paper_burn: 'paper', sparkles: 'sparkle' };
  const TURN_MS = 90;          // 정지 상태에서 다른 방향: 돌아선 뒤 이만큼 유지하면 출발
  const PUSH_MS = 120;         // 막힌 채 밀면 코너 보정까지
  const BUMP_GAP = 400;        // '툭' 최소 간격
  const G = () => MC.gfx;
  const nowG = () => MC.time.now;       // 게임 시간(히트스톱 때 멈춤)
  const nowR = () => MC.time.real;      // 실시간

  const warned = new Set();
  function warn(k, m) { if (warned.has(k)) return; warned.add(k); console.warn('[field] ' + m); }
  function sfx(id, o) { try { if (MC.sfx && MC.sfx.play) MC.sfx.play(id, o); } catch (e) { MC.core.error(e, 'field.sfx'); } }
  function vib(p) {

  function hash2(x, y) {

  /* ================================================================ 액터(플레이어·NPC·조사물·심볼·상자 공용) */
  function newActor(o) {
    return {
      id: o.id, type: o.type || 'npc', def: o.def || null, spawned: false,
      sprite: o.sprite || null, x: o.x | 0, y: o.y | 0, fx: o.x | 0, fy: o.y | 0,
      dir: DV[o.dir] ? o.dir : 'down', baseDir: DV[o.dir] ? o.dir : 'down',
      w: 1, h: 1, z: 0, anim: 0, solid: true, visible: true, present: true, locked: false, event: null,
      moving: false, t: 0, dur: 200, steps: 0, idleSince: 0,

  Object.assign(pl, { holdDir: null, hold: 0, turnWait: 0, pushT: 0, bumpAt: -1e9, bumpLast: null, bufDir: null, invulnUntil: 0, prevX: 0, prevY: 0 });

  function prog(a) { return a.moving ? Math.min(1, a.t / a.dur) : 1; }
  function apx(a) { return (a.moving ? a.fx + (a.x - a.fx) * prog(a) : a.x) * TS; }
  function apy(a) { return (a.moving ? a.fy + (a.y - a.fy) * prog(a) : a.y) * TS; }
  function jumpOff(a) { if (!(a.jumpMs > 0)) return 0; const k = MC.clamp(a.jumpT / a.jumpMs, 0, 1); return Math.round(a.jumpH * 4 * k * (1 - k)); }
  // 충돌 영역(타일): 조사물·NPC·상자·심볼은 x,y가 발밑 왼쪽 칸(위로 h), 트리거·출구는 x,y가 왼쪽 위(아래로 h)
  function rectOf(o) { return (o.type === 'trigger' || o.type === 'exit') ? [o.x, o.y, o.w, o.h] : [o.x, o.y - o.h + 1, o.w, o.h]; }

  /* ================================================================ 모듈 상태 */
  let map = null, scene = null, stick = null, menuBtn = null, taskOn = false, lastUpd = -1;
  let extLock = 0, busy = 0, entering = 0, encountering = false, free = false, hudOn = true, ghost = false;
  let refreshT = 0, lockSeenFrame = -1;
  const pendTap = { on: false, key: false, x: 0, y: 0, t: 0 };
  let tapGuard = 0;                                        // 이벤트·대화가 끝난 직후 짧은 탭 무시(대사 넘기던 연타가 같은 대상을 다시 여는 것 방지)

  const rcam = { x: 0, y: 0 };                           // 마지막 렌더 카메라(정수, 흔들림 포함) — 탭 좌표 변환용
  const light = { dark: 0, r: 64, at: 'player', color: null, flicker: false };
  const drawList = [], floorList = [];

  function inStack() { return !!scene && MC.scene.has(scene); }
  function isTop() { return MC.scene.top() === scene; }
  function controlsOn() {
    if (!map || !inStack() || !isTop() || entering > 0 || encountering) return false;
    if (MC.fx && MC.fx.busy && MC.fx.busy()) return false;
    return free || evFree() || (extLock === 0 && busy === 0);
  }
  function evFree() { const E = MC.events; return !!(E && E.free && E.running); }   // op player free(이벤트 도중 조작 허용)
  function invuln() { return nowR() < pl.invulnUntil; }

  /* ================================================================ 맵 런타임 */
  function tileDef(m, x, y) {
    if (x < 0 || y < 0 || x >= m.w || y >= m.h) return null;
    const ch = m.rows[y][x] || ' ';
    return m.tiles[ch] || m.tiles[' '] || null;
  }
  function tileSolid(x, y) {
    if (!map || x < 0 || y < 0 || x >= map.w || y >= map.h) return true;
    return map.solid[y * map.w + x] === 1;
  }
  // 물건 타일의 바닥: 이웃 4칸 중 top 없는 바닥(벽 같은 '움직이지 않는 solid'는 제외, 물·부두 턱은 포함)의 최빈값, 동률이면 under, 없으면 under
  function groundChar(m, x, y, td) {

    for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const r = m.rows[y + d[1]], ch = r && r[x + d[0]];
      if (ch == null || ch === ' ') continue;

  function buildMap(id, def) {

    const tiles = (ts && ts.tiles) || {};

    const h = rows.length, w = rows.reduce((m, r) => Math.max(m, r.length), 0);
    const m = {
      id, def, name: def.name || '', tileset: def.tileset || '', tiles, w, h, rows,

    const isAnim = td => !!(td && Array.isArray(td.spr) && td.spr.length > 1 && td.anim > 0);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const ch = rows[y][x] || ' ';

        if (!td && ch !== ' ') warn('tch:' + id + ch, '타일셋 ' + def.tileset + '에 없는 문자 "' + ch + '" (맵 ' + id + ')');
        if (!td) td = tiles[' '];
        const i = y * w + x;
        m.solid[i] = (!td || ch === ' ' || td.solid) ? 1 : 0;

      if (o.type === 'symbol') {
        if (isPl && symbolTouchable(o)) { sym = o; continue; }
        if (isPl && invuln()) continue;                  // 무적 중엔 심볼을 지나갈 수 있다
        block = true; continue;
      }
      if (o.solid) block = true;
    }
    if (!isPl && pl.visible && occupies(pl, nx, ny)) block = true;
    if (sym) return { enc: sym, x: nx, y: ny };
    const ts = tileSolid(nx, ny);
    if (gh) return { ok: true, x: nx, y: ny };
    if (block || ts) return { blocked: true, fire: ts ? fire : null, x: nx, y: ny };
    return { ok: true, x: nx, y: ny };
  }
  // 미끄러짐·코너 보정 대상: 빈 바닥이고 적·상자·출구·NPC·조사물이 없는 칸(트리거는 밟는 칸이라 허용 — 도착하면 발동)
  function plainFree(x, y) {
    if (tileSolid(x, y) && !ghost) return false;
    for (const o of map.objs) {
      if (!o.present || !o.visible) continue;
      if (!occupies(o, x, y)) continue;
      if (o.type === 'trigger') continue;
      if (o.type === 'thing' && !o.solid && !o.event) continue;
      return false;
    }
    return true;
  }
  function findAt(x, y, type) {
    for (const o of map.objs) if (o.present && o.type === type && inRect(o, x, y)) return o;
    return null;
  }

  /* ================================================================ 이동 */
  function startStep(a, d, carry, dur) {
    const fromIdle = !a.moving && (nowG() - a.idleSince > 40 || a.steps === 0);
    const turned = a.lastStepDir && a.lastStepDir !== d;
    a.fx = a.x; a.fy = a.y;
    a.x += DV[d][0]; a.y += DV[d][1];

  }
  function footstep(a, dust) {
    if (!map) return;
    const i = a.y * map.w + a.x, st = (i >= 0 && i < map.step.length && map.step[i]) || 'stone';
    const isPl = a === pl;
    if (!isPl && (!a.visible || a.type === 'symbol')) return;
    const g = G(), sx = apx(a) + 8 - rcam.x;
    if (!isPl && (sx < -24 || sx > g.W + 24)) return;
    const pan = isPl ? 0 : MC.clamp((sx - g.W / 2) / (g.W / 2), -1, 1) * 0.6;
    sfx('step_' + st, { pitch: (a.steps & 1) ? 1.04 : 0.96, gain: isPl ? 1 : 0.35, pan });
    const fx = a.fx * TS + 8, fy = a.fy * TS + 14;
    if (st === 'dream' || map.tileset === 'dream') MC.fx.particles.emit('ripple', a.x * TS + 8, a.y * TS + 13, 1);
    else if (dust && map.tileset === 'town' && a.visible) MC.fx.particles.emit('dust', fx, fy, 2 + (a.steps & 1));

  function finishStep(a) {

  // 모든 액터의 시간 진행(이동·점프·감정). 필드 update가 막혀도(대화 오버레이) 별도 태스크가 부른다
  function motion(a, dt) {
    if (a.jumpMs > 0) { a.jumpT += dt; if (a.jumpT >= a.jumpMs) { a.jumpMs = 0; a.jumpT = 0; const r = a.jumpRes; a.jumpRes = null; if (r) r(); } }
    if (a.emo && nowG() - a.emo.t0 >= a.emo.ms) { const r = a.emo.res; a.emo = null; if (r) r(); }
    if (a.bumpT > 0) a.bumpT -= dt;
    if (!a.moving) {

    }
    a.t += dt;

  }

  /* ---------- 플레이어 조작 ---------- */
  function playerControl(dt) {
    if (pl.moving || pl.path) return;
    const d = stick ? stick.dir : null;
    if (!d) { pl.holdDir = null; pl.hold = 0; pl.pushT = 0; pl.bumpLast = null; pl.noFire = null; return; }
    if (d !== pl.holdDir) {
      pl.holdDir = d; pl.hold = 0; pl.pushT = 0;
      if (d !== pl.dir) {                                // 정지 상태 첫 입력이 다른 방향: 먼저 돌아선다
        pl.dir = d; pl.turnWait = TURN_MS;

  }
  function attemptMove(d, carry, dt) {
    const r = probe(pl, d);
    if (r.enc) { pl.dir = d; startEncounter(r.enc, r.enc.dir === d ? 'player' : null); return 'enc'; }
    if (r.ok) { startStep(pl, d, carry, moveMs()); pl.pushT = 0; pl.bumpLast = null; pl.noFire = null; return 'go'; }
    if (r.fire && r.fire !== pl.noFire) { pl.dir = d; fireAt(r.fire); return 'fire'; }
    // 막힘: 부축 비율로 벽 미끄러짐 → 오래 밀면 코너 보정 → 아니면 '툭'
    const v = stick ? stick.vec : [0, 0], horiz = d === 'left' || d === 'right';
    const maj = Math.abs(horiz ? v[0] : v[1]), mn = horiz ? v[1] : v[0];
    const ratio = maj > 0.001 ? Math.abs(mn) / maj : 0;
    if (ratio >= 0.4) {
      const sd = horiz ? (mn > 0 ? 'down' : 'up') : (mn > 0 ? 'right' : 'left');
      const sx = pl.x + DV[sd][0], sy = pl.y + DV[sd][1];
      if (plainFree(sx, sy)) { startStep(pl, sd, carry, moveMs()); pl.pushT = 0; return 'go'; }
    }
    pl.pushT += dt || 0;
    if (ratio < 0.4) {
      const cd = cornerDir(d);
      if (cd && pl.pushT >= PUSH_MS) { startStep(pl, cd, carry, moveMs()); pl.pushT = 0; return 'go'; }
      if (cd) { pl.dir = d; return 'wait'; }             // 비켜 갈 틈이 있으면 '툭' 없이 120ms 기다렸다가 옆으로 비켜 선다
    }

    return 'blocked';
  }
  function cornerDir(d) {
    const ok = [];
    for (const s of PERP[d]) {

      if (plainFree(px, py) && plainFree(px + DV[d][0], py + DV[d][1])) ok.push(s);
    }
    if (ok.length === 1) return ok[0];
    if (ok.length === 2 && stick) {
      const m = (d === 'left' || d === 'right') ? stick.ky : stick.kx;   // 부성분(px)
      if (m >= 3) return (d === 'left' || d === 'right') ? 'down' : 'right';

  }
  function bump(d) {
    const t = nowR();

    pl.bumpLast = d; pl.bumpAt = t;

  }
  function playerArrived(carry) {
    const px = pl.fx - DV[pl.dir][0], py = pl.fy - DV[pl.dir][1];   // 직전 칸(트리거 경계 판정)
    syncState();
    const ex = findAt(pl.x, pl.y, 'exit');
    if (ex && !ghost) { pl.holdDir = null; fireAt(ex); return; }
    const tr = findAt(pl.x, pl.y, 'trigger');
    if (tr && !inRect(tr, px, py) && !ghost) { pl.holdDir = null; fireAt(tr); return; }
    if (invuln()) extendInvuln();

  }
  function extendInvuln() {
    for (const o of map.objs) if (o.type === 'symbol' && o.present && occupies(o, pl.x, pl.y)) { pl.invulnUntil = Math.max(pl.invulnUntil, nowR() + 300); return; }
  }
  function syncState() {
    if (!map || !MC.state) return;
    const s = MC.state;
    s.map = map.id; s.x = pl.x; s.y = pl.y; s.dir = pl.dir;
  }

  /* ================================================================ 출구·트리거·이벤트 */
  async function fireAt(o) {
    if (o.type === 'exit') return fireExit(o);

    }
  }
  async function fireExit(ex) {
    const d = ex.def || {};
    busy++;
    if (stick) stick.reset();
    try {
      if (ex.locked) { await runEvent(d.lockedEvent, ex); return; }
      if (d.confirm) {
        const ok = MC.ui && MC.ui.Confirm ? await MC.ui.Confirm({ text: d.confirm, yes: '나아간다', no: '그만둔다' }) : true;
        if (!ok) {
          pl.noFire = ex;                                  // 손을 떼거나 움직이기 전엔 다시 묻지 않음
          if (pl.x === ex.x && pl.y === ex.y) await stepBack();
          return;
        }
      }
      if (!d.to) { warn('exitto:' + ex.id, '출구 ' + ex.id + ': to 없음'); return; }
      const ch = map.rows[ex.y] && map.rows[ex.y][ex.x];
      if (ch === 'D') sfx(map.tileset === 'prison' ? 'door_iron' : 'door_wood');

    if (!id) return;

        if (r && typeof r.then === 'function') await r;
      } else {
        warn('noev', 'MC.events 없음 — 이벤트는 토스트로만 표시');
        if (MC.cfg.debug && MC.ui) MC.ui.toast('이벤트: ' + id, 1200);

      }
    } catch (e) { MC.core.error(e, 'field.event:' + id); }

  }

  /* ================================================================ 조사(짧은 탭) */
  function canInteract(o) {
    if (!o.present || !o.visible) return false;

    return (o.type === 'npc' || o.type === 'thing') && !!o.event;
  }
  function faceOK(o) { const f = o.def && o.def.face; return !f || !DV[f] || pl.dir === f; }
  function adjacent(o) {
    const r = rectOf(o);
    const cx = MC.clamp(pl.x, r[0], r[0] + r[2] - 1), cy = MC.clamp(pl.y, r[1], r[1] + r[3] - 1);
    const d = Math.abs(cx - pl.x) + Math.abs(cy - pl.y);
    return d === 1 || (d === 0 && !o.solid);
  }
  function dirTo(o) {
    const r = rectOf(o);
    const cx = MC.clamp(pl.x, r[0], r[0] + r[2] - 1), cy = MC.clamp(pl.y, r[1], r[1] + r[3] - 1);
    const dx = cx - pl.x, dy = cy - pl.y;
    if (!dx && !dy) return pl.dir;

  }
  function drawRect(o) {                                  // 월드 px [x,y,w,h] — 그림 범위(탭 판정)
    const r = rectOf(o);
    let x = r[0] * TS, y = r[1] * TS, w = r[2] * TS, h = r[3] * TS;
    const nm = o.sprite && spriteFor(o);
    if (nm && (o.type === 'thing' || o.type === 'chest')) {

      const sx = objDrawX(o, sz.w), sy = (o.y + 1) * TS - sz.h;
      const x2 = Math.max(x + w, sx + sz.w), y2 = Math.max(y + h, sy + sz.h);

    if (best) return best;

  }
  // 계약 9.2: (1) 탭한 지점이 인접 오브젝트면 그쪽을 보고 실행 (2) 아니면 바라보는 칸/발밑 (3) 없으면 무반응

  function interactWorld(wx, wy) {                         // 월드 px 좌표
    if (!map || pl.moving) return;
    let best = null, bestY = -1e9;
    for (const o of map.objs) {

      const r = drawRect(o);

      const fy = footY(o);
      if (fy > bestY) { best = o; bestY = fy; }

  async function interact(o) {

      await MC.core.wait(120);

    }
  }

  /* ================================================================ 상자 */
  function itemName(id) {

  }
  async function openChest(o) {
    const key = map.id + '/' + o.id;

      MC.fx.floatText('비었다', o.x * TS + 8 - rcam.x, o.y * TS - 2 - rcam.y, { color: '#9a98a8', font: 'small', rise: 8, ms: 700 });
      return;
    }
    busy++;
    try {
      MC.state.chests[key] = true; o.opened = true; o.popT = nowR();
      sfx('chest');
      vib(12);
      MC.fx.particles.emit('sparkle', o.x * TS + 8, o.y * TS + 2, 4);
      await MC.core.waitReal(420);
      const d = o.def || {};
      if (d.item) await giveItem(d.item, d.n > 0 ? d.n : 1, o);

    } finally { busy--; }
  }
  async function giveItem(item, n) {
    const E = MC.events;
    try {                                                  // 러너의 give op: '○○을 얻었다.' 시스템 줄 + item 징글
      if (E && typeof E.run === 'function') { await E.run([{ op: 'give', item, n }], { id: '(chest)' }); return; }
    } catch (e) { MC.core.error(e, 'field.give'); }
    MC.game.give(item, n);
    try { if (MC.music && MC.music.jingle) MC.music.jingle('item'); } catch (_) {}
    const nm = itemName(item);
    if (MC.ui) MC.ui.toast(MC.text.resolveJosa(nm + '{을/를} 얻었다.') + (n > 1 ? ' ×' + n : ''), 1800);
    await MC.core.waitReal(500);
  }

  /* ================================================================ 심볼 AI·인카운터 */
  function symbolTouchable(s) {
    return s.present && s.visible && !encountering && nowR() >= s.stunUntil && !invuln() && controlsOn();
  }
  function symFree(s, x, y) {
    if (tileSolid(x, y)) return false;

      if (occupies(o, x, y)) return false;
    }
    return !(pl.visible && occupies(pl, x, y));
  }
  function symbolsAI(dt) {
    const ms = moveMs();
    for (const s of map.objs) {
      if (s.type !== 'symbol' || !s.present || !s.visible || s.moving || s.path) continue;
      if (nowR() < s.stunUntil) continue;
      s.wait -= dt;
      if (s.wait > 0) continue;
      const d = s.def || {}, step = +d.stepMs > 0 ? +d.stepMs : 420;
      const dx = pl.x - s.x, dy = pl.y - s.y, dist = Math.abs(dx) + Math.abs(dy);
      const hunt = !!d.chase && pl.visible && !invuln() && (dist <= 3 || (s.alert && dist <= 5));
      if (hunt) {
        if (!s.alert) {                                    // 알아챔: '!' + 잠깐 멈춤
          s.alert = true; s.dir = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
          emoteActor(s, 'exclaim', 650); s.wait = 420;
          continue;
        }
        const hx = dx > 0 ? 'right' : dx < 0 ? 'left' : null, vy = dy > 0 ? 'down' : dy < 0 ? 'up' : null;
        const order = Math.abs(dx) >= Math.abs(dy) ? [hx, vy] : [vy, hx];
        let moved = false;
        for (const md of order) {
          if (!md) continue;
          const nx = s.x + DV[md][0], ny = s.y + DV[md][1];
          if (pl.visible && occupies(pl, nx, ny)) {       // 플레이어에게 닿음: 등 뒤면 기습
            s.dir = md;
            if (!pl.moving && controlsOn()) { startEncounter(s, pl.dir === md ? 'enemy' : null); return; }
            moved = true; break;
          }
          if (symFree(s, nx, ny)) { startStep(s, md, 0, Math.max(ms * 1.15, step * 0.8)); moved = true; break; }   // 플레이어보다 조금 느리게(따돌릴 수 있게)
        }
        s.wait = moved ? 30 : 250;
      } else {
        if (s.alert && dist > 5) s.alert = false;
        if (d.move === 'still' || d.move === 'none') { s.wait = 600; continue; }
        const rad = d.radius != null ? +d.radius : 2;
        const dirs = ['up', 'down', 'left', 'right'];
        for (let i = 3; i > 0; i--) { const j = MC.rng.int(0, i); const t = dirs[i]; dirs[i] = dirs[j]; dirs[j] = t; }
        const away = Math.abs(s.x - s.home.x) + Math.abs(s.y - s.home.y);
        let done = false;
        for (const md of dirs) {
          const nx = s.x + DV[md][0], ny = s.y + DV[md][1];
          const nd = Math.abs(nx - s.home.x) + Math.abs(ny - s.home.y);
          const inR = Math.abs(nx - s.home.x) <= rad && Math.abs(ny - s.home.y) <= rad;
          if (!inR && nd >= away) continue;              // 반경 밖이면 집 쪽으로만
          if (!symFree(s, nx, ny) || findAt(nx, ny, 'exit') || findAt(nx, ny, 'trigger')) continue;
          startStep(s, md, 0, step); done = true; break;
        }
        s.wait = done ? 400 + MC.rng() * 600 : 500;
      }
    }
  }
  function troopSize(s) {
    if (s.group) return s.group;

<script>/* ==== src/engine/battle_core.js ==== */
/* battle_core.js — [battle] 전투 순수 로직: 라운드(시작→입력→해결→종료)·속도순·intent 디렉터·상성(약점×2/저항×0.5)·상태이상·도망(C-12)·경험치/레벨업·드롭·보스 스크립트(절망 1차).
   화면을 모른다: 각 단계는 '스텝' 배열({t:'msg'|'hit'|'hurt'|...})을 돌려주고 battle_view가 그것을 재생한다. MC.battle.sim()/simRoute()로 밸런스 확인(REDESIGN C-6·C-11·G-10). */
(function (MC) { 'use strict';

  /* ---------- 문구 ---------- */
  const TXT0 = {
    appear1: '{name}{이/가} 나타났다!', appearN: '{name} 무리가 나타났다!', attack: '{actor}의 공격!', skill: '{actor}의 {skill}!',
    endure: '{actor}{은/는} 몸을 웅크리고 버틴다.', item: '{actor}{은/는} {item}{을/를} 썼다.', noMp: '정신력이 부족하다.',
    flee: '{actor}{은/는} 달아났다!', fleeFail: '달아날 틈이 없다!', fleeNo: '달아날 곳이 없다.', kill: '{target}{을/를} 물리쳤다!',
    lose: '{actor}{은/는} 쓰러졌다…', confused: '{actor}{은/는} 머릿속이 뒤엉켰다!', confuseIdle: '{actor}{은/는} 멍하니 서 있다.',
    confuseHit: '{actor}{은/는} 엉뚱한 곳을 휘둘렀다!', confuseSelf: '자기 자신을 치고 말았다!', confuseCure: '머릿속이 맑아졌다.',
    confuseEnd: '{actor}{은/는} 정신을 차렸다.', enemyIdle: '{actor}{은/는} 가만히 있다.', enemyConfused: '{actor}{은/는} 제자리에서 맴돈다.',
    release: '{actor}{이/가} 모은 힘을 터뜨린다!', charge: '{actor}{이/가} 숨을 모은다…', preemptPlayer: '선수를 쳤다!', preemptEnemy: '기습이다!',
    noItem: '쓸 수 있는 도구가 없다.', eAttack: '{actor}의 공격!', hpHeal: 'HP {n} 회복', mpHeal: '정신력 {n} 회복'
  };
  function T(k) { const t = DB().text; return (t && t[k] != null) ? t[k] : (TXT0[k] != null ? TXT0[k] : k); }
  function fmt(tpl, o) {
    const s = String(tpl == null ? '' : tpl).replace(/\{(actor|target|name|skill|item|n|who)\}/g, (m, k) => (o && o[k] != null ? String(o[k]) : ''));
    return (MC.text && MC.text.resolveJosa) ? MC.text.resolveJosa(s) : s;
  }

  /* ---------- 데이터 접근 ---------- */
  const skill = id => (DB().skills || {})[id] || null;
  const item = id => (DB().items || {})[id] || null;
  const fam = id => (DB().families || {})[id] || null;
  function actionDef(e, id) { return (e.data && e.data.acts && e.data.acts[id]) || (DB().actions || {})[id] || { kind: 'atk', power: 1 }; }
  const pick3 = (v, r) => (Array.isArray(v) ? v[Math.min(r, v.length - 1)] : (v || 0));
  const ICON = { atk: 'ic_intent_atk', charge: 'ic_intent_charge', drain: 'ic_intent_drain', guard: 'ic_intent_guard', confuse: 'ic_intent_confuse', heal: 'ic_intent_guard', overwhelm: 'ic_intent_unknown' };

  /* ---------- 레벨·능력치 ---------- */
  let tblSrc = null, tbl = null;
  const levels = () => DB().levels || {};
  const maxLv = () => levels().max || 20;
  function table() {
    const Lv = levels();
    if (tbl && tblSrc === Lv) return tbl;
    tblSrc = Lv; tbl = {};
    const an = Lv.anchors || { 1: { hp: 30, mp: 10, str: 6, def: 4, spd: 5, wis: 3 }, 15: { hp: 150, mp: 70, str: 40, def: 30, spd: 30, wis: 45 } };
    const ks = Object.keys(an).map(Number).sort((a, b) => a - b);
    for (let lv = 1; lv <= maxLv(); lv++) {
      if (Lv.table && Lv.table[lv]) { tbl[lv] = Lv.table[lv]; continue; }
      let i = 0;
      while (i < ks.length - 2 && lv > ks[i + 1]) i++;
      const l0 = ks[i], l1 = ks[Math.min(i + 1, ks.length - 1)], A = an[l0], Bv = an[l1], o = {};
      for (const k in A) { const d = l1 !== l0 ? (Bv[k] - A[k]) / (l1 - l0) : 0; o[k] = Math.round(A[k] + d * (lv - l0)); }

  }
  // 다음 레벨까지 필요한 경험치(레벨마다 0부터 다시 셈): round(10 × Lv^1.6)
  function expNeed(lv) { const Lv = levels(); return Math.round((Lv.expBase || 10) * Math.pow(Math.max(1, lv), Lv.expPow || 1.6)); }
  // 유닛 기본 능력치(장비 제외)
  function statsFor(unitId, lv) {
    const u = (levels().units && levels().units[unitId]) || {};
    const base = table()[clamp(Math.round(lv || 1), 1, maxLv())] || {};
    const mul = u.mul || {}, o = {};
    for (const k of ['hp', 'mp', 'str', 'def', 'spd', 'wis']) {
      const m = mul[k] != null ? mul[k] : 1;
      o[k] = Math.max(k === 'mp' ? 0 : 1, Math.round((base[k] || 0) * m));
    }
    return o;
  }
  // 파티원 최대치·능력치 갱신(레벨·장비). member.st = {maxHp,maxMp,str,def,spd,wis}
  function recompute(m) {

    const s = statsFor(m.id, m.lv), its = DB().items || {};

    for (const slot of ['weapon', 'armor']) {
      const it = m[slot] && its[m[slot]];
      if (it) { str += it.str || 0; def += it.def || 0; spd += it.spd || 0; wis += it.wis || 0; hp += it.hp || 0; mp += it.mp || 0; }
    }
    const st = (m.st && typeof m.st === 'object') ? m.st : (m.st = {});
    st.maxHp = hp; st.maxMp = mp; st.str = str; st.def = def; st.spd = spd; st.wis = wis;
    if (m.hp == null) m.hp = hp;
    if (m.mp == null) m.mp = mp;
    m.hp = clamp(Math.round(m.hp), 0, hp); m.mp = clamp(Math.round(m.mp), 0, mp);
    if (m.exp == null) m.exp = 0;
    if (!m.skills) m.skills = [];
    return st;
  }
  function rankOf(lv) { const R = levels().ranks || [8, 12]; return lv >= R[1] ? 2 : (lv >= R[0] ? 1 : 0); }
  function skillCost(id, lv) { const s = skill(id); return s ? pick3(s.mp, rankOf(lv || 1)) : 0; }
  // 경험치 더하기 → 레벨업 목록 [{lv, before, after, rank}] (오른 만큼 HP·MP도 회복)
  function gainExp(m, n) {

    recompute(m);
    m.exp = (m.exp || 0) + Math.max(0, Math.round(n || 0));

      m.exp -= expNeed(m.lv);
      const b = Object.assign({}, m.st), r0 = rankOf(m.lv);
      m.lv++;

      m.mp = Math.min(a.maxMp, m.mp + Math.max(0, a.maxMp - b.maxMp));

  }

  /* ---------- 유닛 ---------- */
  function nameOf(m) {
    if (m.id === 'dantes') return (MC.state && MC.state.dispName) || '에드몽';
    const u = levels().units && levels().units[m.id];
    return (u && u.name) || m.name || m.id;
  }
  function allyUnit(m, i) {
    recompute(m);
    const st = m.st;
    return { side: 'ally', idx: i, key: 'a' + i, id: m.id, ref: m, name: nameOf(m), label: nameOf(m), lv: m.lv,
      hp: m.hp, mp: m.mp, maxHp: st.maxHp, maxMp: st.maxMp, str: st.str, def: st.def, spd: st.spd, wis: st.wis,

    if (!e) throw new Error('없는 적: ' + id);
    return { side: 'enemy', idx: i, key: 'e' + i, id, data: e, name: e.name, label: e.name + (letter ? ' ' + letter : ''), letter: letter || '',
      fam: e.fam, lv: e.lv || 1, hp: e.hp, maxHp: e.hp, mp: e.mp || 0, maxMp: e.mp || 0, str: e.str, def: e.def, spd: e.spd, wis: e.wis || 0,

  function tgtEnemy(B, t) {

      disabled: {}, scanned: false, script: null, turnsTaken: 0,
