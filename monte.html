        tower(ix + 20, hz - 42, 12, hz - 12, '#090b12', '#0f131e');
        tower(ix + 35, hz - 30, 9, hz - 11, '#0a0c14', '#10141f');
        tower(ix - 47, hz - 27, 8, hz - 12, '#0a0c14', '#10141f');
        g.rect(ix + 3, hz - 47, 1, 9, '#0a0c14'); g.rect(ix + 4, hz - 47, 3, 2, '#141a28');      // 깃대와 깃발
      });
      const md = mx.getImageData(0, 0, W, H).data, on = (x, y) => x >= 0 && y >= 0 && x < W && y < H && md[(y * W + x) * 4 + 3] > 0;
      g.ctx.drawImage(mk, 0, 0);
      for (let y = 0; y < L.hz - 1; y++) for (let x = 0; x < W; x++) {            // 달빛 테두리(오른쪽·위)
        if (!on(x, y)) continue;
        if (!on(x + 1, y)) g.px(x, y, '#2a3a5a');
        else if (!on(x, y - 1) && y < L.hz - 13) g.px(x, y, '#1c2840');
      }
      // 물에 비친 성(흐린 디더)
      for (let dy = 1; dy <= 14; dy++) for (let x = 0; x < W; x++) {
        if (!on(x, L.hz - dy + 1)) continue;
        const lv = 12 - dy * 0.8;
        if (lv > U.BAYER[((L.hz + dy) & 3) * 4 + (x & 3)]) g.px(x, L.hz + dy, '#050810');
      }
    });
    bg = c; bgKey = key; return c;
  }

  /* ---------- 구름·물결 ---------- */
  let clouds = null;
  function bakeClouds() {                        // 가는 구름 줄기 두 가닥(끝이 가늘고, 위쪽 가장자리만 달빛)
    if (clouds) return clouds;
    clouds = [0, 1].map(i => {
      const w = 96 + i * 30, h = 6, c = G().makeCanvas(w, h);
      G().withCtx(c, () => {
        const g = G();
        for (let x = 0; x < w; x++) {
          const u = x / w, env = Math.pow(Math.sin(u * Math.PI), 1.6);
          const th = Math.round(env * (h - 1) * (0.55 + 0.45 * Math.sin(x * 0.19 + i * 2.1)));
          for (let y = 0; y < th; y++) {
            const lv = 3 + env * 6 - y;
            if (lv > U.BAYER[(y & 3) * 4 + (x & 3)]) g.px(x, h - 1 - y, y === th - 1 ? '#1a2840' : '#0e1628');
          }
        }
      });
      return c;
    });
    return clouds;
  }
  let waves = null, waveKey = '';
  function makeWaves() {
    const g = G(), W = g.W, H = g.H, L = layout(), key = W + 'x' + H;
    if (waves && waveKey === key) return waves;
    const rows = [];
    let y = L.hz + 2, i = 0;
    while (y < H - 1) {
      const d = (y - L.hz) / Math.max(1, H - L.hz), layer = d < 0.16 ? 0 : d < 0.42 ? 1 : 2;
      const speed = [6, 12, 20][layer] * (0.8 + U.hash(i, 1, 41) * 0.4) * ((i & 1) ? -1 : 1);
      const P = 56 + Math.floor(U.hash(i, 2, 41) * 56);
      const strip = g.makeCanvas(W + P, 1), sx = strip.getContext('2d');
      const cols = [['#152238', '#1a2a44'], ['#1c2c4a', '#26395e'], ['#24385a', '#33507a']][layer];
      let x = Math.floor(U.hash(i, 3, 41) * 14);
      const segs = [];
      while (x < P - 3) { const len = 2 + Math.floor(U.hash(i, x, 42) * (3 + layer * 5)); segs.push([x, len]); x += len + 7 + Math.floor(U.hash(x, i, 43) * (10 + layer * 10)); }
      for (let k = 0; k * P < W + P; k++) for (const s of segs) {
        sx.fillStyle = U.hash(s[0], i, 44) < 0.3 ? cols[1] : cols[0]; sx.fillRect(k * P + s[0], 0, s[1], 1);
        if (layer === 2 && U.hash(s[0], i, 45) < 0.18) { sx.fillStyle = '#4a6490'; sx.fillRect(k * P + s[0] + 1, 0, Math.max(1, s[1] - 2), 1); }
      }
      rows.push({ y, speed, P, strip, ph: U.hash(i, 4, 41) * 6.28, layer });
      y += 2 + Math.round(d * 6); i++;
    }
    waves = rows; waveKey = key; return rows;
  }

  function drawBeam(t, L) {
    const g = G(), ctx = g.ctx, th = t / 6000 * Math.PI * 2;
    const c = Math.cos(th), s = Math.sin(th);
    const len = Math.round(150 * Math.pow(Math.abs(c), 0.8)), dir = c < 0 ? -1 : 1;
    const bright = 0.22 + 0.5 * Math.max(0, s);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#ffe9a0';
    for (let d = 1; d < len; d++) {
      const f = 1 - d / len, a = Math.round(bright * Math.pow(f, 0.8) * 0.26 * 32) / 32;
      if (a <= 0) continue;
      const hh = Math.round(1 + d * 0.085), x = L.lampX + dir * d;
      if (x < -2 || x > g.W + 2) break;
      ctx.globalAlpha = a; ctx.fillRect(x, L.lampY - hh, 1, hh * 2 + 1);
    }
    const flash = Math.pow(Math.max(0, s), 8);
    ctx.globalAlpha = 0.35 + 0.5 * flash;
    const gr = U.glow(Math.round(3 + flash * 8), '#ffe9a0', 16, 1.1);
    ctx.drawImage(gr, L.lampX - (gr.width >> 1), L.lampY - (gr.height >> 1));
    ctx.restore();
    g.px(L.lampX, L.lampY, flash > 0.3 ? '#ffffff' : '#ffe9a0');
  }

  /* ---------- 씬 ---------- */
  ch1.titleScene = function (opt) {
    opt = opt || {};
    const g = G();
    const sc = { name: 'title', opaque: true, blocking: true, t: 0, stage: 0, st1: -1, busy: false, info: null };
    const pal = 'act5';
    const bCont = new MC.ui.Button({ label: '이어하기', style: 'primary', pal, onTap: () => doContinue() });
    const bNew = new MC.ui.Button({ label: '처음부터', pal, onTap: () => doNew() });
    const bSet = new MC.ui.Button({ label: '설정', pal, onTap: () => doSettings() });
    const bMute = new MC.ui.Button({ w: 24, h: 24, style: 'ghost', pal, sfx: null, onTap: () => toggleMute() });
    const buttons = () => (sc.info ? [bCont, bNew, bSet, bMute] : [bNew, bSet, bMute]);

    function refreshInfo() {
      const i = MC.save.hasAny() ? MC.save.info() : null;
      if (!i) { sc.info = null; bNew.style = 'primary'; return; }
      bNew.style = 'normal';
      const mp = MC.data.maps && MC.data.maps[i.map], pm = Math.floor((i.playMs || 0) / 60000);
      sc.info = 'Lv ' + i.lv + ' · ' + ((mp && mp.name) || '어딘가') + ' · ' + Math.floor(pm / 60) + ':' + String(pm % 60).padStart(2, '0');
      if (MC.text.width(sc.info, 'small') > 170) sc.info = 'Lv ' + i.lv + ' · ' + ((mp && mp.name) || '');
    }
    function lay() {
      const mt = MC.ui.minTouch(), bh = Math.max(28, mt + 6), W = g.W, cx = W >> 1;
      let y = g.H - 30 - g.safe.bottom;
      bSet.w = 112; bSet.h = bh - 2; y -= bSet.h; bSet.x = cx - (bSet.w >> 1); bSet.y = y; y -= 8;
      if (sc.info) {
        bNew.w = 112; bNew.h = bh; y -= bNew.h; bNew.x = cx - (bNew.w >> 1); bNew.y = y; y -= 12 + 13;
        bCont.w = 136; bCont.h = bh + 4; y -= bCont.h; bCont.x = cx - (bCont.w >> 1); bCont.y = y;
      } else {
        bNew.w = 136; bNew.h = bh + 4; y -= bNew.h; bNew.x = cx - (bNew.w >> 1); bNew.y = y;
      }
      bMute.x = W - 26 - g.safe.right; bMute.y = 2 + g.safe.top;
    }
    function startAudio() {
      U.music('play', U.hasSong('title') ? 'title' : 'marseille', { fade: 1500 });
      U.amb('play', 'harbor', { fade: 1500 });
    }
    function toStage1(user) {
      if (sc.stage >= 1) return;
      sc.stage = 1; sc.st1 = sc.t;
      refreshInfo();
      for (const b of buttons()) b.arm(260);
      if (user) U.sfx('ui_ok');
      startAudio();
    }
    function toggleMute() {
      const m = !(MC.save.settings && MC.save.settings.mute);
      U.audio('setMute', m);
      if (!m) { U.sfx('ui_ok'); startAudio(); }
      MC.ui.toast(m ? '소리를 껐습니다' : '소리를 켰습니다', 1200);
    }
    async function doNew() {
      if (sc.busy) return;
      if (MC.save.hasAny()) {
        sc.busy = true;
        const ok = await MC.ui.Confirm({ text: '지금까지의 기록이 사라집니다.', yes: '지운다', no: '그만둔다', danger: true, holdYes: 1000 });
        sc.busy = false;
        if (!ok) return;
        MC.save.wipe(); refreshInfo();
      }
      sc.busy = true;
      U.music('stop', 1000); U.amb('stop', 1000);
      await MC.fx.fade(1, 700);
      await MC.core.waitReal(200);
      if (MC.scene.has(sc)) MC.scene.remove(sc);
      ch1.startNew();
    }
    async function doContinue() {
      if (sc.busy) return;
      sc.busy = true;
      U.music('stop', 700); U.amb('stop', 700);
      await MC.fx.fade(1, 600);
      const ok = await ch1.continueGame();
      if (!ok) { sc.busy = false; MC.fx.fade(0, 300); MC.ui.toast('기록을 불러오지 못했습니다'); refreshInfo(); startAudio(); }
    }
    async function doSettings() {
      if (sc.busy) return;
      sc.busy = true;
      await ch1.openSettings({ pal });
      sc.busy = false;
      for (const b of buttons()) b.arm(200);
    }

    sc.enter = () => {
      MC.input.guardBack(false);
      refreshInfo();
      if ((MC.fx.fadeLevel ? MC.fx.fadeLevel() : 0) > 0) MC.fx.fade(0, 700);
      if (MC.audio && MC.audio.ready) { sc.t = 700; toStage1(false); }
    };
    sc.update = dt => {
      sc.t += dt;
      if (sc.stage >= 1) { lay(); for (const b of buttons()) b.update(); }
    };
    sc.onInput = ev => {
      if (sc.busy) return true;
      if (sc.stage === 0) {
        if (ev.type === 'tap' && sc.t > 450) toStage1(true);
        return true;
      }
      if (sc.t - sc.st1 < 250) return true;
      for (const b of buttons()) if (b.onInput(ev)) return true;
      return true;
    };
    sc.onBack = () => {};
    sc.render = () => {
      const W = g.W, H = g.H, t = sc.t, L = layout(), ctx = g.ctx;
      ctx.drawImage(bakeBg(), 0, 0);
      // 반짝이는 별
      for (let i = 0; i < 14; i++) {
        const x = Math.floor(U.hash(i, 7, 32) * W), y = Math.floor(U.hash(i, 8, 32) * (L.hz - 40));
        if (Math.hypot(x - L.moonX, y - L.moonY) < 22) continue;
        const ph = Math.sin(t * 0.0017 * (0.6 + U.hash(i, 9, 32)) + i * 1.7);
        if (ph > 0.55) { g.px(x, y, '#c8d4ec'); if (ph > 0.93) { g.px(x - 1, y, '#44547a'); g.px(x + 1, y, '#44547a'); g.px(x, y - 1, '#44547a'); g.px(x, y + 1, '#44547a'); } }
        else if (ph > 0) g.px(x, y, '#44547a');
      }
      // 구름(달 앞을 천천히)
      const cl = bakeClouds();
      for (let i = 0; i < cl.length; i++) {
        const w = cl[i].width, span = W + w, x = Math.round(W - ((t * (0.0021 + i * 0.0012) + i * 97) % span));
        ctx.drawImage(cl[i], x, i === 0 ? L.moonY - 2 : Math.max(6, L.moonY - 22));
      }
      // 등대 빛
      drawBeam(t, L);
      // 성의 창 하나(촛불빛)
      const ix = L.X0 + 64, fl = Math.sin(t * 0.011) + Math.sin(t * 0.027);
      g.rect(ix + 10, L.hz - 32, 1, 2, fl > 1.2 ? '#ffcf6a' : fl > -0.8 ? '#c8923a' : '#7a5424');
      // 물결 3층
      const wv = makeWaves();
      for (const r of wv) {
        const off = ((t / 1000 * r.speed) % r.P + r.P) % r.P;
        const yy = r.y + (r.layer ? Math.round(Math.sin(t * 0.0011 + r.ph) * 0.8) : 0);
        ctx.drawImage(r.strip, -Math.round(off), yy);
      }
      // 섬 기슭의 물거품
      const q = (t / 130) | 0, qf = (t / 260) | 0;
      for (let x = ix - 64; x <= ix + 64; x += 2) {
        const hv = U.hash(x, qf, 53);
        if (hv < 0.45) g.rect(x, L.hz + 1 + (hv < 0.12 ? 1 : 0), hv < 0.2 ? 2 : 1, 1, hv < 0.1 ? '#6a82b0' : '#33507a');
      }
      // 달 그림자(물 위 반짝임)
      for (let k = 0; k < 44; k++) {
        const y = L.hz + 2 + k * 2, depth = k / 44;
        if (y >= H - 2) break;
        if (U.hash(k, q, 51) < 0.28) continue;
        const w = 1 + Math.floor(U.hash(k, q + 7, 52) * (2 + depth * 7));
        const x = L.moonX - (w >> 1) + Math.round(Math.sin(t * 0.0023 + k * 0.9) * (1 + depth * 2));
        g.ditherRect(x, y, w, 1, depth < 0.25 ? '#c8d4ec' : '#6a82b0', 16 - depth * 10);
      }
      // 글자가 물결에 묻히지 않게 아래쪽 바다를 디더 계단으로 어둡게(1단계 안내 → 2단계 버튼 영역)
      {
        const y0 = sc.stage >= 1 ? (sc.info ? bCont.y : bNew.y) - 22 : H - 104 - g.safe.bottom;
        const k = sc.stage >= 1 ? 0.6 + 0.4 * MC.clamp((t - sc.st1) / 300, 0, 1) : U.lvl(t, 1000, 500) / 16;
        if (y0 > L.hz) {
          for (let i = 0; i < 5; i++) g.ditherRect(0, y0 + i * 5, W, 5, '#03050b', Math.round((2 + i * 2) * k));
          g.ditherRect(0, y0 + 25, W, H - y0 - 25, '#03050b', Math.round(10 * k));
        }
      }
      // 로고 (부제 없음 — 원작 이름은 이야기 속에서 드러난다)
      const logo = bakeLogo(), lx = (W - logo.width) >> 1, ly = L.logoY;
      const la = U.lvl(t, 250, 600);
      if (la > 0) U.drawDither(logo, lx, ly, la);
      // 1단계 안내
      if (sc.stage === 0 && t > 1100) {
        const k = ((t - 1100) / 533 | 0) % 4, colr = ['#6a7088', '#9aa8c8', '#e8ecf4', '#9aa8c8'][k];
        const lv = U.lvl(t, 1100, 400), py = H - 90 - g.safe.bottom;
        const a = MC.text.bake('화면을 눌러 시작하세요', 'body', colr, { shadow: '#03050b' });
        U.drawDither(a, (W - a.width) >> 1, py, lv);
        const b = MC.text.bake('(소리가 켜집니다)', 'small', '#6a7088');
        U.drawDither(b, (W - b.width) >> 1, py + 17, lv);
      }
      // 2단계 버튼
      if (sc.stage >= 1) {
        lay();
        const p = MC.clamp((t - sc.st1) / 260, 0, 1), dy = Math.round((1 - MC.ease.outCubic(p)) * 6);
        for (const b of [bCont, bNew, bSet]) { if (b === bCont && !sc.info) continue; b.y += dy; }
        for (const b of buttons()) if (b !== bMute) b.render();
        if (sc.info) {
          const im = MC.text.bake(sc.info, 'small', '#8a98b8', { shadow: '#03050b' });
          if (im) U.drawDither(im, (W - im.width) >> 1, bCont.y + bCont.h + 3, p * 16);
        }
        bMute.render();
        const muted = MC.save.settings && MC.save.settings.mute;
        if (!U.drawSpr(muted ? 'ic_sound_off' : 'ic_sound_on', bMute.x + 6, bMute.y + 6 + (bMute.pressed ? 1 : 0), p * 16)) MC.text.draw(muted ? '×' : '♪', bMute.x + 12, bMute.y + 5, { align: 'center', color: '#9aa8c8' });
        const v = MC.text.bake('v' + (MC.VERSION || ''), 'small', '#26304a');
        if (v) g.ctx.drawImage(v, 3 + g.safe.left, 3 + g.safe.top);
      }
      // 무음 모드 안내
      const n = MC.text.bake('무음 모드에서는 소리가 나지 않아요', 'small', '#5a6280', { shadow: '#03050b' });
      if (n) U.drawDither(n, (W - n.width) >> 1, H - 14 - g.safe.bottom, U.lvl(t, 900, 500));
      if (t < 300) g.ditherFill('#000', 16 - t / 300 * 16);
    };
    return sc;
  };
})(window.MC);

</script>
<script>/* ==== src/ch1/menu.js ==== */
/* menu.js — 필드 메뉴 MC.ch1.openMenu()(도구·상태·설정·기록(감방에서만)·타이틀로)와 설정 화면 MC.ch1.openSettings()(타이틀·메뉴 공용).
   설정은 MC.save.settings에 즉시 반영·저장(음량은 MC.audio.setVolume + ui_cursor 미리듣기). 뒤로가기=한 단계 닫기. 담당: scenes */
(function (MC) { 'use strict';
  const ch1 = MC.ch1, U = ch1.u, G = () => MC.gfx;

  /* ---------- 작은 그림 ---------- */
  function tri(x, y, dir, col) {              // 5×7 화살(◀ ▶)
    const g = G();
    for (let i = 0; i < 4; i++) {                // i=0이 밑변(7px), i=3이 꼭짓점
      const h = 7 - i * 2, xx = dir < 0 ? x + 3 - i : x + i;
      g.rect(xx, y + i, 1, h, col);
    }
  }
  function cross(cx, cy, col) { const g = G(); for (let i = -3; i <= 3; i++) { g.rect(cx + i, cy + i, 2, 1, col); g.rect(cx + i, cy - i, 2, 1, col); } }
  function iconButton(kind, onTap, pal) {
    const b = new MC.ui.Button({ w: 24, h: 24, style: 'ghost', pal, sfx: kind === 'close' ? 'ui_cancel' : 'ui_cancel', onTap });
    b.kind = kind;
    const base = b.render.bind(b);
    b.render = function () {
      base();
      const P = pal ? G().pal(pal) : G().uiPal, y = this.y + (this.pressed ? 1 : 0);
      G().frame(this.x, y, this.w, this.h, { small: true, pal: pal || undefined });
      if (kind === 'close') cross(this.x + 11, y + 12, P.text);
      else tri(this.x + 9, y + 9, -1, P.text);
    };
    return b;
  }
  function bar(x, y, w, v, max, col) {
    const g = G();
    g.rect(x - 1, y - 1, w + 2, 5, '#000000');
    g.rect(x, y, w, 3, '#07070c');
    const f = max > 0 ? Math.round(w * MC.clamp(v / max, 0, 1)) : 0;
    if (f > 0) { g.rect(x, y, f, 3, col); g.hline(x, y, f, G().mix(col, '#ffffff', 0.35)); }
  }
  const fmtTime = ms => { const m = Math.floor((ms || 0) / 60000); return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); };

  /* ---------- 데이터 도우미 ---------- */
  const ITEM_FB = {
    bread: { name: '말린 빵', desc: '딱딱하게 마른 빵. 씹을수록 버틸 힘이 난다. 체력 회복.' },
    water: { name: '물 한 모금', desc: '미지근한 물. 정신이 조금 맑아진다. 정신력 회복.' },
    memory_pipe: { name: '기억 조각', desc: '아버지의 파이프 냄새. 정신력 회복.' },
    inspector_note: { name: '감찰관의 약속', desc: '확인하겠다고 했다.', key: true }
  };
  const PROMISE = ['확인하겠다고 했다.', '확인하는 중일 것이다.', '확인했을까.', '……누가 뭘 약속했더라.', '……'];
  const SKILL_FB = { memory: ['기억', '떠올린 얼굴로 버틴다.'], thought: ['사색', '생각을 벼려 찌른다.'], endure: ['버티기', '웅크려 견딘다.'] };
  function bdata() { return (MC.data && MC.data.battle) || {}; }
  function itemDef(id) {
    const d = (bdata().items || {})[id] || {};
    const fb = ITEM_FB[id] || { name: id, desc: '' };
    const out = Object.assign({}, fb, d);
    if (!out.name) out.name = fb.name || id;
    if (id === 'inspector_note') {
      let k = MC.game.getVar('promise'); if (k == null) k = MC.game.getVar('sleeps');
      out.desc = PROMISE[MC.clamp(+k || 0, 0, PROMISE.length - 1)];
    }
    return out;
  }
  function maxOf(m) {
    let s = null;
    if (MC.battle && typeof MC.battle.statsFor === 'function') { try { s = MC.battle.statsFor(m.id, m.lv); } catch (_) { s = null; } }
    const st = m.st || {};
    return {
      hp: (st.maxHp || (s && s.hp) || m.hp || 1), mp: (st.maxMp || (s && s.mp) || m.mp || 0),
      str: s ? s.str : '-', def: s ? s.def : '-', spd: s ? s.spd : '-', wis: s ? s.wis : '-'
    };
  }
  // 필드에서 쓸 수 있는 도구: 전투 모듈의 필드 사용 함수가 있으면 그걸, 없으면 데이터의 회복 값으로
  function fieldUse(id) {
    const B = MC.battle;
    for (const fn of ['useItemField', 'fieldUseItem', 'useFieldItem']) if (B && typeof B[fn] === 'function') { try { return B[fn](id); } catch (e) { MC.core.error(e, 'menu.use'); return null; } }
    const d = itemDef(id), m = MC.game.lead(); if (!m || d.key) return null;
    const mx = maxOf(m);
    const eff = d.effect || d.eff || d;
    let hp = +(eff.hp || eff.heal || 0), mp = +(eff.mp || 0);
    if (eff.hpPct) hp = Math.max(hp, Math.round(mx.hp * eff.hpPct));
    if (eff.mpPct) mp = Math.max(mp, Math.round(mx.mp * eff.mpPct));
    if (!hp && !mp) { if (id === 'bread') hp = Math.max(30, Math.round(mx.hp * 0.4)); else if (id === 'water') mp = Math.max(15, Math.round(mx.mp * 0.35)); else if (id === 'memory_pipe') mp = 10; }
    if (!hp && !mp) return null;
    const h0 = m.hp, m0 = m.mp;
    if ((!hp || m.hp >= mx.hp) && (!mp || m.mp >= mx.mp)) return { none: true };
    if (!MC.game.take(id, 1)) return null;
    m.hp = Math.min(mx.hp, m.hp + hp); m.mp = Math.min(mx.mp, m.mp + mp);
    return { hp: m.hp - h0, mp: m.mp - m0 };
  }
  function usableInField(id) {
    const d = itemDef(id);
    if (d.key || d.battleOnly || d.field === false) return false;
    return !!(d.hp || d.mp || d.heal || d.hpPct || d.mpPct || d.effect || d.eff || id === 'bread' || id === 'water' || id === 'memory_pipe');
  }
  function mapName() { const m = MC.state && MC.state.map, d = m && MC.data.maps && MC.data.maps[m]; return (d && d.name) || ''; }

  /* ================================================================ 설정 패널 (타이틀·메뉴 공용) */
  const canVib = () => !!navigator.vibrate && !(MC.audio && MC.audio.IOS);
  const SET_TABS = [
    { label: '소리', rows: [
      { k: 'mus', label: '음악', type: 'vol' },
      { k: 'sfx', label: '효과음', type: 'vol' },
      { k: 'voice', label: '대사음', type: 'bool' },
      { k: 'mute', label: '소리 끄기', type: 'bool' }] },
    { label: '진행', rows: [
      { k: 'textSpeed', label: '대사 속도', type: 'opt', opts: [[0, '느림'], [1, '보통'], [2, '빠름'], [3, '즉시']] },
      { k: 'battleSpeed', label: '전투 속도', type: 'opt', opts: [[0, '느림'], [1, '보통'], [2, '빠름']] },
      { k: 'moveMs', label: '걷는 속도', type: 'opt', opts: [[200, '보통'], [150, '빠르게']] },
      { k: 'shake', label: '흔들림', type: 'opt', opts: [[0, '끔'], [0.5, '약하게'], [1, '보통']] },
      { k: 'vibrate', label: '진동', type: 'bool', show: canVib }] }
  ];
  class SettingsPanel {
    constructor(o) {
      o = o || {};
      this.pal = o.pal || null; this.tab = 0; this.x = 0; this.y = 0; this.w = 176; this.h = 220;
      this.tabs = SET_TABS.map((tb, i) => new MC.ui.Button({ label: tb.label, pal: this.pal || undefined, sfx: 'page', onTap: () => { if (this.tab !== i) { this.tab = i; this.build(); } } }));
      this.build();
    }
    rows() { return SET_TABS[this.tab].rows.filter(r => !r.show || r.show()); }
    build() {
      const pal = this.pal || undefined;
      this.rb = this.rows().map(r => {
        if (r.type === 'bool') return { r, tog: new MC.ui.Button({ style: 'ghost', pal, sfx: null, onTap: () => this.change(r, 0) }) };
        return { r, dec: new MC.ui.Button({ pal, sfx: null, onTap: () => this.change(r, -1) }), inc: new MC.ui.Button({ pal, sfx: null, onTap: () => this.change(r, 1) }) };
      });
    }
    widgets() { const out = this.tabs.slice(); for (const e of this.rb) { if (e.tog) out.push(e.tog); else out.push(e.dec, e.inc); } return out; }

    change(r, d) {

        U.sfx('ui_cursor');

      }
      if (r.type === 'bool') {
        const v = !s[r.k];
        if (r.k === 'mute') U.audio('setMute', v); else if (r.k === 'voice') U.audio('setVoice', v);
        s[r.k] = v; MC.save.saveSettings();
        if (r.k === 'vibrate' && v) U.vibrate(30);
        if (r.k === 'voice' && v && MC.sfx && MC.sfx.voice) { try { MC.sfx.voice('dantes', '가'); } catch (_) {} }
        U.sfx(v ? 'ui_ok' : 'ui_cancel');

      }
      const opts = r.opts; let i = opts.findIndex(o => o[0] === s[r.k]); if (i < 0) i = Math.min(1, opts.length - 1);
      const ni = MC.clamp(i + d, 0, opts.length - 1);

    }
    layout(x, y, w, h) {
      this.x = x; this.y = y; this.w = w; this.h = h;
      const mt = MC.ui.minTouch(), tabH = Math.max(22, mt), tw = (w - 12) >> 1;
      this.tabs.forEach((b, i) => { b.x = x + 4 + i * (tw + 4); b.y = y + 4; b.w = tw; b.h = tabH; b.style = i === this.tab ? 'primary' : 'normal'; });
      this.tabH = tabH;
      const n = this.rb.length;
      this.rowH = MC.clamp(Math.floor((h - tabH - 14 - 18) / Math.max(1, n)), mt + 4, Math.max(mt + 8, 30));
      const bh = Math.max(20, Math.min(this.rowH - 6, mt));
      this.rb.forEach((e, i) => {
        const ry = y + tabH + 10 + i * this.rowH, by = ry + ((this.rowH - bh) >> 1);
        e.y = ry;
        if (e.tog) { e.tog.x = x + w - 92; e.tog.y = by; e.tog.w = 88; e.tog.h = bh; }
        else { e.dec.x = x + w - 92; e.dec.y = by; e.dec.w = 22; e.dec.h = bh; e.inc.x = x + w - 26; e.inc.y = by; e.inc.w = 22; e.inc.h = bh; }
      });
    }
    update() { for (const b of this.widgets()) b.update(); }
    onInput(ev) { for (const b of this.widgets()) if (b.onInput(ev)) return true; return false; }
    render() {
      const g = G(), P = this.pal ? g.pal(this.pal) : g.uiPal, s = MC.save.settings, x = this.x, w = this.w;
      for (const b of this.tabs) b.render();
      this.rb.forEach((e, i) => {
        const r = e.r, ry = e.y, cy = ry + ((this.rowH - 16) >> 1) + 1;
        if (i > 0) g.hline(x + 6, ry, w - 12, g.mix(P.f, P.D, 0.6));
        MC.text.draw(r.label, x + 8, cy, { color: P.text });
        if (r.type === 'vol') {
          const v = s[r.k] | 0;
          MC.text.draw(String(v), x + w - 97, cy + 1, { font: 'small', color: P.dim, align: 'right' });
          e.dec.enabled = v > 0; e.inc.enabled = v < 10;
          e.dec.render(); e.inc.render();
          const px0 = x + w - 67, pyy = e.dec.y + (e.dec.h >> 1) - 3;
          for (let k = 0; k < 10; k++) g.rect(px0 + k * 4, pyy + (k < v ? 0 : 2), 3, k < v ? 6 : 2, k < v ? (s.mute ? P.dim : P.gold) : g.mix(P.D, P.f, 0.2));
        } else if (r.type === 'opt') {
          let i2 = r.opts.findIndex(o => o[0] === s[r.k]); if (i2 < 0) i2 = 1;
          e.dec.enabled = i2 > 0; e.inc.enabled = i2 < r.opts.length - 1;
          e.dec.render(); e.inc.render();
          MC.text.draw(r.opts[MC.clamp(i2, 0, r.opts.length - 1)][1], x + w - 48, cy, { color: P.gold, align: 'center' });
        } else {
          e.tog.render();
          const on = !!s[r.k], tx = x + w - 34, ty = e.tog.y + (e.tog.h >> 1) - 5;
          g.rect(tx, ty, 26, 10, '#000000'); g.rect(tx + 1, ty + 1, 24, 8, on ? g.mix(P.gold, P.f, 0.45) : '#15141c');
          g.rect(on ? tx + 14 : tx + 2, ty + 2, 10, 6, on ? P.gold : P.dim);
          MC.text.draw(on ? '켬' : '끔', tx - 6, cy, { color: on ? P.text : P.dim, align: 'right' });
        }
        if (e.dec) { tri(e.dec.x + 8, e.dec.y + (e.dec.h >> 1) - 3 + (e.dec.pressed ? 1 : 0), -1, e.dec.enabled ? P.text : P.dim); tri(e.inc.x + 9, e.inc.y + (e.inc.h >> 1) - 3 + (e.inc.pressed ? 1 : 0), 1, e.inc.enabled ? P.text : P.dim); }

      g.offset(0, dy);
      if (sc.page === 'main') renderMain(x, y, w, h);
      else if (sc.page === 'items') renderItems(x, y, w, h);
      else if (sc.page === 'status') renderStatus(x, y, w, h);
      else if (sc.page === 'settings') { g.frame(x, y, w, sc.setH); settings.render(); }
      g.resetOffset();
      bClose.render();
      if (sc.page !== 'main') bBack.render();
    };
    return sc;
  }

  // 필드 메뉴 열기(이미 열려 있으면 무시) -> Promise(닫힐 때)
  ch1.openMenu = function () {
    if (MC.scene.find('menu') || MC.scene.find('settings')) return Promise.resolve();
    return MC.scene.push(menuScene());
  };
})(window.MC);

</script>
<script>/* ==== src/ch1/main.js ==== */
/* main.js — MC.main(): 설정 적용 → 타이틀(또는 ?ev= / ?map= 디버그 진입). 흐름 함수: MC.ch1.startNew()(새 게임 a0.start), continueGame()(이어하기),
   gotoTitle()(이벤트 중단·씬 비우기·연출 초기화 → 타이틀), applyLook(state)(막별 창 팔레트·색 보정 복원). 담당: scenes */
(function (MC) { 'use strict';
  const ch1 = MC.ch1, U = ch1.u;

  /* ---------- 연출 상태 초기화·복원 ---------- */
  function resetLook() {
    try {
      MC.fx.freeze(false);
      MC.fx.grade({ sat: 1, tint: null, ta: 0 }, 0);
      MC.fx.vignette(0, 0);
      MC.fx.letterbox(false, 0);
      if (MC.fx.particles) MC.fx.particles.clear();
    } catch (e) { MC.core.error(e, 'resetLook'); }
    U.audio('lowpass', null, 0);
    U.music('filterTo', null, 0);
    U.music('detuneTo', 0, 0);
    MC.gfx.setUIPal('act1');
  }
  ch1.resetLook = resetLook;

  // 저장된 진행 상태에 맞는 막 분위기(창 팔레트·채도·비네트). 맵 진입 이벤트가 덮어쓸 수 있다
  function applyLook(st) {
    st = st || MC.state || {};
    resetLook();
    const act = st.act || 0, f = st.flags || {};
    if (act >= 3) {
      MC.gfx.setUIPal('act3');
      MC.fx.grade({ sat: 0.25, tint: '#1a2a50', ta: 0.25 }, 0);
      MC.fx.vignette(0.4, 0);
    } else if (act === 2) {
      MC.gfx.setUIPal('act2');
      if (f['a2.arrested']) { MC.fx.grade({ sat: 0.55, tint: '#1a2a50', ta: 0.12 }, 0); MC.fx.vignette(0.35, 0); }
      else { MC.fx.grade({ sat: 1, tint: '#ffb060', ta: 0.05 }, 0); MC.fx.vignette(0.15, 0); }
    }
  }
  ch1.applyLook = applyLook;
  function playerSpriteFor(st) {
    const v = (st && st.vars) || {}, f = (st && st.flags) || {};
    if (f['a3.after_card']) return 'ch_dantes2';
    if (v.dantesLook === 'prison') return 'ch_dantes_prison';
    return null;
  }

  // 돌고 있는 이벤트를 멈춘다(모듈마다 이름이 다를 수 있어 있는 것을 부름)
  function stopEvents() {
    const E = MC.events;
    if (!E) return;
    for (const fn of ['stopAll', 'stop', 'abort', 'cancel', 'reset']) {
      if (typeof E[fn] === 'function') { try { E[fn](); } catch (e) { MC.core.error(e, 'events.' + fn); } return; }
    }
  }
  ch1.stopEvents = stopEvents;

  /* ---------- 새 게임 / 이어하기 / 타이틀로 ---------- */
  ch1.startNew = function () {
    MC.state = MC.game.newState();
    resetLook();
    MC.input.guardBack(true);
    if (MC.events && typeof MC.events.run === 'function') {
      const r = MC.events.run('a0.start');
      if (r && r.catch) r.catch(e => MC.core.error(e, 'a0.start'));
      return r;
    }
    U.warn('events', 'MC.events.run 없음 — 새 게임을 시작할 수 없음');
    MC.fx.fade(0, 300);
    MC.ui.toast('이야기 모듈을 불러오지 못했습니다', 3000);
    return Promise.resolve();
  };

  // 이어하기: 저장 불러오기 → 막 분위기 → 필드 진입(덮인 채로) → 밝아짐. -> Promise<bool>
  ch1.continueGame = async function () {
    const st = MC.save.load();
    if (!st) return false;
    if (!st.map || !MC.field || typeof MC.field.enter !== 'function') {
      if (!st.map) { ch1.startNew(); return true; }
      U.warn('field', 'MC.field.enter 없음'); return false;
    }
    stopEvents();
    MC.scene.clear();
    applyLook(st);
    MC.input.guardBack(true);
    if ((MC.fx.fadeLevel ? MC.fx.fadeLevel() : 0) < 0.99) MC.fx.fade(1, 0);
    try { await MC.field.enter(st.map, [st.x, st.y, st.dir || 'down'], 'cut'); }
    catch (e) { MC.core.error(e, 'continue'); return false; }
    const spr = playerSpriteFor(st);
    if (spr && MC.field.setSprite) { try { MC.field.setSprite('player', spr); } catch (_) {} }
    await MC.core.waitReal(120);
    await MC.fx.fade(0, 600);
    return true;
  };

  let going = false;
  // opt:{instant:true} — 페이드 없이(이미 검정일 때), keepMusic:true — 지금 곡이 타이틀 곡이면 끊지 않고 이어 감
  ch1.gotoTitle = async function (opt) {
    opt = opt || {};
    if (going) return; going = true;
    try {
      const song = U.hasSong('title') ? 'title' : 'marseille';
      if (!(opt.keepMusic && MC.music && MC.music.current === song)) U.music('stop', 700);
      U.amb('stop', 700);
      if (!opt.instant) await MC.fx.fade(1, 500);
      else MC.fx.fade(1, 0);
      // 이벤트 러너가 custom/카드를 감싼 '페이드 들어올림'을 풀 때 페이드를 되돌리지 않게(타이틀이 검게 덮이는 문제)
      if (MC.events && typeof MC.events.fadeGen === 'number') MC.events.fadeGen++;
      stopEvents();
      MC.scene.clear();
      resetLook();
      await MC.core.waitReal(200);
      MC.scene.push(ch1.titleScene({ from: 'game' }));
    } catch (e) { MC.core.error(e, 'gotoTitle'); }
    finally { going = false; }
  };

  /* ---------- 디버그 진입 (?ev= / ?map=) ---------- */
  async function debugEntry() {
    const cfg = MC.cfg, q = cfg.q || {};
    MC.state = MC.game.newState();
    MC.input.guardBack(true);
    if (cfg.map) {
      if (/^(cell|b1)$/.test(cfg.map)) { MC.state.act = 3; MC.state.vars.dantesLook = 'prison'; MC.state.dispName = '34번'; }
      applyLook(MC.state);
      if (MC.field && MC.field.enter) await MC.field.enter(cfg.map, cfg.x != null ? [cfg.x, cfg.y, q.dir || 'down'] : 'default', 'cut');
      else U.warn('field', 'MC.field.enter 없음');
    }
    const ev = cfg.ev;
    if (!ev) return;
    // ?ev=custom.candle / ?ev=cards.timecard 처럼 연출만 따로 볼 수 있다
    const m = /^(custom|cards|minigames)\.(\w+)$/.exec(ev);
    if (m && !(MC.data.events && MC.data.events[ev])) {
      const fn = ch1[m[1]] && ch1[m[1]][m[2]];
      if (typeof fn !== 'function') { MC.ui.toast('없는 연출: ' + ev, 3000); return; }
      let args = {};
      try { if (q.args) args = JSON.parse(q.args); } catch (_) {}
      if (m[2] === 'timecard' && !q.args) args = { t: '─── 2년 후 ───', sub: '1817년', from: 1815, to: 1817 };
      if (m[2] === 'caption' && !q.args) args = { t: '제1막 끝', ms: 2200 };
      if (m[2] === 'closeup' && !q.args) args = { who: 'danglars', face: 'smirk', ms: 1400 };
      const r = await fn(args);
      console.info('[scenes] ' + ev + ' 결과', r);
      if (!MC.scene.stack.length) MC.scene.push(ch1.titleScene());      // 연출만 본 뒤 빈 화면으로 남지 않게
      return;
    }
    if (MC.events && MC.events.run) return MC.events.run(ev);
    U.warn('events', 'MC.events.run 없음');
  }

  /* ---------- 시작 ---------- */
  MC.main = function () {
    // 설정(음량·음소거)은 audio가 MC.save.settings를 따라가고, 흔들림은 fx가 읽는다
    resetLook();
    if (MC.cfg.ev || MC.cfg.map) return debugEntry();
    return MC.scene.push(ch1.titleScene());
  };
})(window.MC);

</script>
