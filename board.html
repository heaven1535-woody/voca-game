<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎲 다같이 세계여행 보드게임</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%,#1b2a4a,#0c1526);color:#eaf2ff;min-height:100vh;}
  h1{font-size:18px;text-align:center;margin:8px 0 4px;}
  .wrap{max-width:560px;margin:0 auto;padding:6px 8px 24px;}

  /* board */
  .board{width:min(96vw,540px);aspect-ratio:1;margin:6px auto;display:grid;
    grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:3px;}
  .tile{background:#16233d;border:1px solid #2a3c60;border-radius:7px;position:relative;
    display:flex;flex-direction:column;justify-content:space-between;padding:2px;overflow:hidden;
    font-size:9px;line-height:1.1;min-width:0;}
  .tile .bar{height:7px;border-radius:3px 3px 0 0;margin:-2px -2px 1px;}
  .tile .nm{font-weight:700;font-size:9.5px;word-break:keep-all;}
  .tile .pr{font-size:8px;color:#9fb4d6;}
  .tile .bld{font-size:11px;line-height:1;}
  .tile.corner{background:#22355c;border-color:#3d5580;}
  .tile.corner .big{font-size:20px;text-align:center;}
  .tile.corner .cn{font-size:9px;text-align:center;font-weight:700;}
  .tile.sel{outline:3px solid #ffd24a;outline-offset:-1px;cursor:pointer;animation:blink .8s infinite;}
  @keyframes blink{50%{outline-color:#fff6cf;}}
  .owner{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;border:1px solid #0008;}
  .toks{position:absolute;bottom:1px;left:1px;display:flex;gap:1px;flex-wrap:wrap;max-width:90%;}
  .tok{width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px #000a;
    display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;font-weight:800;}

  /* center */
  .center{grid-column:2/7;grid-row:2/7;background:#0e1a30;border:1px solid #2a3c60;border-radius:10px;
    padding:8px;display:flex;flex-direction:column;gap:6px;overflow:auto;}
  .turn{font-weight:800;font-size:14px;text-align:center;padding:4px;border-radius:8px;}
  .dice{display:flex;gap:8px;justify-content:center;align-items:center;min-height:56px;}
  .die{width:52px;height:52px;background:#fff;border-radius:11px;display:grid;
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;gap:2px;
    box-shadow:0 3px 6px #0007;}
  .die.roll{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-8deg)}75%{transform:translateY(-6px) rotate(8deg)}}
  .pip{border-radius:50%;background:transparent;}
  .pip.on{background:#1a2233;}
  .sum{font-size:20px;font-weight:800;text-align:center;}
  .sub{font-size:12px;text-align:center;color:#bcd0f0;min-height:16px;}
  .money{font-size:11px;line-height:1.5;text-align:center;color:#dfe9ff;}
  .money b{color:#ffd24a;}
  .btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  button{font-family:inherit;border:none;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700;
    cursor:pointer;color:#0c1526;background:#ffd24a;}
  button.g{background:#3ec46d;color:#04240f;}
  button.b{background:#4aa3ff;color:#04203f;}
  button.gray{background:#3a4b6d;color:#cfe0ff;}
  button:active{transform:translateY(1px);}
  .step{display:flex;align-items:center;justify-content:center;gap:10px;}
  .step .v{font-size:24px;font-weight:800;min-width:44px;text-align:center;color:#ffd24a;}
  .step button{width:44px;height:44px;border-radius:50%;font-size:22px;padding:0;}
  .log{font-size:10.5px;color:#9fb4d6;max-height:52px;overflow:auto;line-height:1.4;
    border-top:1px solid #24365a;padding-top:4px;}

  /* overlay */
  .ov{position:fixed;inset:0;background:#050b16ea;display:flex;align-items:center;justify-content:center;
    z-index:20;padding:16px;}
  .card{background:#13223d;border:1px solid #38517f;border-radius:16px;padding:20px;max-width:380px;width:100%;
    text-align:center;box-shadow:0 12px 40px #000a;}
  .card h2{margin:2px 0 6px;font-size:22px;}
  .card p{font-size:13px;color:#c6d6f2;margin:6px 0;}
  .sel-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px;}
  .opt{background:#1d3054;border:2px solid #33507f;border-radius:12px;padding:12px 14px;font-size:15px;
    font-weight:800;cursor:pointer;min-width:64px;}
  .opt.on{background:#ffd24a;color:#0c1526;border-color:#fff;}
  .lbl{font-size:13px;color:#9fb4d6;margin:10px 0 4px;font-weight:700;}
  .toggle{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;margin:8px 0;cursor:pointer;}
  .switch{width:46px;height:26px;border-radius:20px;background:#33507f;position:relative;transition:.15s;}
  .switch.on{background:#3ec46d;}
  .switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;}
  .switch.on i{left:23px;}
  .start-btn{width:100%;margin-top:8px;padding:14px;font-size:17px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 다같이 세계여행 보드게임</h1>
  <div class="board" id="board"></div>
</div>

<!-- SETUP -->
<div class="ov" id="setup">
  <div class="card">
    <h2>🎲 세계여행 보드게임</h2>
    <p>도시를 사고 건물을 지어 통행료로 돈을 버는 게임! 마지막까지 파산하지 않으면 승리해요.</p>
    <div class="lbl">주사위 개수</div>
    <div class="sel-row" id="selDice">
      <div class="opt on" data-d="2">🎲🎲 2개</div>
      <div class="opt" data-d="3">🎲🎲🎲 3개</div>
    </div>
    <div class="lbl">플레이어 수</div>
    <div class="sel-row" id="selPl">
      <div class="opt" data-n="2">2명</div>
      <div class="opt on" data-n="3">3명</div>
      <div class="opt" data-n="4">4명</div>
    </div>
    <div class="toggle" id="guessTog">
      <span>합 맞히기 모드 (아이 덧셈 연습)</span>
      <div class="switch on" id="gsw"><i></i></div>
    </div>
    <p style="font-size:11px;color:#8ea6cc">켜면: 굴리기 전 합을 예상 → 맞히면 그대로+보너스, <b>틀리면 차이만큼 덜 이동</b>.<br>끄면: 모두의 마블처럼 나온 대로 이동 + 더블이면 한 번 더!</p>
    <button class="g start-btn" id="startBtn">게임 시작!</button>
  </div>
</div>

<!-- GAME OVER -->
<div class="ov" id="overOv" style="display:none"><div class="card" id="overCard"></div></div>

<script>
/* ---------------- data ---------------- */
var COLORS=['#ff5a5a','#4aa3ff','#3ec46d','#ffd24a'];
var PNAMES=['빨강','파랑','초록','노랑'];
var PMARK=['1','2','3','4'];
var LVNAME=['땅','빌라','빌딩','호텔','랜드마크'];
var LVICON=['·','🏠','🏢','🏨','🗼'];

// group colors for city bands
var GC={a:'#8ed36b',b:'#5ec8c8',c:'#f5a13a',d:'#c98a5a',e:'#ef7bb0',f:'#6f8bf0',g:'#e06060',h:'#b072e0'};

// 24 tiles, corners at 0,6,12,18
function city(nm,price,grp){return {type:'city',name:nm,price:price,grp:grp,owner:null,lv:0};}
var TILES=[
  {type:'start',name:'출발'},
  city('도쿄',100,'a'), city('베이징',120,'a'),
  {type:'chance',name:'황금열쇠'},
  city('마닐라',140,'b'), city('방콕',160,'b'),
  {type:'island',name:'무인도'},
  city('뉴델리',180,'c'), city('두바이',200,'c'),
  {type:'chance',name:'황금열쇠'},
  city('카이로',220,'d'), city('이스탄불',240,'d'),
  {type:'world',name:'세계여행'},
  city('로마',260,'e'), city('파리',280,'e'),
  {type:'tax',name:'세금'},
  city('런던',320,'f'), city('베를린',340,'f'),
  {type:'space',name:'우주여행'},
  city('뉴욕',380,'g'), city('시드니',400,'g'),
  {type:'chance',name:'황금열쇠'},
  city('리우',440,'h'), city('서울',500,'h')
];
var N=TILES.length; // 24

// derived costs
function tollArr(base){return [Math.round(base*0.1),Math.round(base*0.5),Math.round(base*1.1),Math.round(base*2.0),Math.round(base*3.2)];}
function buildCost(base){return Math.round(base*0.6);}

var CHANCE=[
  {t:'용돈을 받았어요! +200 🪙',f:function(p){p.money+=200;}},
  {t:'생일 축하금! +300 🪙',f:function(p){p.money+=300;}},
  {t:'은행 이자 +150 🪙',f:function(p){p.money+=150;}},
  {t:'병원비 지출 -200 🪙',f:function(p){p.money-=200;}},
  {t:'교통 위반 벌금 -150 🪙',f:function(p){p.money-=150;}},
  {t:'출발지로 이동! 월급 받기',f:function(p){p.pos=0;p.money+=SALARY;}},
  {t:'무인도로 이동! 한 턴 쉼',f:function(p){p.pos=6;p.skip=1;}},
];

var START_MONEY=3000, SALARY=300, TAX=250;

/* ---------------- state ---------------- */
var G={n:3,nd:2,guess:true,cur:0,phase:'ready',dice:[],again:false,over:false,pendIdx:-1,guessVal:7};
var players=[];

/* ---------------- coords ---------------- */
function coords(){var g=7,o=[],c,r;
  for(c=1;c<=g;c++)o.push([1,c]);
  for(r=2;r<=g;r++)o.push([r,g]);
  for(c=g-1;c>=1;c--)o.push([g,c]);
  for(r=g-1;r>=2;r--)o.push([r,1]);
  return o;}
var CO=coords();

/* ---------------- build board ---------------- */
var boardEl=document.getElementById('board');
function buildBoard(){
  boardEl.innerHTML='';
  for(var i=0;i<N;i++){
    var t=TILES[i], pos=CO[i];
    var el=document.createElement('div');
    el.className='tile';
    el.style.gridRow=pos[0]; el.style.gridColumn=pos[1];
    el.dataset.idx=i;
    if(t.type==='city'){
      el.innerHTML='<div class="bar" style="background:'+GC[t.grp]+'"></div>'+
        '<div class="nm">'+t.name+'</div>'+
        '<div class="bld" data-b></div>'+
        '<div class="pr" data-p>🪙'+t.price+'</div>'+
        '<span class="owner" data-o style="display:none"></span>'+
        '<div class="toks" data-tk></div>';
    } else {
      var big={start:'🏁',island:'🏝️',world:'✈️',space:'🚀',chance:'🔑',tax:'💰'}[t.type];
      var cn={start:'출발',island:'무인도',world:'세계여행',space:'우주여행',chance:'황금열쇠',tax:'세금'}[t.type];
      el.className='tile corner';
      el.innerHTML='<div class="big">'+big+'</div><div class="cn">'+cn+'</div>'+
        '<div class="toks" data-tk></div>';
    }
    el.addEventListener('click',onTileClick);
    boardEl.appendChild(el);
  }
  // center panel
  var ctr=document.createElement('div');
  ctr.className='center'; ctr.id='center';
  boardEl.appendChild(ctr);
}

function tileEl(i){return boardEl.querySelector('.tile[data-idx="'+i+'"]');}

/* ---------------- render ---------------- */
function cur(){return players[G.cur];}
function tollOf(t){
  var base=t.price, arr=tollArr(base), toll=arr[t.lv];
  // line bonus: owner owns both cities in group
  var mates=TILES.filter(function(x){return x.type==='city'&&x.grp===t.grp;});
  var allSame=mates.every(function(x){return x.owner===t.owner;});
  if(allSame) toll=Math.round(toll*2);
  return toll;
}
function renderTiles(){
  for(var i=0;i<N;i++){
    var t=TILES[i], el=tileEl(i);
    if(t.type==='city'){
      var o=el.querySelector('[data-o]'), b=el.querySelector('[data-b]'), pr=el.querySelector('[data-p]');
      if(t.owner===null){o.style.display='none'; b.textContent=''; pr.textContent='🪙'+t.price;}
      else{o.style.display='block'; o.style.background=COLORS[t.owner];
        b.textContent=LVICON[t.lv]==='·'?'':LVICON[t.lv];
        pr.textContent='통행료 '+tollOf(t);}
      el.classList.toggle('sel', G.phase==='select');
    }
  }
  renderTokens();
}
function renderTokens(){
  boardEl.querySelectorAll('[data-tk]').forEach(function(x){x.innerHTML='';});
  for(var p=0;p<players.length;p++){
    var pl=players[p]; if(!pl.alive) continue;
    var host=tileEl(pl.pos).querySelector('[data-tk]');
    var d=document.createElement('div'); d.className='tok';
    d.style.background=COLORS[p]; d.textContent=PMARK[p];
    host.appendChild(d);
  }
}
function pipDie(v,rolling){
  var map={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
  var s='<div class="die'+(rolling?' roll':'')+'">';
  for(var i=1;i<=9;i++){s+='<span class="pip'+(map[v].indexOf(i)>=0?' on':'')+'"></span>';}
  return s+'</div>';
}
function money(p){return '🪙'+p.money;}
function moneyList(){
  return players.map(function(p,i){
    return '<span style="color:'+COLORS[i]+'">●</span> '+PNAMES[i]+' <b>'+p.money+'</b>'+(p.alive?'':' (파산)');
  }).join('&nbsp;&nbsp;');
}
var logs=[];
function log(m){logs.unshift(m); if(logs.length>6)logs.pop();}

function renderCenter(){
  var c=document.getElementById('center'); if(!c) return;
  var p=cur();
  var html='<div class="turn" style="background:'+COLORS[G.cur]+'33;border:1px solid '+COLORS[G.cur]+'">'+
    '<span style="color:'+COLORS[G.cur]+'">●</span> '+PNAMES[G.cur]+' 차례</div>';

  // dice display
  var dh='';
  if(G.dice.length){ dh=G.dice.map(function(v){return pipDie(v,false);}).join(''); }
  else { dh=pipDie(1,false).replace('die','die').replace(/pip on/g,'pip'); }
  html+='<div class="dice">'+dh+'</div>';

  if(G.phase==='ready'){
    var sum=G.dice.length?G.dice.reduce(function(a,b){return a+b;},0):0;
    if(G.guess){
      var lo=G.nd*1, hi=G.nd*6;
      if(G.guessVal<lo)G.guessVal=lo; if(G.guessVal>hi)G.guessVal=hi;
      html+='<div class="sub">합을 예상해봐요! ('+lo+'~'+hi+')</div>';
      html+='<div class="step"><button class="gray" id="gm">−</button><span class="v" id="gv">'+G.guessVal+'</span><button class="gray" id="gp">＋</button></div>';
    }
    html+='<div class="btns"><button class="g" id="rollBtn">🎲 굴리기!</button></div>';
  } else if(G.phase==='result'){
    var sum2=G.dice.reduce(function(a,b){return a+b;},0);
    html+='<div class="sum">합 '+sum2+'</div><div class="sub" id="rmsg">'+(G.rmsg||'')+'</div>';
    html+='<div class="btns"><button class="g" id="contBtn">계속</button></div>';
  } else if(G.phase==='action'){
    var t=TILES[G.pendIdx];
    var sum3=G.dice.reduce(function(a,b){return a+b;},0);
    html+='<div class="sub"><b>'+t.name+'</b></div>';
    if(t.owner===null){
      html+='<div class="sub">이 도시를 살까요? (🪙'+t.price+')</div>';
      html+='<div class="btns"><button class="g" id="buyBtn">구매 🪙'+t.price+'</button><button class="gray" id="passBtn">통과</button></div>';
    } else {
      html+='<div class="sub">'+LVNAME[t.lv]+' → '+LVNAME[t.lv+1]+' 건설? (🪙'+buildCost(t.price)+')</div>';
      html+='<div class="btns"><button class="b" id="bldBtn">건설 🪙'+buildCost(t.price)+'</button><button class="gray" id="passBtn">통과</button></div>';
    }
  } else if(G.phase==='select'){
    html+='<div class="sub">✈️ 세계여행! 가고 싶은 도시를<br>보드에서 눌러요.</div>';
  } else if(G.phase==='moving'){
    html+='<div class="sub">이동 중...</div>';
  }

  html+='<div class="money">'+moneyList()+'</div>';
  html+='<div class="btns" style="margin-top:2px"><button class="gray" id="endBtn" style="font-size:11px;padding:5px 8px">순위·종료</button></div>';
  html+='<div class="log">'+logs.map(function(l){return '· '+l;}).join('<br>')+'</div>';
  c.innerHTML=html;
  wire();
}
function renderAll(){renderTiles();renderCenter();}

/* ---------------- wiring ---------------- */
function wire(){
  var q=function(id){return document.getElementById(id);};
  if(q('rollBtn'))q('rollBtn').onclick=roll;
  if(q('gm'))q('gm').onclick=function(){G.guessVal--;renderCenter();};
  if(q('gp'))q('gp').onclick=function(){G.guessVal++;renderCenter();};
  if(q('contBtn'))q('contBtn').onclick=function(){afterResult();};
  if(q('buyBtn'))q('buyBtn').onclick=function(){doBuy();};
  if(q('bldBtn'))q('bldBtn').onclick=function(){doBuild();};
  if(q('passBtn'))q('passBtn').onclick=function(){finish();};
  if(q('endBtn'))q('endBtn').onclick=function(){gameOver(true);};
}

/* ---------------- turn logic ---------------- */
function roll(){
  if(G.phase!=='ready')return;
  var d=[];
  for(var i=0;i<G.nd;i++)d.push(1+Math.floor(Math.random()*6));
  G.dice=d;
  var sum=d.reduce(function(a,b){return a+b;},0);
  // rolling animation
  var c=document.getElementById('center');
  c.querySelector('.dice').innerHTML=d.map(function(v){return pipDie(v,true);}).join('');
  // doubles (non-guess, 2 dice)
  G.again=(!G.guess && G.nd===2 && d[0]===d[1]);
  var move, msg;
  if(G.guess){
    var diff=Math.abs(G.guessVal-sum);
    if(diff===0){move=sum; cur().money+=100; msg='정답! 🎉 '+sum+'칸 이동 + 보너스 🪙100';}
    else{move=Math.max(0,sum-diff); msg='아쉽! 예상 '+G.guessVal+', 합 '+sum+' → 차이 '+diff+'만큼 덜 가서 '+move+'칸';}
  } else {
    move=sum; msg=(G.again?'더블! 🎉 ':'')+sum+'칸 이동';
  }
  G.moveN=move; G.rmsg=msg; G.phase='result';
  setTimeout(renderCenter,380);
}
function afterResult(){
  var steps=G.moveN;
  if(steps<=0){ log(cur().name+': 이동 없음'); return finish(); }
  animateMove(steps);
}
function animateMove(steps){
  G.phase='moving'; renderCenter();
  var p=cur(), i=0;
  var t=setInterval(function(){
    p.pos=(p.pos+1)%N;
    if(p.pos===0){p.money+=SALARY; log('출발 통과! 월급 +'+SALARY);}
    renderTokens(); i++;
    if(i>=steps){clearInterval(t); resolve(p.pos);}
  },160);
}
function resolve(idx){
  var t=TILES[idx], p=cur();
  if(t.type==='start'){p.money+=SALARY; log('출발 도착! +'+SALARY); return finish();}
  if(t.type==='tax'){p.money-=TAX; log('세금 -'+TAX); checkBust(p); return finish();}
  if(t.type==='island'){p.skip=1; log('🏝️ 무인도 도착! 다음 턴 쉼'); return finish();}
  if(t.type==='space'){p.money+=200; G.again=true; log('🚀 우주여행! +200, 한 번 더!'); return finish();}
  if(t.type==='world'){log('✈️ 세계여행! 갈 곳 선택'); G.phase='select'; renderAll(); return;}
  if(t.type==='chance'){
    var c=CHANCE[Math.floor(Math.random()*CHANCE.length)];
    c.f(p); log('🔑 '+c.t); checkBust(p); renderTokens();
    // chance may move player; if moved to a city we don't re-resolve (keep simple)
    return finish();
  }
  if(t.type==='city'){
    if(t.owner===null){
      if(p.money>=t.price){ G.pendIdx=idx; G.phase='action'; renderCenter(); }
      else{ log(t.name+': 돈이 부족해 구매 불가'); finish(); }
    } else if(t.owner===G.cur){
      if(t.lv<4 && p.money>=buildCost(t.price)){ G.pendIdx=idx; G.phase='action'; renderCenter(); }
      else{ log(t.name+': 내 도시 (건설 불가/최대)'); finish(); }
    } else {
      var toll=tollOf(t), owner=players[t.owner];
      p.money-=toll; owner.money+=toll;
      log(t.name+' 통행료 '+toll+' → '+PNAMES[t.owner]);
      checkBust(p); finish();
    }
  }
}
function doBuy(){
  var t=TILES[G.pendIdx], p=cur();
  p.money-=t.price; t.owner=G.cur; t.lv=0;
  log(p.name+'이(가) '+t.name+' 구매!');
  finish();
}
function doBuild(){
  var t=TILES[G.pendIdx], p=cur();
  p.money-=buildCost(t.price); t.lv++;
  log(t.name+'에 '+LVNAME[t.lv]+' 건설!');
  finish();
}
function onTileClick(e){
  if(G.phase!=='select')return;
  var idx=+e.currentTarget.dataset.idx;
  var t=TILES[idx];
  if(t.type!=='city'){log('도시만 선택할 수 있어요');return;}
  cur().pos=idx; renderTokens();
  G.phase='resolving';
  resolve(idx);
}
function finish(){
  renderAll();
  if(G.over)return;
  if(aliveCount()<=1)return gameOver(false);
  if(G.again){ G.again=false; G.phase='ready'; G.dice=[]; log('➡️ 한 번 더!'); renderCenter(); return; }
  endTurn();
}
function endTurn(){
  var guard=0;
  do{ G.cur=(G.cur+1)%G.n; guard++; }while(!players[G.cur].alive && guard<20);
  var p=cur();
  if(p.skip>0){ p.skip--; log(PNAMES[G.cur]+' 쉬는 턴'); if(guard<40)return endTurn(); }
  G.phase='ready'; G.dice=[]; renderCenter();
}
function aliveCount(){return players.filter(function(p){return p.alive;}).length;}
function checkBust(p){
  if(p.money<0){
    p.alive=false;
    log('💥 '+p.name+' 파산!');
    for(var i=0;i<N;i++){ if(TILES[i].type==='city'&&TILES[i].owner===players.indexOf(p)){TILES[i].owner=null;TILES[i].lv=0;} }
  }
}
function netWorth(p){
  var w=p.money, idx=players.indexOf(p);
  for(var i=0;i<N;i++){var t=TILES[i]; if(t.type==='city'&&t.owner===idx){w+=t.price+buildCost(t.price)*t.lv;}}
  return w;
}
function gameOver(manual){
  G.over=true;
  var rank=players.slice().sort(function(a,b){
    if(a.alive!==b.alive)return a.alive?-1:1;
    return netWorth(b)-netWorth(a);
  });
  var win=rank[0];
  var rows=rank.map(function(p,i){
    var idx=players.indexOf(p);
    return '<p><b>'+(i+1)+'위</b> <span style="color:'+COLORS[idx]+'">●</span> '+PNAMES[idx]+
      ' — 자산 🪙'+netWorth(p)+(p.alive?'':' (파산)')+'</p>';
  }).join('');
  document.getElementById('overCard').innerHTML=
    '<h2>🏆 '+PNAMES[players.indexOf(win)]+' 승리!</h2>'+rows+
    '<button class="g start-btn" onclick="location.reload()">다시 하기</button>';
  document.getElementById('overOv').style.display='flex';
}

/* ---------------- setup ---------------- */
document.getElementById('selDice').addEventListener('click',function(e){
  var o=e.target.closest('.opt'); if(!o)return;
  this.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on');});
  o.classList.add('on'); G.nd=+o.dataset.d;
});
document.getElementById('selPl').addEventListener('click',function(e){
  var o=e.target.closest('.opt'); if(!o)return;
  this.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on');});
  o.classList.add('on'); G.n=+o.dataset.n;
});
document.getElementById('guessTog').addEventListener('click',function(){
  G.guess=!G.guess;
  document.getElementById('gsw').classList.toggle('on',G.guess);
});
document.getElementById('startBtn').addEventListener('click',function(){
  players=[];
  for(var i=0;i<G.n;i++)players.push({name:PNAMES[i],money:START_MONEY,pos:0,alive:true,skip:0});
  G.cur=0; G.phase='ready'; G.dice=[]; G.over=false; G.guessVal=G.nd;
  document.getElementById('setup').style.display='none';
  buildBoard(); renderAll();
});

buildBoard();
</script>
</body>
