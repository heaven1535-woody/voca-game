<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>둥지 디펜스 — 지텔프 보카</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#1a1420;color:#fff4d6;font-family:'DungGeunMo','Galmuri',ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;min-height:100%;overflow:hidden;position:fixed;inset:0}
#wrap{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column}
.hud{display:flex;gap:5px;padding:7px 8px;align-items:center;flex-wrap:wrap;background:#140f1c;border-bottom:3px solid #000}
.tag{background:#3a2f47;border:2px solid #000;border-radius:4px;padding:3px 7px;font-size:12px;display:flex;gap:4px;align-items:center;line-height:1}
.tag b{color:#ffcf3f}
.tag.nest b{color:#7be08f}
.title{flex:1;font-size:14px;color:#e6a8ff;text-shadow:2px 2px 0 #000;min-width:110px}
#scene{flex:1;position:relative;background:#241a30}
#cv{width:100%;height:100%;display:block}
.banner{position:absolute;top:6px;left:6px;right:6px;background:rgba(20,15,28,.85);border:2px solid #000;border-radius:5px;padding:6px 8px;font-size:12px;color:#ffe9a8}
.banner b{color:#ffcf3f}
.dock{padding:8px;display:flex;gap:8px;background:#140f1c;border-top:3px solid #000}
.btn{flex:1;background:#ffcf3f;color:#2b2233;border:2px solid #000;border-radius:6px;padding:12px;font-family:inherit;font-size:15px;font-weight:bold;box-shadow:0 4px 0 #a8791b;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8791b}
.btn.go{background:#e35d5d;box-shadow:0 4px 0 #9c2f2f;color:#fff}
.btn.go:active{box-shadow:0 1px 0 #9c2f2f}
.btn.mute{flex:0 0 46px;font-size:18px;padding:12px 0}
.btn:disabled{background:#6a6072;box-shadow:0 4px 0 #3f3947;color:#c9c2d4;cursor:default}
.overlay{position:absolute;inset:0;background:rgba(10,7,15,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.card{width:100%;max-width:440px;background:#fff4d6;color:#2b2233;border:3px solid #000;border-radius:10px;box-shadow:0 8px 0 rgba(0,0,0,.4);padding:16px;max-height:94%;overflow:auto}
.card h3{font-size:15px;color:#7a5a2a;margin-bottom:6px}
.duelhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.duelhead .who{font-size:12px;font-weight:bold}
.hearts{font-size:13px;letter-spacing:1px}
.bubble{position:relative;background:#fffdf5;border:2px solid #000;border-radius:10px;padding:12px 10px;margin:6px 0 12px}
.bubble:after{content:'';position:absolute;left:26px;bottom:-9px;width:0;height:0;border:8px solid transparent;border-top-color:#000;border-bottom:0}
.qword{font-size:30px;font-weight:bold;text-align:center}
.qsub{text-align:center;font-size:11px;color:#8a7a55;margin-top:2px}
.trow{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.tbar{flex:1;height:14px;background:#0d0a12;border:2px solid #000;border-radius:7px;overflow:hidden}
.tfill{height:100%;width:100%;background:#3fa74a;transition:background .1s}
.tnum{font-size:15px;font-weight:bold;color:#2b2233;min-width:52px;text-align:right}
.tnum.warn{color:#c23b3b}
.opt{display:block;width:100%;background:#fffdf5;border:2px solid #000;border-radius:7px;padding:12px;font-family:inherit;font-size:16px;margin-bottom:8px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);text-align:center}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.opt.ok{background:#bff0c4;border-color:#2f8f3a}
.opt.bad{background:#ffc9c9;border-color:#c23b3b}
.fb{text-align:center;font-size:14px;font-weight:bold;min-height:20px;margin-top:2px}
.center{text-align:center}
.big{font-size:44px;text-align:center;margin:4px 0}
.grade{font-size:50px;font-weight:bold;text-align:center;text-shadow:2px 2px 0 rgba(0,0,0,.2)}
.shopitem{display:flex;align-items:center;gap:10px;background:#fffdf5;border:2px solid #000;border-radius:7px;padding:9px;margin-bottom:8px}
.shopitem .ic{font-size:24px;width:30px;text-align:center}
.shopitem .info{flex:1}
.shopitem .t{font-size:14px;font-weight:bold}
.shopitem .d{font-size:11px;color:#8a7a55;line-height:1.4}
.buy{background:#ffcf3f;border:2px solid #000;border-radius:6px;padding:8px 10px;font-family:inherit;font-weight:bold;font-size:13px;box-shadow:0 3px 0 #a8791b;cursor:pointer;white-space:nowrap}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #a8791b}
.buy:disabled{background:#d9cfb5;box-shadow:0 3px 0 #9c927a;color:#7c745f;cursor:default}
.buy.rm{background:#e59a9a;box-shadow:0 3px 0 #a85a5a}
.x{float:right;background:#e35d5d;color:#fff;border:2px solid #000;border-radius:6px;width:30px;height:30px;font-family:inherit;font-weight:bold;cursor:pointer}
.small{font-size:11px;color:#8a7a55;text-align:center;margin-top:6px;line-height:1.5}
.toast{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);background:#2b2233;color:#ffcf3f;border:2px solid #000;border-radius:20px;padding:8px 16px;font-size:13px;z-index:30;opacity:0;transition:.25s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}
.hint{position:absolute;bottom:8px;left:8px;right:8px;text-align:center;font-size:11px;color:#c9b6e0;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <div class="hud">
    <div class="title">🐉 우리 둥지</div>
    <div class="tag nest">🏠 <b id="nest">10</b>/10</div>
    <div class="tag">🪙 <b id="coins">0</b></div>
    <div class="tag">🌊 <b id="wave">1</b>/5</div>
  </div>
  <div id="scene">
    <canvas id="cv" width="320" height="160"></canvas>
    <div class="banner" id="banner">빈 칸을 눌러 몬스터를 배치한 뒤, 웨이브를 시작하세요.</div>
    <div class="hint" id="hint">배치 단계 · 통로 칸을 탭해서 몬스터를 세우세요</div>
  </div>
  <div class="dock">
    <button class="btn" id="placeBtn" onclick="openPickerHint()">🐲 배치 도움말</button>
    <button class="btn go" id="waveBtn" onclick="startWave()">▶ 웨이브 시작</button>
    <button class="btn mute" id="muteBtn" onclick="toggleMute()">🔊</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const WORDS=[{"w":"access","k":"접근","lv":"academic"},{"w":"addition","k":"추가","lv":"core"},{"w":"rigid","k":"엄격한","lv":"academic"},{"w":"notion","k":"개념","lv":"academic"},{"w":"implement","k":"시행하다","lv":"academic"},{"w":"grant","k":"부여하다, 수여하다","lv":"academic"},{"w":"communicate","k":"의사소통하다","lv":"academic"},{"w":"promise","k":"약속","lv":"plus"},{"w":"indicate","k":"나타내다","lv":"academic"},{"w":"fund","k":"자금","lv":"academic"},{"w":"team","k":"팀","lv":"academic"},{"w":"population","k":"인구","lv":"core"},{"w":"equip","k":"갖추다","lv":"academic"},{"w":"organize","k":"조직하다","lv":"plus"},{"w":"principle","k":"원칙","lv":"academic"},{"w":"commission","k":"위원회","lv":"academic"},{"w":"isolate","k":"고립시키다","lv":"academic"},{"w":"design","k":"설계","lv":"academic"},{"w":"available","k":"이용 가능한","lv":"academic"},{"w":"maintain","k":"유지하다","lv":"academic"},{"w":"percent","k":"퍼센트","lv":"academic"},{"w":"create","k":"창조하다","lv":"academic"},{"w":"blood","k":"피","lv":"plus"},{"w":"federal","k":"연방의","lv":"academic"},{"w":"abstract","k":"추상적인","lv":"academic"},{"w":"decline","k":"감소하다","lv":"academic"},{"w":"pause","k":"멈춤, 중지","lv":"core"},{"w":"adjust","k":"조정하다","lv":"academic"},{"w":"assign","k":"할당하다","lv":"academic"},{"w":"insert","k":"삽입하다","lv":"academic"},{"w":"executive","k":"임원","lv":"plus"},{"w":"quote","k":"인용하다","lv":"academic"},{"w":"responsible","k":"책임이 있는","lv":"plus"},{"w":"statement","k":"진술","lv":"plus"},{"w":"ultimate","k":"궁극적인","lv":"academic"},{"w":"finite","k":"유한한","lv":"academic"},{"w":"exploit","k":"이용하다","lv":"academic"},{"w":"argument","k":"논쟁","lv":"plus"},{"w":"trend","k":"경향","lv":"academic"},{"w":"welfare","k":"복지","lv":"academic"},{"w":"imply","k":"암시하다","lv":"academic"},{"w":"orient","k":"지향하게 하다","lv":"academic"},{"w":"weight","k":"무게","lv":"plus"},{"w":"credit","k":"공로","lv":"academic"},{"w":"secure","k":"안전한","lv":"academic"},{"w":"substitute","k":"대체하다","lv":"academic"},{"w":"adult","k":"성인","lv":"academic"},{"w":"input","k":"투입, 입력","lv":"academic"},{"w":"extract","k":"추출하다","lv":"academic"},{"w":"presume","k":"추정하다, 가정하다","lv":"academic"},{"w":"logic","k":"논리","lv":"academic"},{"w":"notwithstanding","k":"~에도 불구하고","lv":"academic"},{"w":"attain","k":"달성하다","lv":"academic"},{"w":"distinct","k":"뚜렷한","lv":"academic"},{"w":"factor","k":"요인","lv":"academic"},{"w":"integrate","k":"통합하다","lv":"academic"},{"w":"component","k":"구성 요소","lv":"academic"},{"w":"abandon","k":"버리다","lv":"academic"},{"w":"overall","k":"전반적인","lv":"academic"},{"w":"express","k":"표현하다","lv":"plus"},{"w":"volume","k":"양","lv":"academic"},{"w":"initiate","k":"시작하다, 착수하다","lv":"academic"},{"w":"energy","k":"에너지","lv":"academic"},{"w":"strike","k":"치다","lv":"plus"},{"w":"albeit","k":"비록 ~일지라도","lv":"academic"},{"w":"phenomenon","k":"현상","lv":"academic"},{"w":"assess","k":"평가하다","lv":"academic"},{"w":"discriminate","k":"차별하다","lv":"academic"},{"w":"relevant","k":"관련 있는","lv":"academic"},{"w":"controversy","k":"논란","lv":"academic"},{"w":"incentive","k":"유인, 동기","lv":"academic"},{"w":"visible","k":"보이는","lv":"academic"},{"w":"complement","k":"보완물","lv":"academic"},{"w":"theme","k":"주제","lv":"academic"},{"w":"aspect","k":"측면","lv":"academic"},{"w":"illustrate","k":"설명하다","lv":"academic"},{"w":"prior","k":"이전의","lv":"academic"},{"w":"involve","k":"포함하다","lv":"academic"},{"w":"diverse","k":"다양한","lv":"academic"},{"w":"director","k":"이사","lv":"core"},{"w":"relation","k":"관계","lv":"plus"},{"w":"exercise","k":"운동","lv":"plus"},{"w":"injure","k":"부상을 입히다","lv":"academic"},{"w":"status","k":"지위","lv":"academic"},{"w":"particularly","k":"특히","lv":"core"},{"w":"negative","k":"부정적인","lv":"plus"},{"w":"estate","k":"재산","lv":"academic"},{"w":"virtual","k":"가상의","lv":"academic"},{"w":"confer","k":"상의하다","lv":"academic"},{"w":"recognize","k":"인식하다","lv":"core"},{"w":"debate","k":"토론","lv":"academic"},{"w":"dollar","k":"달러 (화폐 단위)","lv":"plus"},{"w":"anticipate","k":"예상하다","lv":"academic"},{"w":"nevertheless","k":"그럼에도 불구하고","lv":"academic"},{"w":"message","k":"메시지","lv":"plus"},{"w":"cycle","k":"주기","lv":"academic"},{"w":"acknowledge","k":"인정하다","lv":"academic"},{"w":"foundation","k":"기초","lv":"academic"},{"w":"define","k":"정의하다","lv":"academic"},{"w":"perceive","k":"인지하다","lv":"academic"},{"w":"undergo","k":"겪다","lv":"academic"},{"w":"officer","k":"장교","lv":"plus"},{"w":"correct","k":"정확한","lv":"plus"},{"w":"induce","k":"유도하다","lv":"academic"},{"w":"imagine","k":"상상하다","lv":"plus"},{"w":"institute","k":"기관","lv":"academic"},{"w":"displace","k":"대체하다","lv":"academic"},{"w":"ability","k":"능력","lv":"plus"},{"w":"somebody","k":"누군가","lv":"plus"},{"w":"perspective","k":"관점","lv":"academic"},{"w":"hierarchy","k":"위계","lv":"academic"},{"w":"recommend","k":"추천하다","lv":"plus"},{"w":"route","k":"경로","lv":"academic"},{"w":"notice","k":"알아차리다","lv":"core"},{"w":"refine","k":"정제하다","lv":"academic"},{"w":"bias","k":"편견","lv":"academic"},{"w":"manipulate","k":"조작하다","lv":"academic"},{"w":"job","k":"직업","lv":"academic"},{"w":"prefer","k":"선호하다","lv":"plus"},{"w":"trouble","k":"문제","lv":"plus"},{"w":"promote","k":"촉진하다","lv":"academic"},{"w":"replace","k":"교체하다","lv":"plus"},{"w":"plus","k":"더하기","lv":"academic"},{"w":"pattern","k":"양식","lv":"plus"},{"w":"commit","k":"저지르다","lv":"academic"},{"w":"financial","k":"재정의","lv":"core"},{"w":"expert","k":"전문가","lv":"academic"},{"w":"coherent","k":"일관된","lv":"academic"},{"w":"speech","k":"연설","lv":"plus"},{"w":"directly","k":"직접","lv":"plus"},{"w":"quickly","k":"빨리","lv":"plus"},{"w":"myself","k":"나 자신","lv":"core"},{"w":"heart","k":"심장","lv":"core"},{"w":"accompany","k":"동반하다","lv":"academic"},{"w":"monitor","k":"감시하다","lv":"academic"},{"w":"immediately","k":"즉시","lv":"plus"},{"w":"alter","k":"바꾸다","lv":"academic"},{"w":"exactly","k":"정확히","lv":"core"},{"w":"sector","k":"부문","lv":"academic"},{"w":"investment","k":"투자","lv":"plus"}];
const LS='vocadungeon_v1';
const NEST_MAX=10, LANE=5;
const MONS=[
  {id:'slime', nm:'슬라임', em:'🟢', hp:1, atk:1, cost:8,  uw:1, d:'체력1 · 정답당 용사 -1'},
  {id:'goblin',nm:'고블린', em:'👺', hp:1, atk:2, cost:16, uw:2, d:'체력1 · 정답당 용사 -2 (빠른 처치)'},
  {id:'orc',   nm:'오크',   em:'👹', hp:2, atk:2, cost:28, uw:3, d:'체력2 · 정답당 용사 -2'},
  {id:'golem', nm:'골렘',   em:'🗿', hp:3, atk:3, cost:48, uw:4, d:'체력3 · 정답당 용사 -3 (요충지용)'},
];
function mon(id){return MONS.find(m=>m.id===id);}
const HEROES={
  squire:{nm:'견습병', em:'🧑\u200d🌾', hp:1, time:4,   power:1, coin:6,  col:'#8bd88b'},
  soldier:{nm:'병사',  em:'💂', hp:1, time:3,   power:1, coin:9,  col:'#7fb0ff'},
  knight:{nm:'기사',   em:'🛡️', hp:2, time:2,   power:2, coin:15, col:'#e6c05a'},
  champ:{nm:'정예병',  em:'⚔️', hp:3, time:1,   power:3, coin:26, col:'#e6802a'},
  boss:{nm:'마왕급 용사',em:'👑', hp:4, time:0.5, power:5, coin:70, col:'#e35d5d'},
};
const WAVES=[
  ['squire','squire','squire'],
  ['squire','soldier','squire','soldier'],
  ['soldier','soldier','soldier','knight'],
  ['knight','knight','champ'],
  ['champ','champ','boss'],
];
let G={coins:24,nest:NEST_MAX,wave:0,cleared:false,over:false,muted:false,miss:{},placed:new Array(LANE).fill(null)};
function save(){try{localStorage.setItem(LS,JSON.stringify(G));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s){Object.assign(G,s);if(!Array.isArray(G.placed)||G.placed.length!==LANE)G.placed=new Array(LANE).fill(null);}}catch(e){}}

/* ---------- geometry ---------- */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const NESTX=24, SLOT0=64, SLOTW=48, SPAWNX=328;
function slotX(i){return SLOT0+i*SLOTW;}
function unlockedMons(){return MONS.filter(m=>m.uw<=G.wave+1);}

/* ---------- sound ---------- */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(fr,du,ty,vo){if(G.muted)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=ty||'square';o.frequency.value=fr;g.gain.value=vo||0.05;o.connect(g);g.connect(c.destination);const t=c.currentTime;o.start(t);g.gain.setValueAtTime(vo||0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+du);o.stop(t+du+0.02);}
function sfx(k){if(G.muted)return;if(k==='ok'){beep(660,0.08);setTimeout(()=>beep(990,0.09),60);}else if(k==='hit'){beep(1320,0.05,'square',0.04);}else if(k==='bad'){beep(160,0.18,'sawtooth',0.05);}else if(k==='die'){beep(220,0.12,'square',0.05);setTimeout(()=>beep(110,0.16,'sawtooth',0.05),90);}else if(k==='win'){[392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.14,'square',0.05),i*110));}else if(k==='lose'){[440,330,220,160].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'sawtooth',0.05),i*140));}}
function toggleMute(){G.muted=!G.muted;document.getElementById('muteBtn').textContent=G.muted?'🔇':'🔊';save();}

/* ---------- HUD ---------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}
function hud(){
  document.getElementById('nest').textContent=G.nest;
  document.getElementById('coins').textContent=G.coins;
  document.getElementById('wave').textContent=Math.min(G.wave+1,WAVES.length);
  document.getElementById('waveBtn').disabled=running||G.over||G.cleared;
  save();
}

/* ---------- spaced repetition pick ---------- */
let recent=[];
function markMiss(w){G.miss[w]=Math.min(9,(G.miss[w]||0)+2);}
function markHit(w){if(G.miss[w])G.miss[w]=Math.max(0,G.miss[w]-1);}
function pickWords(n,ex){const out=[],seen=new Set(ex?[ex]:[]);let g=0;while(out.length<n&&g++<400){const w=WORDS[Math.random()*WORDS.length|0];if(!seen.has(w.k)){seen.add(w.k);out.push(w);}}return out;}
function pickQuestion(){
  const gap=Math.min(3,WORDS.length-1);
  const cand=WORDS.filter(w=>!recent.includes(w.w));
  const list=cand.length?cand:WORDS;
  let total=0;const wt=list.map(w=>{const v=1+(G.miss[w.w]||0)*3;total+=v;return v;});
  let r=Math.random()*total,idx=list.length-1;
  for(let i=0;i<list.length;i++){r-=wt[i];if(r<=0){idx=i;break;}}
  const w=list[idx];recent.push(w.w);if(recent.length>gap)recent.shift();return w;
}

/* ---------- render ---------- */
let heroes=[],running=false,spawnQ=[],spawnT=0,anim=0,pops=[];
function draw(){
  cx.clearRect(0,0,320,160);
  // dungeon bg
  cx.fillStyle='#241a30';cx.fillRect(0,0,320,160);
  cx.fillStyle='#2f2340';cx.fillRect(0,0,320,26);
  // brick top
  cx.fillStyle='#3a2c4d';for(let x=0;x<320;x+=24){cx.fillRect(x+2,4,20,8);cx.fillRect(x+14,14,20,8);}
  // lane
  cx.fillStyle='#4a3a2a';cx.fillRect(0,96,320,44);
  cx.fillStyle='#5a4630';cx.fillRect(0,96,320,4);
  cx.fillStyle='#3a2d1f';cx.fillRect(0,136,320,4);
  // slots
  for(let i=0;i<LANE;i++){const x=slotX(i);
    cx.fillStyle=(placing? '#6a5a3a':'#40331f');cx.fillRect(x-18,100,36,34);
    cx.strokeStyle=placing?'#ffcf3f':'#2a2013';cx.lineWidth=2;cx.strokeRect(x-18,100,36,34);
    const p=G.placed[i];
    if(p){const m=mon(p.mid);cx.font='22px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(m.em,x,116);
      // hp pips
      cx.font='9px monospace';cx.fillStyle='#ff6b6b';let s='';for(let h=0;h<p.hp;h++)s+='♥';cx.fillStyle='#e35d5d';cx.fillText(s||' ',x,132);
    } else if(placing){cx.fillStyle='#ffcf3f';cx.font='16px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('＋',x,117);}
  }
  // nest (left)
  cx.font='26px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🐉',NESTX,112);
  cx.font='11px monospace';cx.fillStyle='#7be08f';cx.fillText('🥚'+G.nest,NESTX,134);
  // heroes
  for(const h of heroes){const H=HEROES[h.k];
    cx.font='20px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(H.em,h.x,114);
    cx.font='8px monospace';cx.fillStyle=H.col;let s='';for(let i=0;i<h.hp;i++)s+='▮';cx.fillText(s,h.x,100);
  }
  // pops
  pops=pops.filter(p=>p.life>0);cx.textAlign='center';
  for(const p of pops){p.y-=0.6;p.life-=0.02;cx.globalAlpha=Math.max(0,p.life);cx.font='bold 12px monospace';cx.fillStyle='#000';cx.fillText(p.t,p.x+1,p.y+1);cx.fillStyle=p.c;cx.fillText(p.t,p.x,p.y);}
  cx.globalAlpha=1;
  requestAnimationFrame(draw);
}
function pop(t,c,x){pops.push({t,c:c||'#ffcf3f',x:x||160,y:88,life:1});}

/* ---------- placement ---------- */
let placing=true;
cv.addEventListener('click',ev=>{
  if(!placing||running||duel)return;
  const r=cv.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*320;const py=(ev.clientY-r.top)/r.height*160;
  if(py<96||py>140)return;
  let best=-1,bd=999;for(let i=0;i<LANE;i++){const d=Math.abs(px-slotX(i));if(d<bd){bd=d;best=i;}}
  if(best>=0&&bd<24)openPicker(best);
});
function openPickerHint(){toast('통로의 빈 칸(＋)을 탭하면 배치 창이 열립니다');}
function openPicker(i){
  const cur=G.placed[i];
  const items=unlockedMons().map(m=>{
    const dis=G.coins<m.cost;
    return `<div class="shopitem"><div class="ic">${m.em}</div><div class="info"><div class="t">${m.nm}</div><div class="d">${m.d}</div></div>
      <button class="buy" ${dis?'disabled':''} onclick="placeMon(${i},'${m.id}')">🪙 ${m.cost}</button></div>`;
  }).join('');
  const rm=cur?`<button class="buy rm" onclick="removeMon(${i})">치우기 (환불 🪙${Math.floor(mon(cur.mid).cost/2)})</button>`:'';
  const ov=document.createElement('div');ov.className='overlay';ov.id='ov';
  ov.innerHTML=`<div class="card"><button class="x" onclick="closeOv()">✕</button>
    <h3>🐲 ${i+1}번 칸에 배치 &nbsp;🪙 ${G.coins}</h3>
    ${cur?`<div class="small">현재: ${mon(cur.mid).em} ${mon(cur.mid).nm} · 교체하려면 새로 선택</div>`:''}
    ${items}
    <div class="center" style="margin-top:4px">${rm}</div>
    <div class="small">해금: 웨이브를 깰수록 더 강한 몬스터가 열립니다. 지금 웨이브 ${G.wave+1} 기준.</div></div>`;
  closeOv();document.getElementById('scene').appendChild(ov);
}
function placeMon(i,id){const m=mon(id);if(G.coins<m.cost)return;
  if(G.placed[i])G.coins+=Math.floor(mon(G.placed[i].mid).cost/2); // 교체 시 기존 환불
  G.coins-=m.cost;G.placed[i]={mid:id,hp:m.hp};sfx('hit');toast(m.em+' '+m.nm+' 배치!');closeOv();hud();
}
function removeMon(i){const c=G.placed[i];if(!c)return;G.coins+=Math.floor(mon(c.mid).cost/2);G.placed[i]=null;closeOv();hud();}
function closeOv(){const o=document.getElementById('ov')||document.getElementById('duelOv')||document.getElementById('evOv');if(o)o.remove();}

/* ---------- waves ---------- */
function startWave(){
  if(running||G.over||G.cleared)return;
  if(!G.placed.some(p=>p)){toast('먼저 몬스터를 한 마리 이상 배치하세요');return;}
  ac();placing=false;running=true;
  for(let i=0;i<LANE;i++)if(G.placed[i])G.placed[i].hp=mon(G.placed[i].mid).hp; // 체력 회복
  spawnQ=WAVES[G.wave].slice();spawnT=0;heroes=[];
  document.getElementById('banner').innerHTML=`🌊 <b>웨이브 ${G.wave+1}</b> 진행 중! 용사 ${spawnQ.length}명 침입`;
  document.getElementById('hint').textContent='용사가 몬스터에 닿으면 문제가 출제됩니다';
  hud();step();
}
function step(){
  if(!running)return;
  if(duel){requestAnimationFrame(step);return;}
  // spawn
  spawnT++;
  if(spawnQ.length&&spawnT>=70){spawnT=0;const k=spawnQ.shift();const H=HEROES[k];heroes.push({k,hp:H.hp,x:SPAWNX});}
  // move + collide
  for(const h of heroes){
    const tgt=frontMonster(h.x);
    const stopX=tgt?slotX(tgt.i)+16:NESTX+14;
    if(h.x>stopX+0.01){h.x=Math.max(stopX,h.x-0.5);}
    else{
      if(tgt){startDuel(h,tgt.i);return;}
      else{G.nest-=HEROES[h.k].power;pop('둥지 -'+HEROES[h.k].power,'#ff6b6b',NESTX+30);sfx('bad');h.dead=true;hud();if(G.nest<=0){G.nest=0;return gameOver();}}
    }
  }
  heroes=heroes.filter(h=>!h.dead);
  if(!spawnQ.length&&heroes.length===0){return waveClear();}
  requestAnimationFrame(step);
}
function frontMonster(x){ // 용사보다 왼쪽에 있는(=앞을 가로막은) 살아있는 몬스터 중 가장 오른쪽
  for(let i=LANE-1;i>=0;i--){if(G.placed[i]&&slotX(i)<=x-2)return {i};}
  return null;
}

/* ---------- duel ---------- */
let duel=null,qActive=false,qRAF=0,qStart=0,qCorrect='',qWord='';
function startTimer(sec,onTimeout){
  qActive=true;qStart=performance.now();const QT=sec*1000,dl=qStart+QT;
  (function tick(){if(!qActive)return;const left=dl-performance.now();const tf=document.getElementById('tfill');
    if(tf){const p=Math.max(0,left/QT*100);tf.style.width=p+'%';tf.style.background=p<30?'#e35d5d':p<60?'#e6952a':'#3fa74a';}
    const tn=document.getElementById('tnum');if(tn){const s=Math.max(0,left/1000);tn.textContent=s.toFixed(1);tn.classList.toggle('warn',s<1);}
    if(left<=0){qActive=false;onTimeout();return;}qRAF=requestAnimationFrame(tick);})();
}
function stopTimer(){qActive=false;cancelAnimationFrame(qRAF);}
function startDuel(h,slot){duel={h,slot};duelQ();}
function duelQ(){
  const h=duel.h,H=HEROES[h.k],m=G.placed[duel.slot];
  if(!m){endDuel();return;}
  const w=pickQuestion();qCorrect=w.k;qWord=w.w;
  const opts=[w.k,...pickWords(3,w.k).map(x=>x.k)].sort(()=>Math.random()-.5);
  const mm=mon(m.mid);
  const heartsH='▮'.repeat(h.hp), heartsM='♥'.repeat(m.hp);
  closeOv();const ov=document.createElement('div');ov.className='overlay';ov.id='duelOv';
  ov.innerHTML=`<div class="card">
    <div class="duelhead">
      <div style="font-size:24px">${H.em}</div>
      <div class="who">용사 ${H.nm}<br><span class="hearts" style="color:${H.col}">${heartsH}</span></div>
      <div style="flex:1"></div>
      <div class="who" style="text-align:right">${mm.nm} ${mm.em}<br><span class="hearts" style="color:#e35d5d">${heartsM}</span></div>
    </div>
    <div class="bubble"><div class="qword">${esc(w.w)}</div><div class="qsub">이 단어의 뜻은? · ⏱ ${H.time}초 안에!</div></div>
    <div class="trow"><div class="tbar"><div class="tfill" id="tfill"></div></div><span class="tnum" id="tnum">${H.time.toFixed(1)}</span></div>
    <div id="opts">${opts.map(o=>`<button class="opt" onclick="duelAns(this,'${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div></div>`;
  document.getElementById('scene').appendChild(ov);
  startTimer(H.time,()=>duelResolve(false,null));
}
function duelAns(el,val){stopTimer();duelResolve(val===qCorrect,el);}
function duelResolve(good,el){
  document.querySelectorAll('.opt').forEach(b=>{b.onclick=null;if(b.textContent===qCorrect)b.classList.add('ok');else if(el&&b===el)b.classList.add('bad');});
  const h=duel.h,m=G.placed[duel.slot],mm=mon(m.mid),fb=document.getElementById('fb');
  if(good){markHit(qWord);h.hp-=mm.atk;sfx('ok');fb.style.color='#2f8f3a';fb.innerHTML=`정답! 용사에게 -${mm.atk} 타격`;}
  else{markMiss(qWord);m.hp-=1;sfx('bad');fb.style.color='#c23b3b';fb.innerHTML=`오답 — 정답: <b>${esc(qCorrect)}</b> · 몬스터 체력 -1`;}
  hud();
  setTimeout(()=>{
    if(h.hp<=0){G.coins+=HEROES[h.k].coin;pop('🪙+'+HEROES[h.k].coin,'#ffcf3f',slotX(duel.slot));sfx('die');h.dead=true;endDuel();}
    else if(m.hp<=0){G.placed[duel.slot]=null;pop('몬스터 파괴','#ff6b6b',slotX(duel.slot));sfx('die');endDuel();}
    else{duelQ();}
  },good?650:1100);
}
function endDuel(){duel=null;closeOv();heroes=heroes.filter(h=>!h.dead);hud();requestAnimationFrame(step);}

/* ---------- wave clear / end ---------- */
function waveClear(){
  running=false;placing=true;
  const bonus=8+G.wave*4;G.coins+=bonus;G.wave++;
  if(G.wave>=WAVES.length){return victory();}
  const nu=MONS.find(m=>m.uw===G.wave+1);
  closeOv();const ov=document.createElement('div');ov.className='overlay';ov.id='evOv';
  ov.innerHTML=`<div class="card center"><h3>🌊 웨이브 ${G.wave} 방어 성공!</h3>
    <div class="big">🛡️</div>
    <div style="font-size:14px;line-height:1.8">둥지 🏠 <b>${G.nest}</b>/10 유지<br>보상 🪙 <b>+${bonus}</b>${nu?`<br>🔓 새 몬스터 해금: ${nu.em} <b>${nu.nm}</b>`:''}</div>
    <div class="small">다음 웨이브 전에 빈 칸을 눌러 몬스터를 보강하세요.</div>
    <div style="height:10px"></div>
    <button class="btn" onclick="closeOv();afterWave()">계속</button></div>`;
  document.getElementById('scene').appendChild(ov);sfx('win');hud();
}
function afterWave(){document.getElementById('banner').innerHTML=`배치 단계 · 다음은 <b>웨이브 ${G.wave+1}</b>. 빈 칸을 눌러 보강하세요.`;document.getElementById('hint').textContent='배치 단계 · 통로 칸을 탭해서 몬스터를 세우세요';hud();}
function victory(){
  G.cleared=true;running=false;const grade=G.nest>=9?'S':G.nest>=6?'A':G.nest>=3?'B':'C';
  const col=grade==='S'?'#e35d5d':grade==='A'?'#e6952a':grade==='B'?'#5aa9e6':'#8a7a55';
  closeOv();const ov=document.createElement('div');ov.className='overlay';ov.id='evOv';
  ov.innerHTML=`<div class="card center"><h3>🏆 모든 침입을 막아냈습니다!</h3>
    <div class="grade" style="color:${col}">${grade}</div>
    <div style="font-size:14px">둥지 🏠 <b>${G.nest}</b>/10 사수</div>
    <div class="small">축하합니다! 5웨이브를 모두 방어했어요.<br>다시 도전하면 배치를 새로 짜볼 수 있어요.</div>
    <div style="height:10px"></div>
    <button class="btn" onclick="restart()">🔁 다시 도전</button></div>`;
  document.getElementById('scene').appendChild(ov);sfx('win');hud();
}
function gameOver(){
  G.over=true;running=false;
  closeOv();const ov=document.createElement('div');ov.className='overlay';ov.id='evOv';
  ov.innerHTML=`<div class="card center"><h3>💥 둥지가 함락됐어요</h3>
    <div class="big">🥚</div>
    <div style="font-size:14px">웨이브 ${G.wave+1}에서 방어 실패</div>
    <div class="small">더 강한 몬스터를 요충지에 배치하고, 자주 틀리는 단어는 '복습'으로 반복돼요.</div>
    <div style="height:10px"></div>
    <button class="btn" onclick="restart()">🔁 다시 도전</button></div>`;
  document.getElementById('scene').appendChild(ov);sfx('lose');hud();
}
function restart(){const miss=G.miss,muted=G.muted;G={coins:24,nest:NEST_MAX,wave:0,cleared:false,over:false,muted,miss,placed:new Array(LANE).fill(null)};heroes=[];spawnQ=[];running=false;placing=true;duel=null;closeOv();document.getElementById('banner').innerHTML='빈 칸을 눌러 몬스터를 배치한 뒤, 웨이브를 시작하세요.';document.getElementById('hint').textContent='배치 단계 · 통로 칸을 탭해서 몬스터를 세우세요';hud();}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---------- boot ---------- */
load();document.getElementById('muteBtn').textContent=G.muted?'🔇':'🔊';
if(G.over||G.cleared){G.over=false;G.cleared=false;restart();}
hud();requestAnimationFrame(draw);
</script>
</body>
</html>
