<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우디 어학원 타이쿤 — v3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#241d2e;color:#fff4d6;font-family:'DungGeunMo','Galmuri',ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;min-height:100%;overflow:hidden;position:fixed;inset:0}
#wrap{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column}
.hud{display:flex;gap:5px;padding:7px 8px;align-items:center;flex-wrap:wrap;background:#1c1626;border-bottom:3px solid #000}
.tag{background:#3a2f47;border:2px solid #000;border-radius:4px;padding:3px 7px;font-size:12px;display:flex;gap:4px;align-items:center;line-height:1}
.tag b{color:#ffcf3f}
.name{flex:1;font-size:14px;color:#ffcf3f;text-shadow:2px 2px 0 #000;min-width:120px}
.cal{background:#2a3a55;border:2px solid #000;border-radius:4px;padding:3px 7px;font-size:12px;color:#bfe3ff}
.expwrap{width:100%;height:11px;background:#0d0a12;border:2px solid #000;border-radius:3px;overflow:hidden;margin-top:2px}
.expbar{height:100%;background:linear-gradient(#8be08f,#3fa74a);width:0;transition:width .25s}
#scene{flex:1;position:relative;background:#8ec7ff;image-rendering:pixelated}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
.goal{position:absolute;top:6px;left:6px;right:6px;background:rgba(28,22,38,.82);border:2px solid #000;border-radius:5px;padding:6px 8px;font-size:12px;color:#ffe9a8}
.goal b{color:#ffcf3f}
.fever{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:#e35d5d;color:#fff;border:2px solid #000;border-radius:6px;padding:5px 14px;font-weight:bold;font-size:15px;display:none;text-shadow:1px 1px 0 #000;animation:fv .4s infinite alternate}
@keyframes fv{to{transform:translateX(-50%) scale(1.08)}}
.dock{padding:8px;display:flex;gap:8px;background:#1c1626;border-top:3px solid #000}
.btn{flex:1;background:#ffcf3f;color:#2b2233;border:2px solid #000;border-radius:6px;padding:12px;font-family:inherit;font-size:16px;font-weight:bold;box-shadow:0 4px 0 #a8791b;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8791b}
.btn.blue{background:#5aa9e6;box-shadow:0 4px 0 #2c6fa8;color:#08243b}
.btn.blue:active{box-shadow:0 1px 0 #2c6fa8}
.btn.mute{flex:0 0 46px;font-size:18px;padding:12px 0}
.overlay{position:absolute;inset:0;background:rgba(10,7,15,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.card{width:100%;max-width:440px;background:#fff4d6;color:#2b2233;border:3px solid #000;border-radius:10px;box-shadow:0 8px 0 rgba(0,0,0,.4);padding:16px;max-height:92%;overflow:auto}
.card h3{font-size:15px;color:#7a5a2a;margin-bottom:4px}
.qword{font-size:30px;font-weight:bold;text-align:center;margin:10px 0 4px}
.qsub{text-align:center;font-size:12px;color:#8a7a55;margin-bottom:14px}
.opt{display:block;width:100%;background:#fffdf5;border:2px solid #000;border-radius:7px;padding:13px;font-family:inherit;font-size:17px;margin-bottom:9px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);text-align:center}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.opt.ok{background:#bff0c4;border-color:#2f8f3a}
.opt.bad{background:#ffc9c9;border-color:#c23b3b}
.combo{text-align:center;font-size:13px;color:#c0563a;min-height:18px;margin-bottom:6px;font-weight:bold}
.fb{text-align:center;font-size:15px;font-weight:bold;min-height:22px;margin-top:4px}
.big{text-align:center;font-size:40px;margin:6px 0}
.center{text-align:center}
.shopitem{display:flex;align-items:center;gap:10px;background:#fffdf5;border:2px solid #000;border-radius:7px;padding:10px;margin-bottom:8px}
.shopitem.res{background:#eef3ff;border-color:#2c6fa8}
.shopitem .ic{font-size:24px;width:30px;text-align:center}
.shopitem .info{flex:1}
.shopitem .t{font-size:15px;font-weight:bold}
.shopitem .d{font-size:11px;color:#8a7a55;line-height:1.4}
.buy{background:#ffcf3f;border:2px solid #000;border-radius:6px;padding:8px 10px;font-family:inherit;font-weight:bold;font-size:13px;box-shadow:0 3px 0 #a8791b;cursor:pointer;white-space:nowrap}
.buy.res{background:#7fb0ff;box-shadow:0 3px 0 #2c6fa8}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #a8791b}
.buy:disabled{background:#d9cfb5;box-shadow:0 3px 0 #9c927a;color:#7c745f;cursor:default}
.x{float:right;background:#e35d5d;color:#fff;border:2px solid #000;border-radius:6px;width:30px;height:30px;font-family:inherit;font-weight:bold;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;background:#e7dcc0;border:2px solid #000;border-radius:6px;padding:7px;font-family:inherit;font-weight:bold;cursor:pointer;font-size:13px}
.tab.on{background:#ffcf3f}
.toast{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);background:#2b2233;color:#ffcf3f;border:2px solid #000;border-radius:20px;padding:8px 16px;font-size:13px;z-index:30;opacity:0;transition:.25s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}
.small{font-size:11px;color:#8a7a55;text-align:center;margin-top:6px}
.grade{font-size:52px;font-weight:bold;text-align:center;text-shadow:2px 2px 0 rgba(0,0,0,.2)}
.tbar{height:12px;background:#0d0a12;border:2px solid #000;border-radius:6px;overflow:hidden;margin:2px 0 12px}
.tfill{height:100%;width:100%;background:#3fa74a;transition:background .1s}
.speed{color:#e6952a;font-weight:bold}
.timeup .tfill{background:#e35d5d}
.goalprog{height:7px;background:#0d0a12;border:1px solid #000;border-radius:4px;overflow:hidden;margin-top:4px}
.goalprog i{display:block;height:100%;background:linear-gradient(#ffd24a,#e6952a);width:0}
</style>
</head>
<body>
<div id="wrap">
  <div class="hud">
    <div class="name" id="acadName">우디 어학원 · Lv.<span id="lv">1</span></div>
    <div class="cal" id="cal">1년차 4월</div>
    <div class="tag">🪙 <b id="coins">0</b></div>
    <div class="tag">🔬 <b id="res">0</b></div>
    <div class="tag">⭐ <b id="rep">0</b></div>
    <div class="tag">🎓 <b id="grad">0</b></div>
    <div class="tag">🔥 <b id="streak">0</b></div>
    <div class="expwrap"><div class="expbar" id="expbar"></div></div>
  </div>
  <div id="scene">
    <canvas id="cv" width="256" height="176"></canvas>
    <div class="goal" id="goal">첫 수업을 열어 코인을 모아보세요!</div>
    <div class="fever" id="fever">🔥 FEVER! 코인 ×2</div>
  </div>
  <div class="dock">
    <button class="btn" onclick="openStudy()">📖 수업</button>
    <button class="btn blue" onclick="openShop()">🔨 경영</button>
    <button class="btn mute" id="muteBtn" onclick="toggleMute()">🔊</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const WORDS=[{"w":"access","k":"접근","lv":"academic"},{"w":"addition","k":"추가","lv":"core"},{"w":"rigid","k":"엄격한","lv":"academic"},{"w":"notion","k":"개념","lv":"academic"},{"w":"implement","k":"시행하다","lv":"academic"},{"w":"grant","k":"부여하다, 수여하다","lv":"academic"},{"w":"communicate","k":"의사소통하다","lv":"academic"},{"w":"promise","k":"약속","lv":"plus"},{"w":"indicate","k":"나타내다","lv":"academic"},{"w":"fund","k":"자금","lv":"academic"},{"w":"team","k":"팀","lv":"academic"},{"w":"population","k":"인구","lv":"core"},{"w":"equip","k":"갖추다","lv":"academic"},{"w":"organize","k":"조직하다","lv":"plus"},{"w":"principle","k":"원칙","lv":"academic"},{"w":"commission","k":"위원회","lv":"academic"},{"w":"isolate","k":"고립시키다","lv":"academic"},{"w":"design","k":"설계","lv":"academic"},{"w":"available","k":"이용 가능한","lv":"academic"},{"w":"maintain","k":"유지하다","lv":"academic"},{"w":"percent","k":"퍼센트","lv":"academic"},{"w":"create","k":"창조하다","lv":"academic"},{"w":"blood","k":"피","lv":"plus"},{"w":"federal","k":"연방의","lv":"academic"},{"w":"abstract","k":"추상적인","lv":"academic"},{"w":"decline","k":"감소하다","lv":"academic"},{"w":"pause","k":"멈춤, 중지","lv":"core"},{"w":"adjust","k":"조정하다","lv":"academic"},{"w":"assign","k":"할당하다","lv":"academic"},{"w":"insert","k":"삽입하다","lv":"academic"},{"w":"executive","k":"임원","lv":"plus"},{"w":"quote","k":"인용하다","lv":"academic"},{"w":"responsible","k":"책임이 있는","lv":"plus"},{"w":"statement","k":"진술","lv":"plus"},{"w":"ultimate","k":"궁극적인","lv":"academic"},{"w":"finite","k":"유한한","lv":"academic"},{"w":"exploit","k":"이용하다","lv":"academic"},{"w":"argument","k":"논쟁","lv":"plus"},{"w":"trend","k":"경향","lv":"academic"},{"w":"welfare","k":"복지","lv":"academic"},{"w":"imply","k":"암시하다","lv":"academic"},{"w":"orient","k":"지향하게 하다","lv":"academic"},{"w":"weight","k":"무게","lv":"plus"},{"w":"credit","k":"공로","lv":"academic"},{"w":"secure","k":"안전한","lv":"academic"},{"w":"substitute","k":"대체하다","lv":"academic"},{"w":"adult","k":"성인","lv":"academic"},{"w":"input","k":"투입, 입력","lv":"academic"},{"w":"extract","k":"추출하다","lv":"academic"},{"w":"presume","k":"추정하다, 가정하다","lv":"academic"},{"w":"logic","k":"논리","lv":"academic"},{"w":"notwithstanding","k":"~에도 불구하고","lv":"academic"},{"w":"attain","k":"달성하다","lv":"academic"},{"w":"distinct","k":"뚜렷한","lv":"academic"},{"w":"factor","k":"요인","lv":"academic"},{"w":"integrate","k":"통합하다","lv":"academic"},{"w":"component","k":"구성 요소","lv":"academic"},{"w":"abandon","k":"버리다","lv":"academic"},{"w":"overall","k":"전반적인","lv":"academic"},{"w":"express","k":"표현하다","lv":"plus"},{"w":"volume","k":"양","lv":"academic"},{"w":"initiate","k":"시작하다, 착수하다","lv":"academic"},{"w":"energy","k":"에너지","lv":"academic"},{"w":"strike","k":"치다","lv":"plus"},{"w":"albeit","k":"비록 ~일지라도","lv":"academic"},{"w":"phenomenon","k":"현상","lv":"academic"},{"w":"assess","k":"평가하다","lv":"academic"},{"w":"discriminate","k":"차별하다","lv":"academic"},{"w":"relevant","k":"관련 있는","lv":"academic"},{"w":"controversy","k":"논란","lv":"academic"},{"w":"incentive","k":"유인, 동기","lv":"academic"},{"w":"visible","k":"보이는","lv":"academic"},{"w":"complement","k":"보완물","lv":"academic"},{"w":"theme","k":"주제","lv":"academic"},{"w":"aspect","k":"측면","lv":"academic"},{"w":"illustrate","k":"설명하다","lv":"academic"},{"w":"prior","k":"이전의","lv":"academic"},{"w":"involve","k":"포함하다","lv":"academic"},{"w":"diverse","k":"다양한","lv":"academic"},{"w":"director","k":"이사","lv":"core"},{"w":"relation","k":"관계","lv":"plus"},{"w":"exercise","k":"운동","lv":"plus"},{"w":"injure","k":"부상을 입히다","lv":"academic"},{"w":"status","k":"지위","lv":"academic"},{"w":"particularly","k":"특히","lv":"core"},{"w":"negative","k":"부정적인","lv":"plus"},{"w":"estate","k":"재산","lv":"academic"},{"w":"virtual","k":"가상의","lv":"academic"},{"w":"confer","k":"상의하다","lv":"academic"},{"w":"recognize","k":"인식하다","lv":"core"},{"w":"debate","k":"토론","lv":"academic"},{"w":"dollar","k":"달러 (화폐 단위)","lv":"plus"},{"w":"anticipate","k":"예상하다","lv":"academic"},{"w":"nevertheless","k":"그럼에도 불구하고","lv":"academic"},{"w":"message","k":"메시지","lv":"plus"},{"w":"cycle","k":"주기","lv":"academic"},{"w":"acknowledge","k":"인정하다","lv":"academic"},{"w":"foundation","k":"기초","lv":"academic"},{"w":"define","k":"정의하다","lv":"academic"},{"w":"perceive","k":"인지하다","lv":"academic"},{"w":"undergo","k":"겪다","lv":"academic"},{"w":"officer","k":"장교","lv":"plus"},{"w":"correct","k":"정확한","lv":"plus"},{"w":"induce","k":"유도하다","lv":"academic"},{"w":"imagine","k":"상상하다","lv":"plus"},{"w":"institute","k":"기관","lv":"academic"},{"w":"displace","k":"대체하다","lv":"academic"},{"w":"ability","k":"능력","lv":"plus"},{"w":"somebody","k":"누군가","lv":"plus"},{"w":"perspective","k":"관점","lv":"academic"},{"w":"hierarchy","k":"위계","lv":"academic"},{"w":"recommend","k":"추천하다","lv":"plus"},{"w":"route","k":"경로","lv":"academic"},{"w":"notice","k":"알아차리다","lv":"core"},{"w":"refine","k":"정제하다","lv":"academic"},{"w":"bias","k":"편견","lv":"academic"},{"w":"manipulate","k":"조작하다","lv":"academic"},{"w":"job","k":"직업","lv":"academic"},{"w":"prefer","k":"선호하다","lv":"plus"},{"w":"trouble","k":"문제","lv":"plus"},{"w":"promote","k":"촉진하다","lv":"academic"},{"w":"replace","k":"교체하다","lv":"plus"},{"w":"plus","k":"더하기","lv":"academic"},{"w":"pattern","k":"양식","lv":"plus"},{"w":"commit","k":"저지르다","lv":"academic"},{"w":"financial","k":"재정의","lv":"core"},{"w":"expert","k":"전문가","lv":"academic"},{"w":"coherent","k":"일관된","lv":"academic"},{"w":"speech","k":"연설","lv":"plus"},{"w":"directly","k":"직접","lv":"plus"},{"w":"quickly","k":"빨리","lv":"plus"},{"w":"myself","k":"나 자신","lv":"core"},{"w":"heart","k":"심장","lv":"core"},{"w":"accompany","k":"동반하다","lv":"academic"},{"w":"monitor","k":"감시하다","lv":"academic"},{"w":"immediately","k":"즉시","lv":"plus"},{"w":"alter","k":"바꾸다","lv":"academic"},{"w":"exactly","k":"정확히","lv":"core"},{"w":"sector","k":"부문","lv":"academic"},{"w":"investment","k":"투자","lv":"plus"}];
const LS='vocagame_v3';
const MONTHS=['','1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const QT=8000; // 문제당 제한시간(ms)
const GOAL_GRAD=30, GOAL_REP=250, LIMIT_YEAR=3; // 승리조건 & 기한
let G={lv:1,coins:0,exp:0,cap:2,desks:0,tutors:[],deco:0,tier:1,streak:0,lastDay:null,mastered:{},studied:0,
  research:0,rep:0,day:0,year:1,month:4,monthCoin:0,fac:{studyroom:false,board:false,method:false,cafe:false},muted:false,
  mission:0,cleared:false,ended:false,best:0,correct:0,fast:0};
const MISSIONS=[
  {t:'첫 수업을 풀어보기',        done:g=>g.studied>=1,                       rw:0},
  {t:'강사 1명 고용하기',         done:g=>g.tutors.length>=1,                 rw:20},
  {t:'졸업생 5명 배출',           done:g=>gradCount()>=5,                     rw:30},
  {t:'평판 ⭐100 달성',           done:g=>g.rep>=100,                         rw:40},
  {t:'졸업생 15명 배출',          done:g=>gradCount()>=15,                    rw:60},
  {t:`명문 달성 — 졸업생 ${GOAL_GRAD}·평판 ⭐${GOAL_REP}`, done:g=>gradCount()>=GOAL_GRAD&&g.rep>=GOAL_REP, rw:150, final:true},
];
function save(){localStorage.setItem(LS,JSON.stringify(G));}
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s)Object.assign(G,s);}catch(e){}}
function unlockedCount(){return Math.min(WORDS.length, 30+(G.tier-1)*30);}
function gradCount(){return Object.values(G.mastered).filter(v=>v>=3).length;}
function expNeed(){return 30+(G.lv-1)*25;}
function coinBase(){return 4+G.deco+(G.fac.method?2:0);}
function tutorMult(){return 1+G.tutors.length*0.35;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}
function touchStreak(){const d=new Date().toDateString();if(G.lastDay===d)return;const y=new Date(Date.now()-864e5).toDateString();G.streak=(G.lastDay===y)?G.streak+1:1;G.lastDay=d;}

/* ---------- sound (chiptune blips) ---------- */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(freq,dur,type,vol){if(G.muted)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.value=freq;g.gain.value=vol||0.05;o.connect(g);g.connect(c.destination);const t=c.currentTime;o.start(t);g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.stop(t+dur+0.02);}
function sfx(kind){if(G.muted)return;if(kind==='ok'){beep(660,0.09);setTimeout(()=>beep(990,0.10),70);}
  else if(kind==='coin'){beep(1320,0.06,'square',0.04);}
  else if(kind==='bad'){beep(180,0.18,'sawtooth',0.05);}
  else if(kind==='lvl'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.12),i*90));}
  else if(kind==='fanfare'){[392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.14,'square',0.05),i*110));}}
function toggleMute(){G.muted=!G.muted;document.getElementById('muteBtn').textContent=G.muted?'🔇':'🔊';save();}

function hud(){
  document.getElementById('lv').textContent=G.lv;
  document.getElementById('cal').textContent=G.year+'년차 '+MONTHS[G.month];
  document.getElementById('coins').textContent=G.coins;
  document.getElementById('res').textContent=G.research;
  document.getElementById('rep').textContent=G.rep;
  document.getElementById('grad').textContent=gradCount();
  document.getElementById('streak').textContent=G.streak;
  document.getElementById('expbar').style.width=Math.min(100,G.exp/expNeed()*100)+'%';
  document.getElementById('goal').innerHTML=goalText();
  checkMission();
  save();
}
function goalText(){
  if(G.cleared)return '🎉 <b>명문 달성!</b> 자유 플레이 — 계속 키워보세요';
  const m=MISSIONS[G.mission]||MISSIONS[MISSIONS.length-1];
  // 최종 목표 진행도(졸업생·평판 평균)
  const p=Math.min(100,Math.round((Math.min(1,gradCount()/GOAL_GRAD)+Math.min(1,G.rep/GOAL_REP))/2*100));
  return `🎯 <b>${m.t}</b> · ⏳ ${G.year}/${LIMIT_YEAR}년차`
       + `<div class="goalprog"><i style="width:${p}%"></i></div>`;
}
let _mc=false;
function checkMission(){
  if(_mc||G.cleared)return;_mc=true;
  while(G.mission<MISSIONS.length){
    const m=MISSIONS[G.mission];
    if(m.done(G)){
      if(m.rw){G.coins+=m.rw;popNum('미션 🪙+'+m.rw,'#8be08f');}
      toast('✅ 미션 완료 · '+m.t);G.mission++;
      if(m.final){G.cleared=true;setTimeout(ending,900);break;}
    }else break;
  }
  _mc=false;
}

/* ---------- pixel scene ---------- */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
const R=(x,y,w,h,c)=>{cx.fillStyle=c;cx.fillRect(x|0,y|0,w|0,h|0);};
let parts=[],pops=[],t0=performance.now();
function person(x,y,f,col,hair){const b=Math.round(Math.sin((f/22)+x)*1);R(x-3,y-8+b,6,5,'#f2c69a');R(x-3,y-9+b,6,1,hair||'#3a2b22');R(x-3,y-3+b,6,5,col);R(x-3,y+2+b,2,2,'#3a2b22');R(x+1,y+2+b,2,2,'#3a2b22');}
function draw(now){
  const f=(now-t0)/16;
  R(0,0,256,120,'#8ec7ff');R(0,90,256,30,'#bfe3ff');
  const c1=(f*0.2)%300-40;R(c1,20,26,6,'#fff');R(c1+6,15,16,6,'#fff');

function coinPop(){for(let i=0;i<6;i++)parts.push({x:100+Math.random()*56,y:60+Math.random()*40,life:1});}
function popNum(txt,col){pops.push({x:110+Math.random()*36,y:70,txt,col:col||'#ffcf3f',life:1});}

/* ---------- study ---------- */
function pickWords(n,exclude){const pool=WORDS.slice(0,unlockedCount());const out=[],seen=new Set(exclude?[exclude]:[]);let g=0;while(out.length<n&&g++<400){const w=pool[Math.random()*pool.length|0];if(!seen.has(w.k)){seen.add(w.k);out.push(w);}}return out;}
let combo=0;
/* ---------- 문제 타이머 (빠를수록 보너스, 시간초과=오답) ---------- */
let qActive=false,qRAF=0,qStart=0,qCorrect='',qWord='';
function startTimer(onTimeout){
  qActive=true;qStart=performance.now();const dl=qStart+QT;
  (function step(){
    if(!qActive)return;
    const left=dl-performance.now();
    const tf=document.getElementById('tfill');
    if(tf){const p=Math.max(0,left/QT*100);tf.style.width=p+'%';tf.style.background=p<30?'#e35d5d':p<60?'#e6952a':'#3fa74a';}
    if(left<=0){qActive=false;onTimeout();return;}
    qRAF=requestAnimationFrame(step);
  })();
}
function stopTimer(){qActive=false;cancelAnimationFrame(qRAF);}
function spent(){return performance.now()-qStart;}

function openStudy(){ac();combo=0;document.getElementById('fever').style.display='none';nextQ();}
function nextQ(){
  const pool=WORDS.slice(0,unlockedCount());const w=pool[Math.random()*pool.length|0];
  const opts=[w.k,...pickWords(3,w.k).map(x=>x.k)].sort(()=>Math.random()-.5);
  const ov=document.createElement('div');ov.className='overlay';ov.id='studyOv';
  ov.innerHTML=`<div class="card"><button class="x" onclick="closeStudy()">✕</button>
    <h3>📖 수업 중 · 콤보 <span id="cb">${combo}</span></h3>
    <div class="tbar"><div class="tfill" id="tfill"></div></div>
    <div class="qword">${esc(w.w)}</div><div class="qsub">이 단어의 뜻은? · ⚡ 빠를수록 보너스 코인</div>
    <div id="opts">${opts.map(o=>`<button class="opt" onclick="answer(this,'${esc(o).replace(/'/g,"\\'")}','${esc(w.k).replace(/'/g,"\\'")}','${esc(w.w).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}</div>
    <div class="combo" id="comboMsg"></div><div class="fb" id="fb"></div></div>`;
  closeOv();document.getElementById('scene').appendChild(ov);
  qCorrect=w.k;qWord=w.w;
  startTimer(timeUp);
}
function revealOpts(el){document.querySelectorAll('.opt').forEach(b=>{b.onclick=null;if(b.textContent===qCorrect)b.classList.add('ok');else if(el&&b===el)b.classList.add('bad');});}
function answer(el,val,correct,word){
  stopTimer();const took=spent();
  revealOpts(el);const fb=document.getElementById('fb');advanceDay();
  if(val===correct){
    combo++;const fever=combo>=8;document.getElementById('fever').style.display=fever?'block':'none';
    const fast=took<QT*0.35;if(fast)G.fast++;
    const mult=(1+Math.min(combo,12)*0.12)*tutorMult()*(fever?2:1)*(fast?1.5:1);
    const gain=Math.round(coinBase()*mult);
    G.coins+=gain;G.monthCoin+=gain;G.exp+=10;G.studied++;G.correct++;G.research+=1;G.rep+=1;
    G.mastered[word]=(G.mastered[word]||0)+1;
    coinPop();popNum('+'+gain,'#ffcf3f');sfx('ok');sfx('coin');
    fb.style.color='#2f8f3a';fb.innerHTML=`정답! 🪙 +${gain}${fast?' <span class="speed">⚡빠른정답 ×1.5</span>':''}`;
    document.getElementById('comboMsg').textContent=combo>1?(fever?`🔥 FEVER! ${combo}콤보 (코인 ×2)`:`🔥 ${combo}콤보 (보너스 ×${mult.toFixed(1)})`):'';
    if(G.mastered[word]===3){toast('🎓 졸업생 배출! ('+esc(word)+')');popNum('🎓','#8be08f');}
    while(G.exp>=expNeed()){G.exp-=expNeed();G.lv++;G.cap+=1;toast('⭐ 학원 Lv.'+G.lv+'! 한 층 더 커졌어요');sfx('lvl');}
    touchStreak();hud();
    if(G.cleared)return;
    if(G.day%30===0){setTimeout(monthEnd,700);return;}
    setTimeout(nextQ,600);
  }else{ wrong(correct,fb,false); }
}
function timeUp(){revealOpts(null);advanceDay();wrong(qCorrect,document.getElementById('fb'),true);}
function wrong(correct,fb,timeout){
  combo=0;document.getElementById('fever').style.display='none';
  let refund=0;if(G.fac.studyroom){refund=2;G.coins+=2;G.monthCoin+=2;popNum('+2 복습','#63c76a');}
  fb.style.color='#c23b3b';fb.innerHTML=`${timeout?'⏰ 시간 초과! ':'아쉬워요 — '}정답: <b>${esc(correct)}</b>${refund?' <span style="color:#2f8f3a">(자습실 복습 🪙+2)</span>':''}`;
  sfx('bad');hud();
  if(G.cleared)return;
  if(G.day%30===0){setTimeout(monthEnd,900);return;}
  setTimeout(nextQ,1250);
}
function closeStudy(){stopTimer();closeOv();}
function closeOv(){const o=document.getElementById('studyOv')||document.getElementById('shopOv')||document.getElementById('evOv');if(o)o.remove();}

/* ---------- time: month end / year award ---------- */
function advanceDay(){G.day++;if(G.fac.board && G.day%7===0){G.rep+=2;popNum('⭐+2','#ffd24a');}}
function monthEnd(){
  const earned=G.monthCoin;G.monthCoin=0;

let mock={i:0,ok:0,correct:''};
function startMock(){mock={i:0,ok:0,correct:''};mockQ();}
function mockQ(){
  if(mock.i>=5)return mockResult();
  const pool=WORDS.slice(0,unlockedCount());const w=pool[Math.random()*pool.length|0];
  const opts=[w.k,...pickWords(3,w.k).map(x=>x.k)].sort(()=>Math.random()-.5);

    <div id="opts">${opts.map(o=>`<button class="opt" onclick="mockAns(this,'${esc(o).replace(/'/g,"\\'")}','${esc(w.k).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}</div></div>`;
  document.getElementById('scene').appendChild(ov);
  mock.correct=w.k;startTimer(mockTimeUp);
}
function mockReveal(el){document.querySelectorAll('.opt').forEach(b=>{b.onclick=null;if(b.textContent===mock.correct)b.classList.add('ok');else if(el&&b===el)b.classList.add('bad');});}
function mockAns(el,val,correct){
  stopTimer();const good=val===correct;mockReveal(el);
  if(good){mock.ok++;sfx('ok');}else sfx('bad');mock.i++;setTimeout(mockQ,good?550:1000);
}
function mockTimeUp(){mockReveal(null);sfx('bad');mock.i++;setTimeout(mockQ,1000);}
function mockResult(){
  const g=['C','C','B','A','S','S'][mock.ok];const coin=mock.ok*8,rep=mock.ok*3;
  G.coins+=coin;G.rep+=rep;
  closeOv();const ov=document.createElement('div');ov.className='overlay';ov.id='evOv';
  const col=g==='S'?'#e35d5d':g==='A'?'#e6952a':g==='B'?'#5aa9e6':'#8a7a55';
  ov.innerHTML=`<div class="card center"><h3>📝 모의고사 결과</h3>
    <div class="grade" style="color:${col}">${g}등급</div>
    <div style="font-size:14px">5문제 중 <b>${mock.ok}</b>개 정답</div>
    <div style="margin-top:8px">보상 🪙 <b>+${coin}</b> · ⭐ <b>+${rep}</b></div>
    <div style="height:12px"></div>
    ${(G.month===1)?`<button class="btn" onclick="yearAward()">🏆 연말 시상식</button>`:`<button class="btn" onclick="closeOv();hud()">계속하기</button>`}</div>`;
  document.getElementById('scene').appendChild(ov);sfx('fanfare');hud();
}
function scoreNow(){return gradCount()*10+G.rep+Math.floor(G.coins/5);}

function ending(){
  stopTimer();closeOv();G.ended=true;const s=scoreNow();if(s>G.best)G.best=s;const gr=scoreGrade(s);

const SPECIAL=['4지선다 특기','속독 특기','암기 특기','받아쓰기 특기'];
function buy(id,cur,cost){
  const bal=cur==='coin'?G.coins:G.research;if(bal<cost)return;
  if(cur==='coin')G.coins-=cost;else G.research-=cost;
  if(id==='desk'){G.desks++;G.cap++;toast('🪑 책상 추가! 정원 '+G.cap);}
  if(id==='tutor'){const sp=SPECIAL[Math.random()*SPECIAL.length|0];G.tutors.push({sp,lv:1});toast('👩‍🏫 강사 고용! ['+sp+']');}
  if(id==='deco'){G.deco++;toast('🪴 화분!');}
  if(id==='pack'){G.tier++;toast('📦 단어팩 해금! 단어 '+unlockedCount());}
  if(id==='board'){G.fac.board=true;toast('📋 게시판 설치!');}
  if(id==='studyroom'){G.fac.studyroom=true;toast('📚 자습실 증축!');}
  if(id==='method'){G.fac.method=true;toast('🧪 새 교습법!');}
  if(id==='cafe'){G.fac.cafe=true;toast('🥤 매점 오픈!');}
